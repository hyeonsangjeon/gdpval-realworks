schema_version: "2.0"
config_name: "e35par"
description: |
  Parity regrade of exp035_codex_foundry_full220 (gpt-5.4 on Codex + Azure AI
  Foundry) after the reviewed deliverable-selector fix. Only the tasks whose
  selection under the merged selector differs from the selection recorded in
  the published exp035 grade (graded at 93707428 with src fd0db9d9d78d6d54)
  are pinned below; every other exp035 task keeps the selection it was graded
  with, so it is not regraded. The list is the output of
  scripts/selection_diff_against_grade.py, recorded in
  docs/run_records/exp035_parity_selection_20261106.json.
  The judge, rubric, grader, tpm_guard, prompt and output blocks are copied
  byte-for-byte from exp035_codex_foundry_full220_v2_sol_max.yaml, which stays
  untouched: sol_batch_grading pins its sha256 and the #794 grader seal holds
  its bytes. The config name is short on purpose: experiment id (28) plus
  config name (6) stays inside the 36-character grade-file name budget.
  A proper subset makes this a diagnostic grade under
  data/grades/_diagnostic/<ordered task ids sha256>/; it never replaces the
  published exp035 grade. sol_batch_grading.py admits it under the owner's
  2026-11-06 approval (EXP035_PARITY), with its own USD ceiling.

rerun_identity:
  experiment_id: "exp035_codex_foundry_full220"
  expected_task_count: 8
  rubric_commit_sha: "11e7900cdcac61bc4daf59e65feb238acda98fbf"
  inference_revision: "dc36d6837a8f0899f8bfa4d32aae9a9f6805f3b0"
  # Canonical exp035 upload order (experiments/exp035_codex_foundry_full220.yaml);
  # step 8 refuses a pinned list in any other order.
  # sha256 of the ordered list: b2ed72124660d52d20ffb3af870fa308a3ebdf3b2bbe4aed9dc495f240ac4851
  task_ids:
    - 15d37511-75c5-4c7f-81f1-16e00c0d95f3
    - 15ddd28d-8445-4baa-ac7f-f41372e1344e
    - 1aecc095-4d76-4b89-b752-1a0f870502cd
    - 3baa0009-5a60-4ae8-ae99-4955cb328ff3
    - 9a8c8e28-ce76-408b-83c3-488422892e58
    - aad21e4c-1d43-45fc-899a-97754a1b1b63
    - b1a79ce1-86b0-41fb-97dc-9206dfd7b044
    - cebf301e-5ea7-41ae-b117-ad8f43e7ac22
judge:
  provider: "azure_openai"
  api: "responses"
  model: "gpt-5.6-sol"
  deployment: "gpt-5.6-sol"
  api_version: "2025-04-01-preview"
  timeout_sec: 600
  reasoning:
    effort: "max"
  generation:
    temperature: 0
    seed: 42
    max_output_tokens: 2400
    finalization_reasoning_effort: "max"

  tools:
    read_deliverable:
      env: "exp011_subprocess"
      ops:
        - inspect_structure
        - read_content
        - inspect_formatting
        - probe_audio
        - probe_video
      read_only: true
      per_item_call_cap: 8
      max_iterations: 10

  perception:
    visual:
      model: "gpt-5.6-sol"
      deployment: "gpt-5.6-sol"
      reasoning_effort: "max"
      vision: true
      call_cap_per_task: 112  # 185-task gold run, measured: irreducible max 102 + one item (file_cap_per_item 10)
    audio:
      model: "gpt-audio-1.5"
      deployment: "gpt-audio-1.5"
      call_cap_per_task: 32  # checked-in 220 inventory: max 32 listening criteria
      trim_seconds: 30

  critical:
    rule: "abs_max_score_threshold"
    threshold: 4
    sign_aware: true

  scoring:
    sign_aware_pct: true
    handle_nonpositive_total_max: "explicit"

rubric:
  source: "huggingface"
  repo_id: "openai/gdpval"
  revision: "11e7900cdcac61bc4daf59e65feb238acda98fbf"
  cache_dir: "data/gdpval-local"

grader:
  precheck_patterns_version: "v2"
  evidence_max_chars: 200
  judge_max_retries: 1
  per_item_max_output_tokens: 2400
  save_raw_responses: false
  fail_on_missing_evidence: true
  task_prompt_truncate_chars: 500

tpm_guard:
  max_concurrent: 1
  min_delay_ms_between_calls: 500
  retry_on_429:
    enabled: true
    max_retries: 3
    initial_backoff_sec: 2
    exponential_factor: 2.0

prompt:
  template: "prompts/grader_judge.md"
  tool_template: "prompts/grader_judge_v2.md"
  version: "v2.2"

output:
  directory: "../data/grades"
  filename_template: "{exp_id}__judge_{judge_slug}__{config_name}__cfg_{config_hash}__rubric_{rubric_sha}__inference_{inference_sha}__src_{grader_source_hash_short}__{prompt_v}.json"
