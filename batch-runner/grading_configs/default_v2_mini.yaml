schema_version: "2.0"
config_name: "default_v2_mini"
description: |
  default_v2 with judge model swapped to gpt-5.4-mini, effort=medium.

  Provenance: Step 5 (B-prime mini smoke) of PR3
  TASK_grading_v2_cost_decision.md. Triggered after Step 4 fork
  routed to ELSE branch (effective 220 cost $173 > $80 autonomous
  ceiling on Step 2 measurement). Hypothesis: mini's ~5x lower
  per-token price dominates any orchestration overhead.

  Delta vs default_v2.yaml:
    judge.model:      gpt-5.4    -> gpt-5.4-mini
    judge.deployment: gpt-5.4    -> gpt-5.4-mini
    judge.reasoning.effort: medium (unchanged; NOT low — Step 5 spec
      explicitly says do not weaken model AND reasoning together on
      the first test)

  Step 5 PASS rule:
    mean |mini-standard| avg_pct  <= ~2pp
    AND critical_item_pass non-inferior (5pp margin) vs standard
    AND judge_error_rate < 2%
    AND no heavy-cluster quality collapse
    AND effective_220_cost <= $80

  On PASS  -> Step 6 (hybrid fallback spec; mini-default + standard-
              fallback router).
  On FAIL  -> HARD-STOP with the specific failure reason for owner.

judge:
  provider: "azure_openai"
  api: "responses"
  model: "gpt-5.4-mini"
  deployment: "gpt-5.4-mini"
  api_version: "2025-04-01-preview"
  timeout_sec: 600
  reasoning:
    effort: "medium"
  generation:
    temperature: 0
    seed: 42
    max_output_tokens: 2400

  tools:
    read_deliverable:
      env: "exp011_subprocess"
      ops:
        - inspect_structure
        - read_content
        - inspect_formatting
        - probe_audio
        - probe_video
      read_only: true
      per_item_call_cap: 8
      max_iterations: 10

  perception:
    visual:
      model: "gpt-5.4"
      vision: true
      call_cap_per_task: 72  # checked-in 220 inventory: max 68 supported calls
    audio:
      model: "gpt-audio-1.5"
      call_cap_per_task: 32  # checked-in 220 inventory: max 32 listening criteria
      trim_seconds: 30

  critical:
    rule: "abs_max_score_threshold"
    threshold: 4
    sign_aware: true

  scoring:
    sign_aware_pct: true
    handle_nonpositive_total_max: "explicit"

rubric:
  source: "huggingface"
  repo_id: "openai/gdpval"
  revision: "main"
  cache_dir: "data/gdpval-local"

grader:
  precheck_patterns_version: "v2"
  evidence_max_chars: 200
  judge_max_retries: 1
  per_item_max_output_tokens: 2400
  save_raw_responses: false
  fail_on_missing_evidence: true
  task_prompt_truncate_chars: 500

tpm_guard:
  max_concurrent: 1
  min_delay_ms_between_calls: 500
  retry_on_429:
    enabled: true
    max_retries: 3
    initial_backoff_sec: 2
    exponential_factor: 2.0

prompt:
  template: "prompts/grader_judge.md"
  tool_template: "prompts/grader_judge_v2.md"
  version: "v2.2"

output:
  directory: "../data/grades"
  filename_template: "{exp_id}__judge_{judge_slug}__{config_name}__cfg_{config_hash}__rubric_{rubric_sha}__inference_{inference_sha}__src_{grader_source_hash_short}__{prompt_v}.json"
