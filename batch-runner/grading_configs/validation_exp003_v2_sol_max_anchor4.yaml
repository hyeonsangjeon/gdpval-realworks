schema_version: "2.0"
config_name: "validation_exp003_v2_sol_max_anchor4"
description: |
  Paid four-task Sol Max anchor for exp003. Runtime grading semantics match
  the pinned full rerun; only the config identity and anchored task set differ.

rerun_identity:
  experiment_id: "exp003_GPT52Chat_baseline_runner_exec"
  expected_task_count: 4
  rubric_commit_sha: "11e7900cdcac61bc4daf59e65feb238acda98fbf"
  inference_revision: "9c639f506b8dfd5c0bb8675cb1e0c2a938a3905f"
  allow_legacy_missing_provenance: true
  task_ids:
    - "99ac6944-4ec6-4848-959c-a460ac705c6f"
    - "4c18ebae-dfaa-4b76-b10c-61fcdf26734c"
    - "40a8c4b1-b169-4f92-a38b-7f79685037ec"
    - "a73fbc98-90d4-4134-a54f-2b1d0c838791"

anchor_projection:
  method: "modality_normalized_v1"
  anchor_config_name: "validation_exp003_v2_sol_max_anchor4"
  anchor_task_count: 4
  anchor_ordered_task_ids_sha256: "29d5623a5cec85eb38f21fb73a2f3b06c66ed6a5fd6fd95948b979cd70a70bc9"
  anchor_source_inference_repo_id: "HyeonSang/exp003_GPT52Chat_baseline_runner_exec"
  baseline_payload_sha256: "b5cbb6a80c776b458f99f007841a946c1c5f9ec8bf60be052500713dd6f13570"
  baseline_schema_version: "1.0"
  baseline_perception_wired: false
  baseline_main_calls: 234
  baseline_main_latency_ms: 2449199.44
  baseline_final_json_parse_failed: 13
  baseline_empty_final_text: 9
  anchor_visual_criteria: 43
  anchor_audio_criteria: 13
  full_task_count: 220
  full_visual_criteria: 337
  full_audio_criteria: 58
  chunk_envelope_hours: 44

judge:
  provider: "azure_openai"
  api: "responses"
  model: "gpt-5.6-sol"
  deployment: "gpt-5.6-sol"
  api_version: "2025-04-01-preview"
  timeout_sec: 600
  reasoning:
    effort: "max"
  generation:
    temperature: 0
    seed: 42
    max_output_tokens: 2400
    finalization_reasoning_effort: "max"

  tools:
    read_deliverable:
      env: "exp011_subprocess"
      ops:
        - inspect_structure
        - read_content
        - inspect_formatting
        - probe_audio
        - probe_video
      read_only: true
      per_item_call_cap: 8
      max_iterations: 10

  perception:
    visual:
      model: "gpt-5.6-sol"
      deployment: "gpt-5.6-sol"
      reasoning_effort: "max"
      vision: true
      call_cap_per_task: 72
    audio:
      model: "gpt-audio-1.5"
      deployment: "gpt-audio-1.5"
      call_cap_per_task: 3
      trim_seconds: 30

  critical:
    rule: "abs_max_score_threshold"
    threshold: 4
    sign_aware: true

  scoring:
    sign_aware_pct: true
    handle_nonpositive_total_max: "explicit"

rubric:
  source: "huggingface"
  repo_id: "openai/gdpval"
  revision: "11e7900cdcac61bc4daf59e65feb238acda98fbf"
  cache_dir: "data/gdpval-local"

grader:
  precheck_patterns_version: "v2"
  evidence_max_chars: 200
  judge_max_retries: 1
  per_item_max_output_tokens: 2400
  save_raw_responses: false
  fail_on_missing_evidence: true
  task_prompt_truncate_chars: 500

tpm_guard:
  max_concurrent: 1
  min_delay_ms_between_calls: 500
  retry_on_429:
    enabled: true
    max_retries: 3
    initial_backoff_sec: 2
    exponential_factor: 2.0

prompt:
  template: "prompts/grader_judge.md"
  tool_template: "prompts/grader_judge_v2.md"
  version: "v2.2"

output:
  directory: "../data/grades"
  filename_template: "{exp_id}__judge_{judge_slug}__{config_name}__cfg_{config_hash}__rubric_{rubric_sha}__inference_{inference_sha}__src_{grader_source_hash_short}__{prompt_v}.json"