schema_version: "2.0"
config_name: "gold_smoke_audio_v2_sol_max"
description: |
  The two-task smoke that proves the audio path before the 185-task full run,
  spec tasks/rebuilding_grading_task/304-full-gold-corpus.md and the re-run
  conditions in 306-rerun-conditions.md.

  Runtime semantics are byte-for-byte those of gold_ceiling_185_v2_sol_max --
  same judge, same reasoning effort, same tool ops and caps, same perception
  models, same critical rule, same scoring, same prompts, same rate-limit
  guard. Only the identity differs: the config name and a pinned corpus of
  two. Anything else would make the smoke predict something other than the run
  it is meant to de-risk.

  Why a separate config rather than a narrower dispatch: a config that pins
  `rerun_identity.task_ids` requires --tasks to equal that list exactly and
  --limit to be 0 or its full length, so neither flag can narrow the 185. The
  pin is what makes a re-run's identity checkable, and relaxing it to buy a
  smoke would cost more than the smoke is worth.

  Why these two, and why the list grew by one. The smoke was pinned to
  `75401f7c` on the theory that a bundle carrying .mp3, .mp4 and .wav is the
  cheapest exercise of the `input_audio` shape. That sentence used to say
  "the Responses API `input_audio` shape", which was wrong: audio is the one
  modality the two endpoints disagree about. `ResponseInputContentParam` is a
  union of text, image and file only, so a Responses request carrying audio is
  refused 400 before any model hears it -- which is exactly how the first two
  paid smokes failed, in half a second, with zero perception tokens. Audio
  belongs to `ChatCompletionContentPartParam`, and core/perception/audio.py
  has sent it to Chat Completions since #302. The third smoke (run
  33381143279) is the first whose audio calls settled: 19 of them, all
  resolved against gpt-audio-1.5, 8,448 input and 1,411 output tokens.
  The 174-task partial run then found the defect that theory was guessing at,
  and named its full blast radius: exactly two tasks had audio criteria
  demoted to TEXT and scored by a judge that could not hear -- `75401f7c`
  (14 items, 18.0 of 56) and `e222075d` (7 items, 10.3 of 60). Both are Film
  and Video Editors, which is why they are corpus-adjacent; consecutive rows
  share an occupation.

  A smoke covering one of the two would leave the other's regression unproven
  while costing most of what covering both costs, so the pin is now the
  measured set rather than the guessed one. It is derived, not asserted:
  tests/test_the_audio_smoke_covers_what_the_defect_damaged.py re-reads the
  defect block in stage3_partial_inventory.json and fails if this list and
  that one ever disagree.

  Order is not a preference. step8_grade.py refuses a pinned list that does
  not follow canonical source order, so `e222075d` (corpus position 46) is
  listed before `75401f7c` (47). That ordering is also why --limit could never
  have reached either one cheaply -- `--limit n` takes the first n tasks in
  corpus order.

  The pinned list is a proper subset of the source corpus, so step8_grade.py
  classes the scope as `subset` and forks the output into
  _diagnostic/<scope_sha>/. The full run's directory is therefore untouched by
  whatever this one does, including when it fails.
rerun_identity:
  experiment_id: "exp_gold_baseline"
  expected_task_count: 2
  # The dataset commit the rubric is read from. The same commit stages 1 and 2
  # were frozen to, so the two measurements are of the same corpus.
  rubric_commit_sha: "11e7900cdcac61bc4daf59e65feb238acda98fbf"
  # The same commit, because for a gold corpus the dataset IS the inference:
  # no model ran, so the revision that supplied the answers is the revision
  # that supplied the rubric.
  inference_revision: "11e7900cdcac61bc4daf59e65feb238acda98fbf"
  # Deliberately absent: allow_legacy_missing_provenance. That switch forgives
  # a submission whose Azure routes were never recorded. Here no inference ran,
  # so there is no route that could be missing -- the payload says `gold-corpus`
  # outright, and step8_grade.py keeps every such run out of the published path
  # on that basis alone.
  task_ids:
    - "e222075d-5d62-4757-ae3c-e34b0846583b"
    - "75401f7c-396d-406d-b08e-938874ad1045"

judge:
  provider: "azure_openai"
  api: "responses"
  model: "gpt-5.6-sol"
  deployment: "gpt-5.6-sol"
  api_version: "2025-04-01-preview"
  timeout_sec: 600
  reasoning:
    effort: "max"
  generation:
    temperature: 0
    seed: 42
    max_output_tokens: 2400
    finalization_reasoning_effort: "max"

  tools:
    read_deliverable:
      env: "exp011_subprocess"
      ops:
        - inspect_structure
        - read_content
        - inspect_formatting
        - probe_audio
        - probe_video
      read_only: true
      per_item_call_cap: 8
      max_iterations: 10

  perception:
    visual:
      model: "gpt-5.6-sol"
      deployment: "gpt-5.6-sol"
      reasoning_effort: "max"
      vision: true
      call_cap_per_task: 112  # 185-task gold run, measured: irreducible max 102 + one item (file_cap_per_item 10)
    audio:
      model: "gpt-audio-1.5"
      deployment: "gpt-audio-1.5"
      call_cap_per_task: 32  # checked-in 220 inventory: max 32 listening criteria
      trim_seconds: 30

  critical:
    rule: "abs_max_score_threshold"
    threshold: 4
    sign_aware: true

  scoring:
    sign_aware_pct: true
    handle_nonpositive_total_max: "explicit"

rubric:
  source: "huggingface"
  repo_id: "openai/gdpval"
  revision: "11e7900cdcac61bc4daf59e65feb238acda98fbf"
  cache_dir: "data/gdpval-local"

grader:
  precheck_patterns_version: "v2"
  evidence_max_chars: 200
  judge_max_retries: 1
  per_item_max_output_tokens: 2400
  save_raw_responses: false
  fail_on_missing_evidence: true
  task_prompt_truncate_chars: 500

tpm_guard:
  max_concurrent: 1
  min_delay_ms_between_calls: 500
  retry_on_429:
    enabled: true
    max_retries: 3
    initial_backoff_sec: 2
    exponential_factor: 2.0

prompt:
  template: "prompts/grader_judge.md"
  tool_template: "prompts/grader_judge_v2.md"
  version: "v2.2"

output:
  directory: "../data/grades"
  filename_template: "{exp_id}__judge_{judge_slug}__{config_name}__cfg_{config_hash}__rubric_{rubric_sha}__inference_{inference_sha}__src_{grader_source_hash_short}__{prompt_v}.json"
