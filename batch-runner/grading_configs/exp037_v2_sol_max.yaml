schema_version: "2.0"
config_name: "exp037_v2_sol_max"
description: |
  Grading identity for exp037_sol_first25: GPT-5.6 Sol at Max on the first 25
  tasks of the trial-stage rule, run through the Codex + Azure AI Foundry
  batch path. The judge, rubric, grader, tpm_guard, prompt and output blocks
  are copied byte-for-byte from exp035_codex_foundry_full220_v2_sol_max.yaml,
  as exp036_v2_sol_max.yaml's are. There is no rerun_identity, so no pull
  request is needed between the solve run and its grade; sol_batch_grading.py
  refuses a published result whose task list is not the registered 25, and
  runs step 8 for this config under the combined solve and grade ceiling of
  USD 400.

judge:
  provider: "azure_openai"
  api: "responses"
  model: "gpt-5.6-sol"
  deployment: "gpt-5.6-sol"
  api_version: "2025-04-01-preview"
  timeout_sec: 600
  reasoning:
    effort: "max"
  generation:
    temperature: 0
    seed: 42
    max_output_tokens: 2400
    finalization_reasoning_effort: "max"

  tools:
    read_deliverable:
      env: "exp011_subprocess"
      ops:
        - inspect_structure
        - read_content
        - inspect_formatting
        - probe_audio
        - probe_video
      read_only: true
      per_item_call_cap: 8
      max_iterations: 10

  perception:
    visual:
      model: "gpt-5.6-sol"
      deployment: "gpt-5.6-sol"
      reasoning_effort: "max"
      vision: true
      call_cap_per_task: 112  # 185-task gold run, measured: irreducible max 102 + one item (file_cap_per_item 10)
    audio:
      model: "gpt-audio-1.5"
      deployment: "gpt-audio-1.5"
      call_cap_per_task: 32  # checked-in 220 inventory: max 32 listening criteria
      trim_seconds: 30

  critical:
    rule: "abs_max_score_threshold"
    threshold: 4
    sign_aware: true

  scoring:
    sign_aware_pct: true
    handle_nonpositive_total_max: "explicit"

rubric:
  source: "huggingface"
  repo_id: "openai/gdpval"
  revision: "11e7900cdcac61bc4daf59e65feb238acda98fbf"
  cache_dir: "data/gdpval-local"

grader:
  precheck_patterns_version: "v2"
  evidence_max_chars: 200
  judge_max_retries: 1
  per_item_max_output_tokens: 2400
  save_raw_responses: false
  fail_on_missing_evidence: true
  task_prompt_truncate_chars: 500

tpm_guard:
  max_concurrent: 1
  min_delay_ms_between_calls: 500
  retry_on_429:
    enabled: true
    max_retries: 3
    initial_backoff_sec: 2
    exponential_factor: 2.0

prompt:
  template: "prompts/grader_judge.md"
  tool_template: "prompts/grader_judge_v2.md"
  version: "v2.2"

output:
  directory: "../data/grades"
  filename_template: "{exp_id}__judge_{judge_slug}__{config_name}__cfg_{config_hash}__rubric_{rubric_sha}__inference_{inference_sha}__src_{grader_source_hash_short}__{prompt_v}.json"
