schema_version: "2.0"
config_name: "default_v2_tight"
description: |
  default_v2.yaml with tighter tool-call caps and output cap.

  Provenance:
    Round 1 (exp998 N=3 smoke, 2026-05-30) externally projected $52/run.
    Round 2 (exp003 N=10 smoke, 2026-05-30) measured $7.66 / 10 tasks =
      $168/run extrapolation — over the autonomous stop+alert ceiling
      ($80) but under the abort line ($200), with v2 showing +5-7pp avg
      vs v1 baseline. Caps tightened to reclaim input-token budget
      without surrendering the quality margin.

  Delta vs default_v2.yaml:
    judge.tools.read_deliverable.per_item_call_cap : 8 -> 4
    judge.tools.read_deliverable.max_iterations    : 10 -> 6
    judge.generation.max_output_tokens             : 2400 -> 1500

  Acceptance gate (autonomous):
    - 220-task extrapolation <= $80
    - avg_score_pct >= 51 (v1 mini level, -5pp from default_v2 round 2)
    - judge_error_rate < 2%
  If met -> proceed to full exp003 grade-run (task 301).
  If not met -> STOP+ALERT, hand back to user.

judge:
  provider: "azure_openai"
  api: "responses"
  model: "gpt-5.4"
  deployment: "gpt-5.4"
  api_version: "2025-04-01-preview"
  timeout_sec: 600
  reasoning:
    effort: "medium"
  generation:
    temperature: 0
    seed: 42
    max_output_tokens: 1500              # was 2400

  tools:
    read_deliverable:
      env: "exp011_subprocess"
      ops:
        - inspect_structure
        - read_content
        - inspect_formatting
        - probe_audio
        - probe_video
      read_only: true
      per_item_call_cap: 4               # was 8
      max_iterations: 6                  # was 10

  perception:
    visual:
      model: "gpt-5.4"
      vision: true
      call_cap_per_task: 72  # checked-in 220 inventory: max 68 supported calls
    audio:
      model: "gpt-audio-1.5"
      call_cap_per_task: 3
      trim_seconds: 30

  critical:
    rule: "abs_max_score_threshold"
    threshold: 4
    sign_aware: true

  scoring:
    sign_aware_pct: true
    handle_nonpositive_total_max: "explicit"

rubric:
  source: "huggingface"
  repo_id: "openai/gdpval"
  revision: "main"
  cache_dir: "data/gdpval-local"

grader:
  precheck_patterns_version: "v2"
  evidence_max_chars: 200
  judge_max_retries: 1
  per_item_max_output_tokens: 1500       # mirrors generation.max_output_tokens
  save_raw_responses: false
  fail_on_missing_evidence: true
  task_prompt_truncate_chars: 500

tpm_guard:
  max_concurrent: 1
  min_delay_ms_between_calls: 500
  retry_on_429:
    enabled: true
    max_retries: 3
    initial_backoff_sec: 2
    exponential_factor: 2.0

prompt:
  template: "prompts/grader_judge.md"
  tool_template: "prompts/grader_judge_v2.md"
  version: "v2.2"

output:
  directory: "../data/grades"
  filename_template: "{exp_id}__judge_{judge_slug}__{config_name}__cfg_{config_hash}__rubric_{rubric_sha}__inference_{inference_sha}__src_{grader_source_hash_short}__{prompt_v}.json"
