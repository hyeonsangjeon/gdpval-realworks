# Codex against Foundry — GPT-5.6 Sol, the first 98 of exp038's 195
# ==========================================================
#
# Owner decision 2026-11-14 ("추천대로"): exp037's readout failed R3 and R4
# (12 solve legs and 11 grading chunks projected for the 195, against 9 each),
# so the 195 of exp038_sol_rest195 are solved as two experiments instead, as
# that file's header said they would be. This is positions 1-98 of
# exp038_sol_rest195's list, in the same order; exp040_sol_last97 is the
# rest. exp038_sol_rest195 stays registered and unapproved, and is never run.
#
#   ordered_task_ids_sha256  147fbb87ac52a0ec8389ecf84ce2f3dee3d839c79849b23afb4f7102b7ced6f8
#   98 tasks, 4,807 rubric items; every industry: Health Care 16, Manufacturing 13, Government 12, Professional Services 12, Wholesale 11, Real Estate 10, Finance 9, Retail 8, Information 7
#
# Money (sol_batch_controls.RUNS and sol_batch_grading.APPROVALS)
# ---------------------------------------------------------------
#
# USD 2,500 for this solve and its grade together, owner 2026-11-14. 2,500 =
# 1,600 solve + 900 grading; 51 per attempt, so attempts start while booked
# solve spend <= 1,549. From exp037's 25 measured tasks (solve booking and
# grading journal per task), resampled twice (the 25, then 98 draws from them;
# 100,000 runs): median solve about 840 and grade about 790, p99.9 1,500 and
# 1,263. The solve gate or the grading ceiling stops about 1 run in 1,300.
#
# Renderer
# --------
#
# exp037 was graded with PyMuPDF 2.1. grade-run.yml installs the grade job's
# libraries under batch-runner/grading_constraints/exp037_grade_environment.txt
# (the versions exp037's last chunk installed), outside the grader hash, so
# this grade reads deliverables with what exp037's did. The free dry run's
# "Preflight grading renderer" prints the fingerprint before any spend, and the
# readout's one_grader flag checks it afterwards.
#
# The wall clock and the relay legs
# ---------------------------------
#
# exp037 measured 10.4 minutes per task (11.0 by wall clock, retries
# included): 98 x 10.4 = 1,019 minutes, 6 legs of 170; at 11.0,
# 7. relay_max_runs: 10 allows eleven, so four or more legs are spare.
#
# Grading runs as one unsharded process in resume chunks of 338 minutes:
# 4,807 items x 0.96 judged x 24.1 s (exp037's mean) is 6 chunks; at
# chunk 0's slowest 32 s, 8. grade-run.yml chains eleven. A chunk after
# the first inherits the approval only through the bot's own auto-retrigger
# and this lineage's committed partial (grade-run.yml, "Resolve inherited
# paid approval"). The grade covers the whole registered list:
# sol_batch_grading.py refuses a dispatch that names tasks or a task limit.
#
# Resume stays off, and the money and relay rules are exp037's (see that
# file's header), with this run's names.

experiment:
  id: "exp039_sol_next98"
  name: "Codex command-line tool against Foundry — GPT-5.6 Sol, first 98 of exp038's 195"
  description: >-
    Part of the second stage of GPT-5.6 Sol on the whole benchmark: the
    first 98 of exp038_sol_rest195's 195 tasks (positions 1-98), in
    exp035's order. Approved 2026-11-14 at USD 2,500 for solve and grade.
  author: "Hyeonsang Jeon"
  created_at: "2026-11-15"

control:
  fixed:
    - model
    - reasoning_effort
    - context_window
    - prompt
    - temperature
    - self_qa
    - retry_budget
    - execution_environment
  changed:
    # The stage, and nothing else.
    - tasks

data:
  # HyeonSang/<experiment.id>, as in exp033-exp036. Step 0 creates it, step 7
