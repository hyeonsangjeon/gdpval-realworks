# exp027 - paired subprocess bridge for exp026 sandbox analysis
#
# Historical correction: exp026 declared reasoning_effort=low, but Step 1
# dropped that field before Runs #91/#92. Its effective runtime setting was
# therefore server default (reasoning_effort omitted). This control deliberately
# uses null so it matches the actual exp026 runtime rather than its YAML label.

experiment:
  id: "exp027_GPT54_default_subprocess_bridge50"
  name: "GPT-5.4 Default Reasoning - Subprocess Bridge 50"
  description: >
    A 50-task diagnostic subprocess comparator for exp026. It freezes the
    actual exp026 model behavior (server-default reasoning), 32K code budget,
    timeout, audio/video preprocessors, and Self-QA. It uses the coherent exp025
    subprocess condition prompt while exp026 uses Skills-specific guidance, so
    results describe the whole runner/prompt bundle and do not isolate sandbox
    causally.
  author: "Hyeonsang Jeon"
  created_at: "2026-07-14"

