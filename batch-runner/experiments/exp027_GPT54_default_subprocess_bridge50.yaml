    - tasks
    - model
    - temperature
    - reasoning_effort
    - code_generation_tokens
    - timeout
    - audio_video_preprocessors
    - self_qa
  changed:
    - execution_mode
    - condition_prompt
    - runner_codegen_prompt
    - sandbox_skills_contract_qa_repair_bundle

