condition_a:
  name: "Codex command-line tool, Foundry deployment"
  model:
    provider: "azure"
    # Must equal execution.codex.model: CodexAgentRunner.run refuses a
    # mismatch rather than calling one deployment and recording another.
    deployment: "gpt-5.6-sol"
    # Codex owns the request, so these are inherited defaults, not claims
    # about what was sent. The effort it sends is the one execution.codex
    # names.
    temperature: 0.0
    seed: 42
    reasoning_effort: null
  prompt:
    # Byte-for-byte exp033's, exp034's, exp035's and exp036's.
    system: |
      You are completing a professional work task. You have a terminal and a
      working directory. Do the task and leave the finished deliverables in
      the working directory as real files.
    prefix: null
    body: null
    suffix: null
  # Off, for the reason exp033 gives.
  qa:
    enabled: false
    max_retries: 0
    model: null
    min_score: 6
    prompt: ""

execution:
  mode: "codex_foundry"
  codex:
    endpoint_from_route: true
    model: "gpt-5.6-sol"
    # exp036's owner conditions 4 and 1: effort, then window. Step 1
    # carries both keys into the prepared file, and step 2 hands them to Codex.
    reasoning_effort: "max"
    model_context_window: 1000000
    # Both 0 on purpose; retries live in max_retries below, where they are
    # counted.
    request_max_retries: 0
    stream_max_retries: 0
  # Wall clock for one turn. Unchanged from exp033-exp036.
  timeout: 1800
  # Attempts after an infrastructure failure, per task: four at most, as in
  # exp035. The USD gate can refuse to start any of them.
  max_retries: 3
  # Off; see "Resume stays off" in the header.
  resume_max_rounds: 0
  # exp036's owner condition 5, kept: a Sol run is compared with Sol runs.
  install_libreoffice: true
  # Step 2's watchdog in minutes, used because the dispatch passes
  # wall_timeout 0. See "The wall clock and the relay legs" in the header.
  wall_timeout: 170
  # Leg zero plus ten relay legs, the most batch-run.yml accepts; see the
  # header.
  relay_max_runs: 10

output:
  # Nothing in codex_foundry mode reads this to decide an upload; the
  # dispatch's dry_run: false does. Written true so the two agree.
  publish_to_hf: true
  submit_to_evals: false
