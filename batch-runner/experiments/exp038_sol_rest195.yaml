# Codex against Foundry — GPT-5.6 Sol, the other 195 of the 220
# ===============================================================
#
# REGISTERED, NOT APPROVED. sol_batch_controls.RUNS["exp038_sol_rest195"] has
# no approval and no ceiling, so step 2 refuses this run with
# sol_batch_run_not_approved before any attempt, and sol_batch_grading.py
# refuses exp038_v2_sol_max.yaml before any download. Do not dispatch it: the
# refusal comes at step 2, after step 0 has already created the empty
# HyeonSang/exp038_sol_rest195 dataset. It is written now so the second stage
# is reviewed once, ahead of the owner's decision, rather than in a hurry after
# it.
#
# The second stage of the Sol 220: every task exp037_sol_first25 did not run,
# in exp035's sorted order. Together the two stages are the 220, each task
# solved once. Everything that touches a result is exp036's and exp037's.
#
#   ordered_task_ids_sha256  18699a1808cb03a6ecfdf9479879f1662b3b49ae5617df6fcbcf391f56269725
#   9,248 rubric items; 22 tasks from each industry except Retail Trade (18)
#   and Wholesale Trade (23)
#
# The approval pull request
# -------------------------
#
# Owner approval for this stage comes after exp037's readout and sets, in one
# pull request: approval and the four money fields in RUNS, re-derived from
# exp037's measured per-task solve and grading cost, with the same approval and
# ceiling on EXP038_REST195 in sol_batch_grading.APPROVALS; this header's wall-clock
# figures, re-derived from exp037's measured task time; and, if exp037
# changed the grader, a regrade of exp037 under the same grader so the two
# halves of the 220 are marked by one grader.
#
# The wall clock and the relay legs
# ---------------------------------
#
# From exp036's rate until exp037 measures Sol's:
#
#   195 tasks x 390 s (exp036's mean) = 1,268 minutes of work
#   170-minute watchdog per leg, the same per-leg arithmetic as exp036
#   relay_max_runs: 10 -> eleven legs, 1,870 minutes: 7.5 legs needed, so
#   at least nine with room to spare
#
# Eleven legs is the most batch-run.yml accepts (relay_max_runs 0..10, and a
# relay_run input above 10 is refused), so the lineage can finish only if
# Sol's mean task time stays under about 9.5 minutes (11 x 170 / 195). If
# exp037 measures more, the approval splits this stage into two experiments of
# about 98 tasks each instead of hoping.
#
# Resume stays off, the money and relay rules are exp037's (see that file's
# header), with this run's names.
#
# Grading would run as one unsharded process in sequential resume chunks
# (step 8 exits 7 at the 338-minute budget and the next chunk is dispatched
# only after the finished chunk's journal is on main): about 32 to 40 hours,
# six to eight of the eleven chunks grade-run.yml allows, every chunk under
# this run's one ceiling.

experiment:
  id: "exp038_sol_rest195"
  name: "Codex command-line tool against Foundry — GPT-5.6 Sol, the other 195 of 220"
  description: >-
    The second stage of GPT-5.6 Sol on the whole benchmark: the 195 tasks
    exp037_sol_first25 did not run, in exp035's order. Registered, NOT approved:
    sol_batch_controls refuses it before any attempt.
  author: "Hyeonsang Jeon"
  created_at: "2026-11-06"

