# Agentic Sandbox V2, stage one: the settings and what they could cost
# ====================================================================
#
# Stage one is the first step in
# tasks/0822_saturday/TASK_AGENTIC_SANDBOX_V2_FOUNDATION.md: let the model
# choose its own next action from the safe tools, with the command-running tool
# exec_run still shut. It answers one question — does asking the model again
# after each tool result help at all? — and nothing else.
#
# TWO AMOUNTS ARE APPROVED HERE, FOR THE FIVE TASKS BELOW AND NOTHING ELSE.
#
# This header used to read "NOTHING HERE IS APPROVED AND NOTHING HERE RUNS",
# and it went on reading that way after the amounts were filled in on
# 2026-09-11 — four lines above the block that holds them. Corrected rather
# than quietly deleted, because the first sentence of a file is the one a
# reader trusts, and a file that contradicts itself is believed at the top.
#
# What is approved: running the five task_ids below (50.00) and marking their
# answers (2600.00), under the standing approval for Foundry model calls and
# experiments within the already authorised scope. Both are whole-run figures
# for those five tasks. Neither is a per-task rate, so neither prices a larger
# cohort: scripts/run_agentic_v2_stage.py refuses any stage this file has not
# priced and says by what multiple it would have overrun.
#
# Read this file with:
#     cd batch-runner
#     python scripts/check_agentic_stage_one_ceiling.py
#
# Beyond the money, two things still block stage one, and approving an amount
# did not move either of them:
#
#   - the guards that keep the mode out of the paid pipeline. Two of them: the
#     check in step2_run_inference._require_runnable_execution_mode, and the
#     refusal in core/executor.py to build a runner unless the caller states
#     the run makes no paid model calls. Both stay exactly as they are.
#   - exec_run is still shut, so nothing stage one does runs a command. No
#     guest boots either, so stage one exercises the loop and not the
#     isolation, and no result from it is evidence about the isolation.
#
# One thing that used to be on this list has moved, and is written down here so
# the change is not silent. Until 2026-09-10 nothing in the repository could
# reach a real model at all. Now it can:
# core/agentic_v2_model_voice.AzureFoundryVoice asks a Foundry deployment
# through the Responses API. What replaced that blocker was narrower — the
# amount below, since real_model_voice refuses when it is handed no budget and
# the loop refuses a paid voice on a run that carries none, both of which the
# free check runs rather than reads. That blocker was cleared on 2026-09-11
# when the two amounts were approved. It is kept here because it explains why
# the amounts are the thing that mattered, and because a run that finds itself
# refused for want of a budget is being refused by those two mechanisms.
#
# Written: 2026-08-26. Amounts approved and this header corrected: 2026-09-11.

plan_version: "agentic-stage-one-v1"

# ── The model, which must be the same one the comparison uses ─────────────
#
# Stage one is not itself a scored comparison against the other run places, but
# its result is only worth anything if it can later be set beside them. That
# needs the same deployment, in the same Azure account, so the same rules apply
# here as in advance_check_plan.yaml.
model:
  deployment: "gpt-5.4"
  resolved_model: "gpt-5.4"

azure_connection:
  account: "hjeon-fdpo-foundry-eus2"
  project: "gdpval-realworks"
  route_profile: "project-ci"

# ── The tasks ─────────────────────────────────────────────────────────────
#
# The same five tasks the three-place comparison fixed, chosen by the rule in
# core/execution_envelope_tasks.py from a catalogue that holds no score. Using
# the same five means a stage-one result can be set beside the other three run
# places on the same work, rather than on work chosen afterwards.
task_ids:
  - "02aa1805-c658-4069-8a6a-02dec146063a"
  - "0112fc9b-c3b2-4084-8993-5a4abb1f54f1"
  - "2ea2e5b5-257f-42e6-a7dc-93763f28b19d"
  - "3baa0009-5a60-4ae8-ae99-4955cb328ff3"
  - "0818571f-5ff7-4d39-9d2c-ced5ae44299e"

# ── The settings whose price is being asked about ─────────────────────────
#
# Two settings decide almost all of the cost, and they are the two the owner
# has to choose between. They are listed here as candidates rather than fixed,
# because the point of this file is to price the choice.
#
#   tool_calls_per_attempt — how many times the model may be asked again inside
#     one attempt. The dispatcher in core/agentic_v2_tools.py refuses anything
#     past its own ceiling, and the free check reads that ceiling from the code
#     rather than from a number written here, so a candidate above it is left
#     out instead of being priced.
#
#     This is the setting that matters most, and not in the way people expect.
#     Every turn re-reads the whole conversation before it, so what was written
#     early is charged again on every later turn. Doubling this number roughly
#     quadruples what the earlier turns cost to re-read.
#
#   max_output_tokens_per_turn — the most the model may write in one turn.
#
#     The three-place comparison uses 32768, and there that is nearly free
#     because one answer is written per task. Here an answer may be written on
#     every turn, so the same number is multiplied by the number of turns. A
#     turn that only picks a tool needs very little room, so the smaller
#     candidates are not a compromise; they match what a turn actually does.
candidate_settings:
  tool_calls_per_attempt: [4, 6, 8, 12, 16, 32]
  max_output_tokens_per_turn: [2048, 4096, 8192, 32768]

# The settings that are fixed whatever is chosen above.
fixed_settings:
  # One retry, and only after a network failure, a server error, or a timeout.
  # The model's own judgement never triggers one.
  retry_max_attempts: 1
  retry_reasons_allowed:
    - "infrastructure_error"

  # Off. Stage one asks whether choosing tools helps. Letting the model take a
  # second look at its finished answer is a different question, and running
  # both at once would make it impossible to say which one produced the
  # difference.
  self_review_enabled: false
  self_review_max_attempts: 0

  per_task_timeout_seconds: 1200

  # Never allowed. If a call fails, the run stops rather than quietly asking a
  # different model or a different deployment.
  automatic_model_switch_allowed: false

  # exec_run stays shut. Stage one proves the loop works — the model reads a
  # result and picks a next action — without the capability that carries the
  # risk. Opening it is stage three and needs its own separate approval.
  exec_run_open: false

# ── The command-running tool stays shut ───────────────────────────────────
#
# Listed separately so it cannot be lost among the settings above. All three
# blocks described in the specification stay exactly as they are through stage
# one, and the free check confirms each of them by running it, not by reading
# text:
#
#   1. step2_run_inference._require_runnable_execution_mode refuses the mode.
#   2. core/executor.py refuses to build a runner for a paid run.
#   3. exec_run answers that the capability is unavailable for any ordinary
#      command.
#
# If any of the three has opened, the free check refuses regardless of money.
safety_blocks_must_stay_closed: true

# ── What may be spent ─────────────────────────────────────────────────────
cost:
  # ── Two amounts, because they are two decisions ─────────────────────────
  #
  # There used to be one key here, approved_maximum_usd, holding the total. The
  # free check now refuses a plan that still carries it, rather than reading it
  # as either half — an approval given for a total is not an approval of a part
  # of it.
  #
  # The reason for the split is in the table the free check prints. Marking is
  # a flat 2504.67 whatever the settings are; running moves from 3.37 to 493.70
  # across the candidate rows. Held as one figure, the decision actually being
  # made — which settings buy an answer worth having — is under one per cent of
  # the number being signed, and could change a hundredfold without moving it.
  #
  # Approved 2026-09-11 under the standing approval for Foundry model calls and
  # experiments in the existing authorised scope.

  # Running the five tasks. The chosen row below prices at 18.47 at most; 50 is
  # written here so a modest move in the shared assumptions does not turn a
  # correct plan into a refused one without anybody having changed their mind.
  # Nothing spends up to it: the per-task budgets under chosen_settings are
  # what actually stop a run, and they are worked out from the same arithmetic.
  running_approved_maximum_usd: 50.00

  # Marking the five answers. Approved here because the plan is where the whole
  # of stage one is priced and a half-approved stage is not an approved one.
  # Nothing in scripts/run_agentic_v2_stage.py can spend it — that script binds
  # every call to the problem-solving bucket, and core.agentic_v2_cost_binding
  # raises on a grading stage. Marking is a separate run against this figure.
  grading_approved_maximum_usd: 2600.00

  # ── The settings ─────────────────────────────────────────────────────────
  #
  # Eight tool calls and 8192 tokens a turn, from the table the free check
  # prints. Chosen 2026-09-11, and the reasoning is worth keeping because the
  # cheapest row is not obviously wrong:
  #
  #   4 / 2048   3.37   what stage A asked one question with. Four tool calls
  #                     is enough to read, write and finalise, and little else;
  #                     a task needing to look at two inputs first has spent
  #                     them before it starts.
  #   8 / 8192  18.46   chosen. Double the calls, quadruple the write cap, at
  #                     an amount that is still small.
  #  16 / 32768 137.62  the write cap is past what these deliverables need, and
  #                     the loop re-sends the whole conversation every turn, so
  #                     the input cost grows with the square of the length.
  #
  # This is a choice about what the model is given room to do, and it will show
  # up in the results either way. Recorded before the run, not after it.
  chosen_settings:
    tool_calls_per_attempt: 8
    max_output_tokens_per_turn: 8192

  # ── Stage A: the one paid question that comes before the run above ──────
  #
  # Stage A is not a fifth of stage one and is not priced as one. It asks a
  # single thing — can a real deployment be reached, does it choose a tool, and
  # does the turn after that arrive holding the first turn's answer — on one
  # task, and it marks nothing. Marking is about 2504 of the cheapest stage-one
  # row's 2543 dollars, so a figure carrying a share of it would be almost
  # entirely for work this does not do.
  #
  # The figure below is not copied from anywhere. The free check works it out
  # from the same arithmetic as the table above, with two things changed: one
  # task instead of five, and no marking. At 4 tool calls and 2048 tokens a
  # turn that is 0.47 to run and 0.59 with the safety multiplier, against the
  # one dollar written here.
  #
  # Which task is not chosen here either. It is the first of the five fixed
  # above, taken by position in core/agentic_v2_stage_one_budget.py, so the
  # probe cannot be quietly pointed at whichever one looks easiest.
  #
  # The cheapest row is deliberate. Four calls is enough for a model to spend a
  # turn orienting and still have a second turn that must react to the first
  # one's answer, which is the whole question. Stage A is not trying to produce
  # good work, so paying for longer replies would buy nothing it is asking
  # about.
  stage_a_probe:
    approved_maximum_usd: 1.00
    chosen_settings:
      tool_calls_per_attempt: 4
      max_output_tokens_per_turn: 2048

    # Read from core/agentic_v2_stage_a_probe.py rather than declared here. A
    # list written in a file is a claim; the check compares the tuple the probe
    # will actually offer, so a probe that gained finalize would fail this even
    # if nobody updated the document.
    tools_come_from: "core/agentic_v2_stage_a_probe.py PROBE_TOOLS"

  # The written guesses the figures rest on. These are the same ones the
  # three-place comparison uses, taken from
  # experiments/execution_envelope/advance_check_plan.yaml so the two cannot
  # drift apart. The free check reads them from that file rather than from a
  # second copy here.
  #
  # One of those guesses is borrowed rather than measured here: the length of
  # the standing instructions. Stage one will have its own wording, which does
  # not exist yet, so the three-place comparison's figure stands in for it. That
  # figure is measured rather than written down — the comparison renders the
  # prompt each of its run places really sends, takes the widest, and adds the
  # sections its runner builds around it. The wording is sent on every turn, so
  # if stage one's own instructions turn out longer than the widest of those
  # three, this must be measured again before the figures are trusted.
  #
  # No figure for it is repeated here on purpose. It has already moved twice —
  # 1068 written down, then 5020 measured, then 7307 once the sections nobody
  # had counted were counted — and each move changed the cheapest row above
  # (3.24, then 3.32, then 3.37 to run). A number copied into this sentence is
  # a number that goes stale the next time that happens without anything
  # noticing, which is exactly what it did. The live one is in the file named
  # below, and the free check reads it from there.
  assumptions_come_from: "experiments/execution_envelope/advance_check_plan.yaml"

  # One thing is NOT taken from that file: how much a single tool result may
  # add to the conversation. That number is read from the dispatcher's own code
  # in core/agentic_v2_tools.py, because the dispatcher is what will actually
  # enforce it when something runs. A number written down here could disagree
  # with the code; a number read from the code cannot.
  tool_result_size_comes_from: "core/agentic_v2_tools.py AgenticV2ToolDispatcher"

# ── What happens after stage one ──────────────────────────────────────────
#
# Written down now so that a disappointing result cannot lead to the rules
# being loosened afterwards.
after_stage_one:
  success_criteria: >-
    All five tasks finish without an error, and a test shows the model was
    asked again with a tool result in front of it and changed what it did
    because of it. Whether the answers scored well is a separate question and
    is not part of finishing stage one.
  stop_conditions: >-
    Stop at once if the model name or deployment name reported back differs
    from the one fixed above; if a run switches model or deployment on its own;
    if any of the three safety blocks shows signs of having been opened; if a
    paid call is about to happen without an approved amount on record; or if
    real spending passes the amount approved above.
  next_stage: >-
    Stage two writes down what a command may touch and proves each limit with a
    test that tries to exceed it. It is test-only and switches nothing on.
    Opening exec_run is stage three and needs its own separate written
    approval, presented with those test results.
