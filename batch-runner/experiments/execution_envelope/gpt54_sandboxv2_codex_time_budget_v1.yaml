  native_turn_equals_model_attempt: false

conditions:
  # Named differences, not replacement runtime configs. Existing template bytes
  # remain sealed, including V2's other local settings. No equal-compute claim.
  sandbox_v2:
    template: batch-runner/experiments/execution_envelope/agentic_corrected_harness_plan.yaml
    harness: agentic_sandbox_v2
    isolation: same-host
    replay_format: faithful
    request: {reasoning_effort: xhigh}
    local_settings: {max_model_turns: 9, max_written_tokens_per_turn: 8192}
    settings_scope: v2_only_not_shared_native_compute
