# The one set of conditions all three run places must share
# =========================================================
#
# The comparison asks a single question: when the same GPT model does the same
# work, does the place it runs in change the result? That question only has an
# answer if everything except the run place is held still. This file is where
# "everything else" is written down, once, for all three places to read.
#
# Nothing in this file causes a model to be called. It is read by the free
# check at batch-runner/scripts/check_execution_envelope_advance_check.py.
# Technical inconsistencies still stop the run. Cost findings are recorded for
# review under the owner's explicit credit-backed measurement decision below.
#
# Read this file with:
#     cd batch-runner
#     python scripts/check_execution_envelope_advance_check.py \
#         --plan experiments/execution_envelope/advance_check_plan.yaml
#
# Written: 2026-08-25. Stage: the five-task advance check only. The thirty-task
# and two-hundred-and-twenty-task stages are written down further below so the
# rules for them are fixed before any result is seen. This approval applies to
# paid benchmark work under the recorded monthly credit, but each stage keeps
# its fixed task and execution limits.

plan_version: "execution-envelope-advance-check-v1"

# Which of the two comparisons this plan is for.
#
# "same_generated_code_rerun" is the stricter one: self-review and retries
# driven by the model's own judgement are switched off, so the only thing that
# differs between the three places is where the code runs. The advance check
# uses it because its purpose is to confirm the three places start under
# identical conditions, not to compare scores.
comparison: "same_generated_code_rerun"

# ── Which run places take part ────────────────────────────────────────────
#
# Three of the five places named in the written specification are listed. The
# other two are left out on purpose and are NOT replaced by anything:
#
#   Agentic Sandbox V2 — its command-running tool answers that the capability
#     is unavailable, two separate guards refuse the mode, and nothing here can
#     reach a real model to drive it. The loop itself does exist, at
#     core/agentic_v2_conversation.py, and is proven against stand-ins that
#     spend nothing; this comment said otherwise until 2026-08-26, which is
#     what a written-down claim does when nobody re-reads it. Only structure
#     checks are possible, so it cannot take part in a scored comparison.
#     core/execution_environment_readiness.py is the copy that is checked
#     against the code; if the two ever disagree, believe that one.
#
#   Codex built-in agent — this repository holds no code that runs a benchmark
#     task through it, and no official documentation was found describing
#     either running its agent loop against an outside benchmark or running it
#     on an Azure AI Foundry deployment. Its place in the comparison stays
#     empty until both of those exist.
#
#   Codex native harness on this same Foundry deployment — no code here runs a
#     task through it. Its published configuration reference gives a provider
#     its credential through a static API key in an environment variable, or
#     through a command that prints a bearer token; this repository forbids
#     every static Azure credential variable and raises when one is set. That
#     reference documents no Microsoft Entra sign-in for a provider and gives
#     no way to pin an API version. Those are three separate blockers, and
#     none of them is cleared by clearing the others.
#
#   GitHub Copilot command-line tool on this same Foundry deployment — no code
#     here runs a task through it. Its own-key documentation supplies the
#     credential through COPILOT_PROVIDER_API_KEY, a static API key this
#     repository forbids; and its Azure example addresses the service at
#     /openai/deployments/<name>, which is none of the three endpoint shapes
#     core/azure_ai_clients.py accepts. Either one alone would stop the run.
#
#   GitHub Copilot command-line tool on a GitHub-served model — no code here
#     runs a task through it, and it is not the same comparison in any case.
#     GitHub's documentation describes automatic model selection routing a
#     task to whichever model it judges best, and a designated base model used
#     when no other is available. Which model answers is therefore GitHub's
#     decision, so a result from here says something about the product, not
#     about a run place. It has a scoreboard of its own or none at all.
#
# Leaving a place out of this list does not make the comparison complete. It
# records that the place could not run, which is a different statement from
# "the place performed badly".

# ── The model, and everything sent with it ────────────────────────────────

model_run_conditions:
  shared:
    # Where the model comes from.
    provider: "azure"

    # The name of the deployment an administrator created in Azure AI Foundry.
    # All three run places address this one name. Nothing in this repository
    # may change it part-way through a run: see automatic_model_switch_allowed
    # below.
    #
    # Why this one: it is the only deployment already used by experiment
    # settings in this repository for both a separate Python process on the
    # server (exp025, exp027) and a Docker container (exp026), and the same
    # name is recorded as having answered through the Responses API in
    # data/grades, which is the interface the Azure code interpreter uses. No
    # other deployment name in this repository has evidence for all three.
    deployment: "gpt-5.4"

    # The model name the service is required to report back with its answers.
    #
    # This cannot be confirmed before the first call, because it is a value the
    # service returns. It is written here as the value the run must see: if a
    # reply names anything else, the run stops rather than continuing with a
    # different model. The per-task record keeps whatever the service actually
    # returned, taken from the reply itself and not copied from this file.
    resolved_model: "gpt-5.4"

    # The version of the request format used to call the service.
    api_version: "2025-04-01-preview"

    # The standing instruction each run place's settings offer, word for word.
    # Copied unchanged into all three experiment settings files; the free check
    # compares them character by character and refuses the run if they drift.
    #
    # It is offered rather than sent. core/prompt_loader.py lets a committed
    # prompt file's own system_message win whenever it has one, and all three
    # prompt files have one, so this wording is a fallback that never comes up.
    # Holding the three places to the same fallback is still worth doing — it
    # is one more way they could quietly stop being comparable — but it is not
    # what the model reads, and the cost sum no longer charges for it as though
    # it were. See instruction_character_count below.
    system_instruction: |
      You are a helpful assistant that completes professional tasks.
      When the task requires creating files (e.g., Excel, Word, PDF, PowerPoint),
      write Python code that generates those files and save them to the current directory.
      Use libraries such as openpyxl, python-docx, reportlab, python-pptx, and Pillow.
      Always produce complete, runnable code.

    # The instruction appended to every task, word for word. Same rule as above.
    task_instruction: |
      If the task requires creating deliverable files (documents, spreadsheets,
      presentations, reports, etc.), you MUST use Python code to generate the
      actual file(s) and save them to the current directory.
      Do NOT just describe what you would create — actually execute code to produce
      downloadable files. The task is NOT complete unless the files are saved.

      In your text response, do NOT include any file download links or sandbox URLs
      (e.g. "[Download ...](sandbox:/mnt/data/...)" or similar).
      Only provide a plain-text summary of what was produced.

      Before writing any code, ALWAYS inspect the actual structure of any
      reference files first (df.columns, df.dtypes, df.head()).
      Never hardcode column names or assume data types.

    # The five tasks, in a fixed order.
    #
    # These were not picked by hand. They come from a rule written down before
    # any result was seen, carried in
    # batch-runner/core/execution_envelope_tasks.py and re-derived by the free
    # check every time it runs, from a catalogue that holds no score at all:
    #
    #   Sort every task in the benchmark by its task number. Fill five slots in
    #   this order — spreadsheet, document, presentation, picture, text answer
    #   only. For each slot take the smallest-numbered task that has not been
    #   taken, whose job is not already represented, and all of whose expert
    #   answer files belong to that format; if the benchmark holds no such
    #   task, take the smallest-numbered one where at least one answer file
    #   does.
    #
    # What the rule produced, and why each one:
    #
    #   02aa1805  spreadsheet   expert handed in an .xlsx file
    #                           Project Management Specialists
    #   0112fc9b  document      expert handed in a .pdf file
    #                           Nurse Practitioners
    #   2ea2e5b5  presentation  expert handed in a .pptx file
    #                           Computer and Information Systems Managers
    #   3baa0009  picture       no task in this benchmark hands in a picture on
    #                           its own; this is the smallest-numbered task that
    #                           hands in one at all (a .jpg beside a .pdf)
    #                           News Analysts, Reporters, and Journalists
    #   0818571f  text only     expert handed in no file, only written text
    #                           Real Estate Brokers
    #
    # Five deliverable formats, five different jobs, four different industries.
    task_ids:
      - "02aa1805-c658-4069-8a6a-02dec146063a"
      - "0112fc9b-c3b2-4084-8993-5a4abb1f54f1"
      - "2ea2e5b5-257f-42e6-a7dc-93763f28b19d"
      - "3baa0009-5a60-4ae8-ae99-4955cb328ff3"
      - "0818571f-5ff7-4d39-9d2c-ced5ae44299e"

    # The exact version of every input, by content fingerprint (SHA-256).
    #
    # The first entry pins the benchmark dataset itself, at the same revision
    # this repository's published grades were produced against. The other two
    # pin the reference files the chosen tasks ship with.
    #
    # Every file in this dataset sits in a folder whose name is 32 hexadecimal
    # characters, and *some* of those folders are the first 32 characters of
    # the file's own fingerprint. Not all of them. At the pinned revision the
    # dataset holds 549 files — 301 under `reference_files/` and 248 under
    # `deliverable_files/` — and the folder name repeats the fingerprint for
    # 200 of them, not one of which is a deliverable file. Both entries pinned
    # below are among the 200, which is why a machine holding no copy of the
    # dataset can still check half of each written value for free.
    #
    # Half is all it is worth, and the check says so rather than rounding up.
    # The other 32 characters stand unchecked until the file itself is read.
    # A folder name that disagrees is recorded as unchecked too — with most of
    # this dataset's folders not named after their contents, a correct
    # fingerprint disagrees with its folder exactly like a wrong one does, so
    # the disagreement does not say which of the two is at fault. Either way
    # the run stops on it; none of these states is a pass.
    input_file_versions:
      "openai/gdpval@11e7900cdcac61bc4daf59e65feb238acda98fbf": "f8422fab9b21d90c0ee5f0659842ab666d418cb8940842918f9f4b0df7ae0202"
      "reference_files/bb09ca2a9999b404d7fced9202b42949/Work Time Study - Source.xlsx": "bb09ca2a9999b404d7fced9202b42949cd9f142f39554e254bac77b3686dae9e"
      "reference_files/901e943a97328a661f9e704ae43eeea1/Acquisition Criteria (2).pdf": "901e943a97328a661f9e704ae43eeea167e7805385a99322f1c24f8e159125c4"

    # The most the model may write in reply to one request.
    #
    # 32768 is the value exp026 and exp027 already use. The note in exp026
    # records that 16384 truncated this model's generated code and produced an
    # empty visible answer, so a lower value would turn a working run place
    # into a failing one and corrupt the comparison.
    max_output_tokens: 32768

    # The most wall-clock time one task may take.
    #
    # 1200 seconds is the value exp026 and exp027 already use. The default for
    # a separate Python process on the server is 570 seconds, so it is raised
    # here on purpose: a different time limit per run place would itself change
    # the result, which is the thing being measured.
    per_task_timeout_seconds: 1200

    # Self-review is off. This comparison changes the run place and nothing
    # else, so the model must not get a second look at its own answer in one
    # place and not another.
    self_review_enabled: false
    self_review_max_attempts: 0

    # Only one of the three reasons for attempting a task again is allowed:
    # a network failure, a server error, or a timeout. The model's own
    # judgement never triggers a retry here, because self-review is off.
    retry_reasons_allowed:
      - "infrastructure_error"
    retry_max_attempts: 3

    # Never allowed. If a call fails, the run stops rather than quietly asking
    # a different model or a different deployment, which would leave a score
    # that no single model earned.
    automatic_model_switch_allowed: false

    # Where the answer comes from.
    #
    # Two run places can agree on every line above and still not be asking the
    # same model, because a product may choose one for itself. This says which
    # of the two known sources each place uses, and the free check refuses a
    # place that lets a product choose from joining a comparison that reports
    # its results as differences between run places.
    #
    # The Microsoft Foundry resource the deployment lives in is deliberately
    # NOT repeated here. It is named once, in the azure_connection block below,
    # and the free check fills it in from there; writing it twice would let the
    # two copies drift with nothing to notice.
    model_serving_path: "microsoft_foundry_deployment"

    # Never allowed. When something the run needs cannot be had, the run stops
    # and the failure is written down. Carrying on with a substitute would put
    # the substitute's score under the name of the thing it replaced.
    #
    # This is a separate prohibition from the one above: that one is about
    # changing model, this one is about carrying on at all.
    automatic_fallback_allowed: false

    # Never allowed. If the run place named here cannot be used, the task is
    # not run somewhere else. The whole comparison is between run places, so a
    # run that moved would report one place while measuring another. The
    # container block below is the same rule written where a real code path
    # could break it.
    unsupported_runner_substitution_allowed: false

  # The three run places. Each one takes the shared conditions above with no
  # change at all — that is the point of the comparison — so each entry is
  # empty. An entry that set anything here would be a difference between run
  # places, and the free check would report it.
  by_environment:
    host_python_process: {}
    docker_container: {}
    azure_code_interpreter: {}

# ── The experiment settings file each run place uses ──────────────────────
#
# The free check opens each of these and compares it against the conditions
# above: the deployment name, the two instruction texts, the task list, the
# run mode, the answer-length cap, the time limit, the retry count, and
# whether self-review is switched on. Any disagreement stops the run.

experiment_files:
  host_python_process: "experiments/execution_envelope/exp030_envelope_host_python_process.yaml"
  docker_container: "experiments/execution_envelope/exp031_envelope_docker_container.yaml"
  azure_code_interpreter: "experiments/execution_envelope/exp032_envelope_azure_code_interpreter.yaml"

# ── The container requirement ─────────────────────────────────────────────
#
# The Docker run place must never quietly become the server run place.
#
# SandboxRunner._execute in batch-runner/core/sandbox_runner.py runs the code
# on the server's own operating system, after printing a warning, when the
# container setting is "auto" and either Docker or the image is missing. If
# that happened during this comparison, the Docker place's score would in fact
# be the server place's score, and the two columns of the result table would be
# measuring the same thing without saying so.
#
# "always" is therefore required. With it, a missing Docker service or a
# missing image ends the task as a failure that is written down, instead of
# moving the work somewhere else. The free check refuses any other value, and
# tests/test_execution_envelope_docker_containment.py holds the behaviour in
# place.
container:
  use_docker: "always"
  image: "gdpval-sandbox:latest"

# ── Which Azure resource the deployment must live in ──────────────────────
#
# A deployment name does not identify a deployment.
#
# When this comparison was first attempted, the Azure tenant it was attempted
# from held two separate Azure AI Foundry accounts that each exposed a
# deployment named exactly "gpt-5.4", and a third that exposed the same
# underlying model under a different deployment name. Two accounts, same name,
# different resources: possibly different regions, different model versions,
# different content filters.
#
# So pinning `deployment: gpt-5.4` above is not enough on its own. Without the
# account and project below, the comparison could run against a deployment
# nobody intended and still report, truthfully by its own rules, that every run
# place used the same deployment name. That is the exact class of silent error
# this whole plan exists to prevent, and it was open until this block was added.
#
# These two names are the ones this repository already records for its own
# automated runs, as the repository variables AZURE_AI_EXPECTED_PROJECT_ACCOUNT
# and AZURE_AI_EXPECTED_PROJECT_NAME. They are settings, not secrets.
#
# That sentence used to sit here on its own, with nothing comparing the two.
# The free check now compares them: if either repository variable names another
# account or another project, the run is refused before it starts. It also
# demands that they be set at all, because every automated run place here that
# can spend money turns on AZURE_AI_REQUIRE_EXPECTED_IDENTITIES, and the Azure
# run place then refuses to start without them.
#
# The free check reads the endpoint settings in the environment, classifies
# them with this repository's own endpoint rules, and refuses the run if they
# name any other account or project. Every rule it applies is read from
# core/azure_ai_clients.py, which is the module the paid run itself uses to
# decide whether a route may be built.
azure_connection:
  account: "hjeon-fdpo-foundry-eus2"
  project: "gdpval-realworks"
  route_profile: "project-ci"

# ── The two comparisons keep separate score tables ────────────────────────
#
# Results from re-running one model's own code and results from letting each
# tool use everything it ships with answer different questions and must never
# be added together. Each table carries the name of the comparison it belongs
# to.
scoreboards:
  same_generated_code_rerun:
    comparison: "same_generated_code_rerun"
    status: "not started — no paid model call has been made"
  tool_built_in_features:
    comparison: "tool_built_in_features"
    status: "not started — no paid model call has been made"

# ── Which marking settings the answers will be marked with ────────────────
#
# Named here so the free check can open the file and compare the marking
# numbers in the cost sum below against the limits the marking would really
# apply. Without this the marking half of the ceiling is three numbers typed by
# hand that nothing verifies, which is how a ceiling quietly becomes a guess.
#
# The check reads four limits out of this file: how many times the model may be
# asked about one scoring line, how long one reply may run, and whether picture
# reading and sound listening are switched on and at what per-task limit.
grading_config: "grading_configs/default_v2.yaml"

# ── What the largest possible bill is, and how it was worked out ──────────
#
# These are the written guesses the ceiling rests on. Each one is stated on
# purpose, because an unstated guess is how a cost ceiling ends up wrong in the
# direction that costs money.
cost:
  # The owner has a monthly allowance of Azure credit and explicitly approved
  # using it for these benchmark runs on 2026-08-28. The exact amount is
  # account information, so it is kept in the owner's private records and not
  # written here. Cost calculations remain visible, but an estimate above a
  # prior amount, a model without a published price, or a missing first-use
  # measurement no longer blocks this plan. Fixed task, call, retry, token, and
  # timeout limits still bound the five-task run.
  policy: "record_cost_findings_only"
  approved_maximum_usd: null
  owner_approval:
    approved_on: "2026-08-28"
    paid_model_calls: true
    unpriced_audio_measurement: true
    # No account balance belongs here. What the owner approved is the two flags
    # above; how much credit is left in the account is account information, it
    # is not a setting for a run, this file is published, and no check reads
    # it. The free check refuses a plan that writes
    # available_monthly_credit_usd under owner_approval.

  assumptions:
    # How many characters of wording are counted as one token. English text
    # usually runs about four characters to the token; three is used here so
    # the ceiling comes out larger rather than smaller.
    characters_per_token: 3.0

    # What one request carries, in characters, besides the task's own words and
    # its reference files. Charged on every call, by every run place, so a
    # figure below what is really sent understates the running half once per
    # call for as long as this plan stands.
    #
    # This used to say 1068, being the standing instruction and the task
    # instruction written out above added together. Both halves of that were
    # wrong. The standing instruction above is never sent — core/prompt_loader.py
    # lets a committed prompt file's own system_message win whenever it has one,
    # and all three of them have one — so 345 characters were charged for
    # wording no model reads. And the committed prompt file itself was not
    # counted at all, neither its own standing instruction nor the several
    # thousand characters of wording it wraps every task in, which is the great
    # majority of what is sent.
    #
    # 5020 was the widest render of the three, measured rather than typed: the
    # container sends prompts/sandbox_occupation_codegen.yaml, which renders to
    # 571 characters of standing instruction and 3725 of wording around the
    # task, with 724 more from its own condition_a.prompt suffix. The other two
    # render to 3867 and 3533. The occupation is written into those templates up
    # to three times, so they are rendered with the longest name in the
    # catalogue.
    #
    # That render is not all the container sends. SandboxRunner._augment_prompt
    # builds a deliverable contract, a dependency hint and a skills manual,
    # lays them out with the task, and hands the result to render_prompt *as*
    # the task — and the renderer measures with a one-character stand-in task,
    # so none of it was ever counted. 5020 was therefore smaller than the
    # container's real first request, which is the one direction a ceiling may
    # not be wrong in.
    #
    # 7307 is 5020 plus the 2287 those sections come to, also measured rather
    # than typed: 1365 characters of deliverable contract and 922 of dependency
    # hint. The skills manual is 0 because exp031's execution.sandbox.max_skills
    # is 0; deleting that line falls back to the executor's own default of 5,
    # which puts 7028 characters back and this figure would have to rise with it. Two of the three read the task's own words,
    # and the catalogue holds a task's length but not its text, so they are
    # built from the widest wording their own committed tables can produce —
    # over-charging the real container by a wide margin, in the direction a
    # ceiling is allowed to be wrong in.
    #
    # The free check builds all of it through the same functions a real attempt
    # uses — core/prompt_loader.py for the render, core/first_request_sections.py
    # for the three sections — and refuses this plan if the number here is
    # lower. Nothing above is copied from anything, so editing the prompt files,
    # the contract tables, the dependency tables or the skill packs moves the
    # demand and this figure has to follow.
    #
    # Still outside this figure, and charged elsewhere in this same sum: the
    # task's own words (per task, from the catalogue's prompt_character_count)
    # and the reference files (per file, at REFERENCE_FILE_CHARACTER_CAP).
    instruction_character_count: 7307

    # The most times the model may be asked again inside one attempt while it
    # is still working with its tools.
    #
    #   A separate Python process on the server: the model is asked once, it
    #   writes Python, and the batch runner runs that Python itself.
    #   core/subprocess_runner.py has no loop at all, so 1 is structural.
    #
    #   A Docker container: 1 as well, but for a reason that lives in the
    #   settings rather than in the code. core/sandbox_runner.py goes at the
    #   code once per repair allowed, and calls a vision model once per go when
    #   the picture check is on — and it turns repair *on* when the setting is
    #   left out. The container's file says `repair: enabled: false` and
    #   `output_qa: enabled: false`, which is what makes this 1. Delete those
    #   lines and the real number is 2. So it is not taken on trust: the free
    #   check works it out from that file and refuses if this number is lower.
    #   See _check_the_plan_counts_every_call_the_container_makes.
    #
    #   Azure code interpreter: the service runs the model's Python for it and
    #   may return to the model with the result several times inside one reply.
    #   Microsoft's documentation does not publish a limit on how many times,
    #   so a limit is chosen here rather than left open. 8 is used. This is the
    #   one of the three that cannot be read from anywhere in this repository.
    tool_loop_max_model_turns:
      host_python_process: 1
      docker_container: 1
      azure_code_interpreter: 8

    # Whether the cap on answer length covers a whole attempt or each turn
    # inside it. This is the largest single divisor in the sum below: a true
    # bills one answer an attempt, a false bills one for every turn.
    #
    # The readable half. Each runner declares SENDS_A_FRESH_REQUEST_PER_TURN,
    # and core/execution_envelope_preflight.py holds these three against it,
    # refusing a true where the repository itself opens a fresh request each
    # turn. core/code_interpreter.py sends exactly one responses.create an
    # attempt with the tool attached to that same call; core/sandbox_runner.py
    # repairs with a Python for loop that calls the model again with the whole
    # budget; core/subprocess_runner.py asks once and runs the code itself.
    #
    # The half that cannot be checked here. Whether Azure honours its one
    # max_output_tokens across the tool turns it takes inside that single
    # request is Microsoft's behaviour, taken on the documentation's word, in
    # the same way as the turn count above. If it does not hold, the honest
    # value is false and the estimate rises about 50 dollars. Only the
    # cheapening direction is rejected: a false where one cap really does cover
    # the attempt over-charges, which is safe.
    output_tokens_capped_per_attempt:
      host_python_process: false
      docker_container: false
      azure_code_interpreter: true

    # The most one tool result may add to the conversation, in tokens.
    #
    # This only has an effect where the model is asked more than once inside
    # one attempt. Every later turn re-reads the results of the earlier ones,
    # so a result written on turn one is paid for again on turns two, three and
    # onwards. That is why a loop's input rises faster than its number of
    # turns.
    #
    #   A separate Python process on the server: the model is asked once, that
    #   run place has no loop of any kind, and nothing comes back to it. 0.
    #
    #   A Docker container: 0, and it is 0 because of one line in
    #   exp031_envelope_docker_container.yaml — `repair: enabled: false`. It is
    #   not 0 because the container has no way of carrying anything forward.
    #
    #   This comment used to say the container "is asked once and nothing is
    #   carried forward", flatly, as a property of the run place. That was
    #   wrong. Switch repair on — or simply delete the block, since
    #   core/sandbox_runner.py builds its settings as
    #   `{"enabled": True, "max_attempts": 1, **(repair or {})}` and so turns
    #   the loop *on* when it is left out — and a whole repair prompt sits in
    #   front of the model on the second turn: the opening, instruction and
    #   close it always carries, twelve blocking-error lines under their heading
    #   with a 600-character failure tail at the head of them, every
    #   repair_guidance entry prompts/sandbox_occupation_codegen.yaml holds, six
    #   warning lines under their heading, a deliverable contract section, and
    #   the last 800 characters each of what the code printed and what it
    #   printed as an error. That is 3922 characters, 1308 tokens at the ratio
    #   above, and the 0 below charges for none of it.
    #
    #   core/execution_envelope_preflight.py now gets that figure by asking
    #   core/sandbox_runner.py to build such a prompt through the same function a
    #   repair turn renders with, and refuses this plan if the container's own
    #   settings would really loop while the number below sits under 1308. None
    #   of 3922, 1308 or the parts above is typed into the checking code: edit a
    #   heading in the prompt file, change a limit in the runner or add a
    #   repair_guidance entry and the figure moves by itself. Today the settings
    #   say the loop is off, so the check is silent and the 0 stands. It stops
    #   being silent the moment that one line changes, which is the point. It
    #   also refuses rather than staying silent if the named prompt cannot be
    #   read at all.
    #
    #   The one part of the prompt outside the 3922 is the English the run writes
    #   onto those lines while it runs — the text of each blocking error and
    #   warning, and whatever a real contract adds over the least one that can
    #   render. Those are settled by the task and the failure, not by anything
    #   committed here. The prior code is left out on purpose in the other
    #   direction: the prompt carries up to 4000 characters of it and the words
    #   placed around it are counted, but the code itself is the model's own
    #   earlier answer, which max_input_tokens_per_attempt already charges a full
    #   max_output_tokens for.
    #
    #   Azure code interpreter: the service feeds the output of the code it ran
    #   back to the model. Microsoft's documentation does not publish a limit on
    #   how large that may be, so a limit is chosen here rather than left open,
    #   the same way the turn limit above is. 5000 tokens is roughly fifteen
    #   thousand characters, which is a great deal of program output for one
    #   step and well above what the tasks in this comparison produce.
    max_tool_result_tokens_per_turn:
      host_python_process: 0
      docker_container: 0
      azure_code_interpreter: 5000

    # Applied to the whole ceiling at the end, to leave room for counting that
    # turns out to be optimistic.
    safety_multiplier: 1.25

    # Marking the answers costs money too, and it is counted here rather than
    # being discovered later.
    grading_required: true
    grading_model: "gpt-5.4"

    # The most times the model may be asked about one scoring line. This is not
    # a guess: grading_configs/default_v2.yaml allows ten tool rounds plus one
    # final answer, and core/execution_envelope_grading_cost.py reads that limit
    # out of the file and refuses if the number below is lower.
    #
    # It used to be 1.0, taken from three recorded runs that averaged far fewer.
    # An average is not a ceiling. What a run averaged says nothing about what
    # the settings permit, and it is the settings that decide the bill.
    grading_calls_per_rubric_item: 11.0

    # This was 10,000 for a long time, taken from three recorded runs that
    # averaged 4,745 tokens of input per marking call (398,629 over 84 calls).
    # An average is not a ceiling, and 10,000 turned out to be 1.865 per cent
    # of what the settings permit. The comment here used to say no settings
    # file could pin the number down, because how much is sent follows the
    # answer being marked. Both halves of that were wrong.
    #
    # The judge never sees the answer whole. It asks for pieces through the
    # read_deliverable tool, and every part of what a call carries is pinned:
    #   * core/tools/read_deliverable.py hands back at most MAX_CONTENT_CHARS
    #     (200,000) characters in one result — every content read ends with
    #     text[:MAX_CONTENT_CHARS];
    #   * grading_configs/default_v2.yaml sets per_item_call_cap: 8, so at most
    #     eight results can pile up for one scoring line, and every later turn
    #     sends them all again — 8 x 200,000 / 3 = 533,334 tokens;
    #   * every call also opens with prompts/grader_judge_v2.md (6,866
    #     characters), the 500 characters of the task the judge is shown, and
    #     the widest scoring line in the benchmark (1,203 characters) —
    #     2,857 tokens.
    #
    # 533,334 + 2,857 = 536,191. The number below is not typed from that
    # arithmetic: core/execution_envelope_grading_cost.py builds it out of the
    # marking settings, the committed instruction file and the task catalogue,
    # and test_the_marking_call_ceiling_is_reached.py rebuilds it the same way
    # and fails if the number below stops reaching it. Widen per_item_call_cap,
    # MAX_CONTENT_CHARS, the instruction file or the widest scoring line and
    # the test says so; none of them can be raised past this figure quietly.
    #
    # This is the number that moves the marking line from 215.87 US dollars to
    # 6,011.21 and the whole ceiling from 364.23 to 7,608.40. Nothing about the
    # marking run changed — the settings always allowed this. Only the sum
    # stopped understating it.
    #
    # The sum charges this flat: all 11 calls at the full pile-up, when call
    # one carries no tool results at all and only the last four can carry
    # eight. 88 result-slots are charged where 52 are reachable, so this is
    # 1.686 times what a call-by-call count would give. That is deliberate and
    # it is stated rather than hidden: a ceiling may be more careful than the
    # thing it bounds, and may not fall short of it.
    grading_input_tokens_per_call: 536191

    # How long one marking reply may run. Read from the same settings file,
    # which sets 2,400. This was 1,000 on the reasoning that "a marking call
    # replies with a short verdict" — true of the replies that were observed,
    # and irrelevant to the question of how long a reply is allowed to be.
    grading_output_tokens_per_call: 2400

    # ── What marking costs when it looks and listens ──────────────────────────
    #
    # Marking does not only read words. It can send a picture of the answer to a
    # model that looks at pictures, and a sound clip to a model that listens.
    # These are separate models, separately billed, and until this block existed
    # the cost sum did not count a single one of those calls.
    #
    # calls_per_task is read from the marking settings and checked against them.
    # The token counts cannot be: neither a picture's size nor a clip's length
    # is fixed by any setting here. Worse, neither perception call sets a limit
    # on the reply at all — core/perception/vision.py calls the Responses API
    # and core/perception/audio.py calls Chat Completions, and neither passes
    # max_output_tokens — so the numbers below are measurements of what
    # happened, never promises about what can.
    grading_perception:
      vision:
        model: "gpt-5.4"
        # grading_configs/default_v2.yaml: perception.visual.call_cap_per_task.
        #
        # Was 72, because that setting said 72 until the cap was raised to 112.
        # Seventy-two was never a measured demand either: on the 185-task gold
        # run one task planned 102 renders that no relaxation could reduce, was
        # refused, and lost 34 of its 63 scoring lines. Like the sound figure
        # below, this only ever mirrors the setting, so it moves when the
        # setting moves. See grading_configs/README.md, "Why the visual task
        # cap is 112".
        #
        # Unlike the sound figure, this one does change an amount: pictures
        # have both a price and measured token counts, so the worked-out total
        # rises with it. That is the honest direction — the old total was a
        # ceiling under a cap that no longer applies.
        calls_per_task: 112
        # Measured across every committed grading run: 817 scoring lines that
        # actually called the picture model. The largest was 23,139 tokens of
        # input for one call; this rounds that up. The mean was 2,123, which is
        # why an average would have under-counted by a factor of eleven.
        input_tokens_per_call: 24000
        # Largest measured reply over the same 817 calls was 3,202 tokens
        # (mean 349), rounded up. Nothing caps this, so it is a floor under
        # what could happen rather than a lid on it.
        output_tokens_per_call: 4000
      audio:
        model: "gpt-audio-1.5"
        # grading_configs/default_v2.yaml: perception.audio.call_cap_per_task.
        #
        # Was 3, because that setting said 3 until the cap was raised to 32.
        # Three was never a measured demand: counted across the checked-in
        # 220-task inventory, 11 tasks ask for more listening than that, and
        # the worst asks for 32. This figure only ever mirrors the setting, so
        # it moves when the setting moves.
        #
        # It changes no amount. Both token counts below are null and this
        # model has no published price, so sound contributes nothing to the
        # worked-out total either way. What moves is how many calls of unknown
        # cost the plan admits are possible — which is the honest direction for
        # an unknown to move in.
        calls_per_task: 32
        # Deliberately not filled in. Across every committed grading run, 116
        # scoring lines were routed to sound and the sound model was called
        # **zero** times, so there is no measurement to draw on — not one billed
        # call exists. `null` makes the check refuse. Writing a number here
        # would be inventing evidence, and writing 0 would say the calls are
        # free, which is the exact mistake this whole file exists to prevent.
        #
        # Zero successful calls is now understood rather than merely observed:
        # every one of them was sent to an endpoint whose content union has no
        # audio member, so each was refused with a 400 before a model heard it.
        # The request now goes to Chat Completions, which accepts it — but a
        # path that has been repaired and not yet run is still a path nobody
        # has measured, so these stay null until a real call reports usage.
        #
        # This model also has no published price, so even a measured token count
        # would not produce an amount.
        input_tokens_per_call: null
        output_tokens_per_call: null

# ── The three stages, fixed before anything is spent ──────────────────────
#
# All three are written down now so that a disappointing result cannot lead to
# the rules being loosened afterwards. Only the first is being asked for.

