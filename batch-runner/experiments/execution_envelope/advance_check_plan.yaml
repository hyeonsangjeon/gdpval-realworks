# The one set of conditions all three run places must share
# =========================================================
#
# The comparison asks a single question: when the same GPT model does the same
# work, does the place it runs in change the result? That question only has an
# answer if everything except the run place is held still. This file is where
# "everything else" is written down, once, for all three places to read.
#
# Nothing in this file causes a model to be called. It is read by the free
# check at batch-runner/scripts/check_execution_envelope_advance_check.py,
# which refuses the run if anything here is missing, inconsistent, or would
# cost more than the amount approved.
#
# Read this file with:
#     cd batch-runner
#     python scripts/check_execution_envelope_advance_check.py \
#         --plan experiments/execution_envelope/advance_check_plan.yaml
#
# Written: 2026-08-25. Stage: the five-task advance check only. The thirty-task
# and two-hundred-and-twenty-task stages are written down further below so the
# rules for them are fixed before any result is seen, but neither is approved.

plan_version: "execution-envelope-advance-check-v1"

# Which of the two comparisons this plan is for.
#
# "same_generated_code_rerun" is the stricter one: self-review and retries
# driven by the model's own judgement are switched off, so the only thing that
# differs between the three places is where the code runs. The advance check
# uses it because its purpose is to confirm the three places start under
# identical conditions, not to compare scores.
comparison: "same_generated_code_rerun"

# ── Which run places take part ────────────────────────────────────────────
#
# Three of the five places named in the written specification are listed. The
# other two are left out on purpose and are NOT replaced by anything:
#
#   Agentic Sandbox V2 — its command-running tool answers that the capability
#     is unavailable, two separate guards refuse the mode, and nothing here can
#     reach a real model to drive it. The loop itself does exist, at
#     core/agentic_v2_conversation.py, and is proven against stand-ins that
#     spend nothing; this comment said otherwise until 2026-08-26, which is
#     what a written-down claim does when nobody re-reads it. Only structure
#     checks are possible, so it cannot take part in a scored comparison.
#     core/execution_environment_readiness.py is the copy that is checked
#     against the code; if the two ever disagree, believe that one.
#
#   Codex built-in agent — this repository holds no code that runs a benchmark
#     task through it, and no official documentation was found describing
#     either running its agent loop against an outside benchmark or running it
#     on an Azure AI Foundry deployment. Its place in the comparison stays
#     empty until both of those exist.
#
# Leaving a place out of this list does not make the comparison complete. It
# records that the place could not run, which is a different statement from
# "the place performed badly".

# ── The model, and everything sent with it ────────────────────────────────

model_run_conditions:
  shared:
    # Where the model comes from.
    provider: "azure"

    # The name of the deployment an administrator created in Azure AI Foundry.
    # All three run places address this one name. Nothing in this repository
    # may change it part-way through a run: see automatic_model_switch_allowed
    # below.
    #
    # Why this one: it is the only deployment already used by experiment
    # settings in this repository for both a separate Python process on the
    # server (exp025, exp027) and a Docker container (exp026), and the same
    # name is recorded as having answered through the Responses API in
    # data/grades, which is the interface the Azure code interpreter uses. No
    # other deployment name in this repository has evidence for all three.
    deployment: "gpt-5.4"

    # The model name the service is required to report back with its answers.
    #
    # This cannot be confirmed before the first call, because it is a value the
    # service returns. It is written here as the value the run must see: if a
    # reply names anything else, the run stops rather than continuing with a
    # different model. The per-task record keeps whatever the service actually
    # returned, taken from the reply itself and not copied from this file.
    resolved_model: "gpt-5.4"

    # The version of the request format used to call the service.
    api_version: "2025-04-01-preview"

    # The standing instruction sent with every call, word for word. Copied
    # unchanged into all three experiment settings files; the free check
    # compares them character by character and refuses the run if they drift.
    system_instruction: |
      You are a helpful assistant that completes professional tasks.
      When the task requires creating files (e.g., Excel, Word, PDF, PowerPoint),
      write Python code that generates those files and save them to the current directory.
      Use libraries such as openpyxl, python-docx, reportlab, python-pptx, and Pillow.
      Always produce complete, runnable code.

    # The instruction appended to every task, word for word. Same rule as above.
    task_instruction: |
      If the task requires creating deliverable files (documents, spreadsheets,
      presentations, reports, etc.), you MUST use Python code to generate the
      actual file(s) and save them to the current directory.
      Do NOT just describe what you would create — actually execute code to produce
      downloadable files. The task is NOT complete unless the files are saved.

      In your text response, do NOT include any file download links or sandbox URLs
      (e.g. "[Download ...](sandbox:/mnt/data/...)" or similar).
      Only provide a plain-text summary of what was produced.

      Before writing any code, ALWAYS inspect the actual structure of any
      reference files first (df.columns, df.dtypes, df.head()).
      Never hardcode column names or assume data types.

    # The five tasks, in a fixed order.
    #
    # These were not picked by hand. They come from a rule written down before
    # any result was seen, carried in
    # batch-runner/core/execution_envelope_tasks.py and re-derived by the free
    # check every time it runs, from a catalogue that holds no score at all:
    #
    #   Sort every task in the benchmark by its task number. Fill five slots in
    #   this order — spreadsheet, document, presentation, picture, text answer
    #   only. For each slot take the smallest-numbered task that has not been
    #   taken, whose job is not already represented, and all of whose expert
    #   answer files belong to that format; if the benchmark holds no such
    #   task, take the smallest-numbered one where at least one answer file
    #   does.
    #
    # What the rule produced, and why each one:
    #
    #   02aa1805  spreadsheet   expert handed in an .xlsx file
    #                           Project Management Specialists
    #   0112fc9b  document      expert handed in a .pdf file
    #                           Nurse Practitioners
    #   2ea2e5b5  presentation  expert handed in a .pptx file
    #                           Computer and Information Systems Managers
    #   3baa0009  picture       no task in this benchmark hands in a picture on
    #                           its own; this is the smallest-numbered task that
    #                           hands in one at all (a .jpg beside a .pdf)
    #                           News Analysts, Reporters, and Journalists
    #   0818571f  text only     expert handed in no file, only written text
    #                           Real Estate Brokers
    #
    # Five deliverable formats, five different jobs, four different industries.
    task_ids:
      - "02aa1805-c658-4069-8a6a-02dec146063a"
      - "0112fc9b-c3b2-4084-8993-5a4abb1f54f1"
      - "2ea2e5b5-257f-42e6-a7dc-93763f28b19d"
      - "3baa0009-5a60-4ae8-ae99-4955cb328ff3"
      - "0818571f-5ff7-4d39-9d2c-ced5ae44299e"

    # The exact version of every input, by content fingerprint (SHA-256).
    #
    # The first entry pins the benchmark dataset itself, at the same revision
    # this repository's published grades were produced against. The other two
    # pin the reference files the chosen tasks ship with. In this dataset each
    # reference file sits in a folder named after the first 32 characters of
    # its own fingerprint, so the free check can confirm each value below
    # matches its file without downloading anything.
    input_file_versions:
      "openai/gdpval@11e7900cdcac61bc4daf59e65feb238acda98fbf": "f8422fab9b21d90c0ee5f0659842ab666d418cb8940842918f9f4b0df7ae0202"
      "reference_files/bb09ca2a9999b404d7fced9202b42949/Work Time Study - Source.xlsx": "bb09ca2a9999b404d7fced9202b42949cd9f142f39554e254bac77b3686dae9e"
      "reference_files/901e943a97328a661f9e704ae43eeea1/Acquisition Criteria (2).pdf": "901e943a97328a661f9e704ae43eeea167e7805385a99322f1c24f8e159125c4"

    # The most the model may write in reply to one request.
    #
    # 32768 is the value exp026 and exp027 already use. The note in exp026
    # records that 16384 truncated this model's generated code and produced an
    # empty visible answer, so a lower value would turn a working run place
    # into a failing one and corrupt the comparison.
    max_output_tokens: 32768

    # The most wall-clock time one task may take.
    #
    # 1200 seconds is the value exp026 and exp027 already use. The default for
    # a separate Python process on the server is 570 seconds, so it is raised
    # here on purpose: a different time limit per run place would itself change
    # the result, which is the thing being measured.
    per_task_timeout_seconds: 1200

    # Self-review is off. This comparison changes the run place and nothing
    # else, so the model must not get a second look at its own answer in one
    # place and not another.
    self_review_enabled: false
    self_review_max_attempts: 0

    # Only one of the three reasons for attempting a task again is allowed:
    # a network failure, a server error, or a timeout. The model's own
    # judgement never triggers a retry here, because self-review is off.
    retry_reasons_allowed:
      - "infrastructure_error"
    retry_max_attempts: 3

    # Never allowed. If a call fails, the run stops rather than quietly asking
    # a different model or a different deployment, which would leave a score
    # that no single model earned.
    automatic_model_switch_allowed: false

  # The three run places. Each one takes the shared conditions above with no
  # change at all — that is the point of the comparison — so each entry is
  # empty. An entry that set anything here would be a difference between run
  # places, and the free check would report it.
  by_environment:
    host_python_process: {}
    docker_container: {}
    azure_code_interpreter: {}

# ── The experiment settings file each run place uses ──────────────────────
#
# The free check opens each of these and compares it against the conditions
# above: the deployment name, the two instruction texts, the task list, the
# run mode, the answer-length cap, the time limit, the retry count, and
# whether self-review is switched on. Any disagreement stops the run.

experiment_files:
  host_python_process: "experiments/execution_envelope/exp030_envelope_host_python_process.yaml"
  docker_container: "experiments/execution_envelope/exp031_envelope_docker_container.yaml"
  azure_code_interpreter: "experiments/execution_envelope/exp032_envelope_azure_code_interpreter.yaml"

# ── The container requirement ─────────────────────────────────────────────
#
# The Docker run place must never quietly become the server run place.
#
# SandboxRunner._execute in batch-runner/core/sandbox_runner.py runs the code
# on the server's own operating system, after printing a warning, when the
# container setting is "auto" and either Docker or the image is missing. If
# that happened during this comparison, the Docker place's score would in fact
# be the server place's score, and the two columns of the result table would be
# measuring the same thing without saying so.
#
# "always" is therefore required. With it, a missing Docker service or a
# missing image ends the task as a failure that is written down, instead of
# moving the work somewhere else. The free check refuses any other value, and
# tests/test_execution_envelope_docker_containment.py holds the behaviour in
# place.
container:
  use_docker: "always"
  image: "gdpval-sandbox:latest"

# ── Which Azure resource the deployment must live in ──────────────────────
#
# A deployment name does not identify a deployment.
#
# When this comparison was first attempted, the Azure tenant it was attempted
# from held two separate Azure AI Foundry accounts that each exposed a
# deployment named exactly "gpt-5.4", and a third that exposed the same
# underlying model under a different deployment name. Two accounts, same name,
# different resources: possibly different regions, different model versions,
# different content filters.
#
# So pinning `deployment: gpt-5.4` above is not enough on its own. Without the
# account and project below, the comparison could run against a deployment
# nobody intended and still report, truthfully by its own rules, that every run
# place used the same deployment name. That is the exact class of silent error
# this whole plan exists to prevent, and it was open until this block was added.
#
# These two names are the ones this repository already records for its own
# automated runs, as the repository variables AZURE_AI_EXPECTED_PROJECT_ACCOUNT
# and AZURE_AI_EXPECTED_PROJECT_NAME. They are settings, not secrets.
#
# The free check reads the endpoint settings in the environment, classifies
# them with this repository's own endpoint rules, and refuses the run if they
# name any other account or project.
azure_connection:
  account: "hjeon-fdpo-foundry-eus2"
  project: "gdpval-realworks"
  route_profile: "project-ci"

# ── The two comparisons keep separate score tables ────────────────────────
#
# Results from re-running one model's own code and results from letting each
# tool use everything it ships with answer different questions and must never
# be added together. Each table carries the name of the comparison it belongs
# to.
scoreboards:
  same_generated_code_rerun:
    comparison: "same_generated_code_rerun"
    status: "not started — no paid model call has been made"
  tool_built_in_features:
    comparison: "tool_built_in_features"
    status: "not started — no paid model call has been made"

# ── Which marking settings the answers will be marked with ────────────────
#
# Named here so the free check can open the file and compare the marking
# numbers in the cost sum below against the limits the marking would really
# apply. Without this the marking half of the ceiling is three numbers typed by
# hand that nothing verifies, which is how a ceiling quietly becomes a guess.
#
# The check reads four limits out of this file: how many times the model may be
# asked about one scoring line, how long one reply may run, and whether picture
# reading and sound listening are switched on and at what per-task limit.
grading_config: "grading_configs/default_v2.yaml"

# ── What the largest possible bill is, and how it was worked out ──────────
#
# These are the written guesses the ceiling rests on. Each one is stated on
# purpose, because an unstated guess is how a cost ceiling ends up wrong in the
# direction that costs money.
cost:
  # The amount approved for spending, in United States dollars.
  #
  # Approved 2026-08-25 by the repository owner, for exactly this run: five
  # tasks in three run places, with separate grading, under the retry limits
  # fixed above. It is a total ceiling, not a per-place allowance.
  #
  # The thirty-task and two-hundred-and-twenty-task stages are NOT covered by
  # this amount and are not approved.
  #
  # IMPORTANT — this amount no longer covers the worked-out ceiling, and the
  # free check refuses the run because of it. That is the safety mechanism
  # working, not a fault.
  #
  # When the amount was approved, the ceiling came to exactly 32.23. It has
  # since been corrected twice, and both corrections raised it. Nothing about
  # the run got more expensive on either occasion — no extra call, no different
  # model, no changed setting. Both times the old figure was simply wrong in
  # the direction that costs money, and was replaced by one that is not.
  #
  # First correction, 32.23 → 43.77: a looping request was charged wrongly. The
  # Azure code interpreter asks the model again after each piece of code it
  # runs, and every one of those later turns re-reads the whole conversation so
  # far. The old count charged the first turn's input eight times over instead,
  # which leaves out everything the model wrote and every result it was shown
  # in between. Counting the conversation as it grows raises the Azure place
  # from 4.83 to 14.06.
  #
  # Second correction, 43.77 → 363.59: marking was counted at what three past
  # runs happened to average rather than at what the marking settings permit,
  # and its two extra models — the one that reads pictures and the one that
  # listens to sound — were not counted at all. An average is not a ceiling. Of
  # the 290.87 before the safety multiplier, marking is 269.87 and the actual
  # work is 21.00; marking is where nearly the whole bill sits, and it was the
  # part being estimated most loosely.
  #
  # Nothing was spent under either wrong figure: the Azure run place has never
  # been reachable from the machine this was attempted from, and marking has
  # not been run for this plan. But had it been, the run could have been
  # allowed to start and then billed more than was approved, with every check
  # reporting it as within budget.
  #
  # Ways out, and the choice belongs to the owner:
  #   1. approve 363.59 instead;
  #   2. lower the marking settings in grading_configs/default_v2.yaml — the
  #      ten tool rounds per scoring line and the 72 picture calls per task are
  #      both chosen limits rather than published ones, and they are what makes
  #      marking 269.87 of the 290.87. The free check prints the resulting
  #      figure, and refuses if this file then claims less than the settings
  #      allow;
  #   3. lower azure_code_interpreter in tool_loop_max_model_turns, likewise a
  #      chosen limit — though this only moves the smaller 21.00 part;
  #   4. mark nothing, by setting grading_required to false — the check then
  #      leaves marking out of the sum entirely;
  #   5. leave it, and the run stays refused.
  # The answer-length cap is not one of the ways out: the note at
  # max_output_tokens records that a lower value truncated this model's code.
  #
  # Whichever is chosen, 363.59 is a worked-out figure and not an approval. The
  # approved amount is the number written below, and only the owner changes it.
  approved_maximum_usd: 32.23

  assumptions:
    # How many characters of wording are counted as one token. English text
    # usually runs about four characters to the token; three is used here so
    # the ceiling comes out larger rather than smaller.
    characters_per_token: 3.0

    # The combined length, in characters, of the standing instruction and the
    # task instruction above. Both are sent with every call. A test recomputes
    # this from the text and fails if the two stop agreeing.
    instruction_character_count: 1068

    # The most times the model may be asked again inside one attempt while it
    # is still working with its tools.
    #
    #   A separate Python process on the server, and a Docker container: the
    #   model is asked once, it writes Python, and the batch runner runs that
    #   Python itself. The model is not asked again inside the attempt, so 1.
    #
    #   Azure code interpreter: the service runs the model's Python for it and
    #   may return to the model with the result several times inside one reply.
    #   Microsoft's documentation does not publish a limit on how many times,
    #   so a limit is chosen here rather than left open. 8 is used.
    tool_loop_max_model_turns:
      host_python_process: 1
      docker_container: 1
      azure_code_interpreter: 8

    # Whether the cap on answer length covers a whole attempt or each turn
    # inside it. Azure's Responses API applies one cap to the whole reply,
    # tool turns included, so its answer length is counted once per attempt.
    # The other two places send a fresh request per turn.
    output_tokens_capped_per_attempt:
      host_python_process: false
      docker_container: false
      azure_code_interpreter: true

    # The most one tool result may add to the conversation, in tokens.
    #
    # This only has an effect where the model is asked more than once inside
    # one attempt. Every later turn re-reads the results of the earlier ones,
    # so a result written on turn one is paid for again on turns two, three and
    # onwards. That is why a loop's input rises faster than its number of
    # turns.
    #
    #   A separate Python process on the server, and a Docker container: the
    #   model is asked once and nothing is carried forward, so 0.
    #
    #   Azure code interpreter: the service feeds the output of the code it ran
    #   back to the model. Microsoft's documentation does not publish a limit on
    #   how large that may be, so a limit is chosen here rather than left open,
    #   the same way the turn limit above is. 5000 tokens is roughly fifteen
    #   thousand characters, which is a great deal of program output for one
    #   step and well above what the tasks in this comparison produce.
    max_tool_result_tokens_per_turn:
      host_python_process: 0
      docker_container: 0
      azure_code_interpreter: 5000

    # Applied to the whole ceiling at the end, to leave room for counting that
    # turns out to be optimistic.
    safety_multiplier: 1.25

    # Marking the answers costs money too, and it is counted here rather than
    # being discovered later.
    grading_required: true
    grading_model: "gpt-5.4"

    # The most times the model may be asked about one scoring line. This is not
    # a guess: grading_configs/default_v2.yaml allows ten tool rounds plus one
    # final answer, and core/execution_envelope_grading_cost.py reads that limit
    # out of the file and refuses if the number below is lower.
    #
    # It used to be 1.0, taken from three recorded runs that averaged far fewer.
    # An average is not a ceiling. What a run averaged says nothing about what
    # the settings permit, and it is the settings that decide the bill.
    grading_calls_per_rubric_item: 11.0

    # The same three runs averaged 4,745 tokens of input per marking call
    # (398,629 tokens over 84 calls). 10,000 is used, a little over twice that.
    #
    # This is the one number here that no settings file can pin down, and it is
    # not pretended otherwise. How much is sent depends on how long the answer
    # being marked turns out to be, which nothing caps in advance. Measured and
    # doubled is the best available footing; it is an assumption, stated on
    # purpose, rather than a limit read from a file.
    grading_input_tokens_per_call: 10000

    # How long one marking reply may run. Read from the same settings file,
    # which sets 2,400. This was 1,000 on the reasoning that "a marking call
    # replies with a short verdict" — true of the replies that were observed,
    # and irrelevant to the question of how long a reply is allowed to be.
    grading_output_tokens_per_call: 2400

    # ── What marking costs when it looks and listens ──────────────────────────
    #
    # Marking does not only read words. It can send a picture of the answer to a
    # model that looks at pictures, and a sound clip to a model that listens.
    # These are separate models, separately billed, and until this block existed
    # the cost sum did not count a single one of those calls.
    #
    # calls_per_task is read from the marking settings and checked against them.
    # The token counts cannot be: neither a picture's size nor a clip's length
    # is fixed by any setting here. Worse, neither perception call sets a limit
    # on the reply at all — core/perception/vision.py and core/perception/audio.py
    # both call the Responses API without max_output_tokens — so the numbers
    # below are measurements of what happened, never promises about what can.
    grading_perception:
      vision:
        model: "gpt-5.4"
        # grading_configs/default_v2.yaml: perception.visual.call_cap_per_task.
        calls_per_task: 72
        # Measured across every committed grading run: 817 scoring lines that
        # actually called the picture model. The largest was 23,139 tokens of
        # input for one call; this rounds that up. The mean was 2,123, which is
        # why an average would have under-counted by a factor of eleven.
        input_tokens_per_call: 24000
        # Largest measured reply over the same 817 calls was 3,202 tokens
        # (mean 349), rounded up. Nothing caps this, so it is a floor under
        # what could happen rather than a lid on it.
        output_tokens_per_call: 4000
      audio:
        model: "gpt-audio-1.5"
        # grading_configs/default_v2.yaml: perception.audio.call_cap_per_task.
        calls_per_task: 3
        # Deliberately not filled in. Across every committed grading run, 116
        # scoring lines were routed to sound and the sound model was called
        # **zero** times, so there is no measurement to draw on — not one billed
        # call exists. `null` makes the check refuse. Writing a number here
        # would be inventing evidence, and writing 0 would say the calls are
        # free, which is the exact mistake this whole file exists to prevent.
        #
        # This model also has no published price, so even a measured token count
        # would not produce an amount.
        input_tokens_per_call: null
        output_tokens_per_call: null

# ── The three stages, fixed before anything is spent ──────────────────────
#
# All three are written down now so that a disappointing result cannot lead to
# the rules being loosened afterwards. Only the first is being asked for.

run_sizes:
  advance_check:
    task_ids:
      - "02aa1805-c658-4069-8a6a-02dec146063a"
      - "0112fc9b-c3b2-4084-8993-5a4abb1f54f1"
      - "2ea2e5b5-257f-42e6-a7dc-93763f28b19d"
      - "3baa0009-5a60-4ae8-ae99-4955cb328ff3"
      - "0818571f-5ff7-4d39-9d2c-ced5ae44299e"
    task_selection_method: >-
      Sort every task in the benchmark by its task number. Fill five slots in
      this order: spreadsheet, document, presentation, picture, text answer
      only. For each slot take the smallest-numbered task that has not been
      taken, whose job is not already represented, and all of whose expert
      answer files belong to that format; if the benchmark holds no such task,
      take the smallest-numbered one where at least one answer file does. The
      rule reads only task numbers, industries, jobs, and expert answer file
      types, so no score can move it. It is re-derived at check time from a
      catalogue proven to contain no scores.
    success_criteria: >-
      All five tasks finish in all three run places without an error, and the
      conditions recorded for each place are identical on every point this plan
      fixes, including the model name the service reported back. Scores are not
      looked at.
    stop_conditions: >-
      Stop at once, without switching to another run place, if the model name or
      deployment name reported by the service differs anywhere; if any
      instruction text, task number, or input fingerprint differs between
      places; if a run switches model or deployment on its own; if the Docker
      place ends up running on the server's operating system instead; if any of
      the three Agentic Sandbox V2 guards shows signs of having been opened; if
      a paid call is about to happen without approval on record; if any required
      field of the run record is missing; or if real spending passes the amount
      approved above.
    advance_conditions: >-
      Every point of the success criteria is met and every required field of the
      run record was written down for all fifteen runs, that being five tasks in
      each of three places.
    maximum_expected_cost: >-
      Worked out by batch-runner/core/execution_envelope_cost.py from the price
      list committed alongside this plan and the assumptions above. The free
      check prints the figure and refuses to let anything start until an
      approved amount is written into cost.approved_maximum_usd and covers it.
    allowed_retry_reasons:
      - "infrastructure_error"
    allowed_self_review_attempts: 0

  trial_run:
    # Thirty tasks keeping the industry mix of the full benchmark. Produced by
    # the same module as the five above, by walking the industries from the
    # largest down and taking the smallest-numbered task not yet taken from
