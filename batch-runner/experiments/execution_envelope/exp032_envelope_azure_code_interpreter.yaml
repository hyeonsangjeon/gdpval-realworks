# Run place 3 of 3: the Azure code interpreter
# ============================================
#
# Azure AI Foundry runs the model's Python for it, inside a container the
# service creates and manages. This repository does not see that container and
# does not control what is installed in it.
#
# This run place cannot start until the Azure connection setting names the
# project route. step2_run_inference._require_code_interpreter_route_profile
# refuses the mode otherwise, which is the correct behaviour and is not to be
# worked around.
#
# This file is one of three that must agree on everything except where the code
# runs. The conditions they share are written once in
# experiments/execution_envelope/advance_check_plan.yaml, and the free check at
# scripts/check_execution_envelope_advance_check.py compares this file against
# that one character by character. Editing anything below that the plan also
# fixes will stop the run rather than quietly change the comparison.
#
# This file has been used to call a model. On 2026-09-01 the three files ran
# five tasks each: the server process finished 3 of 5, the container 4 of 5,
# and the Azure code interpreter 0 of 5, every one of those five refused with
# http 403 by the project route. The header here said "no model has been called
# with this file" until 2026-09-06, which is what a written-down claim does when
# nothing re-reads it.
#
# The prompt used not to be covered by "agree on everything except where the
# code runs". Each of the three sent the prompt file its own runner class
# declares, and the three are different files; measured through the builders a
# real attempt uses, the first requests came to 3,533, 3,867 and 7,307
# characters for what this plan called one question. It has been settled the
# first way: one prompt for all three. `shared_first_request: true` in the
# execution block below puts every one of them on
# prompts/execution_envelope_shared.yaml, and
# tests/test_the_three_run_places_really_send_one_request.py holds a fake client
# where the provider client goes and fails if the three texts stop matching
# byte for byte.
#
# What is equal now is the text. What is not equal is written down rather than
# implied: core/shared_first_request.py's UNCONTROLLED_DIFFERENCES names the
# API family, the tool declaration only Azure sends, how the reference files
# arrive, the isolation each place carries, the container's own output check
# and the per-task time limit Azure is never given. The free check prints all
# of them and reports pure_run_place_effect_is_measurable as false while any
# remain, so a result from this comparison may not be read as the run place's
# effect on its own.

experiment:
  id: "exp032_envelope_azure_code_interpreter"
  name: "Run-place comparison — the Azure code interpreter (5 tasks)"
  description: >-
    The five-task advance check for the run-place comparison. Azure AI Foundry
    runs the model's Python for it, inside a container the service creates and
    manages. Paired with exp030 (a separate Python process on the server) and
    exp031 (a Docker container), which differ from this file only in where the
    code runs.
  author: "Hyeonsang Jeon"
  created_at: "2026-08-25"

control:
  fixed:
    - model
    - tasks
    - temperature
    - prompt_strategy
  changed:
    - execution_environment

data:
  source: "HyeonSang/exp032_envelope_azure_code_interpreter"
  filter:
    sector: null
    occupation: null
    sample_size: null
    # Fixed by the rule in core/execution_envelope_tasks.py, which reads only
    # task numbers, industries, jobs, and the file types of the human expert's
    # own answer. See the plan file for what each one covers.
    task_ids:
      - "02aa1805-c658-4069-8a6a-02dec146063a"
      - "0112fc9b-c3b2-4084-8993-5a4abb1f54f1"
      - "2ea2e5b5-257f-42e6-a7dc-93763f28b19d"
      - "3baa0009-5a60-4ae8-ae99-4955cb328ff3"
      - "0818571f-5ff7-4d39-9d2c-ced5ae44299e"

condition_a:
  name: "Azure code interpreter"
  model:
    provider: "azure"
    deployment: "gpt-5.4"
    temperature: 0.0
    seed: 42
    # Left unset on purpose. Setting it in one of the three files and not the
    # others would change how hard the model thinks, which is not the thing
    # being measured.
    reasoning_effort: null
  prompt:
    system: |
      You are a helpful assistant that completes professional tasks.
      When the task requires creating files (e.g., Excel, Word, PDF, PowerPoint),
      write Python code that generates those files and save them to the current directory.
      Use libraries such as openpyxl, python-docx, reportlab, python-pptx, and Pillow.
      Always produce complete, runnable code.
    prefix: null
    body: null
    suffix: |
      If the task requires creating deliverable files (documents, spreadsheets,
      presentations, reports, etc.), you MUST use Python code to generate the
      actual file(s) and save them to the current directory.
      Do NOT just describe what you would create — actually execute code to produce
      downloadable files. The task is NOT complete unless the files are saved.

      In your text response, do NOT include any file download links or sandbox URLs
      (e.g. "[Download ...](sandbox:/mnt/data/...)" or similar).
      Only provide a plain-text summary of what was produced.

      Before writing any code, ALWAYS inspect the actual structure of any
      reference files first (df.columns, df.dtypes, df.head()).
      Never hardcode column names or assume data types.

  # Off in all three files. This comparison changes where the code runs and
  # nothing else, so the model must not get a second look at its own answer in
  # one place and not another.
  qa:
    enabled: false
    max_retries: 0
    model: null
    min_score: 6
    prompt: ""

execution:
  mode: "code_interpreter"

  # One first request for all three run places.
  #
  # Without this, each run place loads the prompt file its own runner class
  # names in its DEFAULT_PROMPT, and the three are three different files. The
  # header of this file recorded the sizes that produced: 3,533 characters here,
  # 3,867 in the container and 7,307 through Azure, for what the plan called one
  # question. Set on all three files together, this makes every opted-in run
  # place load prompts/execution_envelope_shared.yaml instead.
  #
  # Off everywhere else, and it has to be written as a real true — anything else
  # leaves the run place on the path it always used, in the config parser and in
  # the free check alike. Every other experiment in this repository builds its
  # first request exactly as before.
  #
  # What this does not equalise is written down rather than left to be assumed:
  # core/shared_first_request.py's UNCONTROLLED_DIFFERENCES, which the free
  # check prints at the end of its summary and which is why this comparison
  # still refuses the verdict "the difference is the run place's alone".
  shared_first_request: true
  # 1200 seconds in all three files. The service also removes an idle container
  # of its own accord after twenty minutes, which is documented behaviour on
  # Microsoft's side and not something this file controls.
  timeout: 1200
  # Attempts after a network failure, a server error, or a timeout. The model's
  # own judgement never causes one, because self-review is off above.
  max_retries: 3
  # Off. A second round would let one run place have more attempts than another
  # depending on how its errors happened to fall.
  resume_max_rounds: 0
  tokens:
    # 16384 truncated this model's generated code in an earlier run and left an
    # empty visible answer, which would show up as a failure of the run place
    # rather than of the setting. See the note in exp026.
    code_generation: 32768

output:
  publish_to_hf: false
  submit_to_evals: false
