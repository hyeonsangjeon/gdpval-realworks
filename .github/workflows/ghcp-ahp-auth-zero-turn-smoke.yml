name: GHCP authenticated zero-turn smoke

on:
  workflow_dispatch:
    inputs:
      confirm_zero_turn_only:
        description: Authenticate and create one thread only; no prompt, inference or paid admission
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ghcp-auth-zero-turn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auth-zero-turn:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_zero_turn_only == true && github.ref == 'refs/heads/leader/ghcp-patched-runtime-receipt-20261106' }}
    name: Authentication and one native thread, zero model turns
    environment: ghcp-sol-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.11'
      - id: dependencies
        name: Install the existing pinned offline test requirements without credentials
        env:
          PIP_CONFIG_FILE: /dev/null
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: -r batch-runner/requirements-ghcp-sol-gate.txt
      - id: offline-tests
        name: Fake servers, zero-turn boundaries and publication guards only
        working-directory: batch-runner
        run: |
          set -euo pipefail
          env -i PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            '${{ steps.python.outputs.python-path }}' -B -m pytest -q -o addopts= -p no:cacheprovider \
            tests/test_ghcp_ahp_auth_smoke.py tests/test_ghcp_ahp_auth_publication.py \
            tests/test_ghcp_ahp_auth_smoke_workflow.py
      - id: prepare
        name: Prepare unchanged public pins without authentication or process execution
        run: |
          set -euo pipefail
          umask 077
          python -B batch-runner/ghcp_ahp_probe.py prepare \
            --prepared "$RUNNER_TEMP/ghcp-auth-zero-turn/prepared" \
            --evidence "$RUNNER_TEMP/ghcp-auth-zero-turn/preparation"
      - id: smoke
        name: One bounded authentication smoke; capture all child output before publication
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GHCP_AUTH_SMOKE_CONFIRM: 'true'
          GHCP_AUTHENTICATED_ZERO_TURN: 'true'
          GHCP_PAID_EXECUTION: 'false'
          GHCP_CONNECTION_ONLY: 'false'
        run: |
          set -euo pipefail
          umask 077
          python -B batch-runner/ghcp_ahp_auth_smoke.py run \
            --prepared "$RUNNER_TEMP/ghcp-auth-zero-turn/prepared" \
            --preparation "$RUNNER_TEMP/ghcp-auth-zero-turn/preparation" \
            --published "$RUNNER_TEMP/ghcp-auth-zero-turn/published"
      - id: publication
        name: Secret-free recheck against the digest from the authentication step
        if: ${{ always() && steps.smoke.outputs.scan_sha256 != '' }}
        env:
          EXPECTED_SCAN_SHA256: ${{ steps.smoke.outputs.scan_sha256 }}
        run: |
          set -euo pipefail
          python -B batch-runner/ghcp_ahp_auth_smoke.py verify \
            --published "$RUNNER_TEMP/ghcp-auth-zero-turn/published" \
            --scan-sha256 "$EXPECTED_SCAN_SHA256"
          echo 'safe=true' >> "$GITHUB_OUTPUT"
      - id: artifact
        name: Publish only independently checked authentication diagnostics
        if: ${{ always() && steps.publication.outputs.safe == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ghcp-auth-zero-turn-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ghcp-auth-zero-turn/published/auth-smoke.json
            ${{ runner.temp }}/ghcp-auth-zero-turn/published/auth-smoke.md
            ${{ runner.temp }}/ghcp-auth-zero-turn/published/process-log.json
            ${{ runner.temp }}/ghcp-auth-zero-turn/published/leak-scan.json
            ${{ runner.temp }}/ghcp-auth-zero-turn/published/probe.json
            ${{ runner.temp }}/ghcp-auth-zero-turn/published/handshake.json
            ${{ runner.temp }}/ghcp-auth-zero-turn/published/thread-policy.json
            ${{ runner.temp }}/ghcp-auth-zero-turn/published/wire-capture.json
            ${{ runner.temp }}/ghcp-auth-zero-turn/published/metadata-http.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
