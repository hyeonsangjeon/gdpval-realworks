name: Grading Renderer Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grading-renderer-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: batch-runner/requirements-renderer.txt

      # Same stall guard as grade-run.yml's renderer install -- see the comment
      # there for the 2026-08-19 mirror outage this exists to survive. A
      # preflight that hangs for five hours is worse than one that fails in
      # ten minutes, because nobody reads a job that is still "running".
      - name: Install document renderer
        run: |
          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o DPkg::Lock::Timeout=60
          )
          install_render_deps() {
            sudo timeout 240 apt-get "${APT_OPTS[@]}" update || return 1
            sudo timeout 420 apt-get "${APT_OPTS[@]}" install \
              --yes --no-install-recommends \
              libreoffice-core \
              libreoffice-calc \
              libreoffice-impress \
              fonts-dejavu-core \
              fonts-liberation2 \
              fontconfig || return 1
          }
          for attempt in 1 2 3; do
            if install_render_deps; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::apt could not install the document renderer after 3 attempts"
              exit 1
            fi
            echo "::warning::apt attempt $attempt failed; retrying in $((attempt * 60))s"
            sleep "$((attempt * 60))"
          done
          libreoffice --headless --version
          FONT_FAMILIES="$(fc-match --format '%{family}\n' 'Liberation Sans')"
          if ! printf '%s\n' "$FONT_FAMILIES" | tr ',' '\n' | awk '
            {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
              if ($0 == "Liberation Sans") found = 1
            }
            END { exit(found ? 0 : 1) }
          '; then
            echo "::error::fc-match did not resolve exact family token Liberation Sans"
            exit 1
          fi

      - name: Install renderer Python dependencies
        run: python -m pip install --requirement batch-runner/requirements-renderer.txt

      - name: Run renderer preflight
        run: |
          RESULT_PATH="$RUNNER_TEMP/grading-renderer-preflight.json"
          set +e
          (cd batch-runner && python scripts/preflight_grading_renderer.py) > "$RESULT_PATH"
          PREFLIGHT_STATUS=$?
          set -e
          cat "$RESULT_PATH"
          python - "$RESULT_PATH" "$PREFLIGHT_STATUS" <<'PY'
          import json
          import sys
          from pathlib import Path

          result_path = Path(sys.argv[1])
          process_status = int(sys.argv[2])
          payload = json.loads(result_path.read_text(encoding="utf-8"))
          if process_status != 0:
              raise SystemExit(f"renderer preflight process failed: {process_status}")
          if payload.get("ok") is not True:
              raise SystemExit("renderer preflight JSON did not report ok=true")
          PY

      - name: Upload renderer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grading-renderer-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/grading-renderer-preflight.json
          if-no-files-found: error
          retention-days: 7