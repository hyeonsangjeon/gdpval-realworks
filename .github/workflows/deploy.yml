name: Aggregate Tests & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'data/tests/**'                 # aggregate-tests → tests-index
      - 'data/grades/**'                # aggregate-grades → grades-index
      - 'batch-runner/experiments/**'   # aggregate-experiments → experiments-index
      - 'batch-runner/results/**'       # aggregate-reports → reports-index
      - 'batch-runner/skills/**'        # perception-note skill registry source
      - 'src/**'                        # 소스 변경 시
      - 'scripts/**'                    # aggregate 스크립트 변경 시
      - 'package.json'                  # aggregate/browser command wiring
      - 'package-lock.json'             # aggregate/browser dependency graph
      - 'index.html'                    # Vite entry point
      - 'vite.config.ts'                # Vite build and base-path config
      - 'tsconfig*.json'                # TypeScript build config
      - 'tailwind.config.js'            # dashboard styles config
      - 'postcss.config.js'             # CSS build config
      - '.github/workflows/deploy.yml'  # Pages gate 자체 변경 시
      - '.github/workflows/batch-run.yml' # runtime-note policy source
      - 'data/notes/runtime-incidents.yaml' # runtime-note incident source
      - 'data/notes/integrity-incidents.yaml' # integrity-note measurement source
      - 'data/notes/perception-pipeline.yaml' # perception-note architecture source
      - 'data/notes/success-layers.yaml' # success-note artifact and interpretation source

  pull_request:
    branches: [main]
    paths:
      - 'data/tests/**'
      - 'data/grades/**'
      - 'batch-runner/experiments/**'
      - 'batch-runner/results/**'
      - 'batch-runner/skills/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/batch-run.yml'
      - 'data/notes/runtime-incidents.yaml'
      - 'data/notes/integrity-incidents.yaml'
      - 'data/notes/perception-pipeline.yaml'
      - 'data/notes/success-layers.yaml'
      - 'README.md'
      - 'README_KR.md'
      - 'docs/**'

  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy the validated artifact (main only)
        required: true
        type: boolean
        default: true
      expected_sha:
        description: Exact result-PR SHA for validation-only dispatches
        required: false
        type: string
        default: ''

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('pages-pr-{0}', github.event.pull_request.number)
        || (github.event_name == 'workflow_dispatch'
            && inputs.deploy_pages == false
            && format('pages-validate-{0}', github.ref)
            || 'pages') }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        || (github.event_name == 'workflow_dispatch'
            && inputs.deploy_pages == false) }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Verify non-PR event contract
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_PAGES: ${{ inputs.deploy_pages }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
          elif [[ "$DEPLOY_PAGES" == "true" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
            [[ -z "$EXPECTED_SHA" ]]
          else
            [[ "$GITHUB_REF" == refs/heads/experiment/* ]]
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]]
            [[ "$WORKFLOW_SHA" == "$EXPECTED_SHA" ]]
          fi

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Aggregate test data
        run: node scripts/aggregate-tests.mjs

      - name: Verify generated files
        run: |
          echo "=== Generated Files ==="
          ls -la public/generated/
          echo ""
          echo "=== experiments-index.json (first 5 lines) ==="
          head -5 public/generated/experiments-index.json
          echo ""
          echo "=== llm-context.md size ==="
          wc -c public/generated/llm-context.md

      - name: Build
        run: npm run build
        env:
          # prebuild에서도 aggregate가 실행되지만,
          # 위에서 이미 실행했으므로 2번 실행됨 (멱등이라 OK)
          NODE_ENV: production
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_REPOSITORY: ${{ github.repository }}

      - name: Verify aggregate contracts and pinned history
        timeout-minutes: 3
        run: npm run test:aggregate:prepared

      - name: Install Chromium headless shell
        timeout-minutes: 10
        run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium

      - name: Verify Field Notes in browser
        timeout-minutes: 8
        run: npm run test:notes-browser:dist

      - name: Verify dashboard build provenance in browser
        timeout-minutes: 8
        run: npm run test:build-provenance-browser:dist
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          EXPECTED_BUILD_REPOSITORY: ${{ github.repository }}

      - name: Verify clean working tree
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Upload Pages artifact
        if: >-
          github.ref == 'refs/heads/main'
          && (github.event_name == 'push'
              || (github.event_name == 'workflow_dispatch'
                  && inputs.deploy_pages == true))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch'
              && inputs.deploy_pages == true))
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
