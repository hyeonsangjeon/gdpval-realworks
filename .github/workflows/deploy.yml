name: Aggregate Tests & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'data/tests/**'                 # aggregate-tests → tests-index
      - 'data/grades/**'                # aggregate-grades → grades-index
      - 'batch-runner/experiments/**'   # aggregate-experiments → experiments-index
      - 'batch-runner/results/**'       # aggregate-reports → reports-index
      - 'src/**'                        # 소스 변경 시
      - 'scripts/**'                    # aggregate 스크립트 변경 시
      - '.github/workflows/batch-run.yml' # runtime-note policy source
      - 'data/notes/runtime-incidents.yaml' # runtime-note incident source
      - 'data/notes/integrity-incidents.yaml' # integrity-note measurement source

  workflow_dispatch:          # 수동 실행 가능

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Aggregate test data
        run: node scripts/aggregate-tests.mjs

      - name: Verify generated files
        run: |
          echo "=== Generated Files ==="
          ls -la public/generated/
          echo ""
          echo "=== experiments-index.json (first 5 lines) ==="
          head -5 public/generated/experiments-index.json
          echo ""
          echo "=== llm-context.md size ==="
          wc -c public/generated/llm-context.md

      - name: Build
        run: npm run build
        env:
          # prebuild에서도 aggregate가 실행되지만,
          # 위에서 이미 실행했으므로 2번 실행됨 (멱등이라 OK)
          NODE_ENV: production

      - name: Verify aggregate contracts and pinned history
        timeout-minutes: 3
        run: npm run test:aggregate

      - name: Install Chromium headless shell
        timeout-minutes: 10
        run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium

      - name: Verify Field Notes in browser
        timeout-minutes: 8
        run: npm run test:notes-browser:dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
