# Does the Foundry deployment answer Codex at all?
#
# The Codex run place has two open legs, and they are not the same question.
# The first — can the agent execute a command inside its isolation — was
# settled by codex-sandbox-host-survey.yml, on one host, against a scripted
# provider. This workflow is the second: whether a request built by the real
# Codex runtime, signed by the real token command and pointed at the real
# deployment, is accepted.
#
# batch-runner/core/execution_environment_readiness.py names three things
# nobody here has measured:
#
#   a. the token the auth command mints has never been *accepted* by anything;
#      it has only been minted;
#   b. which API contract this deployment serves Codex on is unmeasured;
#   c. whether the pinned Codex version's request shape is accepted by this
#      resource's model version and content filters is a third question again.
#
# A single failure that says "the turn failed" separates none of those. The
# script this runs recovers the structured error the SDK's own collector
# discards — it consumes the turn stream itself rather than calling `run()` —
# so a refused sign-in (401/403), a rejected payload (400), an absent
# deployment (404) and a content filter each come back under their own name,
# from the same one request. That is the entire reason this is a workflow and
# not a toggle.
#
# What it deliberately does NOT do:
#
#   * It does not clear a readiness blocker. It records evidence; a person
#     reads it and decides. A diagnostic that quietly flipped the gate would be
#     a manual override wearing a diagnostic's name.
#   * It does not prove the run place works. The prompt forbids commands, files
#     and tools on purpose, so a green verdict cannot be misread as the agent
#     having done anything. `tool_execution_observed` is false in every record
#     this produces, including the connected ones.
#   * It does not fall back. No second model, no second provider, no legacy
#     dated route. A run that cannot reach the deployment it was asked about
#     reports that, rather than reporting a different deployment's health.
#   * It does not name the resource. No endpoint, account name or project name
#     reaches the log or the artifact: the record carries a sha256 of the host
#     instead, and every runtime message passes through a redactor first. The
#     step below re-checks that after the fact rather than trusting it.
#
# Cost. One turn, one prompt of about 135 characters, no tools, and retries
# pinned off in the provider table the runtime actually reads — not merely
# asserted in the plan. That distinction was real: until the pins existed, the
# plan said `retries_configured: 0` while the runtime used its own defaults,
# and one turn against a 500 sent thirty requests. Measured against the pinned
# binary in `batch-runner/tests/test_codex_retry_pins_are_enforced.py`, which
# also records the one case pinning does not reduce to a single request — a
# 401 costs two, because the runtime re-mints the token once and retries.
# `send_request: false` is the default, and with it nothing is sent at all —
# the job prints the plan, fingerprinted, and stops. The plan and the result
# share a schema, so what was fixed beforehand and what happened can be
# compared field by field.
name: Codex Foundry Connection Diagnostic

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment to call (required; there is no default)
        required: true
        type: string
      send_request:
        description: Actually send the one turn. Off means print the plan only.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: codex-foundry-connection-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    # Same guard as azure-rbac-diagnostic.yml. A workflow that can spend runs
    # from the reviewed branch or not at all; the evidence it produces is then
    # preserved in a follow-up pull request rather than being generated by the
    # branch that is asking to be trusted.
    if: github.ref == 'refs/heads/main'
    name: Ask the deployment one question
    # ubuntu-22.04 rather than 24.04, and for a specific reason: 24.04 ships
    # kernel.apparmor_restrict_unprivileged_userns=1 and Codex's sandbox will
    # not start there (docs/codex_sandbox_hosts.json). A turn that died in the
    # sandbox would answer nothing about the deployment while looking like a
    # failure of it. This prompt asks for no command, so the sandbox may never
    # be entered — but "may" is not a thing to run a paid request on.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # Pin the resource this diagnostic is allowed to be about, as a hash.
      #
      # The account and project names live in repository *variables*, and a
      # variable is reprinted verbatim in a step's env header — so checking the
      # identity the ordinary way (AZURE_AI_REQUIRE_EXPECTED_IDENTITIES) would
      # publish the name of the resource in the log of the job built not to
      # name it. The host fingerprint is the same guarantee without the cost:
      # it is a sha256, it changes if the endpoint secret is ever repointed,
      # and it is safe to write down.
      #
      # Recorded by run 34317316416 (`send_request: false`, nothing sent) and
      # kept only because it was *corroborated* rather than observed: the same
      # value falls out of sha256 over the account name this repository already
      # pins in a variable, on the `.services.ai.azure.com` suffix. That
      # derivation needs no network and no request. A measured host that had
      # not matched it would not belong here whatever the run printed.
      #
      # The variable is deliberately not named here, let alone read: naming it
      # is one edit away from requesting it, and requesting it prints it.
      EXPECTED_HOST_FINGERPRINT: "sha256:69057d59166a82e3"

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # 3.10.12 exactly, matching backend-tests.yml. core/agentic_v2_license.py
      # compares a pinned version string against sys.version_info at import,
      # and the script imports core.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10.12"
          cache: pip
          cache-dependency-path: batch-runner/requirements.txt

      - name: Install dependencies
        working-directory: batch-runner
        run: pip install -r requirements.txt

      - name: Make sure bubblewrap is present
        run: |
          set -euo pipefail
          if ! command -v bwrap > /dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap
          fi
          echo "bwrap: $(command -v bwrap)  $(bwrap --version 2>&1 | head -1)"

      # If pip left the pinned binary uninstalled, every verdict below would be
      # `runtime_unavailable` — a true statement about this runner and nothing
      # at all about the deployment. Stop here instead, before the request.
      - name: Refuse to continue unless the pinned runtime is installed
        working-directory: batch-runner
        run: |
          set -euo pipefail
          python3 -c "from core.codex_runtime_config import require_pinned_runtime; print('pinned runtime:', require_pinned_runtime())"

      # The same pinned action, client id, tenant and subscription the paid
      # runs authenticate with. The token the probe sends is minted from this
      # session by core/codex_azure_token.py, which is what makes blocker (a)
      # answerable here: it is that identity's token being accepted or refused,
      # not a stand-in's.
      - name: Azure Login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure OIDC session identity
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_AI_EXPECTED_CLIENT_ID: ${{ vars.AZURE_AI_EXPECTED_CLIENT_ID }}
          AZURE_AI_EXPECTED_TENANT_ID: ${{ vars.AZURE_AI_EXPECTED_TENANT_ID }}
          AZURE_AI_EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_AI_EXPECTED_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          cd batch-runner
          python3 scripts/azure_oidc_identity_preflight.py --verify-session

      # Always, including on the runs that go on to send. The plan is what
      # fixes the request before it costs anything, and comparing it against
      # the result afterwards is how "one turn, retries pinned" stops being a
      # promise. The plan reads its retry numbers off the same settings the
      # provider table is built from, so the two cannot disagree.
      #
      # No AZURE_AI_EXPECTED_* variable is passed to this step or the next one.
      # They would be printed. The script pulls the names it must redact out of
      # the endpoint secret instead, the way azure_rbac_diagnostic.py does.
      - name: Fix the request before anything is sent
        working-directory: batch-runner
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          python3 scripts/diagnose_codex_foundry_connection.py \
            --deployment "${DEPLOYMENT}" \
            --out /tmp/codex-foundry-plan.json

      - name: Confirm the plan is about the resource this job is pinned to
        id: pinned
        env:
          SEND_REQUEST: ${{ inputs.send_request }}
        run: |
          set -euo pipefail
          MEASURED="$(python3 -c "import json;print(json.load(open('/tmp/codex-foundry-plan.json'))['settings']['endpoint_host_fingerprint'])")"
          echo "measured host fingerprint: ${MEASURED}"
          if [ -z "${EXPECTED_HOST_FINGERPRINT}" ]; then
            if [ "${SEND_REQUEST}" = "true" ]; then
              echo "FATAL: EXPECTED_HOST_FINGERPRINT is empty and this run was"
              echo "       asked to send. Nothing would have been compared, so"
              echo "       the request would go to whatever the endpoint secret"
              echo "       currently points at, and be paid for there."
              echo "       Refusing. Pin the value printed above first."
              exit 1
            fi
            echo "NOTE: EXPECTED_HOST_FINGERPRINT is empty in this workflow, so"
            echo "      nothing was checked. Tolerated here only because nothing"
            echo "      is being sent — a dry run is how the value is discovered"
            echo "      in the first place. The same state with send_request on"
            echo "      is the FATAL above."
            exit 0
          fi
          if [ "${MEASURED}" != "${EXPECTED_HOST_FINGERPRINT}" ]; then
            echo "FATAL: this is not the resource this diagnostic is pinned to."
            echo "       Refusing to send. The endpoint secret has been"
            echo "       repointed, or this job was dispatched against"
            echo "       something else."
            exit 1
          fi
          echo "resource=pinned"
          # Written on this path only. Every other way out of this step leaves
          # it unset, which is what the send is gated on below — so a future
          # edit that softens one of the refusals above into an `exit 0` still
          # does not buy itself a request.
          echo "confirmed=yes" >> "${GITHUB_OUTPUT}"

      # Free, and it runs on every dispatch including the dry ones. A listing
      # is not a turn: no prompt, no completion, nothing to generate.
      #
      # It exists because run 34319880025's 401 survived every offline check.
      # The URL, the token scope, the header name and format and the OIDC
      # identity all matched the direct-v1 path grading uses successfully, so
      # none of them explains the refusal. The one difference left unmeasured
      # was where the token comes from: the Python paths mint it in process,
      # the Codex runtime runs `auth.command` as a child and reads stdout.
      #
      # This step mints it the child way and asks the host to list its models.
      # 200 moves the question to something narrower than the identity, and
      # tells us whether the deployment name is even on the resource. 401
      # reproduces the refusal having spent nothing. Either way it is a finding
      # and neither is a reason to fail the job, hence `|| true` — the script
      # exits non-zero for every listing that is not a 200.
      #
      # `test -s` is deliberately not covered by that. A refusal is a finding;
      # no record at all is a bug in this repository, and the step fails, which
      # also stops the paid turn below. Failing closed here costs a dispatch;
      # the other way round costs a request nobody could account for.
      - name: Ask the host what it will admit to, without sending a turn
        id: readonly
        working-directory: batch-runner
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          python3 scripts/diagnose_codex_foundry_connection.py \
            --deployment "${DEPLOYMENT}" \
            --read-only-probe \
            --out /tmp/codex-foundry-readonly.json || true
          test -s /tmp/codex-foundry-readonly.json
          python3 - <<'PY'
          import json
          record = json.load(open("/tmp/codex-foundry-readonly.json"))
          listing = record.get("listing") or {}
          print("token minted by the child process:", record["token"]["minted"])
          print("listing status:", listing.get("status"))
          print("models listed:", listing.get("models_listed"))
          print("the asked-for deployment is in the listing:",
                listing.get("deployment_listed"))
          PY

      # The one request. Skipped entirely unless it was asked for, so the
      # difference between a free run and a paid one is a deliberate input and
      # not a forgotten flag.
      #
      # Two conditions, not one. `inputs.send_request` is the person's
      # intention; `steps.pinned.outputs.confirmed` is the machine's evidence
      # that the intention is about the right resource. Intention alone used to
      # be enough, which meant an empty fingerprint bought a paid call.
      - name: Send the one turn
        if: ${{ inputs.send_request && steps.pinned.outputs.confirmed == 'yes' }}
        working-directory: batch-runner
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          # `|| true` because a refusal is a finding, not a broken job: the
          # script exits non-zero for every verdict except `connected`, and
          # stopping here would throw away the record that says which refusal
          # it was. The verdict is read out of the file below.
          python3 scripts/diagnose_codex_foundry_connection.py \
            --deployment "${DEPLOYMENT}" \
            --send-request \
            --out /tmp/codex-foundry-connection.json || true
          test -s /tmp/codex-foundry-connection.json

      # A grep, not a promise. The redaction is the script's job; this is the
      # check that it did it. Run against whichever record exists, and the
      # endpoint is read from the secret here purely to search for it — it is
      # never echoed, only counted.
      - name: Confirm the record names no resource and carries no token
        id: leak_check
        if: always()
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          from urllib.parse import urlsplit

          leaked = []
          checked = 0
          endpoint = os.environ.get("FOUNDRY_PROJECT_ENDPOINT", "").strip()
          needles = []
          if endpoint:
              parsed = urlsplit(endpoint)
              host = parsed.netloc.split(":", 1)[0]
              needles.append(host)
              needles.append(host.split(".", 1)[0])
              parts = [p for p in parsed.path.split("/") if p]
              if len(parts) >= 2 and parts[-2] == "projects":
                  needles.append(parts[-1])
          needles = [n for n in needles if len(n) >= 4]

          # Exactly one URL belongs in a clean record: the Entra scope the
          # token is asked for. It is the same string for every tenant, carries
          # no account, project, region or subscription, and is already in this
          # public repository's source. Read it out of that source rather than
          # writing it here, so that a future edit pointing the scope at
          # something resource-specific makes this check fail instead of
          # teaching it a new exception. Any other URL is still fatal.
          #
          # The rule this replaces was "any URL at all", which fired on that
          # constant and stopped a run that had leaked nothing. A guard that
          # cries wolf is a guard someone reaches past.
          scope_source = "batch-runner/core/azure_ai_clients.py"
          try:
              scope_text = open(scope_source, encoding="utf-8").read()
          except OSError as exc:
              print(f"FATAL: cannot read {scope_source}: {exc}")
              print("       refusing to decide what a URL means without it")
              sys.exit(1)
          found_scope = re.search(
              r'^DIRECT_TOKEN_SCOPE\s*=\s*"([^"]+)"', scope_text, re.M
          )
          if found_scope is None:
              print(f"FATAL: no DIRECT_TOKEN_SCOPE in {scope_source}")
              print("       the allowed URL cannot be established, so none is allowed")
              sys.exit(1)
          allowed_url = found_scope.group(1)

          for path in (
              "/tmp/codex-foundry-plan.json",
              "/tmp/codex-foundry-readonly.json",
              "/tmp/codex-foundry-connection.json",
          ):
              if not os.path.exists(path):
                  continue
              checked += 1
              text = open(path, encoding="utf-8").read()
              lowered = text.lower()
              for needle in needles:
                  if needle.lower() in lowered:
                      leaked.append(f"{path}: names the resource")
              if re.search(r"\bey[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}", text):
                  leaked.append(f"{path}: contains something token-shaped")
              for found in set(re.findall(r"""https?://[^\s"'\\]+""", text)):
                  if found != allowed_url:
                      leaked.append(
                          f"{path}: contains a URL that is not the public token scope"
                      )
              record = json.loads(text)
              # Two record shapes now land here and only one of them observes a
              # turn. Branch on the record's own schema rather than on whether
              # the key happens to be present: `.get("observed", {})` would turn
              # a renamed field in the connection record into a silent pass, and
              # this check exists precisely to catch a claim nobody measured.
              schema = str(record.get("schema", ""))
              if schema.startswith("codex_foundry_readonly_probe/"):
                  if record["inference_requested"] is not False:
                      leaked.append(f"{path}: a read-only record claims a request was made")
              else:
                  if record["observed"]["tool_execution_observed"] is not False:
                      leaked.append(f"{path}: claims tool execution, which this probe cannot observe")

          if leaked:
              print("FATAL:")
              for item in sorted(set(leaked)):
                  print(" -", item)
              sys.exit(1)
          if checked == 0:
              # This step runs on failure too. Saying "clean" about nothing
              # would read as a pass for a check that never happened.
              print("no record exists to check; the run stopped before one was written")
          else:
              print(f"record=clean ({checked} checked)")
          PY

      # Not `always()`. A record this job's own check rejected is the one
      # record that must not be published: this repository is public, so an
      # artifact is world-readable from the moment it exists, and deleting it
      # afterwards is a different fact from never having uploaded it.
      #
      # `== 'success'` rather than `!= 'failure'`, so that a check which never
      # ran does not read as a check that passed. The check is itself
      # `always()`, so it succeeds whenever it found a clean record — including
      # when an earlier step failed, which is when the record is most worth
      # keeping.
      - name: Keep the record
        if: always() && steps.leak_check.conclusion == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-foundry-connection
          path: |
            /tmp/codex-foundry-plan.json
            /tmp/codex-foundry-readonly.json
            /tmp/codex-foundry-connection.json
          if-no-files-found: warn
          retention-days: 90

      - name: Say that the record was withheld
        if: always() && steps.leak_check.conclusion != 'success'
        run: |
          set -euo pipefail
          {
            echo "### The record was not published"
            echo ""
            echo "The redaction check did not pass it, so \`Keep the record\`"
            echo "was skipped. The record exists only on the runner and goes"
            echo "away with it. Read the check's output above for what it"
            echo "found — it names the kind of thing, never the thing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          RECORD=/tmp/codex-foundry-connection.json
          [ -s "$RECORD" ] || RECORD=/tmp/codex-foundry-plan.json
          VERDICT="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict'])" "$RECORD" 2>/dev/null || echo 'not measured')"
          ANSWERED="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['provider_answered'])" "$RECORD" 2>/dev/null || echo 'unknown')"
          RO=/tmp/codex-foundry-readonly.json
          RO_STATUS="$(python3 -c "import json,sys;print((json.load(open(sys.argv[1])).get('listing') or {}).get('status'))" "$RO" 2>/dev/null || echo 'not measured')"
          RO_MINTED="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['token']['minted'])" "$RO" 2>/dev/null || echo 'unknown')"
          RO_LISTED="$(python3 -c "import json,sys;print((json.load(open(sys.argv[1])).get('listing') or {}).get('deployment_listed'))" "$RO" 2>/dev/null || echo 'unknown')"
          {
            echo "### Codex → Foundry, one turn"
            echo ""
            echo "- verdict: \`${VERDICT}\`"
            echo "- did the provider answer at all: \`${ANSWERED}\`"
            echo "- request sent: \`${{ inputs.send_request }}\`"
            echo "- tool execution observed: \`false\` — this prompt forbids tools, by design"
            echo ""
            echo "### 무과금 읽기 전용 확인 (턴 없음)"
            echo ""
            echo "- 자식 프로세스가 토큰을 만들었는가: \`${RO_MINTED}\`"
            echo "- 목록 조회 응답: \`${RO_STATUS}\`"
            echo "- 물어본 배포가 목록에 있는가: \`${RO_LISTED}\`"
            echo ""
            echo "이 세 줄이 뜻하는 것: 프롬프트도 생성도 없이, Codex가 쓰는 것과"
            echo "**같은 방법으로 토큰을 만들어** 같은 주소에 모델 목록만"
            echo "물어본 결과입니다. \`200\`이면 이 자원이 이 신원의 토큰을"
            echo "받아준다는 뜻이므로, 턴이 거절됐다면 원인은 신원보다 더 좁은"
            echo "곳에 있습니다. \`401\`이면 **돈 한 푼 안 쓰고** 같은 거절을"
            echo "재현한 것이고, 문제는 토큰 자체입니다. 배포가 목록에"
            echo "\`False\`로 없으면 그 이름이 이 자원에 없다는 뜻입니다."
            echo "다만 목록이 열린다고 해서 **호출이 허용된다는 뜻은 아닙니다.**"
            echo ""
            echo "이 줄이 뜻하는 것: Codex 런타임이 만든 요청 한 번을 실제 배포에"
            echo "보내고, 그쪽이 무엇이라고 답했는지를 이름 붙여 기록한 것입니다."
            echo "\`connected\`이면 모델이 응답했다는 뜻이고, 그것뿐입니다 —"
            echo "명령 실행·파일 생성·묶음 실행·비용은 여기서 확인되지 않습니다."
            echo "\`authentication_rejected\`는 로그인이 거절된 것,"
            echo "\`request_shape_rejected\`는 요청 형식이 거절된 것,"
            echo "\`deployment_not_found\`는 그 배포가 없다는 뜻으로, 셋은 고치는"
            echo "곳이 서로 다릅니다."
          } >> "$GITHUB_STEP_SUMMARY"
