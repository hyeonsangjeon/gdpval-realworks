# Does the Foundry deployment answer Codex at all?
#
# The Codex run place has two open legs, and they are not the same question.
# The first — can the agent execute a command inside its isolation — was
# settled by codex-sandbox-host-survey.yml, on one host, against a scripted
# provider. This workflow is the second: whether a request built by the real
# Codex runtime, signed by the real token command and pointed at the real
# deployment, is accepted.
#
# batch-runner/core/execution_environment_readiness.py names three things
# nobody here has measured:
#
#   a. the token the auth command mints has never been *accepted* by anything;
#      it has only been minted;
#   b. which API contract this deployment serves Codex on is unmeasured;
#   c. whether the pinned Codex version's request shape is accepted by this
#      resource's model version and content filters is a third question again.
#
# A single failure that says "the turn failed" separates none of those. The
# script this runs recovers the structured error the SDK's own collector
# discards — it consumes the turn stream itself rather than calling `run()` —
# so a refused sign-in (401/403), a rejected payload (400), an absent
# deployment (404) and a content filter each come back under their own name,
# from the same one request. That is the entire reason this is a workflow and
# not a toggle.
#
# What it deliberately does NOT do:
#
#   * It does not clear a readiness blocker. It records evidence; a person
#     reads it and decides. A diagnostic that quietly flipped the gate would be
#     a manual override wearing a diagnostic's name.
#   * It does not prove the run place works. The prompt forbids commands, files
#     and tools on purpose, so a green verdict cannot be misread as the agent
#     having done anything. `tool_execution_observed` is false in every record
#     this produces, including the connected ones.
#   * It does not fall back. No second model, no second provider, no legacy
#     dated route. A run that cannot reach the deployment it was asked about
#     reports that, rather than reporting a different deployment's health.
#   * It does not name the resource. No endpoint, account name or project name
#     reaches the log or the artifact: the record carries a sha256 of the host
#     instead, and every runtime message passes through a redactor first. The
#     step below re-checks that after the fact rather than trusting it.
#
# Cost. One turn and retries pinned off in the provider table the runtime
# actually reads — not merely asserted in the plan. That distinction was real:
# until the pins existed, the plan said `retries_configured: 0` while the
# runtime used its own defaults, and one turn against a 500 sent thirty
# requests. Measured against the pinned binary in
# `batch-runner/tests/test_codex_retry_pins_are_enforced.py`, which also
# records the one case pinning does not reduce to a single request — a 401
# costs two, because the runtime re-mints the token once and retries.
#
# What that one turn bills for is *not* the 135-character prompt. This note
# used to say "one prompt of about 135 characters, no tools", which was the
# same error it warns about above: a property of the plan asserted about the
# runtime. The turn puts about 45.9 KB on the wire — roughly 21 KB of Codex
# system `instructions`, 18 KB of ten `tools` definitions sent with
# `tool_choice: auto`, and 5 KB of `input` — and no prompt wording or config
# key removes the tools. Measured in
# `batch-runner/tests/test_what_one_codex_turn_actually_sends.py`. The turn is
# still cheap and still one request; the prompt length is simply not what
# makes it so, and a contrast against the direct Python path cannot be matched
# on body size.
#
# `send_request: false` is the default, and with it nothing is sent at all —
# the job prints the plan, fingerprinted, and stops. The plan and the result
# share a schema, so what was fixed beforehand and what happened can be
# compared field by field.
name: Codex Foundry Connection Diagnostic

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment to call (required; there is no default)
        required: true
        type: string
      send_request:
        description: Actually send the one turn. Off means print the plan only.
        required: false
        default: false
        type: boolean
      send_valid_request:
        description: >-
          Send one servable Responses request through plain urllib (paid, not
          Codex). This is the only probe here that can produce a completion.
        required: false
        default: false
        type: boolean
      send_closing_sweep:
        description: >-
          Nine servable requests (paid), each the served one plus one property
          Codex adds. Asks which of them turns a 200 back into a 401.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: codex-foundry-connection-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    # Same guard as azure-rbac-diagnostic.yml. A workflow that can spend runs
    # from the reviewed branch or not at all; the evidence it produces is then
    # preserved in a follow-up pull request rather than being generated by the
    # branch that is asking to be trusted.
    if: github.ref == 'refs/heads/main'
    name: Ask the deployment one question
    # ubuntu-22.04 rather than 24.04, and for a specific reason: 24.04 ships
    # kernel.apparmor_restrict_unprivileged_userns=1 and Codex's sandbox will
    # not start there (docs/codex_sandbox_hosts.json). A turn that died in the
    # sandbox would answer nothing about the deployment while looking like a
    # failure of it. This prompt asks for no command, so the sandbox may never
    # be entered — but "may" is not a thing to run a paid request on.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # Pin the resource this diagnostic is allowed to be about, as a hash.
      #
      # The account and project names live in repository *variables*, and a
      # variable is reprinted verbatim in a step's env header — so checking the
      # identity the ordinary way (AZURE_AI_REQUIRE_EXPECTED_IDENTITIES) would
      # publish the name of the resource in the log of the job built not to
      # name it. The host fingerprint is the same guarantee without the cost:
      # it is a sha256, it changes if the endpoint secret is ever repointed,
      # and it is safe to write down.
      #
      # Recorded by run 34317316416 (`send_request: false`, nothing sent) and
      # kept only because it was *corroborated* rather than observed: the same
      # value falls out of sha256 over the account name this repository already
      # pins in a variable, on the `.services.ai.azure.com` suffix. That
      # derivation needs no network and no request. A measured host that had
      # not matched it would not belong here whatever the run printed.
      #
      # The variable is deliberately not named here, let alone read: naming it
      # is one edit away from requesting it, and requesting it prints it.
      EXPECTED_HOST_FINGERPRINT: "sha256:69057d59166a82e3"

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # 3.10.12 exactly, matching backend-tests.yml. core/agentic_v2_license.py
      # compares a pinned version string against sys.version_info at import,
      # and the script imports core.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10.12"
          cache: pip
          cache-dependency-path: batch-runner/requirements.txt

      - name: Install dependencies
        working-directory: batch-runner
        run: pip install -r requirements.txt

      - name: Make sure bubblewrap is present
        run: |
          set -euo pipefail
          if ! command -v bwrap > /dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap
          fi
          echo "bwrap: $(command -v bwrap)  $(bwrap --version 2>&1 | head -1)"

      # If pip left the pinned binary uninstalled, every verdict below would be
      # `runtime_unavailable` — a true statement about this runner and nothing
      # at all about the deployment. Stop here instead, before the request.
      - name: Refuse to continue unless the pinned runtime is installed
        working-directory: batch-runner
        run: |
          set -euo pipefail
          python3 -c "from core.codex_runtime_config import require_pinned_runtime; print('pinned runtime:', require_pinned_runtime())"

      # The same pinned action, client id, tenant and subscription the paid
      # runs authenticate with. The token the probe sends is minted from this
      # session by core/codex_azure_token.py, which is what makes blocker (a)
      # answerable here: it is that identity's token being accepted or refused,
      # not a stand-in's.
      - name: Azure Login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure OIDC session identity
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_AI_EXPECTED_CLIENT_ID: ${{ vars.AZURE_AI_EXPECTED_CLIENT_ID }}
          AZURE_AI_EXPECTED_TENANT_ID: ${{ vars.AZURE_AI_EXPECTED_TENANT_ID }}
          AZURE_AI_EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_AI_EXPECTED_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          cd batch-runner
          python3 scripts/azure_oidc_identity_preflight.py --verify-session

      # Always, including on the runs that go on to send. The plan is what
      # fixes the request before it costs anything, and comparing it against
      # the result afterwards is how "one turn, retries pinned" stops being a
      # promise. The plan reads its retry numbers off the same settings the
      # provider table is built from, so the two cannot disagree.
      #
      # No AZURE_AI_EXPECTED_* variable is passed to this step or the next one.
      # They would be printed. The script pulls the names it must redact out of
      # the endpoint secret instead, the way azure_rbac_diagnostic.py does.
      - name: Fix the request before anything is sent
        working-directory: batch-runner
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          python3 scripts/diagnose_codex_foundry_connection.py \
            --deployment "${DEPLOYMENT}" \
            --out /tmp/codex-foundry-plan.json

      - name: Confirm the plan is about the resource this job is pinned to
        id: pinned
        env:
          SEND_REQUEST: ${{ inputs.send_request }}
        run: |
          set -euo pipefail
          MEASURED="$(python3 -c "import json;print(json.load(open('/tmp/codex-foundry-plan.json'))['settings']['endpoint_host_fingerprint'])")"
          echo "measured host fingerprint: ${MEASURED}"
          if [ -z "${EXPECTED_HOST_FINGERPRINT}" ]; then
            if [ "${SEND_REQUEST}" = "true" ]; then
              echo "FATAL: EXPECTED_HOST_FINGERPRINT is empty and this run was"
              echo "       asked to send. Nothing would have been compared, so"
              echo "       the request would go to whatever the endpoint secret"
              echo "       currently points at, and be paid for there."
              echo "       Refusing. Pin the value printed above first."
              exit 1
            fi
            echo "NOTE: EXPECTED_HOST_FINGERPRINT is empty in this workflow, so"
            echo "      nothing was checked. Tolerated here only because nothing"
            echo "      is being sent — a dry run is how the value is discovered"
            echo "      in the first place. The same state with send_request on"
            echo "      is the FATAL above."
            exit 0
          fi
          if [ "${MEASURED}" != "${EXPECTED_HOST_FINGERPRINT}" ]; then
            echo "FATAL: this is not the resource this diagnostic is pinned to."
            echo "       Refusing to send. The endpoint secret has been"
            echo "       repointed, or this job was dispatched against"
            echo "       something else."
            exit 1
          fi
          echo "resource=pinned"
          # Written on this path only. Every other way out of this step leaves
          # it unset, which is what the send is gated on below — so a future
          # edit that softens one of the refusals above into an `exit 0` still
          # does not buy itself a request.
          echo "confirmed=yes" >> "${GITHUB_OUTPUT}"

      # Free, and it runs on every dispatch including the dry ones. A listing
      # is not a turn: no prompt, no completion, nothing to generate.
      #
      # It exists because run 34319880025's 401 survived every offline check.
      # The URL, the token scope, the header name and format and the OIDC
      # identity all matched the direct-v1 path grading uses successfully, so
      # none of them explains the refusal. The one difference left unmeasured
      # was where the token comes from: the Python paths mint it in process,
      # the Codex runtime runs `auth.command` as a child and reads stdout.
      #
      # This step mints it the child way and asks the host to list its models.
      # 200 moves the question to something narrower than the identity, and
      # tells us whether the deployment name is even on the resource. 401
      # reproduces the refusal having spent nothing. Either way it is a finding
      # and neither is a reason to fail the job, hence `|| true` — the script
      # exits non-zero for every listing that is not a 200.
      #
      # `test -s` is deliberately not covered by that. A refusal is a finding;
      # no record at all is a bug in this repository, and the step fails, which
      # also stops the paid turn below. Failing closed here costs a dispatch;
      # the other way round costs a request nobody could account for.
      #
      # A failed *mint* is the same category as a missing record, and run
      # 34340775246 is why that is written down rather than assumed. It burned
      # a real OIDC login, reported `success`, and measured nothing: the probe
      # read `settings.auth_command` without calling it, so the token error was
      # `'method' object is not iterable` — our defect, filed in the record
      # beside the host's answers where a reader could take it for one. The
      # check below now separates "the host refused" from "we never asked".
      - name: Ask the host what it will admit to, without sending a turn
        id: readonly
        working-directory: batch-runner
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          python3 scripts/diagnose_codex_foundry_connection.py \
            --deployment "${DEPLOYMENT}" \
            --read-only-probe \
            --out /tmp/codex-foundry-readonly.json || true
          test -s /tmp/codex-foundry-readonly.json
          python3 - <<'PY'
          import json
          import sys

          record = json.load(open("/tmp/codex-foundry-readonly.json"))
          listing = record.get("listing") or {}
          token = record["token"]
          print("token minted by the child process:", token["minted"])
          print("listing status:", listing.get("status"))
          print("models listed:", listing.get("models_listed"))
          print("the asked-for deployment is in the listing:",
                listing.get("deployment_listed"))

          # A refusal is a finding and this step keeps going for it: 401 is the
          # answer we came for as much as 200 is. Never getting as far as the
          # host is not a finding — it says nothing about the resource, and a
          # green step there is how run 34340775246 looked like it had measured
          # something while the argv was wrong. Fail, which also stops the paid
          # turn below: a job that could not mint a token has no business
          # buying one.
          if not token["minted"]:
              print("::error::the probe never reached the host: the token could "
                    "not be minted, so this run measures nothing about the "
                    "resource. This is an environment or code fault, not a "
                    "refusal.")
              sys.exit(1)
          PY

      # Free, and ungated for the same reason the step above is: it sends no
      # prompt and asks for no completion, and a diagnostic that only runs on
      # the dispatches that spend money is not available when it is most
      # needed.
      #
      # It exists because the step above came back 200 while the turn below
      # came back 401, on the same host, with the same bearer, minutes apart.
      # Four candidate causes died on that pair -- address, identity,
      # deployment name, header format -- and the refusal was still not
      # located. The Azure gateway string that came with it ("invalid
      # subscription key or wrong API endpoint") is shared by more than one
      # kind of refusal, so it does not locate it either.
      #
      # This asks the *turn route* something it cannot answer with a
      # completion: a POST whose body names no model. Twice -- once with the
      # bearer the Codex runtime would mint, once with a fixed string that is
      # plainly not a token.
      #
      # Two arms, because one would not be readable. A 400 from the minted
      # bearer means "it got past authorization" only if this host checks
      # authorization before it validates the body, and nothing here has ever
      # established that ordering. The control arm makes the host demonstrate
      # it. If the non-token is *not* stopped at the gate, the probe reports
      # that it cannot tell rather than reading the minted arm's number as an
      # answer -- which is the reading somebody hoping for good news would
      # take, and this is being run by somebody hoping for good news.
      #
      # The control arm is not credential guessing and cannot become it: the
      # string is a fixed sentence in the script, it is never varied, and it is
      # never derived from anything real.
      #
      # `|| true` for the same reason as above: every verdict except the two
      # conclusive ones exits non-zero, and "the instrument could not
      # discriminate" is a finding worth keeping rather than a broken job.
      # `test -s` is not covered by it -- no record at all is a defect here.
      - name: Ask which check this host runs first, without sending a turn
        id: auth_discriminator
        working-directory: batch-runner
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          python3 scripts/diagnose_codex_foundry_connection.py \
            --deployment "${DEPLOYMENT}" \
            --auth-discriminator \
            --out /tmp/codex-foundry-auth-discriminator.json || true
          test -s /tmp/codex-foundry-auth-discriminator.json
          python3 - <<'PY'
          import json
          import sys

          record = json.load(open("/tmp/codex-foundry-auth-discriminator.json"))
          arms = record["arms"]
          minted = arms["minted_bearer"] or {}
          control = arms["invalid_bearer_control"] or {}
          print("token minted by the child process:", record["token"]["minted"])
          print("minted bearer  ->", minted.get("status"))
          print("non-token      ->", control.get("status"))
          print("same refusal text for both:", record["same_message_as_control"])
          print("verdict:", record["verdict"])
          print("what that means:", record["verdict_note"])

          # Same rule as the read-only step. A refusal is a finding and an
          # honest "cannot tell" is a finding. Never reaching the host is not:
          # it says nothing about the resource, and a green step there is
          # exactly how run 34340775246 looked like it had measured something.
          if not record["token"]["minted"]:
              print("::error::the probe never reached the host: the token could "
                    "not be minted, so this run measures nothing about the "
                    "resource. This is an environment or code fault, not a "
                    "refusal.")
              sys.exit(1)
          PY

      # Where the discriminator left the question. The bearer clears this
      # host's gate under `urllib` and the runtime is refused at it with the
      # control arm's sentence word for word, so the difference is in what the
      # runtime puts on the wire and `urllib` does not. Four transmission
      # explanations were measured offline against the pinned binary and all
      # four are false: the header is present, it carries `Bearer `, its value
      # is exactly what the auth command printed, and no second credential
      # rides alongside.
      #
      # So this adds the rest, one property at a time, to a request already
      # known to clear the gate. A 400 that becomes a 401 names a property
      # that changes how this host authorizes. Nothing changing names the
      # body, which is the other place left to look.
      #
      # Cost: seven requests, none of which names a model, so none can select
      # a deployment or generate anything. That is an argument, not a receipt
      # -- a refusal returns no usage record, so these are unpriced rather
      # than proven free, and the record says so in `not_established`.
      #
      # What it cannot show: these arms are `urllib`, not the runtime. A
      # property that closes the gate here is where to look next. It is not a
      # demonstrated cause of the turn's refusal, and it is not a reason to
      # request a role.
      #
      # `|| true` for the reason the steps above give: `sweep_inconclusive`
      # exits non-zero and is a finding worth keeping, not a broken job.
      - name: Ask which request property closes a gate the plain request clears
        id: transmission_sweep
        working-directory: batch-runner
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          python3 scripts/diagnose_codex_foundry_connection.py \
            --deployment "${DEPLOYMENT}" \
            --transmission-sweep \
            --out /tmp/codex-foundry-transmission-sweep.json || true
          test -s /tmp/codex-foundry-transmission-sweep.json
          python3 - <<'PY'
          import json
          import sys

          record = json.load(open("/tmp/codex-foundry-transmission-sweep.json"))
          print("token minted by the child process:", record["token"]["minted"])
          print("requests planned:", record["requests_planned"],
                "sent:", record["requests_sent"])
          for name, arm in (record["arms"] or {}).items():
              print(f"  {name:28s} -> {arm.get('status')}"
                    f"  same text as control: {arm.get('same_message_as_control')}")
          print("  control                      ->",
                (record["control"] or {}).get("status"))
          print("closed the gate:", record["properties_that_closed_the_gate"])
          print("verdict:", record["verdict"])
          print("what that means:", record["verdict_note"])

          if not record["token"]["minted"]:
              print("::error::the sweep never reached the host: the token could "
                    "not be minted, so this run measures nothing about the "
                    "resource. This is an environment or code fault, not a "
                    "refusal.")
              sys.exit(1)

          # The count on the wire, not the constant. A sweep that sent fewer
          # requests than it planned measured fewer properties than it reports
          # on, and would read as a null result for arms that never went.
          if record["requests_sent"] != record["requests_planned"]:
              print(f"::error::the sweep planned {record['requests_planned']} "
                    f"requests and sent {record['requests_sent']}. The arms that "
                    f"did not go are not evidence about anything.")
              sys.exit(1)
          PY

      # The one request this file can send that the route is able to serve.
      #
      # Run 34437632382 finished the free line of questioning: all six header
      # arms, up to and including every runtime header at once with
      # `stream: true`, still cleared the gate with the same `400`. Nothing the
      # runtime *adds to its headers* is what refuses it. What has never been
      # sent to this resource is a body it could serve — every probe above
      # deliberately omits the `model` field, which is exactly the field that
      # resolves a deployment and therefore the field a per-deployment
      # authorization check would key on.
      #
      # So this is not another free diagnostic. It costs, it is gated on its
      # own input, and it answers a question none of the free ones can:
      #
      #   200 with text -> this identity infers here through urllib. Whatever
      #                    refuses Codex is Codex-side, and there is now a
      #                    working reference to diff its request against.
      #   401/403       -> this identity may not infer here at all. That is a
      #                    permission fact, and the first evidence in this
      #                    whole diagnostic that would bear on a role.
      #   400/404       -> the shape or the deployment name is wrong and the
      #                    message says which. Still not a permission fact.
      #
      # Ceilings are in the script, not here, so they cannot be dispatched
      # around: one request, no retry, 16 output tokens, 90 seconds, no
      # fallback. Pinned by batch-runner/tests/test_codex_valid_request.py.
      - name: Send one request the route can actually serve
        id: valid_request
        if: ${{ inputs.send_valid_request && steps.pinned.outputs.confirmed == 'yes' }}
        working-directory: batch-runner
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          # `|| true` for the same reason as the turn below: the script exits
          # non-zero for everything except a completion, and a refusal is the
          # finding rather than a broken job. The verdict is read out of the
          # file, which is also what keeps a missing file from passing.
          python3 scripts/diagnose_codex_foundry_connection.py \
            --deployment "${DEPLOYMENT}" \
            --valid-request \
            --out /tmp/codex-foundry-valid-request.json || true
          test -s /tmp/codex-foundry-valid-request.json
          python3 - <<'PY'
          import json
          import sys

          record = json.load(open("/tmp/codex-foundry-valid-request.json"))
          attempt = record["attempt"] or {}
          print("token minted:", record["token"]["minted"])
          print("requests planned:", record["requests_planned"],
                "sent:", record["requests_sent"])
          print("status:", attempt.get("status"))
          print("produced text:", bool(attempt.get("answer")))
          usage = attempt.get("usage") or {}
          print("usage reported:", usage.get("reported"),
                "pricing:", usage.get("pricing"))
          print("verdict:", record["verdict"])
          print("what that means:", record["verdict_note"])

          if not record["token"]["minted"]:
              print("::error::the token could not be minted, so nothing was "
                    "sent and this run measures nothing about the resource.")
              sys.exit(1)

          # The count on the wire, not the constant. This is the paid probe;
          # a run that sent more than it planned is the failure mode the
          # ceilings exist to prevent, and it must be loud.
          if record["requests_sent"] > record["requests_planned"]:
              print(f"::error::planned {record['requests_planned']} request(s) "
                    f"and sent {record['requests_sent']}.")
              sys.exit(1)
          PY

      # The bisect the step above made possible.
      #
      # Run 34442249527 got `200 completed` out of this route with a body that
      # named a model, on the host fingerprint that answers the runtime's 401
      # and with the token the runtime's own auth command mints. So there is
      # now a request known to be served, and the question stops being "does
      # this identity may infer" — it does — and becomes "which of the things
      # Codex adds to a request stops it being served".
      #
      # That is also why the free sweep above cannot answer this. Every arm
      # there named no model, so every arm died in the deployment router with
      # `400 Missed model deployment` before reaching whatever refuses the
      # runtime. Its empty `properties_that_closed_the_gate` was the instrument
      # failing to see, not a finding that nothing closes the gate.
      #
      # Nine arms, isolated rather than cumulative, one request each, no retry.
      # The first arm is the served request unchanged; if it is not served this
      # run, the other eight are not sent, because they would be measured
      # against nothing and they are not free. Ceilings live in the script so a
      # dispatch cannot widen them; pinned by
      # batch-runner/tests/test_codex_closing_sweep.py.
      - name: Add what Codex adds, one property at a time
        id: closing_sweep
        if: ${{ inputs.send_closing_sweep && steps.pinned.outputs.confirmed == 'yes' }}
        working-directory: batch-runner
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          # `|| true` as above: an arm being refused is the finding. The
          # verdict is read out of the file, so a missing file still fails.
          python3 scripts/diagnose_codex_foundry_connection.py \
            --deployment "${DEPLOYMENT}" \
            --closing-sweep \
            --out /tmp/codex-foundry-closing-sweep.json || true
          test -s /tmp/codex-foundry-closing-sweep.json
          python3 - <<'PY'
          import json
          import sys

          record = json.load(open("/tmp/codex-foundry-closing-sweep.json"))
          print("token minted:", record["token"]["minted"])
          print("requests planned:", record["requests_planned"],
                "sent:", record["requests_sent"])
          for arm in record["arms"]:
              usage = arm.get("usage") or {}
              print(f"  {arm['arm']}: status={arm.get('status')}"
                    f" in={usage.get('input_tokens')}"
                    f" out={usage.get('output_tokens')}"
                    f" pricing={usage.get('pricing')}")
          closed = record["properties_that_closed_the_gate"]
          print("closed the gate:", ", ".join(closed) if closed else "nothing")
          print("verdict:", record["verdict"])
          print("what that means:", record["verdict_note"])

          if not record["token"]["minted"]:
              print("::error::the token could not be minted, so nothing was "
                    "sent and this run measures nothing about the resource.")
              sys.exit(1)

          # Paid, and nine arms rather than one, so the count on the wire
          # matters more here than anywhere else in this file.
          if record["requests_sent"] > record["requests_planned"]:
              print(f"::error::planned {record['requests_planned']} request(s) "
                    f"and sent {record['requests_sent']}.")
              sys.exit(1)
          PY

      #
      # Two conditions, not one. `inputs.send_request` is the person's
      # intention; `steps.pinned.outputs.confirmed` is the machine's evidence
      # that the intention is about the right resource. Intention alone used to
      # be enough, which meant an empty fingerprint bought a paid call.
      - name: Send the one turn
        if: ${{ inputs.send_request && steps.pinned.outputs.confirmed == 'yes' }}
        working-directory: batch-runner
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          # `|| true` because a refusal is a finding, not a broken job: the
          # script exits non-zero for every verdict except `connected`, and
          # stopping here would throw away the record that says which refusal
          # it was. The verdict is read out of the file below.
          python3 scripts/diagnose_codex_foundry_connection.py \
            --deployment "${DEPLOYMENT}" \
            --send-request \
            --out /tmp/codex-foundry-connection.json || true
          test -s /tmp/codex-foundry-connection.json

      # A grep, not a promise. The redaction is the script's job; this is the
      # check that it did it. Run against whichever record exists, and the
      # endpoint is read from the secret here purely to search for it — it is
      # never echoed, only counted.
      - name: Confirm the record names no resource and carries no token
        id: leak_check
        if: always()
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          from urllib.parse import urlsplit

          leaked = []
          checked = 0
          endpoint = os.environ.get("FOUNDRY_PROJECT_ENDPOINT", "").strip()
          needles = []
          if endpoint:
              parsed = urlsplit(endpoint)
              host = parsed.netloc.split(":", 1)[0]
              needles.append(host)
              needles.append(host.split(".", 1)[0])
              parts = [p for p in parsed.path.split("/") if p]
              if len(parts) >= 2 and parts[-2] == "projects":
                  needles.append(parts[-1])
          needles = [n for n in needles if len(n) >= 4]

          # Exactly one URL belongs in a clean record: the Entra scope the
          # token is asked for. It is the same string for every tenant, carries
          # no account, project, region or subscription, and is already in this
          # public repository's source. Read it out of that source rather than
          # writing it here, so that a future edit pointing the scope at
          # something resource-specific makes this check fail instead of
          # teaching it a new exception. Any other URL is still fatal.
          #
          # The rule this replaces was "any URL at all", which fired on that
          # constant and stopped a run that had leaked nothing. A guard that
          # cries wolf is a guard someone reaches past.
          scope_source = "batch-runner/core/azure_ai_clients.py"
          try:
              scope_text = open(scope_source, encoding="utf-8").read()
          except OSError as exc:
              print(f"FATAL: cannot read {scope_source}: {exc}")
              print("       refusing to decide what a URL means without it")
              sys.exit(1)
          found_scope = re.search(
              r'^DIRECT_TOKEN_SCOPE\s*=\s*"([^"]+)"', scope_text, re.M
          )
          if found_scope is None:
              print(f"FATAL: no DIRECT_TOKEN_SCOPE in {scope_source}")
              print("       the allowed URL cannot be established, so none is allowed")
              sys.exit(1)
          allowed_url = found_scope.group(1)

          for path in (
              "/tmp/codex-foundry-plan.json",
              "/tmp/codex-foundry-readonly.json",
              "/tmp/codex-foundry-auth-discriminator.json",
              "/tmp/codex-foundry-transmission-sweep.json",
              "/tmp/codex-foundry-valid-request.json",
              "/tmp/codex-foundry-closing-sweep.json",
              "/tmp/codex-foundry-connection.json",
          ):
              if not os.path.exists(path):
                  continue
              checked += 1
              text = open(path, encoding="utf-8").read()
              lowered = text.lower()
              for needle in needles:
                  if needle.lower() in lowered:
                      leaked.append(f"{path}: names the resource")
              if re.search(r"\bey[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}", text):
                  leaked.append(f"{path}: contains something token-shaped")
              for found in set(re.findall(r"""https?://[^\s"'\\]+""", text)):
                  if found != allowed_url:
                      leaked.append(
                          f"{path}: contains a URL that is not the public token scope"
                      )
              record = json.loads(text)
              # Six record shapes now land here and they do not share a
              # check, so every one of them is matched by name and an
              # unrecognised schema is fatal. The previous shape -- three
              # prefixes and the turn record as the `else` -- was right about
              # failing closed and it did fail closed once, for real, on the
              # sweep record. But it failed by `KeyError` inside the turn
              # branch, which is a crash that happens to be safe rather than a
              # check that refuses. The valid-request record would have hit the
              # same branch and is worse: it is the *paid* one, so the run that
              # crashes here is the run that already spent the money and then
              # throws the evidence away. Named branches, explicit `else`.
              schema = str(record.get("schema", ""))
              if schema.startswith((
                  "codex_foundry_readonly_probe/",
                  "codex_foundry_auth_discriminator/",
                  "codex_foundry_transmission_sweep/",
              )):
                  if record["inference_requested"] is not False:
                      leaked.append(f"{path}: a free-probe record claims a request was made")
              elif schema.startswith("codex_foundry_valid_request/"):
                  # The reverse check. This probe does buy inference, and the
                  # field is how a reader tells a paid record from a free one.
                  # A `false` here would hide a real request inside the cheap
                  # branch, so `true` is required rather than merely allowed.
                  if record["inference_requested"] is not True:
                      leaked.append(f"{path}: a paid probe's record denies sending a request")
                  if record["requests_sent"] > record["requests_planned"]:
                      leaked.append(f"{path}: sent more requests than it planned")
              elif schema.startswith("codex_foundry_closing_sweep/"):
                  # Paid too, and the same two rules — but its own branch
                  # rather than a shared prefix tuple, because the two records
                  # differ in shape (`arms`, not `attempt`) and a branch that
                  # covers both would have to stop reading either. This one
                  # sends nine, so the planned-versus-sent rule is the one that
                  # matters most in the file.
                  if record["inference_requested"] is not True:
                      leaked.append(f"{path}: a paid probe's record denies sending a request")
                  if record["requests_sent"] > record["requests_planned"]:
                      leaked.append(f"{path}: sent more requests than it planned")
              elif schema.startswith("codex_foundry_connection/"):
                  if record["observed"]["tool_execution_observed"] is not False:
                      leaked.append(f"{path}: claims tool execution, which this probe cannot observe")
              else:
                  leaked.append(
                      f"{path}: schema {schema!r} has no check here, so nothing "
                      f"vouched for this record"
                  )

          if leaked:
              print("FATAL:")
              for item in sorted(set(leaked)):
                  print(" -", item)
              sys.exit(1)
          if checked == 0:
              # This step runs on failure too. Saying "clean" about nothing
              # would read as a pass for a check that never happened.
              print("no record exists to check; the run stopped before one was written")
          else:
              print(f"record=clean ({checked} checked)")
          PY

      # Not `always()`. A record this job's own check rejected is the one
      # record that must not be published: this repository is public, so an
      # artifact is world-readable from the moment it exists, and deleting it
      # afterwards is a different fact from never having uploaded it.
      #
      # `== 'success'` rather than `!= 'failure'`, so that a check which never
      # ran does not read as a check that passed. The check is itself
      # `always()`, so it succeeds whenever it found a clean record — including
      # when an earlier step failed, which is when the record is most worth
      # keeping.
      - name: Keep the record
        if: always() && steps.leak_check.conclusion == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-foundry-connection
          path: |
            /tmp/codex-foundry-plan.json
            /tmp/codex-foundry-readonly.json
            /tmp/codex-foundry-auth-discriminator.json
            /tmp/codex-foundry-transmission-sweep.json
            /tmp/codex-foundry-valid-request.json
            /tmp/codex-foundry-closing-sweep.json
            /tmp/codex-foundry-connection.json
          if-no-files-found: warn
          retention-days: 90

      - name: Say that the record was withheld
        if: always() && steps.leak_check.conclusion != 'success'
        run: |
          set -euo pipefail
          {
            echo "### The record was not published"
            echo ""
            echo "The redaction check did not pass it, so \`Keep the record\`"
            echo "was skipped. The record exists only on the runner and goes"
            echo "away with it. Read the check's output above for what it"
            echo "found — it names the kind of thing, never the thing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          RECORD=/tmp/codex-foundry-connection.json
          [ -s "$RECORD" ] || RECORD=/tmp/codex-foundry-plan.json
          VERDICT="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict'])" "$RECORD" 2>/dev/null || echo 'not measured')"
          ANSWERED="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['provider_answered'])" "$RECORD" 2>/dev/null || echo 'unknown')"
          RO=/tmp/codex-foundry-readonly.json
          RO_STATUS="$(python3 -c "import json,sys;print((json.load(open(sys.argv[1])).get('listing') or {}).get('status'))" "$RO" 2>/dev/null || echo 'not measured')"
          RO_MINTED="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['token']['minted'])" "$RO" 2>/dev/null || echo 'unknown')"
          RO_LISTED="$(python3 -c "import json,sys;print((json.load(open(sys.argv[1])).get('listing') or {}).get('deployment_listed'))" "$RO" 2>/dev/null || echo 'unknown')"
          AD=/tmp/codex-foundry-auth-discriminator.json
          AD_VERDICT="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict'])" "$AD" 2>/dev/null || echo 'not measured')"
          AD_NOTE="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict_note'])" "$AD" 2>/dev/null || echo 'not measured')"
          AD_MINTED="$(python3 -c "import json,sys;print((json.load(open(sys.argv[1]))['arms']['minted_bearer'] or {}).get('status'))" "$AD" 2>/dev/null || echo 'unknown')"
          AD_CONTROL="$(python3 -c "import json,sys;print((json.load(open(sys.argv[1]))['arms']['invalid_bearer_control'] or {}).get('status'))" "$AD" 2>/dev/null || echo 'unknown')"
          AD_SAME="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['same_message_as_control'])" "$AD" 2>/dev/null || echo 'unknown')"
          TS=/tmp/codex-foundry-transmission-sweep.json
          TS_VERDICT="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict'])" "$TS" 2>/dev/null || echo 'not measured')"
          TS_NOTE="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict_note'])" "$TS" 2>/dev/null || echo 'not measured')"
          TS_SENT="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['requests_sent'])" "$TS" 2>/dev/null || echo 'unknown')"
          TS_PLANNED="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['requests_planned'])" "$TS" 2>/dev/null || echo 'unknown')"
          TS_BASELINE="$(python3 -c "import json,sys;print((json.load(open(sys.argv[1]))['arms'].get('baseline') or {}).get('status'))" "$TS" 2>/dev/null || echo 'unknown')"
          # An empty list prints as nothing and would read as "not measured".
          # It is also not "nothing closes the gate": every arm here names no
          # model, so every arm dies in the deployment router before reaching
          # whatever refuses the runtime. Say which of the two this is.
          TS_CLOSED="$(python3 -c "import json,sys;v=json.load(open(sys.argv[1]))['properties_that_closed_the_gate'];print(', '.join(v) if v else 'none — but see below; this probe cannot see that far')" "$TS" 2>/dev/null || echo 'not measured')"
          VR=/tmp/codex-foundry-valid-request.json
          VR_VERDICT="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict'])" "$VR" 2>/dev/null || echo 'not measured')"
          VR_NOTE="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict_note'])" "$VR" 2>/dev/null || echo 'not measured')"
          VR_STATUS="$(python3 -c "import json,sys;print((json.load(open(sys.argv[1]))['attempt'] or {}).get('status'))" "$VR" 2>/dev/null || echo 'unknown')"
          # Whether text came back, not the text itself. The answer is in the
          # artifact; a model's words do not belong in a job summary.
          VR_TEXT="$(python3 -c "import json,sys;print(bool((json.load(open(sys.argv[1]))['attempt'] or {}).get('answer')))" "$VR" 2>/dev/null || echo 'unknown')"
          VR_SENT="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['requests_sent'])" "$VR" 2>/dev/null || echo 'unknown')"
          VR_PRICING="$(python3 -c "import json,sys;print((((json.load(open(sys.argv[1]))['attempt'] or {}).get('usage')) or {}).get('pricing'))" "$VR" 2>/dev/null || echo 'unknown')"
          VR_IN="$(python3 -c "import json,sys;print((((json.load(open(sys.argv[1]))['attempt'] or {}).get('usage')) or {}).get('input_tokens'))" "$VR" 2>/dev/null || echo 'unknown')"
          VR_OUT="$(python3 -c "import json,sys;print((((json.load(open(sys.argv[1]))['attempt'] or {}).get('usage')) or {}).get('output_tokens'))" "$VR" 2>/dev/null || echo 'unknown')"
          CS=/tmp/codex-foundry-closing-sweep.json
          CS_VERDICT="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict'])" "$CS" 2>/dev/null || echo 'not measured')"
          CS_NOTE="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict_note'])" "$CS" 2>/dev/null || echo 'not measured')"
          CS_SENT="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['requests_sent'])" "$CS" 2>/dev/null || echo 'unknown')"
          CS_PLANNED="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['requests_planned'])" "$CS" 2>/dev/null || echo 'unknown')"
          CS_BASELINE="$(python3 -c "import json,sys;a={x['arm']:x for x in json.load(open(sys.argv[1]))['arms']};print((a.get('baseline') or {}).get('status'))" "$CS" 2>/dev/null || echo 'unknown')"
          # An empty list prints as nothing, which would read as "not measured".
          CS_CLOSED="$(python3 -c "import json,sys;v=json.load(open(sys.argv[1]))['properties_that_closed_the_gate'];print(', '.join(v) if v else 'none — nothing closed it')" "$CS" 2>/dev/null || echo 'not measured')"
          # Every arm's status on one line, so a reader sees the shape of the
          # result rather than only the verdict drawn from it.
          CS_ARMS="$(python3 -c "import json,sys;print(' / '.join(f\"{x['arm']}=\" + str(x.get('status')) for x in json.load(open(sys.argv[1]))['arms']))" "$CS" 2>/dev/null || echo 'not measured')"
          CS_IN="$(python3 -c "import json,sys;v=[(x.get('usage') or {}).get('input_tokens') for x in json.load(open(sys.argv[1]))['arms']];print(sum(n for n in v if n) if any(n for n in v) else 'none reported')" "$CS" 2>/dev/null || echo 'unknown')"
          CS_OUT="$(python3 -c "import json,sys;v=[(x.get('usage') or {}).get('output_tokens') for x in json.load(open(sys.argv[1]))['arms']];print(sum(n for n in v if n) if any(n for n in v) else 'none reported')" "$CS" 2>/dev/null || echo 'unknown')"
          {
            echo "### Codex → Foundry, one turn"
            echo ""
            echo "- verdict: \`${VERDICT}\`"
            echo "- did the provider answer at all: \`${ANSWERED}\`"
            echo "- request sent: \`${{ inputs.send_request }}\`"
            echo "- tool *execution* observed: \`false\` — the prompt forbids running any, and none ran"
            echo "- tool *definitions sent*: \`10\`, with \`tool_choice: auto\` — the runtime attaches these to every turn and no prompt wording or config key removes them; measured offline by \`batch-runner/tests/test_what_one_codex_turn_actually_sends.py\`"
            echo ""
            echo "### 무과금 읽기 전용 확인 (턴 없음)"
            echo ""
            echo "- 자식 프로세스가 토큰을 만들었는가: \`${RO_MINTED}\`"
            echo "- 목록 조회 응답: \`${RO_STATUS}\`"
            echo "- 물어본 배포가 목록에 있는가: \`${RO_LISTED}\`"
            echo ""
            echo "이 세 줄이 뜻하는 것: 프롬프트도 생성도 없이, Codex가 쓰는 것과"
            echo "**같은 방법으로 토큰을 만들어** 같은 주소에 모델 목록만"
            echo "물어본 결과입니다. \`200\`이면 이 자원이 이 신원의 토큰을"
            echo "받아준다는 뜻이므로, 턴이 거절됐다면 원인은 신원보다 더 좁은"
            echo "곳에 있습니다. \`401\`이면 **돈 한 푼 안 쓰고** 같은 거절을"
            echo "재현한 것이고, 문제는 토큰 자체입니다. 배포가 목록에"
            echo "\`False\`로 없으면 그 이름이 이 자원에 없다는 뜻입니다."
            echo "다만 목록이 열린다고 해서 **호출이 허용된다는 뜻은 아닙니다.**"
            echo ""
            echo "### 무과금 문지기 순서 확인 (턴 없음)"
            echo ""
            echo "- 진짜로 만든 토큰으로 보냈을 때: \`${AD_MINTED}\`"
            echo "- **토큰이 아닌 문장**으로 보냈을 때: \`${AD_CONTROL}\`"
            echo "- 두 거절 문구가 똑같은가: \`${AD_SAME}\`"
            echo "- 판정: \`${AD_VERDICT}\`"
            echo "- 뜻: ${AD_NOTE}"
            echo ""
            echo "이게 무엇을 한 것인지: 답을 만들어 낼 수 **없는 본문**(모델"
            echo "이름이 아예 없는 요청)을 **턴이 가는 그 주소**로 두 번 보냈습니다."
            echo "한 번은 Codex가 만들 토큰으로, 한 번은 **누가 봐도 토큰이 아닌**"
            echo "고정 문장으로요. 왜 두 번이냐면, 한 번만 보내면 읽을 수가"
            echo "없기 때문입니다 — \`400\`이 왔다고 해서 \"토큰은 통과했다\"고"
            echo "말하려면 **이 호스트가 본문보다 인증을 먼저 본다**는 게 먼저"
            echo "확인돼야 하는데, 지금까지 그걸 잰 적이 없습니다."
            echo ""
            echo "- 토큰 아닌 문장이 \`401\`/\`403\`으로 막혔고 진짜 토큰은"
            echo "  \`400\`/\`422\`까지 갔다면 → 인증을 먼저 보는 호스트이고,"
            echo "  진짜 토큰은 그 문을 **통과했습니다.** 턴의 401은 문 **뒤쪽**"
            echo "  문제입니다."
            echo "- 둘 다 \`401\`/\`403\`이면 → 진짜 토큰이 **가짜 문장과 같은"
            echo "  자리에서** 막힌 것이고, 문제는 토큰 또는 이 신원의 권한입니다."
            echo "- 토큰 아닌 문장이 \`401\`/\`403\`이 **아니면** → 이 호스트는"
            echo "  본문을 먼저 봅니다. 그러면 진짜 토큰 쪽 숫자는 인증에 대해"
