name: Run GDPVal Batch Experiment

# This workflow can only be triggered manually from the GitHub Actions tab.
# Only users with repo write access can run it → security enforced automatically.
on:
  workflow_dispatch:
    inputs:
      experiment_yaml:
        description: 'Experiment YAML filename (without .yaml extension, e.g., "exp998_smoke_baseline_sample")'
        required: true
        type: string
      experiment_name:
        description: 'Experiment name (optional - will auto-extract from YAML if empty)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (skip Step 5 validation, final HF upload, and PR creation)'
        required: false
        type: boolean
        default: false
      relay_run:
        description: 'Relay run number (0=initial, 1+=continuation). Auto-set by retrigger.'
        required: false
        type: number
        default: 0
      relay_lineage_id:
        description: 'Stable lineage ID forwarded across relay legs; leave empty on leg 0'
        required: false
        type: string
        default: ''
      source_sha:
        description: 'Initial main commit forwarded across relay legs; internal only, leave empty on leg 0'
        required: false
        type: string
        default: ''
      wall_timeout:
        description: 'condition_a Step 2 watchdog minutes, 0..290 (0=use execution.wall_timeout from YAML; disabled only when both are 0)'
        required: false
        type: number
        default: 290
      sandbox_image_digest:
        description: 'Pinned ghcr.io/...@sha256 digest forwarded across relay legs so every leg pulls the SAME immutable image. Leave empty on the manual leg 0 (it will be resolved automatically).'
        required: false
        type: string
        default: ''

permissions:
  contents: write        # to commit yaml results
  pull-requests: write   # to create PRs
  actions: write          # for relay self-retrigger (gh workflow run)
  id-token: write         # for Azure OIDC authentication
  packages: read          # to pull the sandbox image from GHCR (sandbox mode only)

env:
  PYTHON_VERSION: '3.11'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  inspect-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      uses_agentic: ${{ steps.mode.outputs.uses_agentic }}
    steps:
      - name: Verify dispatch contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WALL_TIMEOUT: ${{ inputs.wall_timeout }}
          RELAY_RUN: ${{ inputs.relay_run }}
          RELAY_LINEAGE_ID: ${{ inputs.relay_lineage_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SANDBOX_IMAGE_DIGEST: ${{ inputs.sandbox_image_digest }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$EVENT_REF" == "refs/heads/main" ]]
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WALL_TIMEOUT" =~ ^(0|[1-9][0-9]{0,2})$ ]]
          (( 10#$WALL_TIMEOUT <= 290 ))
          [[ "$RELAY_RUN" =~ ^(0|[1-9][0-9]?)$ ]]
          (( 10#$RELAY_RUN <= 10 ))
          if (( 10#$RELAY_RUN == 0 )); then
            [[ -z "$SOURCE_SHA" ]]
            [[ -z "$RELAY_LINEAGE_ID" ]]
            [[ -z "$SANDBOX_IMAGE_DIGEST" ]]
          else
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$SOURCE_SHA" == "$EVENT_SHA" ]]
            [[ "$RELAY_LINEAGE_ID" =~ ^[A-Za-z0-9._:-]{1,256}$ ]]
            if [[ -n "$SANDBOX_IMAGE_DIGEST" ]]; then
              [[ "$SANDBOX_IMAGE_DIGEST" =~ ^ghcr\.io/hyeonsangjeon/gdpval-sandbox@sha256:[0-9a-f]{64}$ ]]
            fi
          fi

      - name: Checkout config only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify exact config checkout
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Inspect execution mode without credentials
        id: mode
        env:
          EXPERIMENT_YAML: ${{ inputs.experiment_yaml }}
        run: |
          ruby <<'RUBY'
          require 'yaml'

          name = ENV.fetch('EXPERIMENT_YAML')
          valid_name = name.match?(/\A[A-Za-z0-9][A-Za-z0-9_.-]{0,99}\z/) &&
            !name.include?('..') && !name.end_with?('.', '.lock')
          abort('invalid experiment YAML name') unless valid_name
          path = File.join('batch-runner', 'experiments', "#{name}.yaml")
          abort("experiment YAML not found: #{path}") unless File.file?(path)
          config = YAML.safe_load(
            File.read(path), permitted_classes: [], permitted_symbols: [], aliases: false
          ) || {}
          abort('experiment YAML root must be a mapping') unless config.is_a?(Hash)
          abort('condition_b is unsupported in the general batch workflow') if config.key?('condition_b')
          execution = config.fetch('execution', {}) || {}
          abort('execution must be a mapping') unless execution.is_a?(Hash)
          sandbox = execution.fetch('sandbox', {}) || {}
          abort('execution.sandbox must be a mapping') unless sandbox.is_a?(Hash)
          uses_agentic = ['agentic_sandbox', 'agentic_sandbox_v2'].include?(
            execution['mode']
          ) || sandbox['hardened_substrate'] == true
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |output|
            output.puts("uses_agentic=#{uses_agentic}")
          end
          RUBY

  reject-agentic:
    needs: inspect-mode
    if: needs.inspect-mode.outputs.uses_agentic == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject agentic mode in general workflow
        run: |
          echo "FATAL: agentic and hardened baseline modes require the dedicated"
          echo "signed control/compute workflow. No credentialed job was started."
          exit 1

  batch-run:
    needs: inspect-mode
    if: needs.inspect-mode.outputs.uses_agentic != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360    # max 6 hours
    env:
      EXPERIMENT_YAML_INPUT: ${{ inputs.experiment_yaml }}
      EXPERIMENT_NAME_INPUT: ${{ inputs.experiment_name }}
      RELAY_RUN_INPUT: ${{ inputs.relay_run }}
      RELAY_LINEAGE_ID_INPUT: ${{ inputs.relay_lineage_id }}
      SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
      WALL_TIMEOUT_INPUT: ${{ inputs.wall_timeout }}
      DRY_RUN_INPUT: ${{ inputs.dry_run }}
      SANDBOX_IMAGE_DIGEST_INPUT: ${{ inputs.sandbox_image_digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify exact checkout
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ── System deps for native Python packages (pycairo/pygraphviz, etc.) ──
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libcairo2-dev \
            libffi-dev \
            graphviz \
            libgraphviz-dev

      - name: Install dependencies
        run: |
          pip install -r batch-runner/requirements.txt

      # ── Verify runtime environment ──
      - name: Verify runtime environment
        run: |
          echo "============================================"
          echo "🔍 Runtime Environment Check"
          echo "============================================"
          echo "🐍 Python: $(python3 --version)"
          echo "📦 pip: $(pip --version)"
          echo "🎬 ffmpeg: $(ffmpeg -version 2>&1 | head -1)"
          echo "📄 LibreOffice: $(libreoffice --version 2>/dev/null || echo 'not installed (expected for baseline)')"
          echo "🔤 Noto Sans: $(fc-list 2>/dev/null | grep -c 'Noto Sans') fonts found"
          echo "💾 Disk: $(df -h / | tail -1 | awk '{print $4}') available"
          echo "🧠 Memory: $(free -m | grep Mem | awk '{print $2}')MB total, $(free -m | grep Mem | awk '{print $7}')MB available"
          echo "💾 Swap: $(free -m | grep Swap | awk '{print $2}')MB total"
          echo "🔒 Subprocess memory limit: ${SUBPROCESS_MEMORY_GB:-5}GB"
          echo "============================================"

      # ── Validation: Check YAML file exists ──
      - name: Validate experiment YAML exists
        run: |
          YAML_FILE="batch-runner/experiments/${EXPERIMENT_YAML_INPUT}.yaml"
          if [ ! -f "$YAML_FILE" ]; then
            echo "❌ Error: $YAML_FILE not found"
            exit 1
          fi
          echo "✅ Found: $YAML_FILE"

      - name: Validate full experiment config
        run: |
          cd batch-runner
          python3 <<'PY'
          import json
          import os

          from core.experiment_config import ExperimentConfig

          path = f"experiments/{os.environ['EXPERIMENT_YAML_INPUT']}.yaml"
          config = ExperimentConfig.from_yaml(path)
          errors = config.validate()
          if errors:
              raise SystemExit("Invalid experiment config: " + "; ".join(errors))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"EXPERIMENT_ID={config.experiment_id}\n")
          print(f"Full experiment config valid: {config.experiment_id}")
          PY

      # ── Extract experiment_name from YAML if not provided ──
      - name: Extract experiment name from YAML
        run: |
          python3 <<'PY'
          import os
          import pathlib
          import yaml

          path = pathlib.Path("batch-runner/experiments") / (
              os.environ["EXPERIMENT_YAML_INPUT"] + ".yaml"
          )
          supplied = os.environ.get("EXPERIMENT_NAME_INPUT", "")
          config = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
          name = supplied or (config.get("experiment") or {}).get("name", "")
          if (
              not isinstance(name, str)
              or not name.strip()
              or len(name) > 200
              or any(ord(character) < 32 for character in name)
          ):
              raise SystemExit("ERROR: experiment name is invalid")
          name = name.strip()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"experiment_name={name}\n")
          print(f"Experiment: {name}")
          PY

      # ── Conditional: LibreOffice + Noto Sans fonts ──
      - name: Read experiment config flags
        id: read_config
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys
          import yaml

          sys.path.insert(0, "batch-runner")
          from core.azure_ai_clients import (
            AzureAIWorkload,
            inference_route_workloads,
          )
          from core.experiment_config import ExperimentConfig
          from core.repository_identity import validate_hf_dataset_repo_id

          path = pathlib.Path("batch-runner/experiments") / (
            os.environ["EXPERIMENT_YAML_INPUT"] + ".yaml"
          )
          config = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
          parsed_config = ExperimentConfig.from_dict(config)
          validation_errors = parsed_config.validate()
          if validation_errors:
            raise SystemExit(
              "invalid experiment config: " + "; ".join(validation_errors)
            )
          execution = config.get("execution") or {}
          sandbox = execution.get("sandbox") or {}
          if not isinstance(execution, dict) or not isinstance(sandbox, dict):
            raise SystemExit("execution and execution.sandbox must be mappings")
          source_repo = validate_hf_dataset_repo_id(
            (config.get("data") or {}).get("source")
          )
          image = sandbox.get("image") or "gdpval-sandbox:latest"
          if not isinstance(image, str) or not re.fullmatch(
            r"[A-Za-z0-9][A-Za-z0-9._/@:-]{0,299}", image
          ):
            raise SystemExit("sandbox image reference is invalid")
          wall_timeout = execution.get("wall_timeout", 0)
          relay_max_runs = execution.get("relay_max_runs", 3)
          if type(wall_timeout) is not int or not 0 <= wall_timeout <= 290:
            raise SystemExit("execution.wall_timeout is invalid")
          if type(relay_max_runs) is not int or not 0 <= relay_max_runs <= 10:
            raise SystemExit("execution.relay_max_runs is invalid")
          mode = execution.get("mode")
          hardened = sandbox.get("hardened_substrate") is True

          def model_identity(condition_name):
            condition = config.get(condition_name)
            if condition is None:
              return "", ""
            if not isinstance(condition, dict):
              raise SystemExit(f"{condition_name} must be a mapping")
            model = condition.get("model") or {}
            if not isinstance(model, dict):
              raise SystemExit(f"{condition_name}.model must be a mapping")
            provider = model.get("provider", "azure")
            deployment = model.get("deployment", "")
            if provider in {"azure", "azure_openai"} and (
              not isinstance(deployment, str) or not deployment
            ):
              raise SystemExit(
                f"{condition_name}.model.deployment is required for Azure"
              )
            return str(provider), str(deployment)

          condition_a_provider, condition_a_deployment = model_identity(
            "condition_a"
          )
          condition_b_provider, condition_b_deployment = model_identity(
            "condition_b"
          )
          provider_requirements = set()
          for condition in (
            parsed_config.condition_a,
            parsed_config.condition_b,
          ):
            if condition is None:
              continue
            provider_requirements.add(condition.model.provider)
            for preprocessor in condition.preprocessors or []:
              provider_requirements.add(preprocessor["model"]["provider"])
          azure_workloads = [(AzureAIWorkload.NARRATIVE, "gpt-5.6-sol")]
          for condition_name in ("condition_a", "condition_b"):
            condition = config.get(condition_name)
            if condition is not None:
              azure_workloads.extend(
                inference_route_workloads(condition, str(mode or "subprocess"))
              )
          values = {
            "install_libreoffice": str(
              execution.get("install_libreoffice") is True
            ),
            "wall_timeout": str(wall_timeout),
            "relay_max_runs": str(relay_max_runs),
            "source_repo": source_repo,
            "uses_sandbox": str(mode == "sandbox").lower(),
            "sandbox_image": image,
            "uses_agentic": str(
              mode in {"agentic_sandbox", "agentic_sandbox_v2"} or hardened
            ).lower(),
            "uses_code_interpreter": str(
              mode == "code_interpreter"
            ).lower(),
            "condition_a_provider": condition_a_provider,
            "condition_a_deployment": condition_a_deployment,
            "condition_b_provider": condition_b_provider,
            "condition_b_deployment": condition_b_deployment,
            "requires_openai_key": str(
              "openai" in provider_requirements
            ).lower(),
            "requires_anthropic_key": str(
              "anthropic" in provider_requirements
            ).lower(),
            "azure_ai_workloads_json": json.dumps([
              f"{workload.value}={deployment}"
              for workload, deployment in azure_workloads
            ], separators=(",", ":")),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            for key, value in values.items():
              output.write(f"{key}={value}\n")
          PY

      - name: 'Block agentic modes in credentialed general workflow'
        if: steps.read_config.outputs.uses_agentic == 'true'
        run: |
          echo "FATAL: agentic sandbox modes and the hardened paired baseline are not"
          echo "authorized in batch-run.yml. This workflow co-locates Docker,"
          echo "Azure/HF credentials, relay, narrative, and upload permissions."
          echo "Use the dedicated signed compute/control workflow only after the"
          echo "paid gate is merged. No model client or cloud credential was used."
          exit 1

      - name: Validate Azure OIDC identity before remote access
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_AI_EXPECTED_CLIENT_ID: ${{ vars.AZURE_AI_EXPECTED_CLIENT_ID }}
          AZURE_AI_EXPECTED_TENANT_ID: ${{ vars.AZURE_AI_EXPECTED_TENANT_ID }}
          AZURE_AI_EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_AI_EXPECTED_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          cd batch-runner
          python3 scripts/azure_oidc_identity_preflight.py

      - name: Validate Azure AI routes before remote writes
        env:
          AZURE_AI_ROUTE_PROFILE: ${{ steps.read_config.outputs.uses_code_interpreter == 'true' && 'project-ci' || 'direct-v1' }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_AI_REQUIRE_EXPECTED_IDENTITIES: '1'
          AZURE_AI_EXPECTED_DIRECT_ACCOUNT: ${{ vars.AZURE_AI_EXPECTED_DIRECT_ACCOUNT }}
          AZURE_AI_EXPECTED_PROJECT_ACCOUNT: ${{ vars.AZURE_AI_EXPECTED_PROJECT_ACCOUNT }}
          AZURE_AI_EXPECTED_PROJECT_NAME: ${{ vars.AZURE_AI_EXPECTED_PROJECT_NAME }}
          AZURE_AI_WORKLOADS_JSON: ${{ steps.read_config.outputs.azure_ai_workloads_json }}
        run: |
          set -euo pipefail
          cd batch-runner
          python3 scripts/azure_ai_route_preflight.py

      - name: Install LibreOffice & Noto Sans fonts
        if: steps.read_config.outputs.install_libreoffice == 'True'
        run: |
          echo "📦 Installing LibreOffice (headless) + Noto Sans fonts + system deps..."
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libreoffice-core \
            libreoffice-calc \
            libreoffice-impress \
            libreoffice-writer \
            fonts-noto-core \
            fonts-noto-cjk \
            ffmpeg \
            libsndfile1 \
            tesseract-ocr \
            poppler-utils \
            wkhtmltopdf \
            ghostscript \
            graphviz libgraphviz-dev \
            libzbar0 \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev \
            libgl1 libglib2.0-0
          fc-cache -fv
          echo "✅ LibreOffice version:"
          libreoffice --version
          echo "✅ Noto Sans available:"
          fc-list | grep -i "Noto Sans" | head -5
          echo "✅ ffmpeg:"
          ffmpeg -version 2>&1 | head -1
          echo "✅ tesseract:"
          tesseract --version 2>&1 | head -1
          echo "✅ graphviz:"
          dot -V 2>&1

      # ── Relay: Restore checkpoint from previous run ──
      - name: 'Restore checkpoint (relay run)'
        id: restore_checkpoint
        if: inputs.relay_run > 0
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_REPO: ${{ steps.read_config.outputs.source_repo }}
        run: |
          set -euo pipefail
          cd batch-runner
          echo "Relay run #${RELAY_RUN_INPUT}: Restoring checkpoint..."
          python3 scripts/relay_checkpoint.py restore \
            --repo-id "$SOURCE_REPO" \
            --source-sha "$SOURCE_SHA_INPUT" \
            --lineage-id "$RELAY_LINEAGE_ID_INPUT" \
            --sandbox-image-digest "$SANDBOX_IMAGE_DIGEST_INPUT"
          RESTORED_GENERATION=$(<workspace/relay_checkpoint_generation)
          [[ "$RESTORED_GENERATION" =~ ^[0-9a-f]{64}$ ]]
          printf 'generation=%s\n' "$RESTORED_GENERATION" >> "$GITHUB_OUTPUT"

      # ── Step 0: Bootstrap ──
      - name: 'Step 0: Bootstrap submission repo'
        id: step0
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_REPO: ${{ steps.read_config.outputs.source_repo }}
        run: |
          cd batch-runner
          bash step0_bootstrap.sh "experiments/${EXPERIMENT_YAML_INPUT}.yaml"
          python3 <<'PY'
          import os

          from core.config import DEFAULT_LOCAL_PATH
          from core.repo_bootstrapper import (
              TARGET_HEAD_FILENAME,
              load_target_head_identity,
          )

          head = load_target_head_identity(
              DEFAULT_LOCAL_PATH / TARGET_HEAD_FILENAME,
              os.environ["SOURCE_REPO"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"target_head={head}\n")
          PY

      - name: 'Verify result dataset write access'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_REPO: ${{ steps.read_config.outputs.source_repo }}
        run: |
          set -euo pipefail
          cd batch-runner
          python3 scripts/relay_checkpoint.py verify-write --repo-id "$SOURCE_REPO"

      # ── Step 1: Prepare Tasks ──
      - name: 'Step 1: Prepare tasks'
        env:
          GDPVAL_RELAY_LINEAGE_ID: ${{ inputs.relay_lineage_id }}
        run: |
          cd batch-runner
          bash step1_prepare_tasks.sh "experiments/${EXPERIMENT_YAML_INPUT}.yaml"

      - name: 'Validate restored checkpoint identity'
        if: inputs.relay_run > 0
        env:
          GDPVAL_RELAY_LINEAGE_ID: ${{ inputs.relay_lineage_id }}
          AZURE_AI_ROUTE_PROFILE: ${{ steps.read_config.outputs.uses_code_interpreter == 'true' && 'project-ci' || 'direct-v1' }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_AI_REQUIRE_EXPECTED_IDENTITIES: '1'
          AZURE_AI_EXPECTED_DIRECT_ACCOUNT: ${{ vars.AZURE_AI_EXPECTED_DIRECT_ACCOUNT }}
          AZURE_AI_EXPECTED_PROJECT_ACCOUNT: ${{ vars.AZURE_AI_EXPECTED_PROJECT_ACCOUNT }}
          AZURE_AI_EXPECTED_PROJECT_NAME: ${{ vars.AZURE_AI_EXPECTED_PROJECT_NAME }}
          AZURE_AI_WORKLOADS_JSON: ${{ steps.read_config.outputs.azure_ai_workloads_json }}
        run: |
          set -euo pipefail
          cd batch-runner
          python3 step2_run_inference.py \
            --condition condition_a \
            --validate-checkpoint-only

      # ── Sandbox: pull the prebuilt image from GHCR & verify (sandbox mode only) ──
      # Runs ONLY for execution.mode: sandbox experiments; baselines skip it
      # entirely (strict NO-OP). NOT continue-on-error on purpose: if the image
      # cannot be made available we abort HERE, before any Azure login or model
      # spend, rather than silently falling back to slow/unhardened local exec.
      - name: 'Sandbox: pull & verify image'
        id: sandbox_pull
        if: steps.read_config.outputs.uses_sandbox == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          RETAG_TARGET: ${{ steps.read_config.outputs.sandbox_image }}
        run: |
          set -euo pipefail
          IMAGE_REPO="ghcr.io/hyeonsangjeon/gdpval-sandbox"

          echo "🔐 Logging in to GHCR..."
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

          # Resolve to an IMMUTABLE digest so every relay leg pulls the exact
          # same image. Pinning the digest across legs prevents mid-run :latest
          # drift (a rebuild between legs) from corrupting a single experiment.
          if [ -n "$SANDBOX_IMAGE_DIGEST_INPUT" ]; then
            RESOLVED_DIGEST="$SANDBOX_IMAGE_DIGEST_INPUT"
            echo "📌 Using pinned digest forwarded from a previous relay leg: $RESOLVED_DIGEST"
          else
            echo "🔎 Resolving ${IMAGE_REPO}:latest to an immutable digest..."
            DIGEST=$(docker buildx imagetools inspect "${IMAGE_REPO}:latest" --format '{{json .Manifest}}' | jq -r '.digest')
            if ! echo "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
              echo "FATAL: could not resolve an immutable digest for ${IMAGE_REPO}:latest (got '$DIGEST')"
              exit 1
            fi
            RESOLVED_DIGEST="${IMAGE_REPO}@${DIGEST}"
            echo "📌 Resolved digest: $RESOLVED_DIGEST"
          fi

          echo "⬇️  Pulling $RESOLVED_DIGEST ..."
          docker pull "$RESOLVED_DIGEST"

          # Retag to the name core/sandbox_runner.py actually looks for. The
          # config image (execution.sandbox.image) WINS over the SANDBOX_IMAGE
          # env var (self.image = image or DEFAULT_SANDBOX_IMAGE), so exporting
          # an env var would be a silent no-op — we must retag to the config name.
          echo "🏷️  Retagging to runner-resolved name: $RETAG_TARGET"
          docker tag "$RESOLVED_DIGEST" "$RETAG_TARGET"

          # Loud fail BEFORE any model spend if the image is somehow unavailable.
          docker image inspect "$RETAG_TARGET" >/dev/null || { echo 'FATAL: sandbox image unavailable — aborting before any model spend'; exit 1; }

          # Expose the pinned digest so the relay step can forward it to the next
          # leg, keeping the whole experiment on one immutable image.
          echo "digest=$RESOLVED_DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### 🐳 Sandbox image ready"
            echo ""
            echo "- Pinned digest: \`$RESOLVED_DIGEST\`"
            echo "- Retagged as: \`$RETAG_TARGET\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Step 2a: Run Inference (condition_a) ──
      - name: 'Azure Login (OIDC)'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure OIDC session identity
        env:
          AZURE_AI_EXPECTED_CLIENT_ID: ${{ vars.AZURE_AI_EXPECTED_CLIENT_ID }}
          AZURE_AI_EXPECTED_TENANT_ID: ${{ vars.AZURE_AI_EXPECTED_TENANT_ID }}
          AZURE_AI_EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_AI_EXPECTED_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          cd batch-runner
          python3 scripts/azure_oidc_identity_preflight.py --verify-session

      - name: Verify Azure AI token before model calls
        env:
          AZURE_AI_ROUTE_PROFILE: ${{ steps.read_config.outputs.uses_code_interpreter == 'true' && 'project-ci' || 'direct-v1' }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_AI_REQUIRE_EXPECTED_IDENTITIES: '1'
          AZURE_AI_EXPECTED_DIRECT_ACCOUNT: ${{ vars.AZURE_AI_EXPECTED_DIRECT_ACCOUNT }}
          AZURE_AI_EXPECTED_PROJECT_ACCOUNT: ${{ vars.AZURE_AI_EXPECTED_PROJECT_ACCOUNT }}
          AZURE_AI_EXPECTED_PROJECT_NAME: ${{ vars.AZURE_AI_EXPECTED_PROJECT_NAME }}
          AZURE_AI_WORKLOADS_JSON: ${{ steps.read_config.outputs.azure_ai_workloads_json }}
        run: |
          set -euo pipefail
          cd batch-runner
          python3 scripts/azure_ai_route_preflight.py --verify-token

      - name: 'Step 2a: Run inference (condition_a)'
        id: step2a
        # Nominally 60min above the 290min watchdog. This is not guaranteed
        # handoff time: the watchdog is checked only between tasks, and the
        # job timeout also includes setup, bootstrap, checkpoint, and dispatch.
        timeout-minutes: 350
        env:
          GDPVAL_RELAY_LINEAGE_ID: ${{ inputs.relay_lineage_id }}
          CONFIG_WALL_TIMEOUT: ${{ steps.read_config.outputs.wall_timeout }}
          OPENAI_API_KEY: ${{ steps.read_config.outputs.requires_openai_key == 'true' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ steps.read_config.outputs.requires_anthropic_key == 'true' && secrets.ANTHROPIC_API_KEY || '' }}
          AZURE_AI_ROUTE_PROFILE: ${{ steps.read_config.outputs.uses_code_interpreter == 'true' && 'project-ci' || 'direct-v1' }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_AI_REQUIRE_EXPECTED_IDENTITIES: '1'
          AZURE_AI_EXPECTED_DIRECT_ACCOUNT: ${{ vars.AZURE_AI_EXPECTED_DIRECT_ACCOUNT }}
          AZURE_AI_EXPECTED_PROJECT_ACCOUNT: ${{ vars.AZURE_AI_EXPECTED_PROJECT_ACCOUNT }}
          AZURE_AI_EXPECTED_PROJECT_NAME: ${{ vars.AZURE_AI_EXPECTED_PROJECT_NAME }}
        run: |
          set +e
          cd batch-runner
          WALL_TIMEOUT="$WALL_TIMEOUT_INPUT"
          if ! [[ "$WALL_TIMEOUT" =~ ^[0-9]+$ ]]; then
            echo "WALL_TIMEOUT_INPUT is not a decimal integer."
            exit 1
          fi
          if ! [[ "$CONFIG_WALL_TIMEOUT" =~ ^[0-9]+$ ]]; then
            echo "execution.wall_timeout is not a decimal integer."
            exit 1
          fi
          if [[ "$WALL_TIMEOUT" == "0" ]]; then
            WALL_TIMEOUT="$CONFIG_WALL_TIMEOUT"
          fi
          if [[ "$WALL_TIMEOUT" != "0" ]]; then
            bash step2_run_inference.sh condition_a --wall-timeout "$WALL_TIMEOUT"
          else
            bash step2_run_inference.sh condition_a
          fi
          STEP2_EXIT_CODE=$?
          echo "exit_code=$STEP2_EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit "$STEP2_EXIT_CODE"
        continue-on-error: true

      # ── Check if relay is needed (exit code 42 = pending tasks) ──
      - name: 'Check relay status'
        id: check_relay
        env:
          STEP2_EXIT_CODE: ${{ steps.step2a.outputs.exit_code }}
        run: |
          set -euo pipefail
          cd batch-runner
          python3 scripts/relay_checkpoint.py status \
            --progress-path workspace/step2_inference_progress.json \
            --exit-code "$STEP2_EXIT_CODE" \
            --github-output "$GITHUB_OUTPUT"

      # ── Verify Step 2a success (fail if step failed AND not relay) ──
      - name: 'Verify Step 2a success'
        if: steps.check_relay.outputs.needs_relay != 'true' && steps.step2a.outcome != 'success'
        run: |
          echo "Step 2a failed (not a relay timeout). Check logs above."
          exit 1

      # ── Checkpoint: Upload progress to HuggingFace for relay ──
      - name: 'Checkpoint: Upload to HuggingFace'
        if: steps.check_relay.outputs.needs_relay == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_REPO: ${{ steps.read_config.outputs.source_repo }}
          SANDBOX_IMAGE_DIGEST: ${{ steps.sandbox_pull.outputs.digest }}
        run: |
          set -euo pipefail
          cd batch-runner
          SOURCE_SHA="$SOURCE_SHA_INPUT"
          if [[ -z "$SOURCE_SHA" ]]; then
            SOURCE_SHA="$GITHUB_SHA"
          fi
          python3 scripts/relay_checkpoint.py upload \
            --repo-id "$SOURCE_REPO" \
            --source-sha "$SOURCE_SHA" \
            --sandbox-image-digest "$SANDBOX_IMAGE_DIGEST"

      # ── Self-retrigger: Start relay run ──
      - name: 'Retrigger relay run'
        if: steps.check_relay.outputs.needs_relay == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned digest from the preflight (empty for non-sandbox runs, where
          # the pull step is skipped). Forwarding it keeps every relay leg on the
          # exact same immutable image.
          SANDBOX_IMAGE_DIGEST: ${{ steps.sandbox_pull.outputs.digest }}
        run: |
          NEXT_RELAY=$(( RELAY_RUN_INPUT + 1 ))
          MAX_RELAYS="${{ steps.read_config.outputs.relay_max_runs }}"

          if [ "$NEXT_RELAY" -gt "$MAX_RELAYS" ]; then
            echo "Max relay runs reached ($MAX_RELAYS). Manual intervention needed."
            exit 1
          fi

          echo "Triggering relay run #$NEXT_RELAY..."
          LINEAGE_ID="$RELAY_LINEAGE_ID_INPUT"
          if [[ -z "$LINEAGE_ID" ]]; then
            LINEAGE_ID="${EXPERIMENT_ID}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          fi
          SOURCE_SHA="$SOURCE_SHA_INPUT"
          if [[ -z "$SOURCE_SHA" ]]; then
            SOURCE_SHA="$GITHUB_SHA"
          fi
          gh workflow run batch-run.yml --ref main \
            -f experiment_yaml="$EXPERIMENT_YAML_INPUT" \
            -f experiment_name="$experiment_name" \
            -f relay_run="$NEXT_RELAY" \
            -f relay_lineage_id="$LINEAGE_ID" \
            -f source_sha="$SOURCE_SHA" \
            -f wall_timeout="$WALL_TIMEOUT_INPUT" \
            -f dry_run="$DRY_RUN_INPUT" \
            -f sandbox_image_digest="$SANDBOX_IMAGE_DIGEST"

          echo "Relay run #$NEXT_RELAY triggered. This run will now exit."
          exit 0

      # ── Step 3: Format Results ──
      - name: 'Step 3: Format results'
        if: steps.check_relay.outputs.needs_relay != 'true' && steps.step2a.outcome == 'success'
        run: |
          cd batch-runner
          bash step3_format_results.sh

      # ── Step 4: Fill Parquet ──
      - name: 'Step 4: Fill parquet'
        if: steps.check_relay.outputs.needs_relay != 'true' && steps.step2a.outcome == 'success'
        run: |
          cd batch-runner
          bash step4_fill_parquet.sh

      # ── Check sample_size (skip validation for smoke tests) ──
      - name: 'Check if smoke test'
        id: check_smoke_test
        run: |
          YAML_PATH="batch-runner/experiments/${EXPERIMENT_YAML_INPUT}.yaml"
          SAMPLE_SIZE=$(python3 -c "import yaml; cfg=yaml.safe_load(open('${YAML_PATH}')); s=cfg.get('data',{}).get('filter',{}).get('sample_size',220); print(s if s is not None else 220)")
          IS_SMOKE_TEST=$([ "$SAMPLE_SIZE" -le 3 ] && echo "true" || echo "false")
          echo "sample_size=$SAMPLE_SIZE" >> "$GITHUB_OUTPUT"
          echo "is_smoke_test=$IS_SMOKE_TEST" >> "$GITHUB_OUTPUT"
          echo "Sample size: $SAMPLE_SIZE (smoke test: $IS_SMOKE_TEST)"

      # ── Step 5: Validate (skip for smoke tests or dry_run or relay) ──
      - name: 'Step 5: Validate dataset'
        if: inputs.dry_run != true && steps.check_smoke_test.outputs.is_smoke_test != 'true' && steps.check_relay.outputs.needs_relay != 'true' && steps.step2a.outcome == 'success'
        run: |
          cd batch-runner
          bash step5_validate.sh

      # ── Step 6: Generate Experiment Report ──
      - name: 'Step 6: Generate experiment report'
        id: step6
        if: steps.check_relay.outputs.needs_relay != 'true' && steps.step2a.outcome == 'success'
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_AI_REQUIRE_EXPECTED_IDENTITIES: '1'
          AZURE_AI_EXPECTED_DIRECT_ACCOUNT: ${{ vars.AZURE_AI_EXPECTED_DIRECT_ACCOUNT }}
        run: |
          cd batch-runner
          if [[ "$DRY_RUN_INPUT" == "true" ]]; then
            bash step6_report.sh --dry-run
          else
            bash step6_report.sh
          fi
        continue-on-error: true

      - name: Ensure model-free experiment report
        if: steps.check_relay.outputs.needs_relay == 'false' && steps.step2a.outcome == 'success'
        env:
          STEP6_OUTCOME: ${{ steps.step6.outcome }}
        run: |
          set -euo pipefail
          cd batch-runner
          REPORT="results/${EXPERIMENT_ID}/report/report.md"
          SELF_REPORT="workspace/upload/self_report.json"
          if [[ -e "$REPORT" && ( -L "$REPORT" || ! -f "$REPORT" ) ]]; then
            echo "FATAL: report target is not a regular file"
            exit 1
          fi
          if [[ "$STEP6_OUTCOME" != "success" || ! -s "$REPORT" || ! -s "$SELF_REPORT" ]]; then
            echo "Narrative report unavailable; generating model-free fallback."
            if [[ "$DRY_RUN_INPUT" == "true" ]]; then
              bash step6_report.sh --no-narrative --dry-run
            else
              bash step6_report.sh --no-narrative
            fi
          fi
          [[ -f "$REPORT" && ! -L "$REPORT" && -s "$REPORT" ]]
          REPORT_REAL=$(realpath "$REPORT")
          RESULTS_REAL=$(realpath results)
          [[ "$REPORT_REAL" == "$RESULTS_REAL"/* ]]
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          experiment_id = os.environ["EXPERIMENT_ID"]
          result = json.loads(Path("workspace/result.json").read_text(encoding="utf-8"))
          self_report_path = Path("workspace/upload/self_report.json")
          self_report = json.loads(self_report_path.read_text(encoding="utf-8"))
          if result.get("experiment_id") != experiment_id:
              raise SystemExit("workspace result experiment identity mismatch")
          if (self_report.get("meta") or {}).get("experiment_id") != experiment_id:
              raise SystemExit("self-report experiment identity mismatch")
          PY

      # ── Create Pull Request (only if not dry_run and not relay) ──
      - name: Create Pull Request with results
        id: cpr
        if: inputs.dry_run != true && steps.check_relay.outputs.needs_relay == 'false' && steps.step2a.outcome == 'success'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "experiment: ${{ env.experiment_name }}"
          title: "🧪 New Experiment: ${{ env.experiment_name }}"
          body: |
            ## Experiment Results

            | Field | Value |
            |---|---|
            | **Name** | ${{ env.experiment_name }} |
            | **YAML Config** | `${{ inputs.experiment_yaml }}` |
            | **Run ID** | [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            ### Pipeline Summary
            - ✅ Step 0: Bootstrap submission repo
            - ✅ Step 1: Prepare tasks
            - ✅ Step 2: Run inference (condition_a)
            - ✅ Step 3: Format results
            - ✅ Step 4: Fill parquet
            - ✅ Step 5: Validate dataset — ${{ steps.check_smoke_test.outputs.is_smoke_test == 'true' && 'Skipped (smoke test)' || 'Run' }}
            - Step 6: Generate experiment report — ${{ steps.step6.outcome == 'success' && 'Narrative report' || 'Model-free fallback report' }}
            - Step 7: Hugging Face upload — Runs only after this PR contract is verified

            This PR records the report before the workflow performs the remote
            Hugging Face upload and dispatches exact-SHA dashboard validation.
          branch: experiment/${{ inputs.experiment_yaml }}
          labels: experiment,automated
          add-paths: batch-runner/results/${{ env.EXPERIMENT_ID }}/report/report.md

      - name: Verify result PR outputs and contract
        if: inputs.dry_run != true && steps.check_relay.outputs.needs_relay == 'false' && steps.step2a.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
          PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          EXPECTED_EXPERIMENT_ID: ${{ env.EXPERIMENT_ID }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_BRANCH" == "experiment/${EXPERIMENT_YAML_INPUT}" ]]
          git check-ref-format --branch "$PR_BRANCH" >/dev/null
          PR_JSON=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json state,baseRefName,headRefName,headRefOid,isCrossRepository,files)
          export PR_JSON PR_BRANCH PR_HEAD_SHA
          python3 - <<'PY'
          import json
          import os

          pull_request = json.loads(os.environ["PR_JSON"])
          paths = [entry["path"] for entry in pull_request["files"]]
          expected_path = (
              "batch-runner/results/"
              + os.environ["EXPECTED_EXPERIMENT_ID"]
              + "/report/report.md"
            )
          checks = {
              "state": pull_request["state"] == "OPEN",
              "base": pull_request["baseRefName"] == "main",
              "branch": pull_request["headRefName"] == os.environ["PR_BRANCH"],
              "sha": pull_request["headRefOid"] == os.environ["PR_HEAD_SHA"],
              "same_repo": pull_request["isCrossRepository"] is False,
              "files": paths == [expected_path],
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit(f"result PR validation contract failed: {failed}")
          PY

      # ── Step 7: Upload only after the result PR contract is proven ──
      - name: 'Step 7: Upload to HuggingFace'
        if: inputs.dry_run != true && steps.check_relay.outputs.needs_relay == 'false' && steps.step2a.outcome == 'success'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXPECTED_TARGET_HEAD: ${{ steps.step0.outputs.target_head }}
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_AI_REQUIRE_EXPECTED_IDENTITIES: '1'
          AZURE_AI_EXPECTED_DIRECT_ACCOUNT: ${{ vars.AZURE_AI_EXPECTED_DIRECT_ACCOUNT }}
        run: |
          cd batch-runner
          bash step7_upload_hf.sh --test

      # ── Cleanup the exact restored relay generation before finality ──
      - name: 'Cleanup relay checkpoint'
        if: success() && inputs.dry_run != true && inputs.relay_run > 0 && steps.check_relay.outputs.needs_relay == 'false' && steps.step2a.outcome == 'success'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_REPO: ${{ steps.read_config.outputs.source_repo }}
          EXPECTED_GENERATION: ${{ steps.restore_checkpoint.outputs.generation }}
        run: |
          set -euo pipefail
          cd batch-runner
          python3 scripts/relay_checkpoint.py cleanup \
            --repo-id "$SOURCE_REPO" \
            --source-sha "$SOURCE_SHA_INPUT" \
            --lineage-id "$RELAY_LINEAGE_ID_INPUT" \
            --expected-generation "$EXPECTED_GENERATION" \
            --sandbox-image-digest "$SANDBOX_IMAGE_DIGEST_INPUT"

      - name: Verify publication finality
        if: success() && inputs.dry_run != true && steps.check_relay.outputs.needs_relay == 'false' && steps.step2a.outcome == 'success'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_REPO: ${{ steps.read_config.outputs.source_repo }}
          EXPECTED_GENERATION: ${{ inputs.relay_run > 0 && steps.restore_checkpoint.outputs.generation || '' }}
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_AI_REQUIRE_EXPECTED_IDENTITIES: '1'
          AZURE_AI_EXPECTED_DIRECT_ACCOUNT: ${{ vars.AZURE_AI_EXPECTED_DIRECT_ACCOUNT }}
        run: |
          set -euo pipefail
          cd batch-runner
          python3 <<'PY'
          import os
          from pathlib import Path

          from core.hf_publication import (
              load_publication_identity,
              verify_publication_finality,
          )
          from core.narrative_analyzer import (
              expected_narrative_publication_identity,
          )

          model, effort, fingerprint = expected_narrative_publication_identity()
          identity = load_publication_identity(
              Path("workspace/step1_tasks_prepared.json"),
              Path("workspace/step2_inference_results.json"),
              expected_narrative_model=model,
              expected_narrative_reasoning_effort=effort,
              expected_narrative_runtime_fingerprint=fingerprint,
          )
          repo_id = os.environ["SOURCE_REPO"]
          if identity.repo_id != repo_id:
              raise SystemExit(
                  "publication repository differs from prepared identity"
              )
          expected_generation = os.environ.get("EXPECTED_GENERATION") or None
          final_head = verify_publication_finality(
              repo_id,
              Path("workspace/upload"),
              token=os.environ["HF_TOKEN"],
              identity=identity,
              expected_generation=expected_generation,
          )
          print(f"Publication finality verified at {final_head}")
          PY

      - name: Recheck result PR head after upload
        if: success() && inputs.dry_run != true && steps.check_relay.outputs.needs_relay == 'false' && steps.step2a.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          CURRENT_HEAD=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefOid --jq .headRefOid)
          [[ "$CURRENT_HEAD" == "$PR_HEAD_SHA" ]]

      - name: Dispatch exact result PR validation
        if: success() && inputs.dry_run != true && steps.check_relay.outputs.needs_relay == 'false' && steps.step2a.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
          PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$PR_BRANCH" \
            --raw-field deploy_pages=false \
            --raw-field expected_sha="$PR_HEAD_SHA"

      # ── Summary step ──
      - name: Show summary
        if: always()
        run: |
          echo "════════════════════════════════════════"
          echo "📊 Batch Experiment Complete"
          echo "════════════════════════════════════════"
          echo "Experiment: ${{ env.experiment_name }}"
          echo "YAML Config: $EXPERIMENT_YAML_INPUT"
          echo "Dry Run: $DRY_RUN_INPUT"
          echo ""
          echo "Check artifacts for full pipeline output."

      # ── Upload artifacts ──
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-results-${{ github.run_id }}
          path: |
            batch-runner/workspace/
            batch-runner/results/
          retention-days: 30
