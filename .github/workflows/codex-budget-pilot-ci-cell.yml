# One registered cell, not the 30-cell scheduler or cross-runner state restore.
# Explicit input transport is separate from model admission. No automatic fallback.
# Creation/review of this workflow is not authorization to transfer or launch.
name: Codex external-budget pilot — one CI cell

on:
  workflow_dispatch:
    inputs:
      reviewed_source_sha:
        description: Exact reviewed main/workflow SHA (40 lowercase hex characters)
        required: true
        type: string
      cell_id:
        description: One canonical advance_check_5 task UUID plus _A_r1/_B_r1/etc.
        required: true
        type: string
      execute:
        description: Later leader-authorized execution; exclusive with all input/output setup checks
        required: false
        default: false
        type: boolean
      input_check:
        description: Explicit private original-input intake/check only; no Azure OIDC or model
        required: false
        default: false
        type: boolean
      output_target_check:
        description: Inspect only the tracked output candidate metadata; no inputs/OIDC/model/publication
        required: false
        default: false
        type: boolean
      output_target_setup:
        description: Later authorized creation of the fixed private output dataset only; no inputs/OIDC/model
        required: false
        default: false
        type: boolean
      input_transport:
        description: Explicit source route; hf_originals reads only the four registered immutable originals
        required: false
        default: github_draft
        type: choice
        options:
          - github_draft
          - hf_originals
      input_release_id:
        description: Positive numeric ID of the explicitly selected same-repository DRAFT release
        required: false
        type: string
      input_asset_id:
        description: Positive numeric ID of its uploaded registered input-bundle asset
        required: false
        type: string
      input_bundle_sha256:
        description: Externally supplied SHA256 of the registered private bundle
        required: false
        type: string
  workflow_call:
    inputs:
      reviewed_source_sha:
        required: true
        type: string
      cell_id:
        required: true
        type: string
      execute:
        required: false
        default: false
        type: boolean
      input_check:
        required: false
        default: false
        type: boolean
      output_target_check:
        required: false
        default: false
        type: boolean
      output_target_setup:
        required: false
        default: false
        type: boolean
      input_transport:
        required: false
        default: github_draft
        type: string
      input_release_id:
        required: false
        type: string
      input_asset_id:
        required: false
        type: string
      input_bundle_sha256:
        required: false
        type: string
    secrets:
      HF_TOKEN:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      FOUNDRY_PROJECT_ENDPOINT:
        required: false

# Same effective identity scope as the reviewed connection diagnostic.
permissions:
  contents: read
  id-token: write

# One active cell for the entire campaign, independent of selected cell.
# Concurrency is not admission. The private CAS claim below admits only the
# immediate canonical successor; this workflow never launches the other cells.
concurrency:
  group: codex-budget-pilot-ci-20260923-01
  cancel-in-progress: false

jobs:
  cell:
    if: github.repository == 'hyeonsangjeon/gdpval-realworks' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 240 # Setup/cleanup headroom; the model cell remains 180 minutes.
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      PILOT_WORKFLOW_SHA: ${{ github.workflow_sha }}
      REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
      SELECTED_CELL: ${{ inputs.cell_id }}
      EXECUTE_REQUESTED: ${{ inputs.execute }}
      INPUT_CHECK_REQUESTED: ${{ inputs.input_check }}
      OUTPUT_TARGET_CHECK_REQUESTED: ${{ inputs.output_target_check }}
      OUTPUT_TARGET_SETUP_REQUESTED: ${{ inputs.output_target_setup }}
      INPUT_TRANSPORT: ${{ inputs.input_transport || 'github_draft' }}
      INPUT_RELEASE_ID: ${{ inputs.input_release_id }}
      INPUT_ASSET_ID: ${{ inputs.input_asset_id }}
    steps:
      - name: Bind reviewed source and refuse workflow reruns before credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EXECUTE_REQUESTED" == true && "$INPUT_CHECK_REQUESTED" == true ]]; then
            echo "input_check_and_execute_are_mutually_exclusive"
            exit 1
          fi
          if [[ "${OUTPUT_TARGET_CHECK_REQUESTED:-false}" == true && ( "$EXECUTE_REQUESTED" == true || "$INPUT_CHECK_REQUESTED" == true ) ]]; then
            echo "output_target_check_mode_conflict"
            exit 1
          fi
          if [[ "${OUTPUT_TARGET_SETUP_REQUESTED:-false}" == true && ( "$EXECUTE_REQUESTED" == true || "$INPUT_CHECK_REQUESTED" == true || "${OUTPUT_TARGET_CHECK_REQUESTED:-false}" == true ) ]]; then
            echo "output_target_setup_mode_conflict"
            exit 1
          fi
          case "${INPUT_TRANSPORT:-github_draft}" in
            github_draft) ;;
            hf_originals)
              if [[ -n "${INPUT_RELEASE_ID:-}" || -n "${INPUT_ASSET_ID:-}" ]]; then
                echo "hf_originals_rejects_github_ids"
                exit 1
              fi ;;
            *) echo "unknown_input_transport"; exit 1 ;;
          esac
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REPOSITORY" == hyeonsangjeon/gdpval-realworks ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$REVIEWED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$REVIEWED_SOURCE_SHA" ]]
          [[ "$PILOT_WORKFLOW_SHA" == "$REVIEWED_SOURCE_SHA" ]]

      - name: Check out exact reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.reviewed_source_sha }}
          persist-credentials: false

      - name: Setup pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10.12"
          cache: pip
          cache-dependency-path: batch-runner/requirements.txt

      - name: Install existing declared dependencies
        run: python3 -m pip install -r batch-runner/requirements.txt

      - name: Plan one cell on the reviewed source before any intake or OIDC
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          args=(--campaign-id budget_pilot_ci_20260925_04
                --cell "$SELECTED_CELL" --reviewed-source-sha "$REVIEWED_SOURCE_SHA"
                --output "$RUNNER_TEMP/budget-pilot-ci-private"
                --completion-out "$RUNNER_TEMP/budget-pilot-ci-completion.json")
          python3 batch-runner/codex_budget_pilot_ci.py "${args[@]}"

      - name: Inspect only the tracked output target metadata
        id: output_target
        if: inputs.output_target_check && !inputs.output_target_setup
        timeout-minutes: 1
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # One <=20-second metadata request inside a short-lived subprocess.
          # Only safe CLI metadata enters the log; no new artifact or publication.
          timeout --signal=TERM --kill-after=5s 30s \
            python3 batch-runner/codex_budget_pilot_ci.py \
              --campaign-id budget_pilot_ci_20260925_04 \
              --cell "$SELECTED_CELL" --reviewed-source-sha "$REVIEWED_SOURCE_SHA" \
              --output-target-check

      - name: Set up only the fixed private output candidate
        id: output_setup
        if: inputs.output_target_setup && !inputs.output_target_check && !inputs.execute && !inputs.input_check
        timeout-minutes: 3
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # At most four fixed requests within the existing 120-second HF bound.
          # No marker/payload upload. Private reservation/receipt are not artifacts.
          timeout --signal=TERM --kill-after=5s 130s \
            python3 batch-runner/codex_budget_pilot_ci.py \
              --campaign-id budget_pilot_ci_20260925_04 \
              --cell "$SELECTED_CELL" --reviewed-source-sha "$REVIEWED_SOURCE_SHA" \
              --output-target-setup --create-output-target \
              --setup-state "$RUNNER_TEMP/budget-pilot-output-setup-private"

      - name: Import the explicitly selected original inputs before OIDC
        id: intake
        if: (inputs.execute || inputs.input_check) && !inputs.output_target_check && !inputs.output_target_setup
        timeout-minutes: 3
        env:
          # Only the selected existing input credential is exposed to this step.
          # Never fall back between transports.
          GITHUB_TOKEN: ${{ inputs.input_transport != 'hf_originals' && github.token || '' }}
          HF_TOKEN: ${{ inputs.input_transport == 'hf_originals' && secrets.HF_TOKEN || '' }}
          INPUT_BUNDLE_SHA256: ${{ inputs.input_bundle_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s \
            python3 batch-runner/codex_ci_input_intake.py --input-check \
              --input-transport "${INPUT_TRANSPORT:-github_draft}" \
              --release-id "$INPUT_RELEASE_ID" --asset-id "$INPUT_ASSET_ID" \
              --expected-sha256 "$INPUT_BUNDLE_SHA256" \
              --bundle-out "$RUNNER_TEMP/budget-pilot-ci-input.tar" \
              --out "$RUNNER_TEMP/budget-pilot-ci-inputs"
          # HF goes online only inside the intake's bounded fetch scope. Its
          # importer and this unchanged gate stay offline, without input tokens.
          unset GITHUB_TOKEN HF_TOKEN HUGGING_FACE_HUB_TOKEN
          python3 batch-runner/codex_budget_pilot_ci.py \
            --campaign-id budget_pilot_ci_20260925_04 \
            --cell "$SELECTED_CELL" --reviewed-source-sha "$REVIEWED_SOURCE_SHA" \
            --output "$RUNNER_TEMP/budget-pilot-ci-private" \
            --completion-out "$RUNNER_TEMP/budget-pilot-ci-completion.json" \
            --dataset-parquet "$RUNNER_TEMP/budget-pilot-ci-inputs/original.parquet" \
            --reference-root "$RUNNER_TEMP/budget-pilot-ci-inputs/reference-only" \
            --step0-manifest "$RUNNER_TEMP/budget-pilot-ci-inputs/step0-manifest.json" \
            --resume --check-inputs
          echo "verified=true" >> "$GITHUB_OUTPUT"

      # Reuse the Codex Ubuntu package bootstrap before claiming a paid cell.
      # One bounded sequence; no input/model credentials or host-policy changes.
      - name: Install the existing native sandbox prerequisite
        if: success() && inputs.execute && !inputs.input_check && !inputs.output_target_check && !inputs.output_target_setup && steps.intake.outputs.verified == 'true'
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null; then
            APT_OPTS=(
              -o Acquire::Retries=3
              -o Acquire::http::Timeout=30
              -o Acquire::https::Timeout=30
              -o DPkg::Lock::Timeout=60
            )
            sudo timeout --kill-after=5s 240s apt-get "${APT_OPTS[@]}" update -qq
            sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=5s 420s apt-get \
              "${APT_OPTS[@]}" install -y --no-install-recommends bubblewrap
          fi

      - name: Require the existing native sandbox prerequisite
        if: success() && inputs.execute && !inputs.input_check && !inputs.output_target_check && !inputs.output_target_setup && steps.intake.outputs.verified == 'true'
        run: |
          if ! command -v bwrap >/dev/null; then
            echo "codex_bubblewrap_unavailable"
            exit 1
          fi

      - name: Require the existing native sandbox capability
        if: success() && inputs.execute && !inputs.input_check && !inputs.output_target_check && !inputs.output_target_setup && steps.intake.outputs.verified == 'true'
        timeout-minutes: 2
        working-directory: batch-runner
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/diagnose_codex_sandbox_host.py

      - name: Claim only the next canonical cell before inference
        id: admission
        if: success() && inputs.execute && !inputs.input_check && !inputs.output_target_check && !inputs.output_target_setup && steps.intake.outputs.verified == 'true'
        timeout-minutes: 3
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Fixed leader-selected private target/bootstrap, not a new input.
          # One CAS claim; failed or ambiguous outcomes never replay a cell.
          timeout --signal=TERM --kill-after=5s 130s \
            python3 batch-runner/codex_budget_pilot_retention.py \
              --cell "$SELECTED_CELL" --reviewed-source-sha "$REVIEWED_SOURCE_SHA" \
              --output "$RUNNER_TEMP/budget-pilot-ci-private" --admit
          echo "admitted=true" >> "$GITHUB_OUTPUT"

      - name: Azure Login (OIDC)
        if: success() && inputs.execute && !inputs.input_check && !inputs.output_target_check && !inputs.output_target_setup && steps.intake.outputs.verified == 'true' && steps.admission.outputs.admitted == 'true'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify existing Azure OIDC session identity
        if: success() && inputs.execute && !inputs.input_check && !inputs.output_target_check && !inputs.output_target_setup && steps.intake.outputs.verified == 'true' && steps.admission.outputs.admitted == 'true'
        env:
          AZURE_AI_EXPECTED_CLIENT_ID: ${{ vars.AZURE_AI_EXPECTED_CLIENT_ID }}
          AZURE_AI_EXPECTED_TENANT_ID: ${{ vars.AZURE_AI_EXPECTED_TENANT_ID }}
          AZURE_AI_EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_AI_EXPECTED_SUBSCRIPTION_ID }}
        run: python3 batch-runner/scripts/azure_oidc_identity_preflight.py --verify-session

      - name: Execute only the selected cell on this live host
        id: execution
        if: success() && inputs.execute && !inputs.input_check && !inputs.output_target_check && !inputs.output_target_setup && steps.intake.outputs.verified == 'true' && steps.admission.outputs.admitted == 'true'
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          # A future explicit execute decision, never inferred from old connectivity.
          CODEX_FOUNDRY_CONNECTION_CONFIRMED: "1"
        shell: bash
        run: |
          set -euo pipefail
          python3 batch-runner/codex_budget_pilot_ci.py \
            --campaign-id budget_pilot_ci_20260925_04 \
            --cell "$SELECTED_CELL" --reviewed-source-sha "$REVIEWED_SOURCE_SHA" \
            --output "$RUNNER_TEMP/budget-pilot-ci-private" \
            --completion-out "$RUNNER_TEMP/budget-pilot-ci-completion.json" \
            --dataset-parquet "$RUNNER_TEMP/budget-pilot-ci-inputs/original.parquet" \
            --reference-root "$RUNNER_TEMP/budget-pilot-ci-inputs/reference-only" \
            --step0-manifest "$RUNNER_TEMP/budget-pilot-ci-inputs/step0-manifest.json" \
            --resume --execute

      - name: Retain confirmed terminal output on this same live host
        id: retention
        if: always() && inputs.execute && !inputs.input_check && !inputs.output_target_check && !inputs.output_target_setup && steps.admission.outputs.admitted == 'true'
        timeout-minutes: 3
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Failed/stopped output is not success. Uncertain cleanup or output
          # publication refuses terminal confirmation and blocks advancement.
          timeout --signal=TERM --kill-after=5s 130s \
            python3 batch-runner/codex_budget_pilot_retention.py \
              --cell "$SELECTED_CELL" --reviewed-source-sha "$REVIEWED_SOURCE_SHA" \
              --output "$RUNNER_TEMP/budget-pilot-ci-private" --retain

      - name: Validate only the nonsecret completion envelope
        id: publication
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 batch-runner/codex_budget_pilot_ci.py \
            --verify-envelope "$RUNNER_TEMP/budget-pilot-ci-completion.json"
          echo "safe=true" >> "$GITHUB_OUTPUT"

      - name: Retain the allowlisted cell envelope only
        if: always() && steps.publication.outputs.safe == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: budget-pilot-ci-cell-completion
          path: ${{ runner.temp }}/budget-pilot-ci-completion.json
          if-no-files-found: error
          retention-days: 7
