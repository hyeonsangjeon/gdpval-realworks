name: Backend Tests

# The batch-runner suite had no pull-request gate, so a change could land on
# main with a red test and nothing would say so. That is not hypothetical:
# #179 rewrote the paid-approval conditions in grade-run.yml and left the
# assertion that pins them comparing against the old literal, and main stayed
# red until a human happened to run pytest locally. This workflow closes that
# gap and nothing else -- it does not gate on mypy or ruff, which both carry a
# pre-existing backlog (189 and 20 findings on main) that a gate would freeze
# into permanent red.

# The `pull_request` trigger below does not reach the result PRs that
# batch-run.yml opens. Those are created by peter-evans/create-pull-request with
# GITHUB_TOKEN, and GitHub deliberately refuses to start a `pull_request` run
# for them so a workflow cannot loop by writing to its own repository. It does
# not refuse quietly: a run row IS created, and it dies at startup with zero
# jobs and the message "This run likely failed because of a workflow file
# issue." Six for six on the bot PRs measured (33464032707, 33464032741,
# 33464910416, 33464910554, 33308414611, 33308414607), while every
# human-authored PR touching the same paths ran normally. The result PR then
# shows an empty Checks list, which reads as "nothing to report" when the truth
# is "never ran". `workflow_dispatch` is not subject to that rule, so
# batch-run.yml dispatches this workflow explicitly and refuses to finish green
# unless the dispatched run comes back successful.
on:
  pull_request:
    paths:
      - "batch-runner/**"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "batch-runner/**"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact result-PR head SHA this dispatch must test. A dispatch resolves a branch name to whatever it points at now, so the caller pins the commit it measured and the run below refuses to be anything else.'
        required: true
        type: string

# Read-only, and no secrets are referenced anywhere below. The suite must stay
# runnable from a fork PR, where neither is available. A dispatch does not need
# more than this either: it only reads the tree and runs pytest, and the caller
# -- not this workflow -- is what acts on the verdict.
permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A dispatch names a branch, and a branch is a moving pointer. Between the
      # caller measuring the PR head and this run starting, the branch can be
      # updated -- so the caller passes the SHA it measured and this refuses to
      # run as anything else. `github.workflow_sha` is checked too, so the
      # workflow file being obeyed is the one on the commit under test rather
      # than a different version of this file on a branch that happens to share
      # the name. Same shape as the validation dispatch in deploy.yml.
      - name: Verify dispatch contract
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]]
          [[ "$WORKFLOW_SHA" == "$EXPECTED_SHA" ]]
          echo "dispatch pinned to $EXPECTED_SHA"

      # Full history, not the default shallow clone.
      # test_verifier_ignores_hostile_path_for_repository_git resolves a
      # hardcoded commit (3ecb8ded, "docs(sandbox): finalize evidence isolation
      # shipment") through `git cat-file`, which exits 128 when that object is
      # not in the clone. The pack is ~41 MiB, so full history is cheap here.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The contract check above reads what GitHub *said* the run is for. This
      # reads what actually landed on disk. The default checkout resolves a
      # branch name, so a push racing the dispatch would otherwise be tested
      # silently under the pinned SHA's name.
      - name: Verify exact checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]

      # Exact patch, not "3.11" like the other workflows here. core/agentic_v2_
      # license.py pins LICENSE_EVALUATOR_PYTHON_VERSION = "3.10.12" and
      # compares it against sys.version_info[:3] at import; anything else makes
      # license_evaluator_runtime_identity() raise and takes ~93 supply-chain
      # tests down with it. That pin is a deliberate reproducibility control
      # for the license evaluator, so CI matches it rather than relaxing it.
      # The dev venv is 3.10.12 for the same reason. If actions/python-versions
      # ever stops shipping a 3.10.12 build for the runner image, re-pin the
      # constant and this together -- not this alone.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10.12"
          cache: pip
          cache-dependency-path: batch-runner/requirements.txt

      - name: Install dependencies
        run: |
          cd batch-runner
          pip install -r requirements.txt

      # `-m "not integration"` is already in pytest.ini's addopts, but this job
      # runs on untrusted pull-request branches that can edit pytest.ini. A PR
      # that dropped the marker filter would turn every CI run into a billed
      # call against the real judge endpoints. Assert the filter is present
      # rather than trusting the file the PR is allowed to rewrite.
      - name: Verify integration tests stay deselected
        run: |
          set -euo pipefail
          cd batch-runner
          if ! grep -qE '^addopts = .*-m "not integration"' pytest.ini; then
            echo "::error::pytest.ini no longer deselects integration tests"
            exit 1
          fi
          echo "pytest.ini deselects integration tests"

      # The marker filter is repeated on the command line so the run stays free
      # even if the addopts guard above is ever relaxed. Integration tests reach
      # paid APIs; CI must never pay.
      #
      # Nothing is deselected here, and that is the point. The sandbox launcher
      # test used to be, because it probed exec denial through os.system(): the
      # blocked fork and exec reach Python as an OSError on the dev box's 3.10
      # kernel and as a plain return value on the runner's, so the assertion
      # measured libc error reporting rather than the filter. It now probes
      # execve directly through os.execv, which raises the filter's own EPERM
      # wherever the filter loads, so it runs on every host the suite runs on.
      #
      # -rs names every skipped test and its reason. Without it, `-q` prints
      # only a count, and a test that stops running is indistinguishable from
      # one that passes -- which is how the launcher test above went unnoticed.
      # Several tests here skip on a legitimately absent host capability
      # (seccomp TSYNC, a Docker image), so the count alone cannot tell an
      # expected skip from a newly silent one. Keep the reasons in the log.
      - name: Run tests
        run: |
          cd batch-runner
          python -m pytest -m "not integration" --tb=short -q -rs

      # `scripts/__tests__/` holds Python tests for the repo-root `scripts/`
      # tooling, and until now nothing ran them: the step above changes into
      # `batch-runner` first, and `npm test` wires only the `.mjs` files that
      # sit in the same directory. Eight files and ninety-five test functions
      # gated nothing. Two of them had been red on `main` for days -- one since
      # #188 (2026-08-21), one since #302 (2026-08-31) -- and no run said so.
      #
      # Run from the repo root, because these resolve fixtures through
      # `parents[2]`. There is no pytest.ini here, so the marker filter is
      # spelled out rather than inherited; nothing under this path is marked
      # integration today and this keeps it that way if something ever is.
      #
      # An empty collection exits 5 and a missing path exits 4, so this step
      # cannot pass by quietly finding nothing -- which is the exact way the
      # directory went unnoticed in the first place.
      #
      # `scripts/**` is in the trigger filter above for this step's sake. It
      # was not at first, so a pull request touching only repo-root `scripts/`
      # started no run at all and this step never executed -- the directory was
      # wired to a job that nothing woke up. Measured on #392, which changed
      # `scripts/grading_cost_sweep.py` and added twenty-five tests here: the
      # only workflow that ran was Aggregate Tests & Deploy.
      - name: Run repo-root script tests
        run: python -m pytest scripts/__tests__ -m "not integration" --tb=short -q -rs
