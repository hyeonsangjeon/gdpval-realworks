name: Run GDPVal Grade Pipeline

on:
  workflow_dispatch:
    inputs:
      experiment_yaml:
        description: "Experiment YAML name (without .yaml)"
        required: true
        type: string
      grading_config:
        description: "Grading config file under batch-runner/grading_configs/"
        required: true
        type: string
        default: "default_v2_sol_max.yaml"
      inference_revision:
        description: "Full HF dataset commit SHA for resume; blank resolves initial main"
        required: false
        type: string
        default: ""
      force:
        description: "Overwrite existing grade file (skip cache)"
        required: false
        type: boolean
        default: false
      tasks_limit:
        description: "Limit to first N tasks (0 = all)"
        required: false
        type: number
        default: 0
      dry_run:
        description: "Classify only, no LLM calls"
        required: false
        type: boolean
        default: true
      paid_approval:
        description: "Explicitly authorize paid model calls (protected environment also required)"
        required: false
        type: boolean
        default: false
      resume:
        description: "Resume from existing partial grade JSON (chunked execution)"
        required: false
        type: boolean
        default: false
      resume_chunk:
        description: "Current chunk index (auto-incremented on self-retrigger). Safety cap = 10."
        required: false
        type: number
        default: 0
      shard_count:
        description: "Split the corpus across N parallel dispatches (1 = serial). Each shard commits its own partial under data/grades/_shards/; the shard that finishes last merges them into the canonical final."
        required: false
        type: number
        default: 1
      shard_index:
        description: "0-based index of this shard. Must be less than shard_count."
        required: false
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  # Chunks of the SAME shard must never overlap -- they resume from one partial
  # file and would race each other. Different shards MUST overlap or sharding
  # buys nothing. So the key carries shard_index but deliberately NOT
  # shard_count: re-dispatching the same index under a different N still
  # serializes, which is what stops two overlapping slices from being graded
  # (and paid for) simultaneously.
  group: grade-${{ inputs.experiment_yaml }}-${{ inputs.grading_config }}-shard${{ inputs.shard_index }}
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-24.04
    outputs:
      approval_inherited: ${{ steps.inherit.outputs.approval_inherited }}
    env:
      GRADE_EXPERIMENT_YAML: ${{ inputs.experiment_yaml }}
      GRADE_CONFIG: ${{ inputs.grading_config }}
      GRADE_INFERENCE_REVISION: ${{ inputs.inference_revision }}
      GRADE_FORCE: ${{ inputs.force }}
      GRADE_TASKS_LIMIT: ${{ inputs.tasks_limit }}
      GRADE_DRY_RUN: ${{ inputs.dry_run }}
      GRADE_PAID_APPROVAL: ${{ inputs.paid_approval }}
      GRADE_RESUME: ${{ inputs.resume }}
      GRADE_RESUME_CHUNK: ${{ inputs.resume_chunk }}
      GRADE_SHARD_COUNT: ${{ inputs.shard_count }}
      GRADE_SHARD_INDEX: ${{ inputs.shard_index }}
    steps:
      - name: Validate workflow context and inputs
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/grade-run.yml@refs/heads/main"
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::grade-run must be started via workflow_dispatch"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::grade-run must be dispatched from main"
            exit 1
          fi
          if [[ "$GITHUB_WORKFLOW_REF" != "$EXPECTED_WORKFLOW_REF" ]]; then
            echo "::error::unexpected workflow identity: $GITHUB_WORKFLOW_REF"
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ || "$GITHUB_WORKFLOW_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::workflow and event SHA must match one lowercase 40-character commit"
            exit 1
          fi

          if (( ${#GRADE_EXPERIMENT_YAML} < 1 || ${#GRADE_EXPERIMENT_YAML} > 128 )) ||
             [[ ! "$GRADE_EXPERIMENT_YAML" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] ||
             [[ "$GRADE_EXPERIMENT_YAML" == *.yaml || "$GRADE_EXPERIMENT_YAML" == *.yml ]]; then
            echo "::error::experiment_yaml must be a safe extensionless basename (1-128 characters)"
            exit 1
          fi
          if (( ${#GRADE_CONFIG} < 1 || ${#GRADE_CONFIG} > 128 )) ||
             [[ ! "$GRADE_CONFIG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.ya?ml$ ]]; then
            echo "::error::grading_config must be a safe YAML basename (1-128 characters)"
            exit 1
          fi
          if [[ -n "$GRADE_INFERENCE_REVISION" && ! "$GRADE_INFERENCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::inference_revision must be blank or a lowercase 40-character SHA"
            exit 1
          fi

          for boolean_name in GRADE_FORCE GRADE_DRY_RUN GRADE_PAID_APPROVAL GRADE_RESUME; do
            boolean_value="${!boolean_name}"
            if [[ "$boolean_value" != "true" && "$boolean_value" != "false" ]]; then
              echo "::error::$boolean_name must be exactly true or false"
              exit 1
            fi
          done
          if [[ "$GRADE_DRY_RUN" != "true" && "$GRADE_PAID_APPROVAL" != "true" ]]; then
            echo "::error::non-dry grading requires paid_approval=true"
            exit 1
          fi
          if [[ "$GRADE_DRY_RUN" == "true" && "$GRADE_PAID_APPROVAL" != "false" ]]; then
            echo "::error::dry-run grading must not request paid approval"
            exit 1
          fi
          if [[ ! "$GRADE_TASKS_LIMIT" =~ ^(0|[1-9][0-9]{0,2})$ ]] ||
             (( 10#$GRADE_TASKS_LIMIT > 220 )); then
            echo "::error::tasks_limit must be an integer between 0 and 220"
            exit 1
          fi
          if [[ ! "$GRADE_RESUME_CHUNK" =~ ^(0|[1-9]|10)$ ]]; then
            echo "::error::resume_chunk must be between 0 and 10"
            exit 1
          fi
          if [[ "$GRADE_FORCE" == "true" && "$GRADE_RESUME" == "true" ]]; then
            echo "::error::force and resume are mutually exclusive"
            exit 1
          fi
          if [[ "$GRADE_RESUME" == "true" && -z "$GRADE_INFERENCE_REVISION" ]]; then
            echo "::error::resume requires the pinned inference_revision"
            exit 1
          fi
          if [[ "$GRADE_RESUME" == "false" && "$GRADE_RESUME_CHUNK" != "0" ]]; then
            echo "::error::resume_chunk must be 0 when resume is false"
            exit 1
          fi

          # Cap at 11 concurrent shards. This is a blast-radius bound, not a
          # derived optimum: each shard is an independent paid relay, so N is
          # also the number of judge workloads billing at once. 11 puts the
          # 220-task corpus at 20 tasks per shard and the ~71.6h serial
          # projection at ~6.5h -- two 4h chunks, comfortably inside the relay
          # envelope -- with room to dial N down if quota bites.
          if [[ ! "$GRADE_SHARD_COUNT" =~ ^([1-9]|1[01])$ ]]; then
            echo "::error::shard_count must be an integer between 1 and 11"
            exit 1
          fi
          if [[ ! "$GRADE_SHARD_INDEX" =~ ^(0|[1-9]|10)$ ]]; then
            echo "::error::shard_index must be an integer between 0 and 10"
            exit 1
          fi
          if (( 10#$GRADE_SHARD_INDEX >= 10#$GRADE_SHARD_COUNT )); then
            echo "::error::shard_index ($GRADE_SHARD_INDEX) must be less than shard_count ($GRADE_SHARD_COUNT)"
            exit 1
          fi
          # --limit forks the output into _diagnostic/<scope_sha>/ because it
          # narrows the graded corpus. Sharding does not narrow the corpus, and
          # combining the two would scatter the shard set across a diagnostic
          # subtree that nothing merges. Refuse the combination outright.
          if [[ "$GRADE_SHARD_COUNT" != "1" && "$GRADE_TASKS_LIMIT" != "0" ]]; then
            echo "::error::shard_count > 1 cannot be combined with tasks_limit"
            exit 1
          fi

      # A resume chunk is not a new spending decision. `rerun_identity` pins the
      # corpus (task_ids + expected_task_count), so the bill is bounded the
      # moment chunk 0 is approved. The 4h boundary that splits a shard is an
      # artifact of the hosted-runner 6h ceiling, not a fresh authorization --
      # and shard_count is capped at 11 against a ~71.6h serial projection, so
      # no sharding choice makes a 220-task run fit in one chunk. Demanding a
      # human click per chunk therefore buys no safety while making the run
      # depend on somebody being awake every four hours.
      #
      # Inheritance is granted only to a chunk that can PROVE it continues an
      # already-approved lineage. Every check below must pass; any doubt at all
      # falls back to the Environment gate.
      - name: Resolve inherited paid approval
        id: inherit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The identity the grade job commits partials under. Kept in lockstep
          # with the `git config user.email` in the commit step below.
          GRADE_BOT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -uo pipefail

          emit() {
            echo "approval_inherited=$1" >> "$GITHUB_OUTPUT"
            echo "[inherit] approval_inherited=$1"
          }
          deny() {
            echo "[inherit] $1 -- requiring the Environment approval"
            emit false
            exit 0
          }

          # This step is an optimisation for chunk >= 1. It must never be able
          # to fail the job, or a bug here would block chunk 0 -- the path that
          # does not use inheritance at all. Any unexpected error denies.
          trap 'deny "unexpected failure near line $LINENO"' ERR
          set -e

          if [[ "$GRADE_DRY_RUN" != "false" || "$GRADE_PAID_APPROVAL" != "true" ]]; then
            deny "not a paid request"
          fi
          if [[ "$GRADE_RESUME" != "true" ]] || (( 10#$GRADE_RESUME_CHUNK < 1 )); then
            deny "chunk 0 is the click that authorizes the corpus"
          fi
          # Only the in-workflow auto-retrigger dispatches under the bot
          # identity. A person hand-passing resume=true carries their own login,
          # and minting a bot dispatch requires merging a workflow to main --
          # already owner-gated.
          if [[ "$GITHUB_ACTOR" != "github-actions[bot]" ||
                "$GITHUB_TRIGGERING_ACTOR" != "github-actions[bot]" ]]; then
            deny "resume dispatched by '$GITHUB_ACTOR'/'$GITHUB_TRIGGERING_ACTOR', not the auto-retrigger"
          fi

          CONFIG_B64="$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/batch-runner/grading_configs/${GRADE_CONFIG}?ref=${GITHUB_SHA}" \
            --jq '.content // ""' || true)"
          if [[ -z "$CONFIG_B64" ]]; then
            deny "grading config ${GRADE_CONFIG} not readable at ${GITHUB_SHA}"
          fi
          if ! printf '%s' "$CONFIG_B64" | base64 -d > "${RUNNER_TEMP}/grading_config.yaml"; then
            deny "grading config ${GRADE_CONFIG} did not decode"
          fi
          CONFIG_NAME="$(awk '
            /^config_name:[[:space:]]/ {
              sub(/^config_name:[[:space:]]*/, "")
              gsub(/^"|"$/, "")
              print
              exit
            }' "${RUNNER_TEMP}/grading_config.yaml")"
          if [[ ! "$CONFIG_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            deny "config_name in ${GRADE_CONFIG} is missing or unsafe"
          fi

          SHARD_FILE="$(printf 'shard-%03d-of-%03d.json' \
            "$((10#$GRADE_SHARD_INDEX))" "$((10#$GRADE_SHARD_COUNT))")"

          # The partial's own path is the receipt. Its parent stem encodes the
          # experiment, config name, config hash, rubric SHA, inference SHA and
          # grader source hash -- so a path match is a full identity match, and
          # the file can only exist because an approved chunk wrote it.
          STEMS="$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/data/grades/_shards?ref=main" \
            --jq '.[] | select(.type == "dir") | .name' 2>/dev/null || true)"
          MATCH=""
          while IFS= read -r stem; do
            [[ -n "$stem" ]] || continue
            [[ "$stem" == "${GRADE_EXPERIMENT_YAML}__"* ]] || continue
            [[ "$stem" == *"__${CONFIG_NAME}__"* ]] || continue
            [[ "$stem" == *"__inference_${GRADE_INFERENCE_REVISION}__"* ]] || continue
            candidate="data/grades/_shards/${stem}/${SHARD_FILE}"
            if gh api "repos/${GITHUB_REPOSITORY}/contents/${candidate}?ref=main" \
                 --jq '.sha' >/dev/null 2>&1; then
              MATCH="$candidate"
              break
            fi
          done <<< "$STEMS"
          if [[ -z "$MATCH" ]]; then
            deny "no committed ${SHARD_FILE} for ${GRADE_EXPERIMENT_YAML}/${CONFIG_NAME} at inference ${GRADE_INFERENCE_REVISION}"
          fi

          AUTHOR_EMAIL="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits?path=${MATCH}&sha=main&per_page=1" \
            --jq '.[0].commit.author.email // ""' || true)"
          if [[ "$AUTHOR_EMAIL" != "$GRADE_BOT_EMAIL" ]]; then
            deny "partial ${MATCH} was last written by '${AUTHOR_EMAIL:-unknown}', not the grading job"
          fi

          echo "[inherit] continuing approved lineage via ${MATCH}"
          emit true

  approve-paid:
    name: Approve paid Sol Max grading (${{ inputs.experiment_yaml }}, ${{ inputs.grading_config }}, chunk ${{ inputs.resume_chunk }}, shard ${{ inputs.shard_index }}/${{ inputs.shard_count }})
    needs: validate-request
    # Skipped only for a bot-dispatched resume chunk that proved it continues an
    # already-approved lineage (see "Resolve inherited paid approval").
    if: >-
      ${{
        inputs.dry_run == false &&
        inputs.paid_approval == true &&
        needs.validate-request.outputs.approval_inherited != 'true'
      }}
    runs-on: ubuntu-24.04
    environment:
      name: grading
    steps:
      - name: Record approved request
        env:
          GRADE_EXPERIMENT_YAML: ${{ inputs.experiment_yaml }}
          GRADE_CONFIG: ${{ inputs.grading_config }}
          GRADE_INFERENCE_REVISION: ${{ inputs.inference_revision }}
          GRADE_TASKS_LIMIT: ${{ inputs.tasks_limit }}
          GRADE_RESUME_CHUNK: ${{ inputs.resume_chunk }}
          GRADE_SHARD_COUNT: ${{ inputs.shard_count }}
          GRADE_SHARD_INDEX: ${{ inputs.shard_index }}
        run: |
          printf '%s\n' \
            "Approved paid grading request:" \
            "  experiment=$GRADE_EXPERIMENT_YAML" \
            "  config=$GRADE_CONFIG" \
            "  inference_revision=${GRADE_INFERENCE_REVISION:-initial-main-resolution}" \
            "  tasks_limit=$GRADE_TASKS_LIMIT" \
            "  resume_chunk=$GRADE_RESUME_CHUNK" \
            "  shard=$GRADE_SHARD_INDEX/$GRADE_SHARD_COUNT"

  grade-dry-run:
    needs: validate-request
    if: inputs.dry_run == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GRADE_EXPERIMENT_YAML: ${{ inputs.experiment_yaml }}
      GRADE_CONFIG: ${{ inputs.grading_config }}
      GRADE_INFERENCE_REVISION: ${{ inputs.inference_revision }}
      GRADE_TASKS_LIMIT: ${{ inputs.tasks_limit }}
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      GRADE_SHARD_COUNT: ${{ inputs.shard_count }}
      GRADE_SHARD_INDEX: ${{ inputs.shard_index }}
    steps:
      - name: Checkout exact main revision (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Verify read-only checkout and input files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::checked out HEAD does not match the dispatched main SHA"
            exit 1
          fi
          if [[ "$(git symbolic-ref --quiet --short HEAD)" != "main" ]]; then
            echo "::error::checkout is not on the local main branch"
            exit 1
          fi
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]]; then
            echo "::error::origin/main moved after dispatch; retry from the new main"
            exit 1
          fi
          if git config --local --name-only --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo "::error::dry-run checkout must not retain repository credentials"
            exit 1
          fi

          EXPERIMENT_PATH="batch-runner/experiments/${GRADE_EXPERIMENT_YAML}.yaml"
          CONFIG_PATH="batch-runner/grading_configs/${GRADE_CONFIG}"
          for input_path in "$EXPERIMENT_PATH" "$CONFIG_PATH"; do
            if [[ ! -f "$input_path" || -L "$input_path" ]]; then
              echo "::error::required input must be a regular non-symlink file: $input_path"
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd batch-runner
          pip install -r requirements.txt

      - name: Download inference results anonymously
        run: |
          cd batch-runner
          python scripts/download_inference_from_hf.py \
            --experiment "$GRADE_EXPERIMENT_YAML" \
            --output workspace/step2_inference_results.json \
            --grading-config "grading_configs/$GRADE_CONFIG" \
            --revision "$GRADE_INFERENCE_REVISION"

      - name: Classify grading work only
        run: |
          cd batch-runner
          ARGS=(
            "$GRADE_EXPERIMENT_YAML"
            --config "grading_configs/$GRADE_CONFIG"
            --source local
            --dry-run
          )
          if [[ "$GRADE_TASKS_LIMIT" != "0" ]]; then
            ARGS+=(--limit "$GRADE_TASKS_LIMIT")
          fi
          # Preview this shard's slice, not the whole corpus -- otherwise the
          # dry run's task count says nothing about what the paid run will do.
          if [[ "$GRADE_SHARD_COUNT" != "1" ]]; then
            ARGS+=(--shard-count "$GRADE_SHARD_COUNT" --shard-index "$GRADE_SHARD_INDEX")
          fi
          python step8_grade.py "${ARGS[@]}"

  grade:
    needs: [validate-request, approve-paid]
    # approve-paid is allowed to be 'skipped' ONLY when validate-request itself
    # certified the inheritance. Reading the output rather than trusting the
    # skip means a skip from any other cause still blocks the paid job.
    #
    # `!cancelled()` is load-bearing, not decoration: a job whose `needs` was
    # skipped is skipped too unless its `if` contains a status check function,
    # so without it this job would never run in exactly the inherited case.
    # It also keeps a cancelled run from proceeding to spend money.
    if: >-
      ${{
        !cancelled() &&
        inputs.dry_run == false &&
        inputs.paid_approval == true &&
        needs.validate-request.result == 'success' &&
        (
          needs.approve-paid.result == 'success' ||
          (
            needs.approve-paid.result == 'skipped' &&
            needs.validate-request.outputs.approval_inherited == 'true'
          )
        )
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      actions: write  # required for self-retrigger via gh workflow run
    env:
      GRADE_EXPERIMENT_YAML: ${{ inputs.experiment_yaml }}
      GRADE_CONFIG: ${{ inputs.grading_config }}
      GRADE_INFERENCE_REVISION: ${{ inputs.inference_revision }}
      GRADE_FORCE: ${{ inputs.force }}
      GRADE_TASKS_LIMIT: ${{ inputs.tasks_limit }}
      GRADE_DRY_RUN: ${{ inputs.dry_run }}
      GRADE_PAID_APPROVAL: ${{ inputs.paid_approval }}
      GRADE_RESUME: ${{ inputs.resume }}
      GRADE_RESUME_CHUNK: ${{ inputs.resume_chunk }}
      GRADE_SHARD_COUNT: ${{ inputs.shard_count }}
      GRADE_SHARD_INDEX: ${{ inputs.shard_index }}
    # GH Actions hosted runners have a HARD 6h (360min) timeout that cannot be
    # extended. We set 320min so step8_grade.py's internal 4h time guard (env
    # GRADER_TIME_BUDGET_SEC=14400) trips first, partial-saves, and exits 7,
    # leaving ~40min headroom for the commit + retrigger steps below.
    timeout-minutes: 320

    steps:

      - name: Checkout exact main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: true

      - name: Verify checked out main and input files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::checked out HEAD does not match the dispatched main SHA"
            exit 1
          fi
          if [[ "$(git symbolic-ref --quiet --short HEAD)" != "main" ]]; then
            echo "::error::checkout is not on the local main branch"
            exit 1
          fi
          if [[ "$(git rev-parse --abbrev-ref '@{upstream}')" != "origin/main" ]]; then
            echo "::error::local main does not track origin/main"
            exit 1
          fi
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]]; then
            echo "::error::origin/main moved after dispatch; retry from the new main"
            exit 1
          fi
          if ! git config --local --name-only --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo "::error::checkout credentials required for result publication are missing"
            exit 1
          fi

          EXPERIMENT_PATH="batch-runner/experiments/${GRADE_EXPERIMENT_YAML}.yaml"
          CONFIG_PATH="batch-runner/grading_configs/${GRADE_CONFIG}"
          for input_path in "$EXPERIMENT_PATH" "$CONFIG_PATH"; do
            if [[ ! -f "$input_path" || -L "$input_path" ]]; then
              echo "::error::required input must be a regular non-symlink file: $input_path"
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd batch-runner
          pip install -r requirements.txt

      - name: Determine renderer requirement
        id: renderer
        run: |
          cd batch-runner
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          from core.azure_ai_clients import grader_route_workloads
          from step8_grade import (
              requires_track2_office_renderer,
              validate_grading_config,
          )

          config_dir = Path("grading_configs").resolve()
          config_path = (config_dir / os.environ["GRADE_CONFIG"]).resolve()
          config_path.relative_to(config_dir)
          with config_path.open("r", encoding="utf-8") as handle:
              config = yaml.safe_load(handle)
          validate_grading_config(config)
          required = (
              os.environ["GRADE_DRY_RUN"] != "true"
              and requires_track2_office_renderer(config)
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"required={'true' if required else 'false'}\n")
              output.write(f"deployment={config['judge']['deployment']}\n")
              output.write(
                "azure_ai_workloads_json="
                + json.dumps([
                  f"{workload.value}={deployment}"
                  for workload, deployment in grader_route_workloads(config)
                ], separators=(",", ":"))
                + "\n"
              )
          PY

      - name: Validate Azure OIDC identity before remote access
        if: inputs.dry_run != true
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_AI_EXPECTED_CLIENT_ID: ${{ vars.AZURE_AI_EXPECTED_CLIENT_ID }}
          AZURE_AI_EXPECTED_TENANT_ID: ${{ vars.AZURE_AI_EXPECTED_TENANT_ID }}
          AZURE_AI_EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_AI_EXPECTED_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          cd batch-runner
          python scripts/azure_oidc_identity_preflight.py

      - name: Validate Azure AI route before remote access
        if: inputs.dry_run != true
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_AI_REQUIRE_EXPECTED_IDENTITIES: '1'
          AZURE_AI_EXPECTED_DIRECT_ACCOUNT: ${{ vars.AZURE_AI_EXPECTED_DIRECT_ACCOUNT }}
          AZURE_AI_WORKLOADS_JSON: ${{ steps.renderer.outputs.azure_ai_workloads_json }}
        run: |
          set -euo pipefail
          cd batch-runner
          python scripts/azure_ai_route_preflight.py

      - name: Install grading render dependencies
        if: steps.renderer.outputs.required == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libreoffice-core \
            libreoffice-calc \
            libreoffice-impress \
            fonts-dejavu-core \
            fonts-liberation2 \
            fontconfig
          libreoffice --headless --version
          FONT_FAMILIES="$(fc-match --format '%{family}\n' 'Liberation Sans')"
          if ! printf '%s\n' "$FONT_FAMILIES" | tr ',' '\n' | awk '
            {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
              if ($0 == "Liberation Sans") found = 1
            }
            END { exit(found ? 0 : 1) }
          '; then
            echo "::error::fc-match did not resolve exact family token Liberation Sans"
            exit 1
          fi

      - name: Preflight grading renderer
        if: steps.renderer.outputs.required == 'true'
        run: |
          cd batch-runner
          python scripts/preflight_grading_renderer.py

      - name: Azure Login (OIDC)
        if: inputs.dry_run != true
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure OIDC session identity
        if: inputs.dry_run != true
        env:
          AZURE_AI_EXPECTED_CLIENT_ID: ${{ vars.AZURE_AI_EXPECTED_CLIENT_ID }}
          AZURE_AI_EXPECTED_TENANT_ID: ${{ vars.AZURE_AI_EXPECTED_TENANT_ID }}
          AZURE_AI_EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_AI_EXPECTED_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          cd batch-runner
          python scripts/azure_oidc_identity_preflight.py --verify-session

      - name: Verify Azure AI token before grading
        if: inputs.dry_run != true
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_AI_REQUIRE_EXPECTED_IDENTITIES: '1'
          AZURE_AI_EXPECTED_DIRECT_ACCOUNT: ${{ vars.AZURE_AI_EXPECTED_DIRECT_ACCOUNT }}
          AZURE_AI_WORKLOADS_JSON: ${{ steps.renderer.outputs.azure_ai_workloads_json }}
        run: |
          set -euo pipefail
          cd batch-runner
          python scripts/azure_ai_route_preflight.py --verify-token

      - name: Download inference results from HF
        id: inference
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd batch-runner
          python scripts/download_inference_from_hf.py \
            --experiment "$GRADE_EXPERIMENT_YAML" \
            --output workspace/step2_inference_results.json \
            --grading-config "grading_configs/$GRADE_CONFIG" \
            --revision "$GRADE_INFERENCE_REVISION"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          payload = json.loads(
              Path("workspace/step2_inference_results.json").read_text(encoding="utf-8")
          )
          revision = payload.get("source_revision")
          if not isinstance(revision, str) or not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("canonical source_revision is not a full lowercase HF SHA")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"revision={revision}\n")
          PY

      - name: Run grading
        id: grade
        env:
          AZURE_AI_ROUTE_PROFILE: ${{ !inputs.dry_run && 'direct-v1' || '' }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ !inputs.dry_run && secrets.FOUNDRY_PROJECT_ENDPOINT || '' }}
          AZURE_AI_REQUIRE_EXPECTED_IDENTITIES: ${{ !inputs.dry_run && '1' || '0' }}
          AZURE_AI_EXPECTED_DIRECT_ACCOUNT: ${{ !inputs.dry_run && vars.AZURE_AI_EXPECTED_DIRECT_ACCOUNT || '' }}
          # Force unbuffered Python stdout so per-task progress prints
          # appear in the GH Actions log in real time. Without this, GHA's
          # pipe-style stdout triggers full-buffer mode and the log looks
          # frozen for many minutes between flushes.
          PYTHONUNBUFFERED: "1"
          # 4-hour internal time budget. step8_grade.py partial-saves and
          # exits 7 when this trips, letting the workflow self-retrigger
          # below before the 320-min job timeout-kills the runner.
          GRADER_TIME_BUDGET_SEC: "14400"
        run: |
          cd batch-runner
          ARGS=(
            "$GRADE_EXPERIMENT_YAML"
            --config "grading_configs/$GRADE_CONFIG"
            --source local
          )

          # --force and --resume are mutually exclusive in semantics; only
          # the first chunk should honor --force, subsequent resume chunks
          # must NOT pass it (would wipe the partial).
          if [[ "$GRADE_RESUME" == "true" ]]; then
            ARGS+=(--resume)
          elif [[ "$GRADE_FORCE" == "true" ]]; then
            ARGS+=(--force)
          fi
          if [[ "$GRADE_DRY_RUN" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          if [[ "$GRADE_TASKS_LIMIT" != "0" ]]; then
            ARGS+=(--limit "$GRADE_TASKS_LIMIT")
          fi
          # Shard flags change WHO grades WHAT, never what is in scope: the
          # payload still declares the full 220-task identity, so every shard
          # shares one cache key and step9 can prove the set is complete. The
          # slice only forks the output path (data/grades/_shards/...), which
          # is what lets N jobs commit without contending for one file.
          if [[ "$GRADE_SHARD_COUNT" != "1" ]]; then
            ARGS+=(--shard-count "$GRADE_SHARD_COUNT" --shard-index "$GRADE_SHARD_INDEX")
          fi

          set +e
          python step8_grade.py "${ARGS[@]}"
          RC=$?
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "[grade-step] step8_grade.py exited with rc=$RC"
          # Treat 0 (done) and 7 (chunk-resume) as success at the step
          # level so subsequent commit/retrigger steps always run. Any
          # other non-zero is a real failure → fail loud below.
          if [[ "$RC" != "0" && "$RC" != "7" ]]; then
            exit "$RC"
          fi

      - name: Commit grade result
        id: commit_grade
        if: always() && steps.grade.conclusion == 'success' && (steps.grade.outputs.rc == '0' || steps.grade.outputs.rc == '7') && inputs.dry_run == false
        env:
          EXPECTED_GRADE_STATUS: ${{ steps.grade.outputs.rc == '7' && 'partial' || steps.grade.outputs.grade_status }}
        run: |
          GRADE_FILE="${{ steps.grade.outputs.grade_file }}"
          if [[ -z "$GRADE_FILE" || ! -f "$GRADE_FILE" ]]; then
            echo "::error::resolved grade file is missing: $GRADE_FILE"
            exit 1
          fi
          python - "$GRADE_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "batch-runner")
          from core.grade_payload import validate_grade_payload

          grade_path = Path(sys.argv[1])
          schema_path = Path("batch-runner/schemas/grade.schema.json")
          payload = json.loads(grade_path.read_text(encoding="utf-8"))
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          validate_grade_payload(payload, schema)
          if not isinstance(payload.get("tasks"), list):
              raise SystemExit("grade payload has no tasks array")
          if payload.get("run_status") != os.environ["EXPECTED_GRADE_STATUS"]:
              raise SystemExit("grade payload run_status does not match exit code")
          PY
          GRADE_BLOB_SHA="$(python - "$GRADE_FILE" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )"
          if [[ ! "$GRADE_BLOB_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::failed to compute pre-rebase grade SHA-256"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$GRADE_FILE"
          if git diff --staged --quiet; then
            if [[ "${{ steps.grade.outputs.rc }}" == "7" ]]; then
              echo "::error::rc=7 requires a newly persisted partial grade diff"
              exit 1
            fi
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No grade file changes (likely skip-cache hit)"
            exit 0
          fi
          if [[ "${{ steps.grade.outputs.rc }}" == "7" ]]; then
            MSG="chore(grades): partial chunk $GRADE_RESUME_CHUNK for $GRADE_EXPERIMENT_YAML via $GRADE_CONFIG"
          else
            MSG="chore(grades): grade $GRADE_EXPERIMENT_YAML via $GRADE_CONFIG"
          fi
          if [[ "$GRADE_SHARD_COUNT" != "1" ]]; then
            # Every sharded commit is a partial by construction, so say which
            # slice it is -- the log is the only place that distinguishes N
            # simultaneous commits touching sibling files.
            MSG="$MSG [shard $GRADE_SHARD_INDEX of $GRADE_SHARD_COUNT]"
          fi
          git commit -m "$MSG"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          if [[ ! -f "$GRADE_FILE" ]]; then
            echo "::error::grade file disappeared after rebase: $GRADE_FILE"
            exit 1
          fi
          POST_REBASE_GRADE_BLOB_SHA="$(python - "$GRADE_FILE" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )"
          if [[ "$POST_REBASE_GRADE_BLOB_SHA" != "$GRADE_BLOB_SHA" ]]; then
            echo "::error::grade file changed during rebase"
            exit 1
          fi
          python - "$GRADE_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "batch-runner")
          from core.grade_payload import validate_grade_payload

          grade_path = Path(sys.argv[1])
          schema_path = Path("batch-runner/schemas/grade.schema.json")
          payload = json.loads(grade_path.read_text(encoding="utf-8"))
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          validate_grade_payload(payload, schema)
          if not isinstance(payload.get("tasks"), list):
              raise SystemExit("post-rebase grade payload has no tasks array")
          if payload.get("run_status") != os.environ["EXPECTED_GRADE_STATUS"]:
              raise SystemExit("post-rebase grade run_status does not match exit code")
          PY
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Auto-retrigger next chunk (time budget hit)
        if: steps.grade.outputs.rc == '7' && steps.commit_grade.outputs.committed == 'true' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVED_INFERENCE_REVISION: ${{ steps.inference.outputs.revision }}
        run: |
          NEXT_CHUNK=$(( GRADE_RESUME_CHUNK + 1 ))
          if [[ $NEXT_CHUNK -gt 10 ]]; then
            echo "::error::resume_chunk=$NEXT_CHUNK exceeds safety cap (10). Aborting auto-resume; investigate manually."
            exit 1
          fi
          echo "[auto-resume] triggering chunk $NEXT_CHUNK for $GRADE_EXPERIMENT_YAML / $GRADE_CONFIG (shard $GRADE_SHARD_INDEX/$GRADE_SHARD_COUNT)"
          gh workflow run grade-run.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f experiment_yaml="$GRADE_EXPERIMENT_YAML" \
            -f grading_config="$GRADE_CONFIG" \
            -f inference_revision="$RESOLVED_INFERENCE_REVISION" \
            -f force=false \
            -f tasks_limit="$GRADE_TASKS_LIMIT" \
            -f dry_run=false \
            -f paid_approval="$GRADE_PAID_APPROVAL" \
            -f resume=true \
            -f resume_chunk=$NEXT_CHUNK \
            -f shard_count="$GRADE_SHARD_COUNT" \
            -f shard_index="$GRADE_SHARD_INDEX"
          echo "[auto-resume] chunk $NEXT_CHUNK dispatched"

      - name: Merge shards into the final grade
        id: merge_shards
        if: steps.grade.outputs.rc == '0' && inputs.dry_run == false && inputs.shard_count > 1
        env:
          SHARD_GRADE_FILE: ${{ steps.grade.outputs.grade_file }}
        run: |
          set -euo pipefail
          # This shard has graded its whole slice. It is the LAST shard only if
          # every sibling partial is already on main, so pull before looking.
          #
          # Whichever shard sees a complete set performs the merge. If two race,
          # step9 is deterministic and order-independent, so both produce
          # byte-identical output and the loser's `git diff --staged --quiet`
          # turns its commit into a no-op. That is why no lock is needed. And
          # the last shard to push its own partial is guaranteed to see all N,
          # so at least one merger always exists.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

          SHARD_DIR="$(dirname -- "$SHARD_GRADE_FILE")"
          # Expected shape: <output_root>/_shards/<canonical_stem>/shard-NNN-of-NNN.json
          # Derive the final from the _shards/ parent instead of hardcoding
          # data/grades/. A run that also forks into _diagnostic/<scope_sha>/
          # then merges into ITS root rather than hard-failing here, after the
          # money is already spent. Still pinned under data/grades/, still
          # rejecting traversal, newlines and symlinked directories.
          if [[ "$SHARD_GRADE_FILE" == *$'\n'* || "$SHARD_GRADE_FILE" == *..* ]]; then
            echo "::error::shard grade path is not a safe relative path"
            exit 1
          fi
          if [[ "$SHARD_DIR" != data/grades/* || "$SHARD_DIR" != */_shards/* ]]; then
            echo "::error::sharded run resolved an unexpected output directory: $SHARD_DIR"
            exit 1
          fi
          if [[ ! -d "$SHARD_DIR" || -L "$SHARD_DIR" ]]; then
            echo "::error::shard directory is not a real directory: $SHARD_DIR"
            exit 1
          fi
          STEM="$(basename -- "$SHARD_DIR")"
          FINAL_FILE="${SHARD_DIR%/_shards/*}/${STEM}.json"
          if [[ -L "$FINAL_FILE" ]]; then
            echo "::error::refusing to merge through a symlinked output: $FINAL_FILE"
            exit 1
          fi
          COUNT=$(( 10#$GRADE_SHARD_COUNT ))

          SHARDS=()
          for index in $(seq 0 $(( COUNT - 1 ))); do
            candidate="$(printf '%s/shard-%03d-of-%03d.json' "$SHARD_DIR" "$index" "$COUNT")"
            if [[ ! -f "$candidate" || -L "$candidate" ]]; then
              echo "[merge] shard $index of $COUNT is not published yet; a later shard will merge"
              echo "merged=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            SHARDS+=("$candidate")
          done

          echo "[merge] all $COUNT shards present; merging into $FINAL_FILE"
          # --force: a shard that loses the race re-merges over a byte-identical
          # file. step9 refuses an existing output otherwise, which would fail
          # the loser for doing exactly the right thing.
          python batch-runner/step9_merge_shards.py "${SHARDS[@]}" \
            --output "$FINAL_FILE" --force

          python - "$FINAL_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "batch-runner")
          from core.grade_payload import validate_grade_payload

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          schema = json.loads(
              Path("batch-runner/schemas/grade.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          validate_grade_payload(payload, schema)
          if payload.get("run_status") != "final":
              raise SystemExit("merged payload must be final")
          tasks = payload.get("tasks")
          expected = payload.get("expected_task_count")
          if not isinstance(tasks, list) or len(tasks) != expected:
              raise SystemExit(
                  f"merged payload holds {len(tasks or [])} of {expected} tasks"
              )
          PY

          git add -- "$FINAL_FILE"
          if git diff --staged --quiet; then
            echo "[merge] identical merge is already on main (another shard won the race)"
          else
            git commit -m "chore(grades): merge $COUNT shards for $GRADE_EXPERIMENT_YAML via $GRADE_CONFIG"
            # A sibling can still push its own merge in the window between the
            # pull above and this push. That is safe at the git level too: the
            # rebase drops our commit by patch-id, and even if it did not, an
            # add/add of byte-identical content resolves without conflict.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "grade_file=$FINAL_FILE" >> "$GITHUB_OUTPUT"

      - name: Auto-analyze (final chunk only)
        id: analysis
        # Serial: rc=0 means the run finished. Sharded: rc=0 means only THIS
        # slice finished, so analysing here would publish an analysis of 1/N of
        # the corpus. Wait for the merge to declare the whole run complete.
        if: >-
          inputs.dry_run == false &&
          ((inputs.shard_count == 1 && steps.grade.outputs.rc == '0') ||
          steps.merge_shards.outputs.merged == 'true')
        env:
          ANALYSIS_GRADE_FILE: ${{ steps.merge_shards.outputs.grade_file || steps.grade.outputs.grade_file }}
        run: |
          # Serial: rc=0 means step8 completed every task (single-shot or last
          # resume chunk). Sharded: the merge step above just proved the whole
          # corpus is assembled, and hands over the merged final's path.
          # Analyze that exact JSON and emit a markdown analysis (wall-clock,
          # latency, tokens, cost estimate, top-5 slowest, quality summary).
          GRADE_FILE="$ANALYSIS_GRADE_FILE"
          if [[ -z "$GRADE_FILE" || ! -f "$GRADE_FILE" ]]; then
            echo "::error::resolved grade file is missing for $GRADE_EXPERIMENT_YAML: $GRADE_FILE"
            exit 1
          fi
          OUT="$(python scripts/analyze_grade_run.py "$GRADE_FILE" --auto-out)"
          if [[ "$OUT" == /* || "$OUT" == *$'\n'* || ! -f "$OUT" || -L "$OUT" ]]; then
            echo "::error::analysis output is not a safe regular file"
            exit 1
          fi
          echo "analysis_file=$OUT" >> "$GITHUB_OUTPUT"
          echo "[analyze] wrote $OUT"
          echo "----- preview -----"
          head -40 "$OUT"

      - name: Commit analysis
        # Follow the analyze step exactly. Gating on rc alone would fire on a
        # shard that produced no analysis, and the emptiness guard below would
        # then fail the job for correctly declining to analyze 1/N of a corpus.
        if: steps.analysis.outcome == 'success' && inputs.dry_run == false
        env:
          ANALYSIS_FILE: ${{ steps.analysis.outputs.analysis_file }}
        run: |
          if [[ -z "$ANALYSIS_FILE" || "$ANALYSIS_FILE" == /* || "$ANALYSIS_FILE" == *$'\n'* || "$ANALYSIS_FILE" != data/grades/*.analysis.md || ! -f "$ANALYSIS_FILE" || -L "$ANALYSIS_FILE" ]]; then
            echo "::error::resolved analysis file is invalid"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$ANALYSIS_FILE"
          if git diff --staged --quiet; then
            echo "[analyze] no analysis changes to commit"
            exit 0
          fi
          git commit -m "docs(grading): auto-analysis for $GRADE_EXPERIMENT_YAML ($GRADE_CONFIG)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Upload grade artifact
        if: always() && inputs.dry_run == false && steps.grade.outputs.grade_file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Shards are separate workflow runs, so the names cannot collide --
          # but a downloaded bundle is unreadable without knowing which slice it
          # holds, and the merging shard carries the final on top of its own.
          name: grade-${{ env.GRADE_EXPERIMENT_YAML }}${{ inputs.shard_count > 1 && format('-shard{0}of{1}', inputs.shard_index, inputs.shard_count) || '' }}
          path: |
            ${{ steps.grade.outputs.grade_file }}
            ${{ steps.merge_shards.outputs.grade_file }}
            ${{ steps.analysis.outputs.analysis_file }}
          retention-days: 30
