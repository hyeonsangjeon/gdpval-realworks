name: Run GDPVal Grade Pipeline

on:
  workflow_dispatch:
    inputs:
      experiment_yaml:
        description: "Experiment YAML name (without .yaml)"
        required: true
        type: string
      grading_config:
        description: "Grading config file under batch-runner/grading_configs/"
        required: true
        type: string
        default: "default_v2_sol_max.yaml"
      inference_revision:
        description: "Full HF dataset commit SHA for resume; blank resolves initial main"
        required: false
        type: string
        default: ""
      force:
        description: "Overwrite existing grade file (skip cache)"
        required: false
        type: boolean
        default: false
      tasks_limit:
        description: "Limit to first N tasks (0 = all)"
        required: false
        type: number
        default: 0
      tasks:
        description: "Grade only these task_ids (comma-separated; empty = all)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Classify only, no LLM calls"
        required: false
        type: boolean
        default: true
      paid_approval:
        description: "Explicitly authorize paid model calls (protected environment also required)"
        required: false
        type: boolean
        default: false
      resume:
        description: "Resume from existing partial grade JSON (chunked execution)"
        required: false
        type: boolean
        default: false
      resume_chunk:
        description: "Current chunk index (auto-incremented on self-retrigger). Safety cap = 10."
        required: false
        type: number
        default: 0
      shard_count:
        description: "Split the corpus across N parallel dispatches (1 = serial). Each shard commits its own partial under data/grades/_shards/; the shard that finishes last merges them into the canonical final."
        required: false
        type: number
        default: 1
      shard_index:
        description: "0-based index of this shard. Must be less than shard_count."
        required: false
        type: number
        default: 0
      run_ordinal:
        description: "Which repeat of an identical run this is (1 = the original). Repeats above 1 commit under data/grades/**/_repeats/run-NNN/ — above the shard fork, so a repeat can still be sharded — and measure how much the score moves instead of erasing the run they repeat."
        required: false
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  # Chunks of the SAME shard must never overlap -- they resume from one partial
  # file and would race each other. Different shards MUST overlap or sharding
  # buys nothing. So the key carries shard_index but deliberately NOT
  # shard_count: re-dispatching the same index under a different N still
  # serializes, which is what stops two overlapping slices from being graded
  # (and paid for) simultaneously.
  #
  # run_ordinal is deliberately absent for the same reason shard_count is.
  # Repeats write to separate paths and could safely overlap, but a variance
  # measurement gains nothing from running them at once and would bill two full
  # corpora against one judge quota simultaneously. Queuing them is free.
  group: grade-${{ inputs.experiment_yaml }}-${{ inputs.grading_config }}-shard${{ inputs.shard_index }}
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-24.04
    outputs:
      approval_inherited: ${{ steps.inherit.outputs.approval_inherited }}
    env:
      GRADE_EXPERIMENT_YAML: ${{ inputs.experiment_yaml }}
      GRADE_CONFIG: ${{ inputs.grading_config }}
      GRADE_INFERENCE_REVISION: ${{ inputs.inference_revision }}
      GRADE_FORCE: ${{ inputs.force }}
      GRADE_TASKS_LIMIT: ${{ inputs.tasks_limit }}
      GRADE_TASKS: ${{ inputs.tasks }}
      GRADE_DRY_RUN: ${{ inputs.dry_run }}
      GRADE_PAID_APPROVAL: ${{ inputs.paid_approval }}
      GRADE_RESUME: ${{ inputs.resume }}
      GRADE_RESUME_CHUNK: ${{ inputs.resume_chunk }}
      GRADE_SHARD_COUNT: ${{ inputs.shard_count }}
      GRADE_SHARD_INDEX: ${{ inputs.shard_index }}
      GRADE_RUN_ORDINAL: ${{ inputs.run_ordinal }}
    steps:
      - name: Validate workflow context and inputs
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/grade-run.yml@refs/heads/main"
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::grade-run must be started via workflow_dispatch"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::grade-run must be dispatched from main"
            exit 1
          fi
          if [[ "$GITHUB_WORKFLOW_REF" != "$EXPECTED_WORKFLOW_REF" ]]; then
            echo "::error::unexpected workflow identity: $GITHUB_WORKFLOW_REF"
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ || "$GITHUB_WORKFLOW_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::workflow and event SHA must match one lowercase 40-character commit"
            exit 1
          fi

          if (( ${#GRADE_EXPERIMENT_YAML} < 1 || ${#GRADE_EXPERIMENT_YAML} > 128 )) ||
             [[ ! "$GRADE_EXPERIMENT_YAML" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] ||
             [[ "$GRADE_EXPERIMENT_YAML" == *.yaml || "$GRADE_EXPERIMENT_YAML" == *.yml ]]; then
            echo "::error::experiment_yaml must be a safe extensionless basename (1-128 characters)"
            exit 1
          fi
          if (( ${#GRADE_CONFIG} < 1 || ${#GRADE_CONFIG} > 128 )) ||
             [[ ! "$GRADE_CONFIG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.ya?ml$ ]]; then
            echo "::error::grading_config must be a safe YAML basename (1-128 characters)"
            exit 1
          fi
          if [[ -n "$GRADE_INFERENCE_REVISION" && ! "$GRADE_INFERENCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::inference_revision must be blank or a lowercase 40-character SHA"
            exit 1
          fi

          for boolean_name in GRADE_FORCE GRADE_DRY_RUN GRADE_PAID_APPROVAL GRADE_RESUME; do
            boolean_value="${!boolean_name}"
            if [[ "$boolean_value" != "true" && "$boolean_value" != "false" ]]; then
              echo "::error::$boolean_name must be exactly true or false"
              exit 1
            fi
          done
          if [[ "$GRADE_DRY_RUN" != "true" && "$GRADE_PAID_APPROVAL" != "true" ]]; then
            echo "::error::non-dry grading requires paid_approval=true"
            exit 1
          fi
          if [[ "$GRADE_DRY_RUN" == "true" && "$GRADE_PAID_APPROVAL" != "false" ]]; then
            echo "::error::dry-run grading must not request paid approval"
            exit 1
          fi
          if [[ ! "$GRADE_TASKS_LIMIT" =~ ^(0|[1-9][0-9]{0,2})$ ]] ||
             (( 10#$GRADE_TASKS_LIMIT > 220 )); then
            echo "::error::tasks_limit must be an integer between 0 and 220"
            exit 1
          fi
          # This value is spliced into an argv array and, downstream, into the
          # digest that names an output directory. Quoting alone would make it
          # safe to pass; matching it against the only shape a task_id ever has
          # also makes it safe to *act* on, so a typo is a refusal here rather
          # than an empty corpus or a stray flag several steps later.
          if [[ -n "$GRADE_TASKS" ]] && [[ ! "$GRADE_TASKS" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}(,[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12})*$ ]]; then
            echo "::error::tasks must be a comma-separated list of task_id UUIDs"
            exit 1
          fi
          if [[ ! "$GRADE_RESUME_CHUNK" =~ ^(0|[1-9]|10)$ ]]; then
            echo "::error::resume_chunk must be between 0 and 10"
            exit 1
          fi
          if [[ "$GRADE_FORCE" == "true" && "$GRADE_RESUME" == "true" ]]; then
            echo "::error::force and resume are mutually exclusive"
            exit 1
          fi
          if [[ "$GRADE_RESUME" == "true" && -z "$GRADE_INFERENCE_REVISION" ]]; then
            echo "::error::resume requires the pinned inference_revision"
            exit 1
          fi
          if [[ "$GRADE_RESUME" == "false" && "$GRADE_RESUME_CHUNK" != "0" ]]; then
            echo "::error::resume_chunk must be 0 when resume is false"
            exit 1
          fi

          # Cap at 11 concurrent shards. This is a blast-radius bound, not a
          # derived optimum: each shard is an independent paid relay, so N is
          # also the number of judge workloads billing at once. 11 puts the
          # 220-task corpus at 20 tasks per shard and the ~71.6h serial
          # projection at ~6.5h -- two 4h chunks, comfortably inside the relay
          # envelope -- with room to dial N down if quota bites.
          if [[ ! "$GRADE_SHARD_COUNT" =~ ^([1-9]|1[01])$ ]]; then
            echo "::error::shard_count must be an integer between 1 and 11"
            exit 1
          fi
          if [[ ! "$GRADE_SHARD_INDEX" =~ ^(0|[1-9]|10)$ ]]; then
            echo "::error::shard_index must be an integer between 0 and 10"
            exit 1
          fi
          if (( 10#$GRADE_SHARD_INDEX >= 10#$GRADE_SHARD_COUNT )); then
            echo "::error::shard_index ($GRADE_SHARD_INDEX) must be less than shard_count ($GRADE_SHARD_COUNT)"
            exit 1
          fi
          # --limit forks the output into _diagnostic/<scope_sha>/ because it
          # narrows the graded corpus. Sharding does not narrow the corpus, and
          # combining the two would scatter the shard set across a diagnostic
          # subtree that nothing merges. Refuse the combination outright.
          if [[ "$GRADE_SHARD_COUNT" != "1" && "$GRADE_TASKS_LIMIT" != "0" ]]; then
            echo "::error::shard_count > 1 cannot be combined with tasks_limit"
            exit 1
          fi
          # --tasks narrows the corpus the same way and forks the output the
          # same way, so it is refused alongside sharding for the same reason.
          if [[ "$GRADE_SHARD_COUNT" != "1" && -n "$GRADE_TASKS" ]]; then
            echo "::error::shard_count > 1 cannot be combined with tasks"
            exit 1
          fi
          # Ten is the same cap step8_grade.py enforces (MAX_RUN_ORDINAL). A
          # variance measurement needs a handful of repeats; every repeat past
          # the first is another full charge for a corpus already graded.
          if [[ ! "$GRADE_RUN_ORDINAL" =~ ^([1-9]|10)$ ]]; then
            echo "::error::run_ordinal must be an integer between 1 and 10"
            exit 1
          fi

      # A resume chunk is not a new spending decision. `rerun_identity` pins the
      # corpus (task_ids + expected_task_count), so the bill is bounded the
      # moment chunk 0 is approved. The 4h boundary that splits a shard is an
      # artifact of the hosted-runner 6h ceiling, not a fresh authorization --
      # and shard_count is capped at 11 against a ~71.6h serial projection, so
      # no sharding choice makes a 220-task run fit in one chunk. Demanding a
      # human click per chunk therefore buys no safety while making the run
      # depend on somebody being awake every four hours.
      #
      # Inheritance is granted only to a chunk that can PROVE it continues an
      # already-approved lineage. Every check below must pass; any doubt at all
      # falls back to the Environment gate.
      - name: Resolve inherited paid approval
        id: inherit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The identity the grade job commits partials under. Kept in lockstep
          # with the `git config user.email` in the commit step below.
          GRADE_BOT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -uo pipefail

          emit() {
            echo "approval_inherited=$1" >> "$GITHUB_OUTPUT"
            echo "[inherit] approval_inherited=$1"
          }
          deny() {
            echo "[inherit] $1 -- requiring the Environment approval"
            emit false
            exit 0
          }

          # This step is an optimisation for chunk >= 1. It must never be able
          # to fail the job, or a bug here would block chunk 0 -- the path that
          # does not use inheritance at all. Any unexpected error denies.
          trap 'deny "unexpected failure near line $LINENO"' ERR
          set -e

          if [[ "$GRADE_DRY_RUN" != "false" || "$GRADE_PAID_APPROVAL" != "true" ]]; then
            deny "not a paid request"
          fi
          if [[ "$GRADE_RESUME" != "true" ]] || (( 10#$GRADE_RESUME_CHUNK < 1 )); then
            deny "chunk 0 is the click that authorizes the corpus"
          fi
          # Only the in-workflow auto-retrigger dispatches under the bot
          # identity. A person hand-passing resume=true carries their own login,
          # and minting a bot dispatch requires merging a workflow to main --
          # already owner-gated.
          if [[ "$GITHUB_ACTOR" != "github-actions[bot]" ||
                "$GITHUB_TRIGGERING_ACTOR" != "github-actions[bot]" ]]; then
            deny "resume dispatched by '$GITHUB_ACTOR'/'$GITHUB_TRIGGERING_ACTOR', not the auto-retrigger"
          fi

          CONFIG_B64="$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/batch-runner/grading_configs/${GRADE_CONFIG}?ref=${GITHUB_SHA}" \
            --jq '.content // ""' || true)"
          if [[ -z "$CONFIG_B64" ]]; then
            deny "grading config ${GRADE_CONFIG} not readable at ${GITHUB_SHA}"
          fi
          if ! printf '%s' "$CONFIG_B64" | base64 -d > "${RUNNER_TEMP}/grading_config.yaml"; then
            deny "grading config ${GRADE_CONFIG} did not decode"
          fi
          CONFIG_NAME="$(awk '
            /^config_name:[[:space:]]/ {
              sub(/^config_name:[[:space:]]*/, "")
              gsub(/^"|"$/, "")
              print
              exit
            }' "${RUNNER_TEMP}/grading_config.yaml")"
          if [[ ! "$CONFIG_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            deny "config_name in ${GRADE_CONFIG} is missing or unsafe"
          fi

          SHARD_FILE="$(printf 'shard-%03d-of-%03d.json' \
            "$((10#$GRADE_SHARD_INDEX))" "$((10#$GRADE_SHARD_COUNT))")"

          # The partial's own path is the receipt. Its parent stem encodes the
          # experiment, config name, config hash, rubric SHA, inference SHA and
          # grader source hash -- so a path match is a full identity match, and
          # the file can only exist because an approved chunk wrote it.
          STEMS="$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/data/grades/_shards?ref=main" \
            --jq '.[] | select(.type == "dir") | .name' 2>/dev/null || true)"
          MATCH=""
          while IFS= read -r stem; do
            [[ -n "$stem" ]] || continue
            [[ "$stem" == "${GRADE_EXPERIMENT_YAML}__"* ]] || continue
            [[ "$stem" == *"__${CONFIG_NAME}__"* ]] || continue
            [[ "$stem" == *"__inference_${GRADE_INFERENCE_REVISION}__"* ]] || continue
            candidate="data/grades/_shards/${stem}/${SHARD_FILE}"
            if gh api "repos/${GITHUB_REPOSITORY}/contents/${candidate}?ref=main" \
                 --jq '.sha' >/dev/null 2>&1; then
              MATCH="$candidate"
              break
            fi
          done <<< "$STEMS"
          if [[ -z "$MATCH" ]]; then
            deny "no committed ${SHARD_FILE} for ${GRADE_EXPERIMENT_YAML}/${CONFIG_NAME} at inference ${GRADE_INFERENCE_REVISION}"
          fi

          AUTHOR_EMAIL="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits?path=${MATCH}&sha=main&per_page=1" \
            --jq '.[0].commit.author.email // ""' || true)"
          if [[ "$AUTHOR_EMAIL" != "$GRADE_BOT_EMAIL" ]]; then
            deny "partial ${MATCH} was last written by '${AUTHOR_EMAIL:-unknown}', not the grading job"
          fi

          echo "[inherit] continuing approved lineage via ${MATCH}"
          emit true

  approve-paid:
    name: Approve paid Sol Max grading (${{ inputs.experiment_yaml }}, ${{ inputs.grading_config }}, chunk ${{ inputs.resume_chunk }}, shard ${{ inputs.shard_index }}/${{ inputs.shard_count }})
    needs: validate-request
    # Skipped only for a bot-dispatched resume chunk that proved it continues an
    # already-approved lineage (see "Resolve inherited paid approval").
    if: >-
      ${{
        inputs.dry_run == false &&
        inputs.paid_approval == true &&
        needs.validate-request.outputs.approval_inherited != 'true'
      }}
    runs-on: ubuntu-24.04
    environment:
      name: grading
    steps:
      - name: Record approved request
        env:
          GRADE_EXPERIMENT_YAML: ${{ inputs.experiment_yaml }}
          GRADE_CONFIG: ${{ inputs.grading_config }}
          GRADE_INFERENCE_REVISION: ${{ inputs.inference_revision }}
          GRADE_TASKS_LIMIT: ${{ inputs.tasks_limit }}
          GRADE_TASKS: ${{ inputs.tasks }}
          GRADE_RESUME_CHUNK: ${{ inputs.resume_chunk }}
          GRADE_SHARD_COUNT: ${{ inputs.shard_count }}
          GRADE_SHARD_INDEX: ${{ inputs.shard_index }}
          GRADE_RUN_ORDINAL: ${{ inputs.run_ordinal }}
        run: |
          printf '%s\n' \
            "Approved paid grading request:" \
            "  experiment=$GRADE_EXPERIMENT_YAML" \
            "  config=$GRADE_CONFIG" \
            "  inference_revision=${GRADE_INFERENCE_REVISION:-initial-main-resolution}" \
            "  tasks_limit=$GRADE_TASKS_LIMIT" \
            "  tasks=${GRADE_TASKS:-<all>}" \
            "  resume_chunk=$GRADE_RESUME_CHUNK" \
            "  shard=$GRADE_SHARD_INDEX/$GRADE_SHARD_COUNT"

  # ---------------------------------------------------------------------------
  # Both grading jobs run inside the purpose-built grading image rather than on
  # the bare hosted runner. On formatting criteria the renderer *is* the
  # evidence, so whichever LibreOffice an Ubuntu mirror happened to serve that
  # morning used to decide what a score meant. The image fixes it at the build
  # the published corpus was graded on, and is pinned by digest rather than tag
  # because a tag can be repointed at a rebuild without this file changing.
  #
  #   ghcr.io/hyeonsangjeon/gdpval-grading
  #   revision  59432d4d04dbb2fad049939444bbb8cd8cc4912a
  #   renderer  LibreOffice 24.2.7.2 420(Build:2)
  #
  # No `credentials:` -- the package is public, and adding any would hand a
  # registry token to a job that has no use for one.
  #
  # ImageOS is how actions/setup-python identifies the runner image. The runner
  # exports it for its own image and not for a container, so setting it keeps
  # the action on the same tool-cache selection path it takes on the host. LANG
  # matches what the hosted runner exports; read_deliverable forces
  # LC_ALL=C.UTF-8 for the renderer either way, so this only keeps Python's
  # default encoding identical to what the corpus was graded under.
  #
  # PIP_CACHE_DIR moves pip's cache off $HOME. Steps here run as root, and the
  # runner bind-mounts $HOME=/github/home from its own work directory, so it
  # stays owned by the runner user. For root, pip does not ask whether it can
  # write the cache -- it asks who owns it, and takes anything else as the
  # sudo-without-H mistake it is guarding against (utils/filesystem.py:
  # `if os.geteuid() == 0: return path_uid == 0`). It then disables the cache,
  # and `pip cache dir` -- the first thing `cache: "pip"` runs -- exits 1
  # because there is no cache to report. The free 2026-08-24 rehearsal died
  # there. chmod does not help; only ownership does. A container-local path
  # under /root is owned by root, so the cache stays on, which matters:
  # dropping `cache: "pip"` instead would put a full PyPI download in front of
  # every paid run.
  #
  # What the image deliberately does not carry, and why that is safe:
  #   gh      -- one call site, the auto-resume dispatch below. It now POSTs to
  #              the REST endpoint that `gh workflow run` wraps, using curl,
  #              which the image does carry.
  #   ffprobe -- core/file_reader.py enriches .wav/.mp3/.mp4 *deliverables*
  #              with a duration/codec line and falls back to name and size
  #              when ffprobe is absent. Every deliverable recorded in
  #              data/grades is .pdf/.xlsx/.pptx/.docx/.png -- 2,273 file
  #              entries, zero media -- so nothing in the published corpus
  #              reaches it. It is named here because that fallback is silent
  #              and would change prompt text without moving grader_source_hash
  #              or renderer_fingerprint. test_grading_image.py fails if any
  #              new external binary joins the grading path.
  # ---------------------------------------------------------------------------
  grade-dry-run:
    needs: validate-request
    if: inputs.dry_run == true
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hyeonsangjeon/gdpval-grading@sha256:0f6782c056e31e1ea1d693fc2f8f873da160b232926fa1b6cde75c24e5344a04
      # The runner already mounts its tool cache, but at /__t, and the prebuilt
      # CPython in there was installed on the runner image with
      # RUNNER_TOOL_CACHE=/opt/hostedtoolcache. Nothing rewrites paths on the
      # way in (actions/python-versions' setup.sh only copies and symlinks), so
      # bin/pip still starts `#!/opt/hostedtoolcache/.../python3.11` -- a path
      # that does not exist under this mount name. actions/setup-python found
      # 3.11.16, reported "Successfully set up CPython", then failed to launch
      # its own pip: `spawn /__t/Python/3.11.16/x64/bin/pip ENOENT`.
      #
      # Mounting the same host directory a second time under the name its
      # shebangs already expect fixes it without a download. The alternative,
      # pointing RUNNER_TOOL_CACHE somewhere container-local, makes setup-python
      # fetch CPython fresh on every job -- a new network dependency in front of
      # a paid run, which is the shape of the 2026-08-19 apt outage.
      volumes:
        - /opt/hostedtoolcache:/opt/hostedtoolcache
    # A container job defaults `run:` to `sh -e {0}`, not to the runner's
    # `bash -e {0}` -- the runner will not assume an arbitrary image has bash.
    # The free 2026-08-24 rehearsal found it on the first step (`set: Illegal
    # option -o pipefail` under dash), but every step here is written in bash:
    # [[ ]], arrays, ${VAR%.json}. Restated as the runner's exact default
    # rather than the `shell: bash` shorthand, which would also add pipefail
    # to steps that were graded without it.
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: read
    env:
      GRADE_EXPERIMENT_YAML: ${{ inputs.experiment_yaml }}
      GRADE_CONFIG: ${{ inputs.grading_config }}
      GRADE_INFERENCE_REVISION: ${{ inputs.inference_revision }}
      GRADE_TASKS_LIMIT: ${{ inputs.tasks_limit }}
      GRADE_TASKS: ${{ inputs.tasks }}
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      GRADE_SHARD_COUNT: ${{ inputs.shard_count }}
      GRADE_SHARD_INDEX: ${{ inputs.shard_index }}
      GRADE_RUN_ORDINAL: ${{ inputs.run_ordinal }}
      ImageOS: ubuntu24
      LANG: C.UTF-8
      PIP_CACHE_DIR: /root/.cache/pip
    steps:
      - name: Verify grading container
        run: |
          set -euo pipefail
          test -f /opt/gdpval/renderer-version.txt
          cat /opt/gdpval/renderer-version.txt
          for binary in soffice fc-match git curl; do
            command -v "$binary" >/dev/null \
              || { echo "::error::$binary is missing from the grading image"; exit 1; }
          done

      # Steps in a container job run as root, while /__w is bind-mounted from
      # the runner user's home and stays owned by that user. git therefore sees
      # a repository owned by somebody else and refuses to read it at all:
      # "fatal: detected dubious ownership".
      #
      # actions/checkout does not settle this for the steps after it. It makes
      # the same exemption for its own run under a throwaway HOME -- the log
      # says "Temporarily overriding HOME=... before making global git config
      # changes" -- and drops it on the way out. The free 2026-08-24 rehearsal
      # died on the very next step, with `git rev-parse HEAD` returning
      # nothing and the SHA guard reporting a mismatch it had not really seen.
      #
      # Named exactly, never '*': this trusts the one workspace the job was
      # handed, which is the same directory checkout trusts to clone into.
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout exact main revision (read-only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false

      - name: Verify read-only checkout and input files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git symbolic-ref --quiet --short HEAD)" != "main" ]]; then
            echo "::error::checkout is not on the local main branch"
            exit 1
          fi

          # Same reasoning as the paid job's copy, which carries the full
          # explanation: the branch tip is allowed to move, the grading inputs
          # are not. Kept in step with it by
          # test_a_sibling_shards_commit_cannot_kill_a_chunk.py, which reads
          # both lists and requires them identical.
          GRADING_INPUT_PATHS=(
            .github/workflows/grade-run.yml
            batch-runner/core
            batch-runner/experiments
            batch-runner/grading_configs
            batch-runner/prompts
            batch-runner/requirements.txt
            batch-runner/schemas
            batch-runner/scripts
            batch-runner/step8_grade.py
            batch-runner/step9_merge_shards.py
          )
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$HEAD_SHA" != "$GITHUB_SHA" ]]; then
            git fetch --no-tags --quiet --depth=1 origin "$GITHUB_SHA"
            CHANGED="$(git diff --name-only "$GITHUB_SHA" "$HEAD_SHA" -- "${GRADING_INPUT_PATHS[@]}")"
            if [[ -n "$CHANGED" ]]; then
              echo "::error::grading inputs changed between the dispatched $GITHUB_SHA and the checked out $HEAD_SHA; retry from the new main"
              while IFS= read -r changed_path; do
                echo "::error::changed grading input: $changed_path"
              done <<< "$CHANGED"
              exit 1
            fi
            echo "[pin] main advanced $GITHUB_SHA -> $HEAD_SHA; no grading input differs"
          fi
          if git config --local --name-only --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo "::error::dry-run checkout must not retain repository credentials"
            exit 1
          fi

          EXPERIMENT_PATH="batch-runner/experiments/${GRADE_EXPERIMENT_YAML}.yaml"
          CONFIG_PATH="batch-runner/grading_configs/${GRADE_CONFIG}"
          for input_path in "$EXPERIMENT_PATH" "$CONFIG_PATH"; do
            if [[ ! -f "$input_path" || -L "$input_path" ]]; then
              echo "::error::required input must be a regular non-symlink file: $input_path"
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd batch-runner
          pip install -r requirements.txt

      # The paid job runs this only when the config needs the Office renderer.
      # Here it is unconditional and deliberately so: a free dry run is the
      # only place the container's renderer gets exercised before money is
      # committed, and it costs one step to learn that the pinned digest still
      # renders xlsx/pptx/docx to the bytes the judge expects.
      - name: Preflight grading renderer
        run: |
          cd batch-runner
          python scripts/preflight_grading_renderer.py

      - name: Download inference results anonymously
        run: |
          cd batch-runner
          python scripts/download_inference_from_hf.py \
            --experiment "$GRADE_EXPERIMENT_YAML" \
            --output workspace/step2_inference_results.json \
            --grading-config "grading_configs/$GRADE_CONFIG" \
            --revision "$GRADE_INFERENCE_REVISION"

      - name: Classify grading work only
        run: |
          cd batch-runner
          ARGS=(
            "$GRADE_EXPERIMENT_YAML"
            --config "grading_configs/$GRADE_CONFIG"
            --source local
            --dry-run
          )
          if [[ "$GRADE_TASKS_LIMIT" != "0" ]]; then
            ARGS+=(--limit "$GRADE_TASKS_LIMIT")
          fi
          if [[ -n "$GRADE_TASKS" ]]; then
            ARGS+=(--tasks "$GRADE_TASKS")
          fi
          # Preview this shard's slice, not the whole corpus -- otherwise the
          # dry run's task count says nothing about what the paid run will do.
          if [[ "$GRADE_SHARD_COUNT" != "1" ]]; then
            ARGS+=(--shard-count "$GRADE_SHARD_COUNT" --shard-index "$GRADE_SHARD_INDEX")
          fi
          if [[ "$GRADE_RUN_ORDINAL" != "1" ]]; then
            ARGS+=(--run-ordinal "$GRADE_RUN_ORDINAL")
          fi
          python step8_grade.py "${ARGS[@]}"

  grade:
    needs: [validate-request, approve-paid]
    # approve-paid is allowed to be 'skipped' ONLY when validate-request itself
    # certified the inheritance. Reading the output rather than trusting the
    # skip means a skip from any other cause still blocks the paid job.
    #
    # `!cancelled()` is load-bearing, not decoration: a job whose `needs` was
    # skipped is skipped too unless its `if` contains a status check function,
    # so without it this job would never run in exactly the inherited case.
    # It also keeps a cancelled run from proceeding to spend money.
    if: >-
      ${{
        !cancelled() &&
        inputs.dry_run == false &&
        inputs.paid_approval == true &&
        needs.validate-request.result == 'success' &&
        (
          needs.approve-paid.result == 'success' ||
          (
            needs.approve-paid.result == 'skipped' &&
            needs.validate-request.outputs.approval_inherited == 'true'
          )
        )
      }}
    runs-on: ubuntu-24.04
    # Same pinned grading image as grade-dry-run, for the same reason; see the
    # block above that job. The two digests must stay identical -- a dry run
    # against a different renderer than the paid run proves nothing.
    container:
      image: ghcr.io/hyeonsangjeon/gdpval-grading@sha256:0f6782c056e31e1ea1d693fc2f8f873da160b232926fa1b6cde75c24e5344a04
      # Same reason as grade-dry-run; see the note there.
      volumes:
        - /opt/hostedtoolcache:/opt/hostedtoolcache
    # Same reason as grade-dry-run; see the note there. What makes it matter
    # more here is where the bash syntax sits: Run grading, Commit grade
    # result, Merge shards, Auto-analyze and Commit analysis all use [[ ]] or
    # arrays, and all of them run after the corpus has been judged and paid
    # for. Only the two steps that already carried `shell: bash` were safe.
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: write
      id-token: write
      actions: write  # required for the auto-resume workflow dispatch
    env:
      GRADE_EXPERIMENT_YAML: ${{ inputs.experiment_yaml }}
      GRADE_CONFIG: ${{ inputs.grading_config }}
      GRADE_INFERENCE_REVISION: ${{ inputs.inference_revision }}
      GRADE_FORCE: ${{ inputs.force }}
      GRADE_TASKS_LIMIT: ${{ inputs.tasks_limit }}
      GRADE_TASKS: ${{ inputs.tasks }}
      GRADE_DRY_RUN: ${{ inputs.dry_run }}
      GRADE_PAID_APPROVAL: ${{ inputs.paid_approval }}
      GRADE_RESUME: ${{ inputs.resume }}
      GRADE_RESUME_CHUNK: ${{ inputs.resume_chunk }}
      GRADE_SHARD_COUNT: ${{ inputs.shard_count }}
      GRADE_SHARD_INDEX: ${{ inputs.shard_index }}
      GRADE_RUN_ORDINAL: ${{ inputs.run_ordinal }}
      ImageOS: ubuntu24
      LANG: C.UTF-8
      PIP_CACHE_DIR: /root/.cache/pip
    # GH Actions hosted runners have a HARD 6h (360min) timeout that cannot be
    # extended. We set 320min so step8_grade.py's internal 4h time guard (env
    # GRADER_TIME_BUDGET_SEC=14400) trips first, partial-saves, and exits 7,
    # leaving ~40min headroom for the commit + retrigger steps below.
    timeout-minutes: 320

    steps:

      # First, so a wrong or missing image costs seconds rather than a
      # checkout, a dependency install, and an Azure login. az is on this list
      # and not on the dry run's because only this job logs in.
      - name: Verify grading container
        run: |
          set -euo pipefail
          test -f /opt/gdpval/renderer-version.txt
          cat /opt/gdpval/renderer-version.txt
          for binary in soffice fc-match git curl az; do
            command -v "$binary" >/dev/null \
              || { echo "::error::$binary is missing from the grading image"; exit 1; }
          done

      # Same reason as grade-dry-run; see the note there. It carries further
      # here: this job does not only read the checkout, it commits and pushes
      # to it -- Commit grade result, Merge shards, Commit analysis -- and
      # every one of those runs after the corpus has been judged and paid for.
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Held on the v5 line on purpose. checkout v6 moved persisted
      # credentials out of .git/config into a separate file referenced by an
      # includeIf entry, and `git config --local` does not expand includes.
      # The extraheader check in the next step would stop finding the
      # credential and abort this job -- on the paid path, after dispatch.
      # tests/test_step8_grade.py holds the two together; bump both or
      # neither.
      - name: Checkout exact main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: true

      - name: Verify checked out main and input files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git symbolic-ref --quiet --short HEAD)" != "main" ]]; then
            echo "::error::checkout is not on the local main branch"
            exit 1
          fi
          if [[ "$(git rev-parse --abbrev-ref '@{upstream}')" != "origin/main" ]]; then
            echo "::error::local main does not track origin/main"
            exit 1
          fi

          # main moves between dispatch and here, and that is normal: eleven
          # shards commit their grades to the same branch, so a chunk that
          # waits on its paid-approval gate almost always comes back to a main
          # a sibling has already written to. Run 33248832615 was dispatched at
          # d5c1e18 and killed 117 seconds later because shard 3 landed
          # shard-003-of-011.json in the gap. One grade file, no code, and the
          # chunk died with its approval already spent -- an equality check on
          # the branch tip is false for the most ordinary reason there is.
          #
          # What must not move is what this job *reads*. Every path below is an
          # input to grading; nothing the job writes appears in the list. The
          # set is a deliberate superset of what `compute_grader_source_hash`
          # covers -- whole directories rather than the `.py` files and the one
          # prompt template it selects -- because erring wide can only refuse a
          # run that would have been fine, while erring narrow lets changed
          # code grade under an approval given for something else.
          GRADING_INPUT_PATHS=(
            .github/workflows/grade-run.yml
            batch-runner/core
            batch-runner/experiments
            batch-runner/grading_configs
            batch-runner/prompts
            batch-runner/requirements.txt
            batch-runner/schemas
            batch-runner/scripts
            batch-runner/step8_grade.py
            batch-runner/step9_merge_shards.py
          )
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$HEAD_SHA" != "$GITHUB_SHA" ]]; then
            # Fetching one commit by SHA into the shallow clone. `git diff`
            # needs both trees and not the history between them, so there is
            # no reason to deepen. The repository is public, so this needs no
            # credentials -- which matters in the read-only job, where they
            # are deliberately absent.
            git fetch --no-tags --quiet --depth=1 origin "$GITHUB_SHA"
            CHANGED="$(git diff --name-only "$GITHUB_SHA" "$HEAD_SHA" -- "${GRADING_INPUT_PATHS[@]}")"
            if [[ -n "$CHANGED" ]]; then
              echo "::error::grading inputs changed between the dispatched $GITHUB_SHA and the checked out $HEAD_SHA; retry from the new main"
              while IFS= read -r changed_path; do
                echo "::error::changed grading input: $changed_path"
              done <<< "$CHANGED"
              exit 1
            fi
            echo "[pin] main advanced $GITHUB_SHA -> $HEAD_SHA; no grading input differs"
          fi
          if ! git config --local --name-only --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo "::error::checkout credentials required for result publication are missing"
            exit 1
          fi

          EXPERIMENT_PATH="batch-runner/experiments/${GRADE_EXPERIMENT_YAML}.yaml"
          CONFIG_PATH="batch-runner/grading_configs/${GRADE_CONFIG}"
          for input_path in "$EXPERIMENT_PATH" "$CONFIG_PATH"; do
            if [[ ! -f "$input_path" || -L "$input_path" ]]; then
              echo "::error::required input must be a regular non-symlink file: $input_path"
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd batch-runner
          pip install -r requirements.txt

      - name: Determine renderer requirement
        id: renderer
        run: |
          cd batch-runner
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          from core.azure_ai_clients import grader_route_workloads
          from step8_grade import (
              requires_track2_office_renderer,
              validate_grading_config,
          )

          config_dir = Path("grading_configs").resolve()
          config_path = (config_dir / os.environ["GRADE_CONFIG"]).resolve()
          config_path.relative_to(config_dir)
          with config_path.open("r", encoding="utf-8") as handle:
              config = yaml.safe_load(handle)
          validate_grading_config(config)
          required = (
              os.environ["GRADE_DRY_RUN"] != "true"
              and requires_track2_office_renderer(config)
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"required={'true' if required else 'false'}\n")
              output.write(f"deployment={config['judge']['deployment']}\n")
              output.write(
                "azure_ai_workloads_json="
                + json.dumps([
                  f"{workload.value}={deployment}"
                  for workload, deployment in grader_route_workloads(config)
                ], separators=(",", ":"))
                + "\n"
              )
          PY

      - name: Validate Azure OIDC identity before remote access
        if: inputs.dry_run != true
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_AI_EXPECTED_CLIENT_ID: ${{ vars.AZURE_AI_EXPECTED_CLIENT_ID }}
          AZURE_AI_EXPECTED_TENANT_ID: ${{ vars.AZURE_AI_EXPECTED_TENANT_ID }}
          AZURE_AI_EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_AI_EXPECTED_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          cd batch-runner
          python scripts/azure_oidc_identity_preflight.py

      - name: Validate Azure AI route before remote access
        if: inputs.dry_run != true
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_AI_REQUIRE_EXPECTED_IDENTITIES: '1'
          AZURE_AI_EXPECTED_DIRECT_ACCOUNT: ${{ vars.AZURE_AI_EXPECTED_DIRECT_ACCOUNT }}
          AZURE_AI_WORKLOADS_JSON: ${{ steps.renderer.outputs.azure_ai_workloads_json }}
        run: |
          set -euo pipefail
          cd batch-runner
          python scripts/azure_ai_route_preflight.py

      # The renderer is a host binary, not a library: core/artifact_renderer.py
      # and core/tools/read_deliverable.py both shell out to `soffice`, so it
      # has to exist before grading starts. It arrives with the container now,
      # asserted at build time and again by Verify grading container above.
      #
      # It used to arrive by apt, and on 2026-08-19 that made the install step
      # the single point of failure for the 220-task run: azure.archive.ubuntu
      # .com returned Ign: for every index between 08:11 and 08:35 UTC, apt
      # fell back to archive.ubuntu.com, and that connection stalled
      # mid-transfer. apt imposes no wall-clock ceiling on itself, so five
      # grade jobs sat there for 5h18m until timeout-minutes killed them --
      # taking 63 of the 220 tasks with them and reporting nothing until the
      # job died. Timeouts and a retry loop were added afterwards; they turned
      # a silent five-hour hang into a legible failure but could not make apt
      # succeed while a mirror was down.
      #
      # The deeper problem was that apt could not give a *fixed* renderer at
      # all. Those packages carried no version, so whichever LibreOffice the
      # mirror served that day became the judge's eyes, and two runs a
      # generation apart were not comparable however identical their model,
      # prompt, and grader_source_hash. Pinning a version in apt was rejected
      # because Ubuntu drops superseded builds from the pocket, so the pin
      # would eventually fail as an opaque apt error rather than as a
      # statement about comparability. The digest-pinned image is the durable
      # answer, and it had to be ubuntu:24.04-based: gdpval-sandbox ships
      # LibreOffice 7.4.7.2 against this corpus's 24.2.7.2 and would move the
      # very scores it was meant to stabilise.
      #
      # The preflight below stays gated on the config actually needing the
      # renderer, and still asserts the version before Azure login, so drift
      # in a future rebuild costs a free step rather than a paid corpus run.
      - name: Preflight grading renderer
        if: steps.renderer.outputs.required == 'true'
        run: |
          cd batch-runner
          python scripts/preflight_grading_renderer.py

      - name: Azure Login (OIDC)
        if: inputs.dry_run != true
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure OIDC session identity
        if: inputs.dry_run != true
        env:
          AZURE_AI_EXPECTED_CLIENT_ID: ${{ vars.AZURE_AI_EXPECTED_CLIENT_ID }}
          AZURE_AI_EXPECTED_TENANT_ID: ${{ vars.AZURE_AI_EXPECTED_TENANT_ID }}
          AZURE_AI_EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_AI_EXPECTED_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          cd batch-runner
          python scripts/azure_oidc_identity_preflight.py --verify-session

      - name: Verify Azure AI token before grading
        if: inputs.dry_run != true
        env:
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_AI_REQUIRE_EXPECTED_IDENTITIES: '1'
          AZURE_AI_EXPECTED_DIRECT_ACCOUNT: ${{ vars.AZURE_AI_EXPECTED_DIRECT_ACCOUNT }}
          AZURE_AI_WORKLOADS_JSON: ${{ steps.renderer.outputs.azure_ai_workloads_json }}
        run: |
          set -euo pipefail
          cd batch-runner
          python scripts/azure_ai_route_preflight.py --verify-token

      - name: Download inference results from HF
        id: inference
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd batch-runner
          python scripts/download_inference_from_hf.py \
            --experiment "$GRADE_EXPERIMENT_YAML" \
            --output workspace/step2_inference_results.json \
            --grading-config "grading_configs/$GRADE_CONFIG" \
            --revision "$GRADE_INFERENCE_REVISION"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          payload = json.loads(
              Path("workspace/step2_inference_results.json").read_text(encoding="utf-8")
          )
          revision = payload.get("source_revision")
          if not isinstance(revision, str) or not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("canonical source_revision is not a full lowercase HF SHA")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"revision={revision}\n")
          PY

      - name: Run grading
        id: grade
        env:
          AZURE_AI_ROUTE_PROFILE: ${{ !inputs.dry_run && 'direct-v1' || '' }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ !inputs.dry_run && secrets.FOUNDRY_PROJECT_ENDPOINT || '' }}
          AZURE_AI_REQUIRE_EXPECTED_IDENTITIES: ${{ !inputs.dry_run && '1' || '0' }}
          AZURE_AI_EXPECTED_DIRECT_ACCOUNT: ${{ !inputs.dry_run && vars.AZURE_AI_EXPECTED_DIRECT_ACCOUNT || '' }}
          # Force unbuffered Python stdout so per-task progress prints
          # appear in the GH Actions log in real time. Without this, GHA's
          # pipe-style stdout triggers full-buffer mode and the log looks
          # frozen for many minutes between flushes.
          PYTHONUNBUFFERED: "1"
          # 4-hour internal time budget. step8_grade.py partial-saves and
          # exits 7 when this trips, letting the workflow self-retrigger
          # below before the 320-min job timeout-kills the runner.
          GRADER_TIME_BUDGET_SEC: "14400"
        run: |
          cd batch-runner
          ARGS=(
            "$GRADE_EXPERIMENT_YAML"
            --config "grading_configs/$GRADE_CONFIG"
            --source local
          )

          # --force and --resume are mutually exclusive in semantics; only
          # the first chunk should honor --force, subsequent resume chunks
          # must NOT pass it (would wipe the partial).
          if [[ "$GRADE_RESUME" == "true" ]]; then
            ARGS+=(--resume)
          elif [[ "$GRADE_FORCE" == "true" ]]; then
            ARGS+=(--force)
          fi
          if [[ "$GRADE_DRY_RUN" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          if [[ "$GRADE_TASKS_LIMIT" != "0" ]]; then
            ARGS+=(--limit "$GRADE_TASKS_LIMIT")
          fi
          if [[ -n "$GRADE_TASKS" ]]; then
            ARGS+=(--tasks "$GRADE_TASKS")
          fi
          # Shard flags change WHO grades WHAT, never what is in scope: the
          # payload still declares the full 220-task identity, so every shard
          # shares one cache key and step9 can prove the set is complete. The
          # slice only forks the output path (data/grades/_shards/...), which
          # is what lets N jobs commit without contending for one file.
          if [[ "$GRADE_SHARD_COUNT" != "1" ]]; then
            ARGS+=(--shard-count "$GRADE_SHARD_COUNT" --shard-index "$GRADE_SHARD_INDEX")
          fi
          # A repeat changes nothing about what is graded or how -- that is the
          # entire point, since a rerun only measures movement if everything
          # else held still. It forks the output path so the repeat sits beside
          # the run it repeats instead of replacing it.
          if [[ "$GRADE_RUN_ORDINAL" != "1" ]]; then
            ARGS+=(--run-ordinal "$GRADE_RUN_ORDINAL")
          fi

          set +e
          python step8_grade.py "${ARGS[@]}"
          RC=$?
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "[grade-step] step8_grade.py exited with rc=$RC"
          # Treat 0 (done) and 7 (chunk-resume) as success at the step
          # level so subsequent commit/retrigger steps always run. Any
          # other non-zero is a real failure → fail loud below.
          if [[ "$RC" != "0" && "$RC" != "7" ]]; then
            exit "$RC"
          fi

      - name: Commit grade result
        id: commit_grade
        if: always() && steps.grade.conclusion == 'success' && (steps.grade.outputs.rc == '0' || steps.grade.outputs.rc == '7') && inputs.dry_run == false
        env:
          EXPECTED_GRADE_STATUS: ${{ steps.grade.outputs.rc == '7' && 'partial' || steps.grade.outputs.grade_status }}
          COST_LEDGER_FILE: ${{ steps.grade.outputs.cost_ledger_file }}
          COST_LEDGER_SHA256: ${{ steps.grade.outputs.cost_ledger_sha256 }}
        run: |
          GRADE_FILE="${{ steps.grade.outputs.grade_file }}"
          if [[ -z "$GRADE_FILE" || ! -f "$GRADE_FILE" ]]; then
            echo "::error::resolved grade file is missing: $GRADE_FILE"
            exit 1
          fi
          python - "$GRADE_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "batch-runner")
          from core.grade_payload import validate_grade_payload

          grade_path = Path(sys.argv[1])
          schema_path = Path("batch-runner/schemas/grade.schema.json")
          payload = json.loads(grade_path.read_text(encoding="utf-8"))
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          validate_grade_payload(payload, schema)
          if not isinstance(payload.get("tasks"), list):
              raise SystemExit("grade payload has no tasks array")
          if payload.get("run_status") != os.environ["EXPECTED_GRADE_STATUS"]:
              raise SystemExit("grade payload run_status does not match exit code")
          PY
          GRADE_BLOB_SHA="$(python - "$GRADE_FILE" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )"
          if [[ ! "$GRADE_BLOB_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::failed to compute pre-rebase grade SHA-256"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$GRADE_FILE"
          # The per-call cost ledger travels with the grade it belongs to.
          #
          # It has to be committed, not merely uploaded: step9_merge_shards
          # looks for each shard's ledger *beside that shard's JSON* in the
          # checkout, and a resumed chunk rebuilds its ledger by importing the
          # export the previous chunk left there. Both of those read from the
          # repository, because a chunk gets a fresh runner and the workspace
          # the ledger was written into is gone by the time anyone looks. Until
          # this line existed the file was never committed anywhere, so the
          # merge silently dropped every shard's ledger and each chunk counted
          # only its own calls.
          if [[ -n "$COST_LEDGER_FILE" ]]; then
            if [[ "$COST_LEDGER_FILE" == /* || "$COST_LEDGER_FILE" == *$'\n'* || "$COST_LEDGER_FILE" != data/grades/*.cost_ledger.jsonl || ! -f "$COST_LEDGER_FILE" || -L "$COST_LEDGER_FILE" ]]; then
              echo "::error::resolved cost ledger path is invalid: $COST_LEDGER_FILE"
              exit 1
            fi
            LEDGER_BLOB_SHA="$(python - "$COST_LEDGER_FILE" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )"
            if [[ "$LEDGER_BLOB_SHA" != "$COST_LEDGER_SHA256" ]]; then
              echo "::error::cost ledger on disk does not match the digest step8 published"
              exit 1
            fi
            git add -- "$COST_LEDGER_FILE"
            echo "[cost] committing ledger $COST_LEDGER_FILE ($LEDGER_BLOB_SHA)"
          else
            echo "::warning::this grade carries no cost ledger; its per-call costs will not survive the run"
          fi
          if git diff --staged --quiet; then
            if [[ "${{ steps.grade.outputs.rc }}" == "7" ]]; then
              echo "::error::rc=7 requires a newly persisted partial grade diff"
              exit 1
            fi
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No grade file changes (likely skip-cache hit)"
            exit 0
          fi
          if [[ "${{ steps.grade.outputs.rc }}" == "7" ]]; then
            MSG="chore(grades): partial chunk $GRADE_RESUME_CHUNK for $GRADE_EXPERIMENT_YAML via $GRADE_CONFIG"
          else
            MSG="chore(grades): grade $GRADE_EXPERIMENT_YAML via $GRADE_CONFIG"
          fi
          if [[ "$GRADE_SHARD_COUNT" != "1" ]]; then
            # Every sharded commit is a partial by construction, so say which
            # slice it is -- the log is the only place that distinguishes N
            # simultaneous commits touching sibling files.
            MSG="$MSG [shard $GRADE_SHARD_INDEX of $GRADE_SHARD_COUNT]"
          fi
          git commit -m "$MSG"
          # N shards push to one branch on purpose, so losing a push race is
          # the expected case rather than a fault. Today the first rejection
          # ends the job -- after the grading is already paid for -- and takes
          # the auto-resume chain with it, since that step gates on
          # committed=true. So a few seconds of contention can cost a slice.
          #
          # Every guard sits inside the loop, not ahead of it. Each rebase is
          # another chance for the tree to move, and checking once and then
          # pushing six times would be checking a tree we are no longer the
          # one pushing. The rebase itself is deliberately not retried: `set
          # -e` still ends the step if it conflicts, because two shards
          # writing different bytes into one grade file is a real fault and
          # not contention.
          #
          # Any push failure retries, unclassified. A permissions or network
          # error will not recover, but it costs ~90s to establish that and
          # the final attempt still prints git's own message. Pattern-matching
          # git's rejection wording would be one more thing to get wrong.
          PUSHED=false
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if [[ ! -f "$GRADE_FILE" ]]; then
              echo "::error::grade file disappeared after rebase: $GRADE_FILE"
              exit 1
            fi
            POST_REBASE_GRADE_BLOB_SHA="$(python - "$GRADE_FILE" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
            )"
            if [[ "$POST_REBASE_GRADE_BLOB_SHA" != "$GRADE_BLOB_SHA" ]]; then
              echo "::error::grade file changed during rebase"
              exit 1
            fi
            python - "$GRADE_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "batch-runner")
          from core.grade_payload import validate_grade_payload

          grade_path = Path(sys.argv[1])
          schema_path = Path("batch-runner/schemas/grade.schema.json")
          payload = json.loads(grade_path.read_text(encoding="utf-8"))
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          validate_grade_payload(payload, schema)
          if not isinstance(payload.get("tasks"), list):
              raise SystemExit("post-rebase grade payload has no tasks array")
          if payload.get("run_status") != os.environ["EXPECTED_GRADE_STATUS"]:
              raise SystemExit("post-rebase grade run_status does not match exit code")
          PY
            if git push; then
              PUSHED=true
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then
              break
            fi
            # Jittered, or nine shards that collided once line up to collide
            # again on the same schedule.
            BACKOFF=$(( attempt * 5 + RANDOM % 5 ))
            echo "::warning::push attempt $attempt rejected; rebasing and retrying in ${BACKOFF}s"
            sleep "$BACKOFF"
          done
          if [[ "$PUSHED" != "true" ]]; then
            echo "::error::could not push the grade file to ${GITHUB_REF_NAME} after 6 attempts"
            exit 1
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Auto-retrigger next chunk (time budget hit)
        if: steps.grade.outputs.rc == '7' && steps.commit_grade.outputs.committed == 'true' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVED_INFERENCE_REVISION: ${{ steps.inference.outputs.revision }}
        run: |
          set -euo pipefail
          NEXT_CHUNK=$(( GRADE_RESUME_CHUNK + 1 ))
          if [[ $NEXT_CHUNK -gt 10 ]]; then
            echo "::error::resume_chunk=$NEXT_CHUNK exceeds safety cap (10). Aborting auto-resume; investigate manually."
            exit 1
          fi
          echo "[auto-resume] triggering chunk $NEXT_CHUNK for $GRADE_EXPERIMENT_YAML / $GRADE_CONFIG (shard $GRADE_SHARD_INDEX/$GRADE_SHARD_COUNT, run $GRADE_RUN_ORDINAL)"
          # This used to be `gh workflow run`, which is a thin wrapper over the
          # endpoint below; gh is not in the grading image. Every input is a
          # JSON string, including the booleans, because that is what gh sent
          # and what the dispatch API accepts. Building the body in Python
          # rather than by string concatenation keeps a value containing a
          # quote from silently producing a different dispatch.
          export NEXT_CHUNK
          python - <<'PY' > "$RUNNER_TEMP/auto-resume.json"
          import json
          import os

          print(json.dumps({
              "ref": os.environ["GITHUB_REF_NAME"],
              "inputs": {
                  "experiment_yaml": os.environ["GRADE_EXPERIMENT_YAML"],
                  "grading_config": os.environ["GRADE_CONFIG"],
                  "inference_revision": os.environ["RESOLVED_INFERENCE_REVISION"],
                  "force": "false",
                  "tasks_limit": os.environ["GRADE_TASKS_LIMIT"],
                  # Carried for the same reason as the ordinal below: the
                  # scope narrowing is what put this run's output under
                  # _diagnostic/<scope_sha>/, and a chunk that resumed without
                  # it would grade the whole corpus into a different path,
                  # abandoning the partial it was dispatched to finish.
                  "tasks": os.environ["GRADE_TASKS"],
                  "dry_run": "false",
                  "paid_approval": os.environ["GRADE_PAID_APPROVAL"],
                  "resume": "true",
                  "resume_chunk": os.environ["NEXT_CHUNK"],
                  "shard_count": os.environ["GRADE_SHARD_COUNT"],
                  "shard_index": os.environ["GRADE_SHARD_INDEX"],
                  # Load-bearing: a repeat that runs out of its four hours
                  # resumes from a partial under _repeats/. Dropping the
                  # ordinal here would send the next chunk to run 1's path,
                  # where it would either be refused or overwrite the run this
                  # one exists to be compared against.
                  "run_ordinal": os.environ["GRADE_RUN_ORDINAL"],
              },
          }))
          PY
          # --fail-with-body, not --fail: a dispatch rejected for a bad input
          # explains itself in the response body, and a silent 422 here strands
          # the run with its budget already spent.
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "@$RUNNER_TEMP/auto-resume.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/grade-run.yml/dispatches"
          echo "[auto-resume] chunk $NEXT_CHUNK dispatched"

      - name: Merge shards into the final grade
        id: merge_shards
        if: steps.grade.outputs.rc == '0' && inputs.dry_run == false && inputs.shard_count > 1
        env:
          SHARD_GRADE_FILE: ${{ steps.grade.outputs.grade_file }}
        run: |
          set -euo pipefail
          # This shard has finished a chunk of its slice. Sibling partials
          # only become visible after a pull, so pull before looking.
          #
          # Whichever shard sees a complete corpus performs the merge. If two
          # race, step9 is deterministic and order-independent, so both produce
          # byte-identical output and the loser's `git diff --staged --quiet`
          # turns its commit into a no-op. That is why no lock is needed.
          #
          # Who merges is decided by the union of graded tasks, not by file
          # count. A shard holds a fraction of the corpus, so its file is
          # always run_status=partial and republished after every resume
          # chunk. On a multi-chunk run all N files therefore exist long
          # before all N slices are complete, and each shard that arrives
          # here early finds a short union. The shard that completes the
          # corpus is the one that sees a full union, and it always exists
          # because some shard grades the last task.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

          SHARD_DIR="$(dirname -- "$SHARD_GRADE_FILE")"
          # Expected shape: <output_root>/_shards/<canonical_stem>/shard-NNN-of-NNN.json
          # Derive the final from the _shards/ parent instead of hardcoding
          # data/grades/. A run that also forks into _diagnostic/<scope_sha>/
          # then merges into ITS root rather than hard-failing here, after the
          # money is already spent. Still pinned under data/grades/, still
          # rejecting traversal, newlines and symlinked directories.
          if [[ "$SHARD_GRADE_FILE" == *$'\n'* || "$SHARD_GRADE_FILE" == *..* ]]; then
            echo "::error::shard grade path is not a safe relative path"
            exit 1
          fi
          if [[ "$SHARD_DIR" != data/grades/* || "$SHARD_DIR" != */_shards/* ]]; then
            echo "::error::sharded run resolved an unexpected output directory: $SHARD_DIR"
            exit 1
          fi
          if [[ ! -d "$SHARD_DIR" || -L "$SHARD_DIR" ]]; then
            echo "::error::shard directory is not a real directory: $SHARD_DIR"
            exit 1
          fi
          STEM="$(basename -- "$SHARD_DIR")"
          FINAL_FILE="${SHARD_DIR%/_shards/*}/${STEM}.json"
          if [[ -L "$FINAL_FILE" ]]; then
            echo "::error::refusing to merge through a symlinked output: $FINAL_FILE"
            exit 1
          fi
          COUNT=$(( 10#$GRADE_SHARD_COUNT ))

          SHARDS=()
          for index in $(seq 0 $(( COUNT - 1 ))); do
            candidate="$(printf '%s/shard-%03d-of-%03d.json' "$SHARD_DIR" "$index" "$COUNT")"
            if [[ ! -f "$candidate" || -L "$candidate" ]]; then
              echo "[merge] shard $index of $COUNT is not published yet; a later shard will merge"
              echo "merged=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            SHARDS+=("$candidate")
          done

          echo "[merge] all $COUNT shard file(s) published; checking whether the corpus is complete"
          # A shard file on disk means "this shard graded something", not
          # "this shard is done": under resume, each chunk publishes its
          # slice-so-far. So presence alone cannot identify the last shard,
          # and every shard that finishes a chunk arrives here to find a union
          # that may still be short. That is the normal state, not a fault --
          # --defer-if-incomplete exits 75 so this shard stands down instead
          # of painting a healthy run red. Only a union that is complete but
          # unmergeable is still a failure.
          #
          # --force: a shard that loses the race re-merges over a byte-identical
          # file. step9 refuses an existing output otherwise, which would fail
          # the loser for doing exactly the right thing.
          merge_rc=0
          python batch-runner/step9_merge_shards.py "${SHARDS[@]}" \
            --output "$FINAL_FILE" --force --defer-if-incomplete || merge_rc=$?
          if [[ "$merge_rc" -eq 75 ]]; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$merge_rc" -ne 0 ]]; then
            exit "$merge_rc"
          fi

          python - "$FINAL_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "batch-runner")
          from core.grade_payload import validate_grade_payload

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          schema = json.loads(
              Path("batch-runner/schemas/grade.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          validate_grade_payload(payload, schema)
          if payload.get("run_status") != "final":
              raise SystemExit("merged payload must be final")
          tasks = payload.get("tasks")
          expected = payload.get("expected_task_count")
          if not isinstance(tasks, list) or len(tasks) != expected:
              raise SystemExit(
                  f"merged payload holds {len(tasks or [])} of {expected} tasks"
              )
          PY

          git add -- "$FINAL_FILE"
          if git diff --staged --quiet; then
            echo "[merge] identical merge is already on main (another shard won the race)"
          else
            git commit -m "chore(grades): merge $COUNT shards for $GRADE_EXPERIMENT_YAML via $GRADE_CONFIG"
            # A sibling can still push its own merge in the window between the
            # pull above and this push. That is safe at the git level too: the
            # rebase drops our commit by patch-id, and even if it did not, an
            # add/add of byte-identical content resolves without conflict.
            # Safe, but not automatic -- the push is still rejected as
            # non-fast-forward, and a rejection here fails the one shard that
            # completed the corpus. So rebase and try again.
            MERGE_PUSHED=false
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin "${GITHUB_REF_NAME}"
              if git push; then
                MERGE_PUSHED=true
                break
              fi
              if [[ "$attempt" -eq 6 ]]; then
                break
              fi
              BACKOFF=$(( attempt * 5 + RANDOM % 5 ))
              echo "::warning::merge push attempt $attempt rejected; rebasing and retrying in ${BACKOFF}s"
              sleep "$BACKOFF"
            done
            if [[ "$MERGE_PUSHED" != "true" ]]; then
              echo "::error::could not push the merged grade to ${GITHUB_REF_NAME} after 6 attempts"
              exit 1
            fi
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "grade_file=$FINAL_FILE" >> "$GITHUB_OUTPUT"

      - name: Auto-analyze (final chunk only)
        id: analysis
        # Serial: rc=0 means the run finished. Sharded: rc=0 means only THIS
        # slice finished, so analysing here would publish an analysis of 1/N of
        # the corpus. Wait for the merge to declare the whole run complete.
        if: >-
          inputs.dry_run == false &&
          ((inputs.shard_count == 1 && steps.grade.outputs.rc == '0') ||
          steps.merge_shards.outputs.merged == 'true')
        env:
          ANALYSIS_GRADE_FILE: ${{ steps.merge_shards.outputs.grade_file || steps.grade.outputs.grade_file }}
        run: |
          # Serial: rc=0 means step8 completed every task (single-shot or last
          # resume chunk). Sharded: the merge step above just proved the whole
          # corpus is assembled, and hands over the merged final's path.
          # Analyze that exact JSON and emit a markdown analysis (wall-clock,
          # latency, tokens, cost estimate, top-5 slowest, quality summary).
          GRADE_FILE="$ANALYSIS_GRADE_FILE"
          if [[ -z "$GRADE_FILE" || ! -f "$GRADE_FILE" ]]; then
            echo "::error::resolved grade file is missing for $GRADE_EXPERIMENT_YAML: $GRADE_FILE"
            exit 1
          fi
          OUT="$(python scripts/analyze_grade_run.py "$GRADE_FILE" --auto-out)"
          if [[ "$OUT" == /* || "$OUT" == *$'\n'* || ! -f "$OUT" || -L "$OUT" ]]; then
            echo "::error::analysis output is not a safe regular file"
            exit 1
          fi
          echo "analysis_file=$OUT" >> "$GITHUB_OUTPUT"
          echo "[analyze] wrote $OUT"
          echo "----- preview -----"
          head -40 "$OUT"

      - name: Commit analysis
        # Follow the analyze step exactly. Gating on rc alone would fire on a
        # shard that produced no analysis, and the emptiness guard below would
        # then fail the job for correctly declining to analyze 1/N of a corpus.
        if: steps.analysis.outcome == 'success' && inputs.dry_run == false
        env:
          ANALYSIS_FILE: ${{ steps.analysis.outputs.analysis_file }}
        run: |
          if [[ -z "$ANALYSIS_FILE" || "$ANALYSIS_FILE" == /* || "$ANALYSIS_FILE" == *$'\n'* || "$ANALYSIS_FILE" != data/grades/*.analysis.md || ! -f "$ANALYSIS_FILE" || -L "$ANALYSIS_FILE" ]]; then
            echo "::error::resolved analysis file is invalid"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$ANALYSIS_FILE"
          if git diff --staged --quiet; then
            echo "[analyze] no analysis changes to commit"
            exit 0
          fi
          git commit -m "docs(grading): auto-analysis for $GRADE_EXPERIMENT_YAML ($GRADE_CONFIG)"
          # Same race as the grade and merge pushes above. This one runs last,
          # so it is the most likely to find the branch moved under it.
          ANALYSIS_PUSHED=false
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push; then
              ANALYSIS_PUSHED=true
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then
              break
            fi
            BACKOFF=$(( attempt * 5 + RANDOM % 5 ))
            echo "::warning::analysis push attempt $attempt rejected; rebasing and retrying in ${BACKOFF}s"
            sleep "$BACKOFF"
          done
          if [[ "$ANALYSIS_PUSHED" != "true" ]]; then
            echo "::error::could not push the analysis to ${GITHUB_REF_NAME} after 6 attempts"
            exit 1
          fi

      - name: Upload cost ledger
        # Deliberately *not* gated on steps.grade.outputs.grade_file. That
        # output is written inside the save path, so a run that dies before its
        # first save has none -- which is exactly the run whose costs most need
        # preserving. Shard 4 of the first Stage 3 attempt spent five hours and
        # left `{"total_count":0,"artifacts":[]}` behind, because this upload
        # did not exist and the grade upload below had nothing to trigger on.
        #
        # Both sidecars go up. The JSONL is the portable record with a digest;
        # the sqlite3 is what the process was writing into as it went, so it
        # survives even a kill that never let the exporter run.
        if: always() && inputs.dry_run == false
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cost-ledger-${{ env.GRADE_EXPERIMENT_YAML }}${{ inputs.shard_count > 1 && format('-shard{0}of{1}', inputs.shard_index, inputs.shard_count) || '' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/grades/**/*.cost_ledger.jsonl
            data/grades/**/*.cost_ledger.sqlite3
          if-no-files-found: warn
          retention-days: 90

      - name: Upload grade artifact
        if: always() && inputs.dry_run == false && steps.grade.outputs.grade_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Shards are separate workflow runs, so the names cannot collide --
          # but a downloaded bundle is unreadable without knowing which slice it
          # holds, and the merging shard carries the final on top of its own.
          name: grade-${{ env.GRADE_EXPERIMENT_YAML }}${{ inputs.shard_count > 1 && format('-shard{0}of{1}', inputs.shard_index, inputs.shard_count) || '' }}
          path: |
            ${{ steps.grade.outputs.grade_file }}
            ${{ steps.merge_shards.outputs.grade_file }}
            ${{ steps.analysis.outputs.analysis_file }}
          retention-days: 30
