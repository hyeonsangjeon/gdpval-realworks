name: Preflight Track 2 Cohort

on:
  workflow_dispatch:
    inputs:
      experiment_yaml:
        description: "Experiment YAML name without .yaml"
        required: true
        type: string
      grading_config:
        description: "Grading config file under batch-runner/grading_configs/"
        required: true
        type: string
      expected_repository_commit:
        description: "Exact repository commit to preflight"
        required: true
        type: string
      expected_plan_json:
        description: "JSON object containing all pinned cohort identities"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PREFLIGHT_EXPERIMENT: ${{ inputs.experiment_yaml }}
      PREFLIGHT_CONFIG: ${{ inputs.grading_config }}
      EXPECTED_REPOSITORY_COMMIT: ${{ inputs.expected_repository_commit }}
      EXPECTED_PLAN_JSON: ${{ inputs.expected_plan_json }}

    steps:
      - name: Validate workflow inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          basename = re.compile(r"^[A-Za-z0-9._-]{1,128}$")
          task_id = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$")
          repo_id = re.compile(
              r"^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$"
          )
          hex_lengths = {
              "source_revision": 40,
              "planner_source_hash": 64,
              "config_hash": 16,
              "grader_source_hash": 64,
              "rubric_sha": 40,
          }
          expected_keys = {
              "source_repo",
              "source_revision",
              "tasks_limit",
              "planner_source_hash",
              "config_hash",
              "grader_source_hash",
              "rubric_sha",
              "task_ids",
          }

          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate JSON key: {key}")
                  value[key] = item
              return value

          if not basename.fullmatch(os.environ["PREFLIGHT_EXPERIMENT"]):
              raise SystemExit("experiment_yaml must be a safe basename")
          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Track 2 preflight must be dispatched from main")
          config = os.environ["PREFLIGHT_CONFIG"]
          if not basename.fullmatch(config) or not config.endswith((".yaml", ".yml")):
              raise SystemExit("grading_config must be a safe YAML basename")
          repository_commit = os.environ["EXPECTED_REPOSITORY_COMMIT"]
          if not re.fullmatch(r"[0-9a-f]{40}", repository_commit):
              raise SystemExit("expected_repository_commit must be a full lowercase SHA")
          if repository_commit != os.environ["GITHUB_SHA"].lower():
              raise SystemExit("expected_repository_commit must equal GITHUB_SHA")

          try:
              plan = json.loads(
                os.environ["EXPECTED_PLAN_JSON"],
                object_pairs_hook=unique_object,
              )
          except (json.JSONDecodeError, ValueError) as exc:
              raise SystemExit("expected_plan_json must be valid JSON") from exc
          if not isinstance(plan, dict) or set(plan) != expected_keys:
              raise SystemExit("expected_plan_json has an invalid key set")
          if not repo_id.fullmatch(plan["source_repo"]):
              raise SystemExit("source_repo must be owner/name")
          for name, length in hex_lengths.items():
              value = plan[name]
              if not isinstance(value, str) or not re.fullmatch(
                  rf"[0-9a-f]{{{length}}}", value
              ):
                  raise SystemExit(
                      f"{name} must be {length} lowercase hex characters"
                  )
          limit = plan["tasks_limit"]
          if not isinstance(limit, int) or isinstance(limit, bool) or limit <= 0:
              raise SystemExit("tasks_limit must be a positive integer")
          task_ids = plan["task_ids"]
          if not isinstance(task_ids, list) or not all(
              isinstance(value, str) and task_id.fullmatch(value)
              for value in task_ids
          ):
              raise SystemExit("expected_task_ids_json must be an array of task IDs")
          if len(task_ids) != limit:
              raise SystemExit("expected task ID count must equal tasks_limit")
          if len(set(task_ids)) != len(task_ids):
              raise SystemExit("expected task IDs must be unique")

          values = {
              "PREFLIGHT_INFERENCE_REVISION": plan["source_revision"],
              "PREFLIGHT_TASKS_LIMIT": str(limit),
              "EXPECTED_SOURCE_REPO": plan["source_repo"],
              "EXPECTED_PLANNER_SOURCE_HASH": plan["planner_source_hash"],
              "EXPECTED_CONFIG_HASH": plan["config_hash"],
              "EXPECTED_GRADER_SOURCE_HASH": plan["grader_source_hash"],
              "EXPECTED_RUBRIC_SHA": plan["rubric_sha"],
              "EXPECTED_TASK_IDS_JSON": json.dumps(task_ids, separators=(",", ":")),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name, value in values.items():
                  output.write(f"{name}={value}\n")
          PY

      - name: Checkout exact repository commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.expected_repository_commit }}
          persist-credentials: false

      - name: Verify checked out repository identity
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_HEAD" != "$EXPECTED_REPOSITORY_COMMIT" ]]; then
            echo "::error::checked out HEAD does not match expected repository commit"
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::repository worktree must be clean after checkout"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          cache: "pip"
          cache-dependency-path: batch-runner/requirements-track2-preflight.lock

      - name: Install batch-runner dependencies
        run: |
          cd batch-runner
          python -m pip install --require-hashes --only-binary=:all: \
            -r requirements-track2-preflight.lock

      - name: Verify source and local planner identities
        run: |
          cd batch-runner
          python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          from scripts.preflight_track2_cohort import _planner_source_hash
          from step8_grade import compute_grader_source_hash, hash_config

          experiment_path = Path("experiments") / f"{os.environ['PREFLIGHT_EXPERIMENT']}.yaml"
          experiment = yaml.safe_load(experiment_path.read_text(encoding="utf-8"))
          actual_source_repo = str(
              (experiment or {}).get("data", {}).get("source", "")
          ).strip()
          if actual_source_repo != os.environ["EXPECTED_SOURCE_REPO"]:
              raise SystemExit(
                  "experiment source mismatch before HF download: "
                  f"expected={os.environ['EXPECTED_SOURCE_REPO']}, "
                  f"actual={actual_source_repo}"
              )

          config_path = Path("grading_configs") / os.environ["PREFLIGHT_CONFIG"]
          config = yaml.safe_load(config_path.read_text(encoding="utf-8"))
          checks = {
              "planner source hash": (
                  os.environ["EXPECTED_PLANNER_SOURCE_HASH"],
                  _planner_source_hash(),
              ),
              "config hash": (
                  os.environ["EXPECTED_CONFIG_HASH"],
                  hash_config(str(config_path)),
              ),
              "grader source hash": (
                  os.environ["EXPECTED_GRADER_SOURCE_HASH"],
                  compute_grader_source_hash(config_path, config),
              ),
          }
          for label, (expected, actual) in checks.items():
              if expected != actual:
                  raise SystemExit(
                      f"{label} mismatch before HF download: "
                      f"expected={expected}, actual={actual}"
                  )
          PY

      - name: Record planner environment
        run: |
          mkdir -p batch-runner/workspace
          {
            python --version
            python -m pip --version
            python -m pip freeze --all
          } > batch-runner/workspace/track2_preflight_environment.txt

      - name: Download pinned inference and deliverables
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd batch-runner
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          command = [
              sys.executable,
              "scripts/download_inference_from_hf.py",
              "--experiment",
              os.environ["PREFLIGHT_EXPERIMENT"],
              "--output",
              "workspace/step2_inference_results.json",
              "--revision",
              os.environ["PREFLIGHT_INFERENCE_REVISION"],
          ]
          for task_id in json.loads(os.environ["EXPECTED_TASK_IDS_JSON"]):
              command.extend(("--expected-leading-task-id", task_id))
          subprocess.run(command, check=True)
          PY

      - name: Run exact model-free cohort planner
        id: planner
        run: |
          cd batch-runner
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          task_ids = json.loads(os.environ["EXPECTED_TASK_IDS_JSON"])
          command = [
              sys.executable,
              "scripts/preflight_track2_cohort.py",
              "--config",
              f"grading_configs/{os.environ['PREFLIGHT_CONFIG']}",
              "--inference",
              "workspace/step2_inference_results.json",
              "--upload-root",
              "workspace/upload",
              "--limit",
              os.environ["PREFLIGHT_TASKS_LIMIT"],
              "--expected-source-repo",
              os.environ["EXPECTED_SOURCE_REPO"],
              "--expected-source-revision",
              os.environ["PREFLIGHT_INFERENCE_REVISION"],
              "--expected-repository-commit",
              os.environ["EXPECTED_REPOSITORY_COMMIT"],
              "--expected-planner-source-hash",
              os.environ["EXPECTED_PLANNER_SOURCE_HASH"],
              "--expected-config-hash",
              os.environ["EXPECTED_CONFIG_HASH"],
              "--expected-grader-source-hash",
              os.environ["EXPECTED_GRADER_SOURCE_HASH"],
              "--expected-rubric-sha",
              os.environ["EXPECTED_RUBRIC_SHA"],
          ]
          for task_id in task_ids:
              command.extend(("--expected-task-id", task_id))
          command.extend(("--output", "workspace/track2_cohort_plan.json"))
          subprocess.run(command, check=True)
          PY

      - name: Publish plan summary
        if: always()
        env:
          PLANNER_OUTCOME: ${{ steps.planner.outcome }}
        run: |
          if [[ ! -d batch-runner ]]; then
            printf '## Track 2 cohort preflight\n\nCheckout was not completed.\n' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd batch-runner
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan_path = Path("workspace/track2_cohort_plan.json")
          if not plan_path.is_file():
              with open(
                  os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8"
              ) as output:
                output.write("## Track 2 cohort preflight\n\nPlan was not produced.\n")
                if os.environ["PLANNER_OUTCOME"] == "success":
                  raise SystemExit("planner succeeded without producing a plan")
                raise SystemExit(0)
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          keys = (
              "planner_contract",
              "planner_source_hash",
              "repository_commit",
              "source_repo_id",
              "source_revision",
              "config_hash",
              "grader_source_hash",
              "rubric_sha",
              "ordered_task_ids",
              "rubric_items",
              "precheck_candidates",
              "precheck_resolved",
              "precheck_fallbacks",
              "judge_routes",
              "planned_main_judgments",
              "planned_render_calls",
              "planned_audio_calls",
              "planned_perception_calls",
              "unsupported_visual_paths",
              "errors",
          )
          summary = {key: plan[key] for key in keys}
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## Track 2 cohort preflight\n\n```json\n")
              output.write(json.dumps(summary, indent=2, ensure_ascii=False))
              output.write("\n```\n")
          PY

      - name: Upload exact cohort plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: track2-preflight-${{ github.run_id }}
          path: |
            batch-runner/workspace/track2_cohort_plan.json
            batch-runner/workspace/track2_preflight_environment.txt
          if-no-files-found: warn
          retention-days: 30
