# This workflow is not launch authority. The owner must review the new source
# and approve the exact prepared request in THIS run's grading environment.
name: Retention diagnostic — first cell and fixed Task4 fresh r1

on:
  workflow_dispatch:
    inputs:
      reviewed_source_sha:
        description: Exact separately reviewed main source and workflow SHA
        required: true
        type: string
      cell_id:
        description: Only registered Task4 keep r1 or its fixed fresh r1 successor
        default: 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r1
        required: true
        type: string
      prepare:
        description: Explicit original-input transfer and preparation only, no admission
        default: false
        type: boolean
      execute:
        description: Separately directed selected cell; still needs exact same-run owner environment review
        default: false
        type: boolean
      observe_locator:
        description: Protected locator observation only; conflicts with prepare/execute and never requests a token
        default: false
        type: boolean
      read_result:
        description: Read only the fixed successful retained result; conflicts with every other mode and never grades
        default: false
        type: boolean
      observe_terminal:
        description: Observe only failed/stopped fresh r1 controls, not payloads; conflicts with every other mode
        default: false
        type: boolean

permissions:
  contents: read

# Shared with the old deployment route. CAS, not this runner queue or a local
# flock, is the durable inference fence after interruption or ambiguous cleanup.
concurrency:
  group: codex-budget-pilot-ci-20260923-01
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  HF_HUB_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
  DO_NOT_TRACK: "1"
  REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
  SELECTED_CELL: ${{ inputs.cell_id }}
  RETENTION_WORKFLOW_SHA: ${{ github.workflow_sha }}
  AZURE_AI_EXPECTED_CLIENT_ID: ${{ vars.AZURE_AI_EXPECTED_CLIENT_ID }}
  AZURE_AI_EXPECTED_TENANT_ID: ${{ vars.AZURE_AI_EXPECTED_TENANT_ID }}
  AZURE_AI_EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_AI_EXPECTED_SUBSCRIPTION_ID }}

jobs:
  retention-prepare:
    if: github.repository == 'hyeonsangjeon/gdpval-realworks' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      request_sha256: ${{ steps.packet.outputs.request_sha256 }}
    steps:
      - &source_gate
        name: Refuse source, cell or rerun drift before credentials
        env:
          OBSERVE_LOCATOR_ONLY: ${{ inputs.observe_locator }}
          PREPARE_REQUESTED: ${{ inputs.prepare }}
          EXECUTE_REQUESTED: ${{ inputs.execute }}
          READ_RESULT_ONLY: ${{ inputs.read_result }}
          OBSERVE_TERMINAL_ONLY: ${{ inputs.observe_terminal }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$READ_RESULT_ONLY" != true || ( "$PREPARE_REQUESTED" == false && "$EXECUTE_REQUESTED" == false && "$OBSERVE_LOCATOR_ONLY" == false && "$OBSERVE_TERMINAL_ONLY" == false ) ]]
          [[ "$OBSERVE_TERMINAL_ONLY" != true || ( "$PREPARE_REQUESTED" == false && "$EXECUTE_REQUESTED" == false && "$OBSERVE_LOCATOR_ONLY" == false && "$READ_RESULT_ONLY" == false ) ]]
          [[ "$OBSERVE_LOCATOR_ONLY" != true || ( "$PREPARE_REQUESTED" == false && "$EXECUTE_REQUESTED" == false ) ]]
          [[ "$REVIEWED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEWED_SOURCE_SHA" == "$GITHUB_SHA" && "$GITHUB_SHA" == "$RETENTION_WORKFLOW_SHA" ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r1 || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1 ]]
          [[ "$OBSERVE_LOCATOR_ONLY" != true || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r1 ]]
          [[ "$OBSERVE_TERMINAL_ONLY" != true || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1 ]]
      - &checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.reviewed_source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - &python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10.12"
      - &dependencies
        name: Install the existing pinned Python runtime
        run: python3 -m pip install -r batch-runner/requirements.txt
      - &plan
        name: Validate the current closed plan before any input credential
        if: inputs.read_result == false && inputs.observe_terminal == false
        run: >-
          python3 batch-runner/codex_retention_task4_fresh_r1.py
          --reviewed-source-sha "$REVIEWED_SOURCE_SHA" --cell "$SELECTED_CELL"
      - &archive
        name: Materialize the exact historical input observer, never its runtime
        if: inputs.prepare || inputs.execute || inputs.observe_locator
        run: >-
          python3 batch-runner/codex_retention_historical.py archive
          --historical-root "$RUNNER_TEMP/retention-historical"
      - &intake
        name: Read only the four original registered immutable input roles
        if: inputs.prepare || inputs.execute || inputs.observe_locator
        timeout-minutes: 3
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Separate fixed historical importer, not a repin or model fallback.
          python3 batch-runner/codex_retention_historical.py verify-archive \
            --historical-root "$RUNNER_TEMP/retention-historical"
          timeout --signal=TERM --kill-after=5s 120s \
            python3 "$RUNNER_TEMP/retention-historical/batch-runner/codex_ci_input_intake.py" \
              --input-check --input-transport hf_originals \
              --expected-sha256 757603585405da5d7f6817a6a0a23bd530d4b5e4e38b2fd4dc6f318053d240e3 \
              --bundle-out "$RUNNER_TEMP/retention-originals.tar" --out "$RUNNER_TEMP/retention-originals"
      - &originals
        name: Serialize the original five tasks offline with the unchanged helpers
        if: inputs.prepare || inputs.execute || inputs.observe_locator
        run: >-
          python3 batch-runner/codex_retention_historical.py materialize
          --historical-root "$RUNNER_TEMP/retention-historical"
          --original-root "$RUNNER_TEMP/retention-originals"
      - &packet
        name: Reverify and materialize the current runtime packet; no admission
        id: packet
        if: inputs.prepare || inputs.execute || inputs.observe_locator
        env:
          OBSERVE_LOCATOR_ONLY: ${{ inputs.observe_locator }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p batch-runner/workspace
          python3 batch-runner/codex_retention_task4_fresh_r1.py --prepare \
            --reviewed-source-sha "$REVIEWED_SOURCE_SHA" --cell "$SELECTED_CELL" \
            --historical-root "$RUNNER_TEMP/retention-historical" \
            --original-root "$RUNNER_TEMP/retention-originals" \
            --request-out "$RUNNER_TEMP/retention-request.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          value = json.loads((Path(os.environ['RUNNER_TEMP']) / 'retention-request.json').read_bytes())
          canonical = json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          digest = hashlib.sha256(canonical.encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('request_sha256=' + digest + '\n')
          # This document contains identities/scope only, not prompts, input
          # paths/payloads, tokens, native state or private target names.
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Preparation is not admission. Review the exact request below.\n\n')
              if os.environ['OBSERVE_LOCATOR_ONLY'] == 'true':
                  stream.write('Observation only. Protected review permits redacted locator observation, not execution.\n\n')
                  stream.write('This request is context only; no token, signed approval verification or admission follows.\n\n')
              else:
                  stream.write('Owner approval comment must be exactly:\n\n`approve-retention-first-cell sha256:' + digest + '`\n\n')
              stream.write('```json\n' + json.dumps(value, sort_keys=True, indent=2) + '\n```\n')
          PY
      - name: Bind the fixed fresh r1 reader and frozen helpers before credentials
        if: inputs.read_result && !inputs.observe_terminal && !inputs.prepare && !inputs.execute && !inputs.observe_locator && inputs.cell_id == '3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_SOURCE_SHA" && "$REVIEWED_SOURCE_SHA" == "$GITHUB_SHA" && "$GITHUB_SHA" == "$RETENTION_WORKFLOW_SHA" ]]
          retention_checkout_status="$(git status --porcelain=v1 --untracked-files=all)"
          [[ -z "$retention_checkout_status" ]]
          printf '%s\n' \
            'bbb46c87ac840317a4f41959d2278677ed29e52e7ae28f49cf47db7a464eaafa  batch-runner/codex_retention_fresh_r1_result_intake.py' \
            'df629ee1defde93347a6a6eb92d25ef8ad536e39e7a52b19ad3acb32deaa4196  batch-runner/codex_retention_result_intake.py' \
            '8462ffd6be01c9bd9ef1ac8f6b878a92d8233a6d7b3f28b3a01d979b2df2982c  batch-runner/codex_retention_ci.py' \
            '0cf9fdabd985ba4b5c838c3b661317efd1eb6ee6163463b49585a720b7ae6d76  batch-runner/codex_retention_task4_fresh_r1.py' \
            '57f463c7e1e079b2e87248af87885ffb7d927f13ec32a107f0f3da41a9971fab  batch-runner/codex_retention_first_cell.py' \
            | sha256sum --check --status
      - name: Read only the fixed fresh r1 inference result; never execute or grade
        if: inputs.read_result && !inputs.observe_terminal && !inputs.prepare && !inputs.execute && !inputs.observe_locator && inputs.cell_id == '3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1'
        timeout-minutes: 4
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" && -O "$RUNNER_TEMP" ]]
          retention_result_parent="$(mktemp -d "$RUNNER_TEMP/retention-fresh-r1-result.XXXXXXXX")"
          [[ -d "$retention_result_parent" && ! -L "$retention_result_parent" && -O "$retention_result_parent" ]]
          [[ "$(stat -c '%a' "$retention_result_parent")" == 700 ]]
          [[ ! -e "$retention_result_parent/payload" && ! -L "$retention_result_parent/payload" ]]
          retention_read_status=0
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN \
            timeout --signal=KILL 180s \
            python3 batch-runner/codex_retention_fresh_r1_result_intake.py --read --discover-terminal \
              --expected-producer-source e39d8d1aadcb816d09588829a5ec4929b33083e6 \
              --expected-request-sha256 5bbb0e4cb5ae9444eac9c804ac3c8d2f6d39acbec63e7f7de78d7f2ee35fcf02 \
              --cell-id 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1 \
              --expected-reader-sha256 bbb46c87ac840317a4f41959d2278677ed29e52e7ae28f49cf47db7a464eaafa \
              --output "$retention_result_parent/payload" \
              > "$retention_result_parent/receipt.json" 2> "$retention_result_parent/stderr.log" || retention_read_status=$?
          # Only the reviewed reader's safe receipt is public. Partials stay private.
          retention_receipt_status=0
          tee -a "$GITHUB_STEP_SUMMARY" < "$retention_result_parent/receipt.json" || retention_receipt_status=$?
          if (( retention_read_status != 0 )); then
            exit "$retention_read_status"
          fi
          exit "$retention_receipt_status"
      - name: Bind the fixed result reader to the clean workflow checkout before credentials
        if: inputs.read_result && !inputs.observe_terminal && !inputs.prepare && !inputs.execute && !inputs.observe_locator && inputs.cell_id == '3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r1'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_SOURCE_SHA" && "$REVIEWED_SOURCE_SHA" == "$GITHUB_SHA" && "$GITHUB_SHA" == "$RETENTION_WORKFLOW_SHA" ]]
          retention_checkout_status="$(git status --porcelain=v1 --untracked-files=all)"
          [[ -z "$retention_checkout_status" ]]
          printf '%s\n' \
            'df629ee1defde93347a6a6eb92d25ef8ad536e39e7a52b19ad3acb32deaa4196  batch-runner/codex_retention_result_intake.py' \
            '8462ffd6be01c9bd9ef1ac8f6b878a92d8233a6d7b3f28b3a01d979b2df2982c  batch-runner/codex_retention_ci.py' \
            | sha256sum --check --status
      - name: Read the fixed retained result only; no preparation, admission or grading
        if: inputs.read_result && !inputs.observe_terminal && !inputs.prepare && !inputs.execute && !inputs.observe_locator && inputs.cell_id == '3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r1'
        timeout-minutes: 4
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" && -O "$RUNNER_TEMP" ]]
          retention_result_parent="$(mktemp -d "$RUNNER_TEMP/retention-result.XXXXXXXX")"
          [[ -d "$retention_result_parent" && ! -L "$retention_result_parent" && -O "$retention_result_parent" ]]
          [[ "$(stat -c '%a' "$retention_result_parent")" == 700 ]]
          [[ ! -e "$retention_result_parent/payload" && ! -L "$retention_result_parent/payload" ]]
          retention_read_status=0
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN \
            timeout --signal=KILL 180s \
            python3 batch-runner/codex_retention_result_intake.py --read --discover-terminal \
              --expected-producer-source e355faf9a6212175a288e8473968915ffb2408d0 \
              --expected-request-sha256 ed8b51f6d80e641922013eba9e19d7d3e145d84ae15fb8d7d9509e643c975c68 \
              --cell-id 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r1 \
              --expected-reader-sha256 df629ee1defde93347a6a6eb92d25ef8ad536e39e7a52b19ad3acb32deaa4196 \
              --output "$retention_result_parent/payload" \
              > "$retention_result_parent/receipt.json" 2> "$retention_result_parent/stderr.log" || retention_read_status=$?
          # Only the reviewed reader's safe receipt is public. Partials stay private.
          retention_receipt_status=0
          tee -a "$GITHUB_STEP_SUMMARY" < "$retention_result_parent/receipt.json" || retention_receipt_status=$?
          if (( retention_read_status != 0 )); then
            exit "$retention_read_status"
          fi
          exit "$retention_receipt_status"

      - name: Bind the fixed terminal observer and frozen helpers before credentials
        if: inputs.observe_terminal && !inputs.read_result && !inputs.prepare && !inputs.execute && !inputs.observe_locator && inputs.cell_id == '3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_SOURCE_SHA" && "$REVIEWED_SOURCE_SHA" == "$GITHUB_SHA" && "$GITHUB_SHA" == "$RETENTION_WORKFLOW_SHA" ]]
          retention_checkout_status="$(git status --porcelain=v1 --untracked-files=all)"
          [[ -z "$retention_checkout_status" ]]
          printf '%s\n' \
            'bbb46c87ac840317a4f41959d2278677ed29e52e7ae28f49cf47db7a464eaafa  batch-runner/codex_retention_fresh_r1_result_intake.py' \
            'df629ee1defde93347a6a6eb92d25ef8ad536e39e7a52b19ad3acb32deaa4196  batch-runner/codex_retention_result_intake.py' \
            '8462ffd6be01c9bd9ef1ac8f6b878a92d8233a6d7b3f28b3a01d979b2df2982c  batch-runner/codex_retention_ci.py' \
            '0cf9fdabd985ba4b5c838c3b661317efd1eb6ee6163463b49585a720b7ae6d76  batch-runner/codex_retention_task4_fresh_r1.py' \
            '57f463c7e1e079b2e87248af87885ffb7d927f13ec32a107f0f3da41a9971fab  batch-runner/codex_retention_first_cell.py' \
            | sha256sum --check --status
      - name: Observe only failed or stopped fresh r1 terminal controls; never read payloads
        if: inputs.observe_terminal && !inputs.read_result && !inputs.prepare && !inputs.execute && !inputs.observe_locator && inputs.cell_id == '3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1'
        timeout-minutes: 4
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" && -O "$RUNNER_TEMP" ]]
          retention_terminal_parent="$(mktemp -d "$RUNNER_TEMP/retention-fresh-r1-terminal.XXXXXXXX")"
          [[ -d "$retention_terminal_parent" && ! -L "$retention_terminal_parent" && -O "$retention_terminal_parent" ]]
          [[ "$(stat -c '%a' "$retention_terminal_parent")" == 700 ]]
          [[ ! -e "$retention_terminal_parent/evidence" && ! -L "$retention_terminal_parent/evidence" ]]
          retention_read_status=0
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN \
            timeout --signal=KILL 180s \
            python3 batch-runner/codex_retention_fresh_r1_result_intake.py --observe-terminal --discover-terminal \
              --expected-producer-source e39d8d1aadcb816d09588829a5ec4929b33083e6 \
              --expected-request-sha256 5bbb0e4cb5ae9444eac9c804ac3c8d2f6d39acbec63e7f7de78d7f2ee35fcf02 \
              --cell-id 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1 \
              --expected-reader-sha256 bbb46c87ac840317a4f41959d2278677ed29e52e7ae28f49cf47db7a464eaafa \
              --output "$retention_terminal_parent/evidence" \
              > "$retention_terminal_parent/receipt.json" 2> "$retention_terminal_parent/stderr.log" || retention_read_status=$?
          # Only the reviewed reader's safe receipt is public. Partials stay private.
          retention_receipt_status=0
          tee -a "$GITHUB_STEP_SUMMARY" < "$retention_terminal_parent/receipt.json" || retention_receipt_status=$?
          if (( retention_read_status != 0 )); then
            exit "$retention_read_status"
          fi
          exit "$retention_receipt_status"

  retention-approve:
    needs: retention-prepare
    if: (inputs.execute || inputs.observe_locator) && !inputs.read_result && !inputs.observe_terminal && !(inputs.observe_locator && (inputs.prepare || inputs.execute)) && needs.retention-prepare.result == 'success' && needs.retention-prepare.outputs.request_sha256 != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions: {}
    environment:
      name: grading
    steps:
      - name: Same-run protected review boundary; no checkout, secret or OIDC
        env:
          REQUEST_SHA256: ${{ needs.retention-prepare.outputs.request_sha256 }}
          OBSERVE_LOCATOR_ONLY: ${{ inputs.observe_locator }}
        run: |
          [[ "$REQUEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          if [[ "$OBSERVE_LOCATOR_ONLY" == true ]]; then
            echo "Protected observation review finished; this is not authenticated execution approval."
          else
            echo "Protected job finished; execution independently authenticates the owner's exact review comment."
          fi

  retention-execute:
    needs: [retention-prepare, retention-approve]
    if: (inputs.execute || inputs.observe_locator) && !inputs.read_result && !inputs.observe_terminal && !(inputs.observe_locator && (inputs.prepare || inputs.execute)) && needs.retention-prepare.result == 'success' && needs.retention-prepare.outputs.request_sha256 != '' && needs.retention-approve.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    # No environment here: preserve the established main-ref Azure OIDC subject.
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      APPROVED_REQUEST_SHA256: ${{ needs.retention-prepare.outputs.request_sha256 }}
    steps:
      - *source_gate
      - *checkout
      - *python
      - *dependencies
      - *plan
      - *archive
      - *intake
      - *originals
      - *packet
      - name: Observe only the closed execution-job locator; no token or admission
        if: inputs.observe_locator && !inputs.prepare && !inputs.execute
        run: >-
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u GITHUB_TOKEN
          python3 batch-runner/codex_retention_ci.py --observe-locator
          --reviewed-source-sha "$REVIEWED_SOURCE_SHA" --cell "$SELECTED_CELL"
      - name: Authenticate the owner review and signed job origin before Azure login or claim
        if: inputs.execute && !inputs.observe_locator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 batch-runner/codex_retention_task4_fresh_r1.py --verify-approval
          --reviewed-source-sha "$REVIEWED_SOURCE_SHA" --cell "$SELECTED_CELL"
          --historical-root "$RUNNER_TEMP/retention-historical"
          --original-root "$RUNNER_TEMP/retention-originals"
          --request-sha256 "$APPROVED_REQUEST_SHA256"
      - name: Require the existing native sandbox on the approved host
        if: inputs.execute && !inputs.observe_locator
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null; then
            APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
            sudo timeout --kill-after=5s 240s apt-get "${APT_OPTS[@]}" update -qq
            sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=5s 420s apt-get "${APT_OPTS[@]}" install -y --no-install-recommends bubblewrap
          fi
          python3 batch-runner/scripts/diagnose_codex_sandbox_host.py
      - name: Azure Login (existing main-ref OIDC route)
        if: inputs.execute && !inputs.observe_locator
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Reverify grant and session, claim once, run one owned cell, reconcile once
        if: inputs.execute && !inputs.observe_locator
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AZURE_AI_ROUTE_PROFILE: direct-v1
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          CODEX_FOUNDRY_CONNECTION_CONFIRMED: "1"
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Host checkpoint is a sibling of, never inside, agent-writable temp.
          mkdir "$RUNNER_TEMP/retention-agent-temp"
          export TMPDIR="$RUNNER_TEMP/retention-agent-temp"
          export GDPVAL_CODEX_RUN_ROOT="$RUNNER_TEMP/retention-native-parent"
          case "$SELECTED_CELL" in
            3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r1) retention_host="$RUNNER_TEMP/retention-first-cell-host" ;;
            3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1) retention_host="$RUNNER_TEMP/retention-task4-fresh-r1-host" ;;
            *) exit 2 ;;
          esac
          python3 batch-runner/codex_retention_task4_fresh_r1.py --execute \
            --reviewed-source-sha "$REVIEWED_SOURCE_SHA" --cell "$SELECTED_CELL" \
            --historical-root "$RUNNER_TEMP/retention-historical" \
            --original-root "$RUNNER_TEMP/retention-originals" \
            --request-sha256 "$APPROVED_REQUEST_SHA256" \
            --host-state "$retention_host"
