# This workflow is not launch authority. The owner must review the new source
# and approve the exact prepared request in THIS run's grading environment.
name: Retention diagnostic — fixed Task4 keep/fresh r1/r2

on:
  workflow_dispatch:
    inputs:
      reviewed_source_sha:
        description: Exact separately reviewed main source and workflow SHA
        required: true
        type: string
      cell_id:
        description: Only the eight registered Task4 and Task5 keep/fresh r1/r2 cells
        default: 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r1
        required: true
        type: string
      prepare:
        description: Explicit original-input transfer and preparation only, no admission
        default: false
        type: boolean
      execute:
        description: Separately directed selected cell; still needs exact same-run owner environment review
        default: false
        type: boolean
      observe_locator:
        description: Protected locator observation only; conflicts with prepare/execute and never requests a token
        default: false
        type: boolean
      read_result:
        description: Read only the fixed successful retained result; conflicts with every other mode and never grades
        default: false
        type: boolean
      observe_terminal:
        description: Observe only failed/stopped fixed fresh or keep r2 controls, not payloads; conflicts with every other mode
        default: false
        type: boolean
      observe_budget:
        description: Read only one of the eight fixed RESULT budgets after its controls; conflicts with every other mode
        default: false
        type: boolean

permissions:
  contents: read

# Shared with the old deployment route. CAS, not this runner queue or a local
# flock, is the durable inference fence after interruption or ambiguous cleanup.
concurrency:
  group: codex-budget-pilot-ci-20260923-01
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  HF_HUB_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
  DO_NOT_TRACK: "1"
  REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
  SELECTED_CELL: ${{ inputs.cell_id }}
  RETENTION_WORKFLOW_SHA: ${{ github.workflow_sha }}
  AZURE_AI_EXPECTED_CLIENT_ID: ${{ vars.AZURE_AI_EXPECTED_CLIENT_ID }}
  AZURE_AI_EXPECTED_TENANT_ID: ${{ vars.AZURE_AI_EXPECTED_TENANT_ID }}
  AZURE_AI_EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_AI_EXPECTED_SUBSCRIPTION_ID }}

jobs:
  retention-prepare:
    if: github.repository == 'hyeonsangjeon/gdpval-realworks' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      request_sha256: ${{ steps.packet.outputs.request_sha256 }}
    steps:
      - &source_gate
        name: Refuse source, cell or rerun drift before credentials
        env:
          OBSERVE_LOCATOR_ONLY: ${{ inputs.observe_locator }}
          PREPARE_REQUESTED: ${{ inputs.prepare }}
          EXECUTE_REQUESTED: ${{ inputs.execute }}
          READ_RESULT_ONLY: ${{ inputs.read_result }}
          OBSERVE_TERMINAL_ONLY: ${{ inputs.observe_terminal }}
          OBSERVE_BUDGET_ONLY: ${{ inputs.observe_budget }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$READ_RESULT_ONLY" != true || ( "$PREPARE_REQUESTED" == false && "$EXECUTE_REQUESTED" == false && "$OBSERVE_LOCATOR_ONLY" == false && "$OBSERVE_TERMINAL_ONLY" == false ) ]]
          [[ "$OBSERVE_TERMINAL_ONLY" != true || ( "$PREPARE_REQUESTED" == false && "$EXECUTE_REQUESTED" == false && "$OBSERVE_LOCATOR_ONLY" == false && "$READ_RESULT_ONLY" == false ) ]]
          [[ "$OBSERVE_LOCATOR_ONLY" != true || ( "$PREPARE_REQUESTED" == false && "$EXECUTE_REQUESTED" == false ) ]]
          [[ "$OBSERVE_BUDGET_ONLY" != true || ( "$PREPARE_REQUESTED" == false && "$EXECUTE_REQUESTED" == false && "$OBSERVE_LOCATOR_ONLY" == false && "$READ_RESULT_ONLY" == false && "$OBSERVE_TERMINAL_ONLY" == false ) ]]
          [[ "$OBSERVE_BUDGET_ONLY" != true || ( "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r2 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r2 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r1 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r1 || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1 || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r2 || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r2 || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r1 ) ]]
          [[ "$REVIEWED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEWED_SOURCE_SHA" == "$GITHUB_SHA" && "$GITHUB_SHA" == "$RETENTION_WORKFLOW_SHA" ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r1 || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1 || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r2 || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r2 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r1 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r1 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r2 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r2 ]]
          [[ "$READ_RESULT_ONLY" != true || ( "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r1 || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1 || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r2 || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r2 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r1 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r1 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r2 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r2 ) ]]
          [[ "$OBSERVE_LOCATOR_ONLY" != true || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r1 ]]
          [[ "$OBSERVE_TERMINAL_ONLY" != true || ( "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1 || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r2 || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r2 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r1 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r1 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r2 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r2 ) ]]
      - &checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.reviewed_source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - &python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10.12"
      - &dependencies
        name: Install the existing pinned Python runtime
        run: python3 -m pip install -r batch-runner/requirements.txt
      - &plan
        name: Validate the current closed plan before any input credential
        if: inputs.read_result == false && inputs.observe_terminal == false && inputs.observe_budget == false
        run: >-
          python3 batch-runner/codex_retention_task5_fresh_r2.py
          --reviewed-source-sha "$REVIEWED_SOURCE_SHA" --cell "$SELECTED_CELL"
      - &archive
        name: Materialize the exact historical input observer, never its runtime
        if: inputs.prepare || inputs.execute || inputs.observe_locator
        run: >-
          python3 batch-runner/codex_retention_historical.py archive
          --historical-root "$RUNNER_TEMP/retention-historical"
      - &intake
        name: Read only the four original registered immutable input roles
        if: inputs.prepare || inputs.execute || inputs.observe_locator
        timeout-minutes: 3
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Separate fixed historical importer, not a repin or model fallback.
          python3 batch-runner/codex_retention_historical.py verify-archive \
            --historical-root "$RUNNER_TEMP/retention-historical"
          timeout --signal=TERM --kill-after=5s 120s \
            python3 "$RUNNER_TEMP/retention-historical/batch-runner/codex_ci_input_intake.py" \
              --input-check --input-transport hf_originals \
              --expected-sha256 757603585405da5d7f6817a6a0a23bd530d4b5e4e38b2fd4dc6f318053d240e3 \
              --bundle-out "$RUNNER_TEMP/retention-originals.tar" --out "$RUNNER_TEMP/retention-originals"
      - &originals
        name: Serialize the original five tasks offline with the unchanged helpers
        if: inputs.prepare || inputs.execute || inputs.observe_locator
        run: >-
          python3 batch-runner/codex_retention_historical.py materialize
          --historical-root "$RUNNER_TEMP/retention-historical"
          --original-root "$RUNNER_TEMP/retention-originals"
      - &packet
        name: Reverify and materialize the current runtime packet; no admission
        id: packet
        if: inputs.prepare || inputs.execute || inputs.observe_locator
        env:
          OBSERVE_LOCATOR_ONLY: ${{ inputs.observe_locator }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p batch-runner/workspace
          python3 batch-runner/codex_retention_task5_fresh_r2.py --prepare \
            --reviewed-source-sha "$REVIEWED_SOURCE_SHA" --cell "$SELECTED_CELL" \
            --historical-root "$RUNNER_TEMP/retention-historical" \
            --original-root "$RUNNER_TEMP/retention-originals" \
            --request-out "$RUNNER_TEMP/retention-request.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          value = json.loads((Path(os.environ['RUNNER_TEMP']) / 'retention-request.json').read_bytes())
          canonical = json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          digest = hashlib.sha256(canonical.encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('request_sha256=' + digest + '\n')
          # This document contains identities/scope only, not prompts, input
          # paths/payloads, tokens, native state or private target names.
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Preparation is not admission. Review the exact request below.\n\n')
              if os.environ['OBSERVE_LOCATOR_ONLY'] == 'true':
                  stream.write('Observation only. Protected review permits redacted locator observation, not execution.\n\n')
                  stream.write('This request is context only; no token, signed approval verification or admission follows.\n\n')
              else:
                  stream.write('Owner approval comment must be exactly:\n\n`approve-retention-first-cell sha256:' + digest + '`\n\n')
              stream.write('```json\n' + json.dumps(value, sort_keys=True, indent=2) + '\n```\n')
          PY
      - name: Bind the shared fixed reader and frozen helpers before credentials
        if: inputs.read_result && !inputs.observe_terminal && !inputs.observe_budget && !inputs.prepare && !inputs.execute && !inputs.observe_locator && (inputs.cell_id == '3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1' || inputs.cell_id == '3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r2' || inputs.cell_id == '3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r2' || inputs.cell_id == '0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r1' || inputs.cell_id == '0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r1' || inputs.cell_id == '0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r2' || inputs.cell_id == '0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r2')
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_SOURCE_SHA" && "$REVIEWED_SOURCE_SHA" == "$GITHUB_SHA" && "$GITHUB_SHA" == "$RETENTION_WORKFLOW_SHA" ]]
          retention_checkout_status="$(git status --porcelain=v1 --untracked-files=all)"
          [[ -z "$retention_checkout_status" ]]
          printf '%s\n' \
            '631dd2a76faecd28ae65bdbe69d755f598aa4b025cfc66a8280872c2f3a2bc96  batch-runner/codex_retention_fresh_r1_result_intake.py' \
            'df629ee1defde93347a6a6eb92d25ef8ad536e39e7a52b19ad3acb32deaa4196  batch-runner/codex_retention_result_intake.py' \
            '8462ffd6be01c9bd9ef1ac8f6b878a92d8233a6d7b3f28b3a01d979b2df2982c  batch-runner/codex_retention_ci.py' \
            '75a183f632df17a16f66df4745e01b696f1538b4285f3f11e51fc784c92c15c1  batch-runner/codex_retention_task4_fresh_r1.py' \
            'c42c8bb3e521c10a5d48680918978a3b9269468a724cd127109f8f4898fe2e6b  batch-runner/codex_retention_first_cell.py' \
            | sha256sum --check --status
          if [[ "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r2 || "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r2 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r1 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r1 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r2 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r2 ]]; then
            printf '%s\n' '8b387ec5d172f74c4e6d2e1b93973c674e973f3cbba47b640184c126312ab00f  batch-runner/codex_retention_task4_fresh_r2.py' | sha256sum --check --status
          fi
          if [[ "$SELECTED_CELL" == 3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r2 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r1 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r1 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r2 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r2 ]]; then
            printf '%s\n' '12106b5423e25ffefa1b04023e2e98742861762762966a04bf17fe3da1851450  batch-runner/codex_retention_task4_keep_r2.py' | sha256sum --check --status
          fi
          if [[ "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r1 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r1 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r2 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r2 ]]; then
            printf '%s\n' '9919fda7728e84d0d707fe6a4b23a8a601c04b1e5241bcc83387b9acd20f0f5a  batch-runner/codex_retention_task5_fresh_r1.py' | sha256sum --check --status
          fi
          if [[ "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r1 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r2 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r2 ]]; then
            printf '%s\n' '21623a1a5bb661f105b8d9dcdfaaad13634c21cb8f1207189608f602b80b14ee  batch-runner/codex_retention_task5_keep_r1.py' | sha256sum --check --status
          fi
          if [[ "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r2 || "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r2 ]]; then
            printf '%s\n' '7ac1e8d8014e7fff765c65a80774d808a8b34d2cc2d88af8ef9ba8580ad820af  batch-runner/codex_retention_task5_keep_r2.py' | sha256sum --check --status
          fi
          if [[ "$SELECTED_CELL" == 0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r2 ]]; then
            printf '%s\n' '6f1b78b8956e58b147802921e69d3009fd9ad774fced22037dbd112ecddcd4bd  batch-runner/codex_retention_task5_fresh_r2.py' | sha256sum --check --status
          fi
      - name: Read only the selected fixed inference result; never execute or grade
        if: inputs.read_result && !inputs.observe_terminal && !inputs.observe_budget && !inputs.prepare && !inputs.execute && !inputs.observe_locator && (inputs.cell_id == '3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1' || inputs.cell_id == '3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r2' || inputs.cell_id == '3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r2' || inputs.cell_id == '0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r1' || inputs.cell_id == '0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r1' || inputs.cell_id == '0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r2' || inputs.cell_id == '0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r2')
        timeout-minutes: 4
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          case "$SELECTED_CELL" in
            3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r1)
              retention_read_source=e39d8d1aadcb816d09588829a5ec4929b33083e6
              retention_read_request=5bbb0e4cb5ae9444eac9c804ac3c8d2f6d39acbec63e7f7de78d7f2ee35fcf02
              retention_read_namespace=retention-fresh-r1 ;;
            3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_fresh_r2)
              retention_read_source=5a9614ac04464c4e0a5e80297f54c3a5c9443bae
              retention_read_request=4798c119ea2d06c7c902ae51638bdba25c5bfaf683a2223d286fd7e652d3b317
              retention_read_namespace=retention-fresh-r2 ;;
            3baa0009-5a60-4ae8-ae99-4955cb328ff3_retention_bundle_v1_keep_r2)
              retention_read_source=b8351e561acb9675a4993419e819c12787b5b305
              retention_read_request=8a06cc7df34cbf10896b635f6c8d9ad4e91313d3c685511f8fc5c159cb6ddec1
              retention_read_namespace=retention-keep-r2 ;;
            0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r1)
              retention_read_source=e5e338aa22c247133936fa075c2def7bffb95173
              retention_read_request=9a53e9c0ae7b50400f2b27d514207e489b237cc5b5195ff8e36fcc4ea920370b
              retention_read_namespace=retention-task5-fresh-r1 ;;
            0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r1)
              retention_read_source=a8353cd41f01f7d94129421512a57a62b9bd6997
              retention_read_request=22e0bc6f06e4c9c2ac2d3fa4bfe6a7c567ef24e9111bf319b704409d731997de
              retention_read_namespace=retention-task5-keep-r1 ;;
            0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_keep_r2)
              retention_read_source=bdb7c21111a4c86136b6158f4969a39a9950acb3
              retention_read_request=1b042b77fcc80b8c1a1c21fdd73feeefbcb80ce7f505b7c842aba496419386ac
              retention_read_namespace=retention-task5-keep-r2 ;;
            0818571f-5ff7-4d39-9d2c-ced5ae44299e_retention_bundle_v1_fresh_r2)
