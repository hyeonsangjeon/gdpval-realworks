name: Codex Sandbox Host Survey

# Where can a Codex agent actually execute a command?
#
# Two assertions in tests/test_codex_runtime_end_to_end.py need the agent to
# run something inside its sandbox, and they skip wherever the sandbox will not
# start. That skip used to fire on every machine this project had, which meant
# the execution leg of the Codex path had never been observed working anywhere
# -- while the notes said the chain was verified end to end. This workflow
# exists to replace that guess with measurements.
#
# It answers one question per host: does bubblewrap run a command here, and if
# not, which wall did it hit? The tool it runs
# (batch-runner/scripts/diagnose_codex_sandbox_host.py) separates walls that
# all print a `bwrap:` line and are not the same problem -- a kernel with no
# CONFIG_USER_NS, a sysctl switched off, a security policy that grants the
# namespace and then strips it, a container that denies the capability.
#
# The matrix is a controlled experiment, not a survey of convenience:
#
#   ubuntu-24.04   ships kernel.apparmor_restrict_unprivileged_userns=1
#   ubuntu-22.04   has no such restriction
#
# and on the 24.04 leg, one further probe from inside an ordinary container.
#
# The experiment has run, and the answer is in docs/codex_sandbox_hosts.json:
# 22.04 runs the command, 24.04 does not, both on the same hosted-runner
# infrastructure with the same LSM stack. The AppArmor policy is therefore the
# cause rather than the suspect. Two honest caveats travel with that result:
# 22.04's default posture is more permissive than 24.04's, which is a property
# of an older image and not an achievement; and GitHub is retiring the 22.04
# runner, so this result has an expiry date. The execution-host question is
# deferred by it, not closed.
#
# The `prove-execution` job below is what turns that measurement into cover:
# it runs the end-to-end file on the one ready host with
# CODEX_SANDBOX_MUST_RUN=1, so the execution leg cannot silently stop being
# exercised there.
#
# What this workflow does NOT do, deliberately:
#
#   * It changes no host setting. Nothing here writes a sysctl, loads or
#     unloads an AppArmor profile, or installs a policy. Turning
#     apparmor_restrict_unprivileged_userns off would make the tests pass by
#     removing that protection from every process on the machine, which is not
#     a fix, it is the absence of one.
#   * It runs no privileged container and adds no capabilities. The container
#     probe below is a plain `docker run` with no --privileged, no --cap-add
#     and no --security-opt, spelled out in full so that the absence of those
#     flags is visible rather than promised. The point is to learn what an
#     ordinary container does; a container handed extra powers would answer a
#     question nobody asked.
#   * It opens no network path and disables no sandbox.
#   * It spends nothing. No model is called, no cloud account is signed in to,
#     and no secret is referenced below.
#
# A red run here is not a broken pull request. Read it: the job fails when a
# host's measured verdict disagrees with what the repository has written down
# about that host, in either direction. A machine that quietly became capable
# is as important to notice as one that quietly stopped being.

on:
  pull_request:
    paths:
      - "batch-runner/scripts/diagnose_codex_sandbox_host.py"
      - "batch-runner/scripts/check_recorded_sandbox_verdicts.py"
      - "batch-runner/docs/codex_sandbox_hosts.json"
      - "batch-runner/tests/test_codex_sandbox_host_diagnosis.py"
      - "batch-runner/tests/test_codex_runtime_end_to_end.py"
      - "batch-runner/core/codex_runner.py"
      - "batch-runner/core/codex_runtime_config.py"
      - "batch-runner/requirements.txt"
      - ".github/workflows/codex-sandbox-host-survey.yml"
  push:
    branches: [main]
    paths:
      - "batch-runner/scripts/diagnose_codex_sandbox_host.py"
      - "batch-runner/docs/codex_sandbox_hosts.json"
      - "batch-runner/tests/test_codex_runtime_end_to_end.py"
      - "batch-runner/core/codex_runtime_config.py"
      - ".github/workflows/codex-sandbox-host-survey.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-sandbox-host-survey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  survey:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The host `ubuntu-latest` resolves to today. This is the machine
          # that produced `bwrap: loopback: Failed RTM_NEWADDR: Operation not
          # permitted` on PR #454.
          - label: ubuntu-24.04 runner host
            runner: ubuntu-24.04
            host_key: ubuntu-24.04-host
            probe_container: "yes"

          # The control. Same hosted-runner infrastructure, same container
          # runtime, older security policy: 22.04 predates
          # kernel.apparmor_restrict_unprivileged_userns. A difference between
          # this leg and the one above is attributable to the policy and to
          # very little else.
          - label: ubuntu-22.04 runner host
            runner: ubuntu-22.04
            host_key: ubuntu-22.04-host
            probe_container: "no"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Make sure bubblewrap is present
        run: |
          if ! command -v bwrap > /dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap
          fi
          echo "bwrap: $(command -v bwrap)  $(bwrap --version 2>&1 | head -1)"

      # Recorded for the report, and because "which policy was in force" is the
      # single most useful line when somebody re-reads this run in a month.
      # Every command here reads; none of them writes.
      - name: Record the host's security posture
        run: |
          echo "kernel: $(uname -r)"
          echo "os: $(grep PRETTY_NAME /etc/os-release | cut -d= -f2- | tr -d '\"')"
          for knob in \
            /proc/sys/user/max_user_namespaces \
            /proc/sys/kernel/unprivileged_userns_clone \
            /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          do
            if [ -r "$knob" ]; then
              echo "$knob = $(cat "$knob")"
            else
              echo "$knob = (absent)"
            fi
          done
          echo "lsm: $(cat /sys/kernel/security/lsm 2>/dev/null || echo '(unreadable)')"
          echo "apparmor profiles mentioning bwrap:"
          (sudo aa-status 2>/dev/null | grep -i bwrap) || echo "  (none, or aa-status unavailable)"

      - name: Diagnose the runner host
        id: diagnose
        continue-on-error: true
        working-directory: batch-runner
        run: |
          set +e
          python3 scripts/diagnose_codex_sandbox_host.py \
            --out "/tmp/${{ matrix.host_key }}.json"
          status=$?
          set -e
          echo "exit_status=${status}" >> "$GITHUB_OUTPUT"
          verdict=$(python3 -c "import json;print(json.load(open('/tmp/${{ matrix.host_key }}.json'))['readiness'])")
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"

      # The container axis, at default settings. Written out as an explicit
      # docker run so that what is *not* passed is auditable: no --privileged,
      # no --cap-add, no --security-opt seccomp=unconfined, no --userns=host.
      # Adding any of those would be weakening the isolation to buy a pass,
      # which is the one thing this whole line of work is not allowed to do.
      - name: Diagnose from inside a plain container
        id: container
        if: matrix.probe_container == 'yes'
        continue-on-error: true
        run: |
          set +e
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/batch-runner:/w:ro" \
            -w /w \
            ubuntu:24.04 \
            bash -c '
              set -e
              apt-get update -qq > /dev/null 2>&1
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                python3 bubblewrap util-linux > /dev/null 2>&1
              python3 scripts/diagnose_codex_sandbox_host.py --json
            ' > /tmp/container-probe.json 2>/tmp/container-probe.err
          status=$?
          set -e
          echo "container probe exit: ${status}"
          echo "--- stderr ---"; cat /tmp/container-probe.err || true
          echo "--- report ---"; cat /tmp/container-probe.json || true
          verdict=$(python3 -c "import json;print(json.load(open('/tmp/container-probe.json'))['readiness'])" 2>/dev/null || echo "probe_did_not_report")
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"

      # The gate. It does not ask "is this host ready" -- most of them are not,
      # that is a stable fact, and a job that is red for a fact nobody disputes
      # teaches people to ignore it. It asks whether the host still behaves the
      # way the repository says it does, so that a hosted image quietly gaining
      # or losing the ability to sandbox shows up as a change rather than as
      # nothing at all.
      - name: Compare against what the repository has recorded
        working-directory: batch-runner
        run: |
          python3 scripts/check_recorded_sandbox_verdicts.py \
            --host-key "${{ matrix.host_key }}" \
            --observed "/tmp/${{ matrix.host_key }}.json"

      # The container measurement is held to the record too. Without this it
      # would be a line in a summary that nobody reads and nothing checks --
      # measured, printed, and unable to fail. The container is the axis most
      # likely to move without warning, because the image and the runtime under
      # it are both updated on somebody else's schedule.
      - name: Compare the container against what the repository has recorded
        if: matrix.probe_container == 'yes'
        working-directory: batch-runner
        run: |
          python3 scripts/check_recorded_sandbox_verdicts.py \
            --host-key ubuntu-24.04-container \
            --observed /tmp/container-probe.json

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-host-${{ matrix.host_key }}
          path: |
            /tmp/${{ matrix.host_key }}.json
            /tmp/container-probe.json
            /tmp/container-probe.err
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.label }}"
            echo ""
            echo "- runner host verdict: \`${{ steps.diagnose.outputs.verdict }}\`"
            echo "- diagnostic exit status: \`${{ steps.diagnose.outputs.exit_status }}\` (0 only when a command ran inside the sandbox)"
            if [ "${{ matrix.probe_container }}" = "yes" ]; then
              echo "- plain-container verdict: \`${{ steps.container.outputs.verdict }}\`"
            fi
            echo ""
            echo "이 줄이 뜻하는 것: 이 기계에서 Codex가 격리 안에서 명령을 실제로"
            echo "실행할 수 있는지 재보고, 안 되면 어느 벽에 막혔는지 이름을 붙인"
            echo "결과입니다. \`ready\`가 아니면 이 기계는 실행 호스트가 될 수 없습니다."
          } >> "$GITHUB_STEP_SUMMARY"

  # The survey above says where a command *can* run. This job is the one that
  # makes it count: on the single host measured `ready`, it drives the real
  # Codex runtime end to end and refuses to let the execution assertions skip.
  #
  # That refusal is the whole point. `test_codex_runtime_end_to_end.py` has two
  # assertions that need the agent to actually execute a command, and they skip
  # when the sandbox will not start. On every machine this project had, that
  # skip fired -- so the suite was green, the leg was unproven, and the two
  # states were indistinguishable from outside. Meanwhile the notes said the
  # chain was verified end to end. `CODEX_SANDBOX_MUST_RUN=1` closes that by
  # mechanism rather than by promising to remember: here, a skip is a failure.
  #
  # Nothing is relaxed to make this pass. ubuntu-22.04 is not configured to be
  # permissive by anything below -- its default posture predates
  # kernel.apparmor_restrict_unprivileged_userns, which is a fact about the
  # image, not a favour anyone did it. No sysctl is written, no capability is
  # added, no sandbox is disabled, and no network is opened. The model endpoint
  # is a scripted server on 127.0.0.1 inside the test process, so this job
  # spends nothing and references no secret.
  #
  # When this job goes red, read it as one of three things, in this order:
  #   1. the 22.04 image gained the restriction -- the project just lost its
  #      only execution host, which is the loudest thing this repository could
  #      currently be told;
  #   2. the two assertions were renamed or removed -- the pinned node IDs below
  #      stop that from passing silently;
  #   3. the run place actually broke.
  prove-execution:
    name: Prove a command runs inside the sandbox (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Make sure bubblewrap is present
        run: |
          if ! command -v bwrap > /dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap
          fi
          echo "bwrap: $(command -v bwrap)  $(bwrap --version 2>&1 | head -1)"

      # 3.10.12 exactly, matching backend-tests.yml. core/agentic_v2_license.py
      # compares a pinned version string against sys.version_info at import, so
      # anything else takes a large part of the suite down before it starts.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"
          cache: pip
          cache-dependency-path: batch-runner/requirements.txt

      - name: Install dependencies
        working-directory: batch-runner
        run: pip install -r requirements.txt

      # Gate one. The diagnostic exits 0 only when it watched bubblewrap run a
      # command, so this step is what earns the right to set
      # CODEX_SANDBOX_MUST_RUN below. If 22.04 ever gains the restriction, this
      # is where the job stops, with the wall named.
      - name: Refuse to continue unless this host measures ready
        working-directory: batch-runner
        run: |
          set -euo pipefail
          python3 scripts/diagnose_codex_sandbox_host.py --out /tmp/prove-host.json
          echo "this host runs commands under bubblewrap; skips are now failures"

      # Gate two. The whole test file is skipif'd on the pinned runtime being
      # absent, and a pip failure that left the binary uninstalled would turn
      # this entire job into a green wall of skips -- the same hole one level
      # up. Assert the runtime is there before pytest gets the chance to be
      # quiet about it.
      - name: Refuse to continue unless the pinned runtime is installed
        working-directory: batch-runner
        run: |
          set -euo pipefail
          python3 -c "from core.codex_runtime_config import require_pinned_runtime; print('pinned runtime:', require_pinned_runtime())"

      # The two assertions, named. Running them by node ID means a rename or a
      # deletion exits non-zero here instead of quietly leaving this job with
      # nothing to prove.
      - name: Run the two assertions that need a command to execute
        working-directory: batch-runner
        env:
          CODEX_SANDBOX_MUST_RUN: "1"
        run: |
          set -euo pipefail
          python3 -m pytest \
            "tests/test_codex_runtime_end_to_end.py::test_a_turn_starts_a_runtime_calls_a_tool_and_comes_back_with_a_file" \
            "tests/test_codex_runtime_end_to_end.py::test_the_agent_cannot_see_the_other_tasks_files" \
            -m "not integration" --tb=short -q -rs

      # And the rest of the file, on the one host where none of it has an
      # excuse to skip. -rs so that anything which does skip says why.
      - name: Run the whole end-to-end file
        working-directory: batch-runner
        env:
          CODEX_SANDBOX_MUST_RUN: "1"
        run: |
          set -euo pipefail
          python3 -m pytest tests/test_codex_runtime_end_to_end.py \
            -m "not integration" --tb=short -q -rs

      - name: Summary
        if: always()
        run: |
          {
            echo "### Codex execution leg, on ubuntu-22.04"
            echo ""
            echo "- host verdict: \`$(python3 -c "import json;print(json.load(open('/tmp/prove-host.json'))['readiness'])" 2>/dev/null || echo 'not measured')\`"
            echo "- \`CODEX_SANDBOX_MUST_RUN=1\`, so a skipped execution assertion fails this job"
            echo ""
            echo "이 줄이 뜻하는 것: Codex가 격리 안에서 명령을 실제로 실행하고,"
            echo "파일을 만들고, 그 결과를 도구 응답으로 돌려주는 구간을 이 기계에서"
            echo "직접 확인했다는 뜻입니다. 초록이면 실행 구간이 증명된 것이고,"
            echo "빨강이면 이 기계마저 실행 호스트가 아니게 됐다는 뜻입니다."
          } >> "$GITHUB_STEP_SUMMARY"
